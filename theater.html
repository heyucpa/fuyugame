<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    font-family: "Comic Sans MS", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    background: linear-gradient(180deg, #efe4ff 0%, #ffe8f4 55%, #dceaff 100%);
    background-attachment: fixed;
    min-height: 100vh;
    color: #33224a;
  }
  .app { max-width: 620px; margin: 0 auto; position: relative; z-index: 2; }
  .card {
    background: #fff;
    border: 4px solid #33224a;
    border-radius: 22px;
    padding: 18px;
    box-shadow: 0 6px 0 rgba(0,0,0,.14), 0 10px 24px rgba(0,0,0,.16);
  }
  h1 {
    margin: 0 0 4px; text-align: center; font-size: 27px; color: #6b4a9e;
    text-shadow: 2px 2px 0 #fff;
    text-wrap: balance;
  }
  .sub { text-align: center; color: #6b5a7e; margin-bottom: 14px; font-size: 14px; }
  button {
    font-family: inherit; cursor: pointer;
    border: 3px solid #33224a; border-radius: 14px;
    padding: 10px 20px; font-size: 17px; font-weight: 800;
    background: #ffd23f; color: #33224a;
    box-shadow: 0 4px 0 rgba(0,0,0,.15);
  }
  button { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  @media (hover: hover) {
    button:hover:not(:disabled) { transform: translateY(-2px); }
    .pick:hover { background: #eadcff; }
    .choice:hover { background: #ffe9a8; }
  }
  button:active:not(:disabled) { transform: translateY(2px); }
  button:focus-visible { outline: 4px solid #ffaa00; outline-offset: 2px; }

  /* 劇本選單 */
  .pick-grid { display: grid; gap: 10px; margin-top: 12px; }
  .pick {
    display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
    background: #faf5ff; border: 3px solid #33224a; border-radius: 16px; padding: 12px 14px;
  }
  .pick .ico { font-size: 40px; line-height: 1; flex-shrink: 0; }
  .pick .t { font-size: 18px; font-weight: 900; display: block; }
  .pick .g { font-size: 12px; color: #6b5a7e; font-weight: 700; margin-top: 2px; display: block; }
  .pick .done { margin-left: auto; font-size: 26px; flex-shrink: 0; }

  /* 玩家列 */
  .whorow {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: #faf5ff; border: 3px solid #33224a; border-radius: 14px;
    padding: 7px 12px; margin-bottom: 8px; font-size: 14px;
  }
  .whoemo { font-size: 22px; line-height: 1; }
  .whoname { font-weight: 900; }
  .whoswap { margin-left: auto; font-size: 12px; color: #6b4a9e; font-weight: 800; }
  .who-pick.on { background: #eadcff; border-color: #6b4a9e; }

  /* 故事 */
  .stage {
    background: #faf5ff; border: 3px solid #33224a; border-radius: 18px;
    padding: 18px 16px; margin: 12px 0;
  }
  .stage .big { font-size: 62px; line-height: 1; text-align: center; margin-bottom: 8px; }
  .narr { font-size: 17px; line-height: 1.85; }
  .hint {
    margin-top: 10px; font-size: 13px; font-weight: 700; color: #6b4a9e;
    background: #fff3c4; border-radius: 10px; padding: 8px 12px; border: 2px dashed #c9a000;
  }
  .choices { display: grid; gap: 9px; }
  .choice {
    width: 100%; text-align: left; background: #fff; font-size: 16px; font-weight: 700;
    padding: 13px 15px; line-height: 1.5; border-radius: 14px;
    position: relative;
  }
  /* 這一輪已經選過的那個選項 → 變灰（重新開始故事就恢復） */
  .choice.seen {
    background: #efedf4; color: #877f9c; border-color: #a9a2bd;
    box-shadow: 0 4px 0 rgba(0,0,0,.07);
  }
  .seenmark {
    display: inline-block; margin-left: 8px; font-size: 11px; font-weight: 800;
    border-radius: 8px; padding: 2px 7px; vertical-align: middle; white-space: nowrap;
  }
  .seenmark { color: #6b5a8e; background: #ded8ea; }
  /* 揭曉之前，先讓她自己押一個判斷 */
  /* 押判斷的時候連圖也要蓋住 —— 結局插圖本身就會洩漏答案 */
  .cover {
    aspect-ratio: 200 / 130; width: 100%; border-radius: 14px;
    background: repeating-linear-gradient(45deg, #efedf4, #efedf4 12px, #e6e2f0 12px, #e6e2f0 24px);
    border: 3px dashed #a99ac9; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px;
  }
  .cover .q { font-size: 40px; opacity: .55; }
  .cover .c { font-size: 12.5px; font-weight: 800; color: #8a7fa8; }

  .guess { text-align: center; margin-top: 14px; }
  .guess-q { font-size: 17px; font-weight: 900; color: #6b4a9e; margin-bottom: 4px; }
  .guess-s { font-size: 12.5px; color: #8a7fa8; margin-bottom: 12px; line-height: 1.7; }
  .guess-btns { display: grid; gap: 9px; max-width: 420px; margin: 0 auto; }
  .guess-btns button { width: 100%; font-size: 16px; font-weight: 800; padding: 14px 16px; }
  #g-good { background: #b7f0c2; }
  #g-bad  { background: #ffd0d0; }
  #g-idk  { background: #fff; }

  /* 判斷紀錄 */
  .chk { background: #fff; border: 3px solid #33224a; border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
  .chk h3 { margin: 0 0 8px; font-size: 15px; color: #6b4a9e; }
  .chk-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid #eee6f8; font-size: 13.5px; }
  .chk-row:first-of-type { border-top: 0; }
  .chk-row .w { flex: 1; min-width: 0; }
  .chk-tag { font-size: 11px; font-weight: 800; border-radius: 8px; padding: 2px 8px; white-space: nowrap; }
  .chk-num { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  .chk-num div { background: #fff; border: 2px solid #cbbce0; border-radius: 10px; padding: 6px 14px; font-size: 12.5px; font-weight: 700; }
  .chk-num b { color: #6b4a9e; font-size: 17px; }

  /* 心理安全框：提醒孩子這是在練習少數狀況，不是說世界很可怕 */
  .safeframe {
    background: #eafaf1; border: 2px solid #7cc9a0; border-radius: 12px;
    padding: 10px 14px; margin: 14px 0 0; font-size: 13px; line-height: 1.75;
    color: #1e6b46; text-align: center; font-weight: 700;
  }
  .safeframe b { color: #14603c; }
  .safeframe.mini { font-size: 12px; padding: 8px 12px; text-align: left; font-weight: 500; }

  /* 首頁底下的選項圖例：用跟遊戲裡一模一樣的顏色 */
  .legend {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    margin: 12px 0 0;
  }
  .lg {
    font-size: 11px; font-weight: 800; border-radius: 999px;
    padding: 4px 10px; border: 2px solid #33224a;
  }
  .lg-new     { background: #fff;    color: #33224a; }
  .lg-done    { background: #efedf4; color: #877f9c; border-color: #a9a2bd; }

  .steps {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    margin-bottom: 4px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #cbbce0; }
  .dot.on { background: #6b4a9e; transform: scale(1.35); }

  /* 結局 */
  .result { text-align: center; }
  .result .face { font-size: 76px; line-height: 1; }
  /* 小字級用大陰影會糊成兩層，結局標題改用淺陰影 */
  .result h1 { font-size: 24px; text-shadow: 2px 2px 0 #fff; }

  /* 結局插圖 */
  .scene { max-width: 300px; margin: 2px auto 4px; }
  .scene svg { width: 100%; height: auto; display: block; border-radius: 14px; }
  @keyframes rays-spin { to { transform: rotate(360deg); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes cape-wave { 0%,100% { transform: skewY(0deg) scaleX(1); } 50% { transform: skewY(-4deg) scaleX(1.07); } }
  @keyframes sway { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-2px) rotate(-1.2deg); } }
  @keyframes sway2 { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-2px) rotate(1.2deg); } }
  @keyframes hearts-rise { 0% { transform: translateY(6px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-14px); opacity: 0; } }
  @keyframes run-shake { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-3px,-3px); } }
  @keyframes dash { 0%,100% { opacity: .25; transform: translateX(0); } 50% { opacity: .95; transform: translateX(-6px); } }
  @keyframes puff { 0% { opacity: .8; transform: scale(.7); } 100% { opacity: 0; transform: scale(1.4); } }
  @keyframes dragon-miss { 0%,100% { transform: translateX(0) rotate(0deg); } 50% { transform: translateX(-7px) rotate(-5deg); } }
  @keyframes wing-flap { 0%,100% { transform: rotate(0deg) scaleY(1); } 50% { transform: rotate(-16deg) scaleY(.82); } }
  @keyframes fly-drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(6px,-6px); } }
  @keyframes dangle { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  @keyframes sparkle { 0%,100% { opacity: .3; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
  .rays { animation: rays-spin 24s linear infinite; }
  .bob { animation: bob 2.2s ease-in-out infinite; }
  .twinkle text { animation: twinkle 1.6s ease-in-out infinite; }
  .twinkle text:nth-child(2) { animation-delay: .4s; }
  .twinkle text:nth-child(3) { animation-delay: .8s; }
  .twinkle text:nth-child(4) { animation-delay: 1.2s; }
  .cape { animation: cape-wave 2s ease-in-out infinite; }
  .sway { animation: sway 2.6s ease-in-out infinite; }
  .sway2 { animation: sway2 2.6s ease-in-out infinite; }
  .sparkle { animation: sparkle 1.4s ease-in-out infinite; }
  .hearts text { animation: hearts-rise 2.4s ease-out infinite; }
  .hearts text:nth-child(2) { animation-delay: .8s; }
  .hearts text:nth-child(3) { animation-delay: 1.6s; }
  .run { animation: run-shake .38s ease-in-out infinite; }
  .dash path { animation: dash .5s ease-in-out infinite; }
  .dash path:nth-child(2) { animation-delay: .12s; }
  .dash path:nth-child(3) { animation-delay: .24s; }
  .puff circle { animation: puff 1s ease-out infinite; }
  .puff circle:nth-child(2) { animation-delay: .25s; }
  .puff circle:nth-child(3) { animation-delay: .5s; }
  .dragonMiss { animation: dragon-miss 1.1s ease-in-out infinite; }
  .wing { animation: wing-flap .7s ease-in-out infinite; transform-box: fill-box; transform-origin: 100% 60%; }
  .fly { animation: fly-drift 3.2s ease-in-out infinite; }
  .dangle { animation: dangle 1.6s ease-in-out infinite; }
  @keyframes claw-push { 0%,100% { transform: translateX(0); } 50% { transform: translateX(7px); } }
  @keyframes clash { 0%,100% { opacity: .5; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
  @keyframes pull-in { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-6px); } }
  @keyframes swirl { to { transform: rotate(360deg); } }
  @keyframes tilt { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-3deg); } }
  @keyframes shake-bits { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes crouch { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  @keyframes fade-danger { 0%,100% { opacity: .3; } 50% { opacity: .7; } }
  @keyframes ring { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  @keyframes snore { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  @keyframes zzz { 0% { opacity: 0; transform: translateY(4px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
  .clawPush { animation: claw-push 1.3s ease-in-out infinite; }
  .clash { animation: clash .8s ease-in-out infinite; }
  .pull { animation: pull-in 1.6s ease-in-out infinite; }
  .swirl { animation: swirl 6s linear infinite; }
  .tilt { animation: tilt 2.4s ease-in-out infinite; }
  .shakeBits circle { animation: shake-bits .5s ease-in-out infinite; }
  .shakeBits circle:nth-child(2) { animation-delay: .18s; }
  .crouch { animation: crouch 2s ease-in-out infinite; }
  .fadeDanger { animation: fade-danger 1.8s ease-in-out infinite; }
  .ring { animation: ring .9s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  .snore { animation: snore 2.6s ease-in-out infinite; }
  .zzz text { animation: zzz 2.4s ease-out infinite; }
  .zzz text:nth-child(2) { animation-delay: 1.2s; }
  .badge {
    display: inline-block; padding: 5px 16px; border-radius: 999px;
    font-weight: 900; font-size: 15px; border: 3px solid #33224a; margin-top: 6px;
  }
  .lesson {
    text-align: left; font-size: 15px; line-height: 1.85;
    background: #e8f8e6; border: 3px dashed #27ae60; border-radius: 16px;
    padding: 14px 16px; margin: 14px 0;
  }
  .lesson b { color: #1e7d46; }
  .talkbox {
    text-align: left; font-size: 15px; line-height: 1.8;
    background: #fff3c4; border: 3px dashed #c9a000; border-radius: 16px;
    padding: 13px 16px; margin: 12px 0;
  }
  .talkbox-h { font-weight: 900; color: #a07a00; margin-bottom: 5px; }
  .replay { text-align: left; margin: 12px 0; }
  .replay h3 { font-size: 15px; margin: 0 0 8px; color: #6b4a9e; }
  .step-row {
    display: flex; gap: 9px; align-items: flex-start;
    font-size: 13px; line-height: 1.6; padding: 7px 0;
    border-bottom: 1px dashed #cbbce0;
  }
  .step-row:last-child { border-bottom: none; }
  .step-n {
    flex-shrink: 0; width: 21px; height: 21px; border-radius: 50%;
    background: #6b4a9e; color: #fff; font-size: 12px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
  }
  .row { display: flex; gap: 9px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
  .mini { font-size: 13px; padding: 7px 14px; background: #fff;
          min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .anim { animation: fadeUp .3s ease-out; }
  @keyframes pop { 0% { transform: scale(.6);} 50% { transform: scale(1.15);} 100% { transform: scale(1);} }
  .pop { animation: pop .45s ease-out; }
  @media (prefers-reduced-motion: reduce) { .anim, .pop { animation: none; } }

  /* 兩欄容器：手機／直向是一欄，橫向 iPad 變兩欄 */
  .endgrid, .storygrid { display: grid; gap: 14px; align-items: start; margin-top: 12px; }
  .storygrid > .stage { margin-top: 0; }

  /* ===== iPad 直向 ===== */
  @media (min-width: 700px) {
    .app { max-width: 720px; }
    .card { padding: 24px; border-radius: 26px; }
    h1 { font-size: 32px; }
    .sub { font-size: 16px; }
    .narr { font-size: 20px; line-height: 1.9; }
    .choice { font-size: 19px; padding: 17px 20px; }
    .pick { padding: 16px 18px; }
    .pick .ico { font-size: 46px; }
    .pick .t { font-size: 21px; }
    .pick .g { font-size: 14px; }
    .lesson { font-size: 17px; }
    .hint { font-size: 15px; }
    .step-row { font-size: 15px; }
    button { font-size: 19px; padding: 13px 24px; }
    .mini { font-size: 15px; padding: 9px 16px; }
    .scene { max-width: 360px; }
  }

  /* ===== 寬一點的螢幕：選單排兩欄 ===== */
  @media (min-width: 820px) {
    .app { max-width: 880px; }
    .pick-grid { grid-template-columns: 1fr 1fr; }
  }

  /* ===== iPad 橫向：故事與結局左右分欄，一頁看完不用捲 ===== */
  @media (min-width: 1000px) {
    .app { max-width: 1060px; }
    .endgrid { grid-template-columns: minmax(300px, 42%) 1fr; gap: 24px; }
    .storygrid { grid-template-columns: 1fr 1fr; gap: 24px; }
    .scene { max-width: 100%; }
    .result h1 { font-size: 28px; }
  }
</style>

<div class="app" id="app"></div>
<script>
/* ===== 劇本 =====
   每個 node：narration（旁白）+ choices（選擇）
   choices 的 to 指向下一個 node 或 ending
   ending 的 grade：best / good / escape / bad
*/
const SCENARIOS = [
  /* ---------- 1. 放學路上 ---------- */
  {
    id: 'road', emoji: '🚗', title: '放學路上',
    tag: '陌生人・誘拐',
    intro: '今天媽媽說會晚一點下班，你自己走路回家。走到轉角時，一台銀色的車慢慢開到你旁邊……',
    talk: '我們家要不要設一個「暗號」？如果真的有人說是爸媽派來接你的，你會問他什麼？<br><br>如果對方真的知道媽媽的名字、我們住哪附近，甚至你以前好像看過他，你會怎麼確認他是不是真的可以帶你走？',
    start: 'n1',
    nodes: {
      gatewalk: {
        text: '你跟他說：「我不上車喔，我自己走。」<br><br>叔叔笑著說：「可以啊，那我陪你走回學校，總可以吧？」<br><br>他把車停在路邊，走在你旁邊。<br><br>走了一小段，他忽然說：<br><br>「學校不用去了啦，你媽媽就在前面的咖啡店，我帶你過去。」<br><br>他伸手指向另一條巷子。',
        hint: '你雖然沒有上車，但他已經跟你走在一起，而且正在帶你離開原本的路線。',
        choices: [
          { label: '不跟他轉進巷子，立刻跑進附近有人的店家', to: 'good' },
          { label: '都走到這裡了，去咖啡店門口看看就好', to: 'gateclose' },
          { label: '停下來說「我要先打給媽媽」，同時跟他拉開距離', to: 'call' },
        ],
      },
      gateclose: {
        text: '你想：「我又沒有上車，只是去門口看看。」<br><br>但走到巷口時，你發現前面根本沒有咖啡店。<br><br>你回頭時，那個叔叔已經站得離你很近。',

// 共用零件
const GIRL_FACE = (cx, cy, r, mood) => {
  const eyes = mood === 'happy'
    ? '<path d="M' + (cx - r * .42) + ' ' + (cy - r * .1) + ' q ' + (r * .18) + ' ' + (-r * .28) + ' ' + (r * .36) + ' 0" stroke="#33224a" stroke-width="1.6" fill="none" stroke-linecap="round"/>' +
      '<path d="M' + (cx + r * .06) + ' ' + (cy - r * .1) + ' q ' + (r * .18) + ' ' + (-r * .28) + ' ' + (r * .36) + ' 0" stroke="#33224a" stroke-width="1.6" fill="none" stroke-linecap="round"/>'
    : '<circle cx="' + (cx - r * .34) + '" cy="' + (cy - r * .12) + '" r="' + (r * .13) + '" fill="#33224a"/>' +
      '<circle cx="' + (cx + r * .34) + '" cy="' + (cy - r * .12) + '" r="' + (r * .13) + '" fill="#33224a"/>';
  const mouth = mood === 'flat'
    ? '<path d="M' + (cx - r * .22) + ' ' + (cy + r * .42) + ' h ' + (r * .44) + '" stroke="#33224a" stroke-width="1.6" fill="none" stroke-linecap="round"/>'
    : '<path d="M' + (cx - r * .26) + ' ' + (cy + r * .3) + ' q ' + (r * .26) + ' ' + (r * .34) + ' ' + (r * .52) + ' 0" stroke="#33224a" stroke-width="1.8" fill="none" stroke-linecap="round"/>';
  return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#fde2c5" stroke="#33224a" stroke-width="1.6"/>' +
    '<path d="M' + (cx - r) + ' ' + (cy - r * .25) + ' q 0 ' + (-r * 1.2) + ' ' + r + ' ' + (-r * 1.2) + ' q ' + r + ' 0 ' + r + ' ' + (r * 1.2) + ' q ' + (-r * .3) + ' ' + (-r * .55) + ' ' + (-r) + ' ' + (-r * .55) + ' q ' + (-r * .7) + ' 0 ' + (-r) + ' ' + (r * .55) + ' Z" fill="#5d3a1f"/>' +
    eyes +
    '<circle cx="' + (cx - r * .62) + '" cy="' + (cy + r * .2) + '" r="' + (r * .16) + '" fill="#ff8fb8" opacity=".7"/>' +
    '<circle cx="' + (cx + r * .62) + '" cy="' + (cy + r * .2) + '" r="' + (r * .16) + '" fill="#ff8fb8" opacity=".7"/>' +
    mouth;
};

const CROWN = (cx, y, w) =>

/* ===== 組合式插圖：零件庫 =====
   每張結局圖 = 佈景 + 人物 + 效果
   人物以「腳底為原點」的區域座標繪製，再用 transform 擺到定位
*/

// 女孩：pose = stand / cheer / run / reachR / reachL / hang / shout / sit
const GIRL = (x, y, s, o) => {
  o = o || {};
  const mood = o.mood || 'happy', dress = o.dress || '#ff8fb8', pose = o.pose || 'stand';
  let arms = '', legs = '', bottom = 0;
  if (pose === 'cheer')       arms = LIMB(-8, -26, -21, -47, 6) + LIMB(8, -26, 21, -47, 6);
  else if (pose === 'run')  { arms = LIMB(-8, -26, -19, -14, 6) + LIMB(8, -26, 21, -38, 6);
                              legs = LIMB(-3, -6, -15, -10, 6) + LIMB(4, -6, 9, 2, 6); bottom = -6; }
  else if (pose === 'reachR') arms = LIMB(-9, -26, -14, -12, 6) + LIMB(8, -26, 27, -31, 6);
  else if (pose === 'reachL') arms = LIMB(9, -26, 14, -12, 6) + LIMB(-8, -26, -27, -31, 6);
  else if (pose === 'hang')  { arms = LIMB(-8, -30, -17, -19, 5) + LIMB(8, -30, 17, -19, 5);
                              legs = LIMB(-5, -2, -8, 10, 5) + LIMB(5, -2, 8, 10, 5); bottom = -2; }
  else if (pose === 'sit')   { arms = LIMB(-9, -26, -18, -18, 6) + LIMB(9, -26, 18, -18, 6);
                              legs = LIMB(-5, -4, -16, 0, 6) + LIMB(5, -4, 16, 0, 6); bottom = -4; }
  else                        arms = LIMB(-9, -26, -14, -12, 6) + LIMB(9, -26, 14, -12, 6);
  const head = pose === 'shout'
    ? '<circle cx="0" cy="-46" r="13" fill="#fde2c5" stroke="#33224a" stroke-width="1.6"/>' +
      '<path d="M-13 -50 q0 -16 13 -16 q13 0 13 16 q-4 -7 -13 -7 q-9 0 -13 7 Z" fill="#5d3a1f"/>' +
      '<circle cx="-5" cy="-48" r="1.7" fill="#33224a"/><circle cx="5" cy="-48" r="1.7" fill="#33224a"/>' +
      '<ellipse cx="0" cy="-38" rx="5" ry="6" fill="#33224a"/>'
    : GIRL_FACE(0, -46, 13, mood);
  return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')">' + arms +
    '<path d="M-13 ' + bottom + ' L-8 -34 L8 -34 L13 ' + bottom + ' Z" fill="' + dress +
    '" stroke="#33224a" stroke-width="1.6" stroke-linejoin="round"/>' + legs + head +
    (o.crown ? CROWN(0, -58, 11) : '') + '</g>';
};

// 大人：kind = mom / dad / man / teacher
const ADULT = (x, y, s, o) => {
  o = o || {};
  const c = o.color || '#9b59b6', hair = o.hair || '#3a2510';
  const arms = o.pose === 'reachL' ? LIMB(-10, -30, -30, -24, 6)

    (o.cape ? '<g class="cape" style="transform-origin:0px -40px"><path d="M-10 -40 q-24 24 -16 40 q16 -10 28 -6 Z" fill="#e74c3c" stroke="#33224a" stroke-width="1.5" stroke-linejoin="round"/></g>' : '') +

/* ===== 音效（Web Audio，無外部檔） ===== */
const Sfx = (() => {
  let ctx = null;
  let muted = localStorage.getItem('theater-muted') === '1';
  let bgmOn = localStorage.getItem('theater-bgm') !== '0';
  let trackId = localStorage.getItem('theater-track') || 'fairy';
  let bgmTimer = null, bgmGain = null, bgmAlive = false;
  function get() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(f, d, v = 0.16, type = 'sine', delay = 0) {
    if (muted) return;
    const c = get(); if (!c) return;
    const t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.connect(g).connect(c.destination);
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.start(t); o.stop(t + d + 0.02);
  }
  /* 背景音樂：輕柔、音量壓低，不要蓋過讀故事 */
  const TRACKS = {
    fairy: { name: '🏰 童話圓舞曲', notes: [
      [523,.45],[659,.22],[784,.22],[880,.45],[784,.22],[659,.22],
      [698,.45],[880,.22],[1047,.22],[880,.45],[784,.22],[659,.22],
      [587,.45],[698,.22],[880,.22],[784,.45],[659,.22],[587,.22],
      [523,.9],[0,.5] ] },
    forest: { name: '🌿 森林散步', notes: [
      [440,.32],[523,.32],[587,.32],[523,.32],[440,.64],
      [392,.32],[440,.32],[523,.32],[587,.32],[659,.64],
      [587,.32],[523,.32],[440,.32],[392,.32],[349,.9],[0,.5] ] },
    starry: { name: '⭐ 星星搖籃曲', notes: [
      [523,.4],[523,.4],[587,.4],[523,.4],[698,.8],[659,.8],
      [523,.4],[523,.4],[587,.4],[523,.4],[784,.8],[698,.8],
      [523,.4],[523,.4],[1047,.4],[880,.4],[698,.4],[659,.4],[587,.9],
      [932,.4],[880,.4],[698,.4],[784,.4],[698,.9],[0,.5] ] },
  };
  function loop() {
    if (!bgmAlive || muted || !bgmOn) { bgmAlive = false; return; }
    const c = get(); if (!c) { bgmAlive = false; return; }
    if (!bgmGain) { bgmGain = c.createGain(); bgmGain.gain.value = 0.055; bgmGain.connect(c.destination); }
    const notes = (TRACKS[trackId] || TRACKS.fairy).notes;
    let t = c.currentTime + 0.05;
    notes.forEach(([f, d]) => {
      if (f > 0) {
        const o = c.createOscillator(), g = c.createGain();
        o.connect(g); g.connect(bgmGain);
        o.type = 'triangle'; o.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.6, t + 0.04);
        g.gain.exponentialRampToValueAtTime(0.001, t + d * 0.92);
        o.start(t); o.stop(t + d + 0.03);
      }
      t += d;
    });
    const total = notes.reduce((a, n) => a + n[1], 0);
    bgmTimer = setTimeout(loop, (total - 0.05) * 1000);
  }
  function startBgm() { if (muted || !bgmOn || bgmAlive) return; bgmAlive = true; loop(); }
  function stopBgm() { bgmAlive = false; if (bgmTimer) { clearTimeout(bgmTimer); bgmTimer = null; } }

  return {
    unlock() { get(); startBgm(); },
    isMuted() { return muted; },
    toggle() {
      muted = !muted;
      localStorage.setItem('theater-muted', muted ? '1' : '0');
      if (muted) stopBgm(); else startBgm();
      return muted;
    },
    isBgmOn() { return bgmOn; },
    toggleBgm() {
      bgmOn = !bgmOn;
      localStorage.setItem('theater-bgm', bgmOn ? '1' : '0');
      if (bgmOn) { get(); startBgm(); } else stopBgm();
      return bgmOn;
    },
    trackName() { return (TRACKS[trackId] || TRACKS.fairy).name; },
    nextTrack() {
      const ids = Object.keys(TRACKS);
      trackId = ids[(ids.indexOf(trackId) + 1) % ids.length];
      localStorage.setItem('theater-track', trackId);
      stopBgm(); get(); startBgm();
      return TRACKS[trackId].name;
    },
    tap() { tone(680, 0.07, 0.12, 'triangle'); },
    page() { tone(520, 0.09, 0.1, 'sine'); tone(700, 0.1, 0.09, 'sine', 0.07); },
    best() { [523, 659, 784, 1046, 1318].forEach((n, i) => tone(n, 0.16, 0.16, 'triangle', i * 0.09)); },
    good() { [523, 784, 1046].forEach((n, i) => tone(n, 0.14, 0.15, 'triangle', i * 0.09)); },
    escape() { [440, 660, 880].forEach((n, i) => tone(n, 0.13, 0.14, 'sine', i * 0.1)); },
    bad() { tone(300, 0.25, 0.15, 'sawtooth'); tone(200, 0.35, 0.13, 'sawtooth', 0.2); },
  };
})();

function defaultPlayers() {
  return [{ id: 'p1', name: '帆帆', emoji: '⭐' }, { id: 'p2', name: '安安', emoji: '🌸' }];
}
function players() {
  try {
    const p = JSON.parse(localStorage.getItem(PKEY));
    if (Array.isArray(p) && p.length) return p;
  } catch (e) {}
  const d = defaultPlayers();
  try { localStorage.setItem(PKEY, JSON.stringify(d)); } catch (e) {}
  return d;
}
function savePlayers(list) { try { localStorage.setItem(PKEY, JSON.stringify(list)); } catch (e) {} }
function whoId() {
  const id = localStorage.getItem(CKEY);
  const list = players();
  return list.some(p => p.id === id) ? id : list[0].id;
}
function who() { return players().find(p => p.id === whoId()) || players()[0]; }
function setWho(id) { try { localStorage.setItem(CKEY, id); } catch (e) {} }

const pKey = k => 'theater-' + k + ':' + whoId();
// 舊的單人存檔搬給第一個玩家，只做一次
(function migrate() {
  try {
    const old = localStorage.getItem(OLD_SAVE);
    const first = players()[0].id;
    if (old && !localStorage.getItem('theater-progress:' + first)) {
      localStorage.setItem('theater-progress:' + first, old);
      localStorage.removeItem(OLD_SAVE);
    }
  } catch (e) {}
})();

/* 後果卡模式：這類劇本沒有「比較好」的結局，只有「這樣選會發生什麼」。
   所以不打等級、不比較、不跳「比上次更好了」，只記錄走過哪些結果。 */
const isCons = sc => !!(sc && sc.mode === 'consequence');

function loadEnds() {
  try { return JSON.parse(localStorage.getItem(pKey('ends'))) || {}; } catch (e) { return {}; }
}
function recordEnding(id, key) {
  const e = loadEnds();
  (e[id] = e[id] || {})[key] = 1;
  try { localStorage.setItem(pKey('ends'), JSON.stringify(e)); } catch (e2) {}
}
function endsSeen(id) { return Object.keys(loadEnds()[id] || {}).length; }

/* 選過的選項：只記「這一輪」。重新開始這個故事就全部恢復白色。
   （不寫進 localStorage，換一輪就沒了） */
let runSeen = {};
function markSeen(nodeId, idx) { runSeen[nodeId + '|' + idx] = 1; }
function isSeen(nodeId, idx) { return !!runSeen[nodeId + '|' + idx]; }

      </div>
      <div class="row" style="margin-top:14px;">
        <button class="mini" id="mute">${Sfx.isMuted() ? '🔇 靜音中' : '🔊 有聲'}</button>
        <button class="mini" id="music">${Sfx.isBgmOn() ? Sfx.trackName() : '🎵 音樂關'}</button>
        <button class="mini" id="reset">🗑️ 清除紀錄</button>
        <button class="mini" id="check">📊 判斷紀錄</button>
        <button class="mini" id="map">🗺️ 分支圖</button>
        <button class="mini" id="back">🎲 回骰子遊戲</button>
      </div>
      <p style="text-align:center; font-size:12px; color:#6b5a7e; margin:14px 0 0; line-height:1.7;">
        沒有「輸」這件事 —— 走到不好的結局也會告訴你為什麼，<br>再走一次就好。
      </p>
      <p style="text-align:center; font-size:11.5px; color:#8a7fa8; margin:10px 0 0;">
        故事裡繞回同一題的時候，剛剛選過的那個會變灰：</p>
      <div class="legend">
        <span class="lg lg-new">還沒選</span>
        <span class="lg lg-done">這次選過了</span>
      </div>
    </div>
  `;
  document.querySelectorAll('.pick').forEach(b => {
    b.onclick = () => { Sfx.unlock(); Sfx.tap(); startScenario(b.dataset.id); };
  });
  document.getElementById('whobtn').onclick = () => { Sfx.tap(); view = 'who'; render(); };
  document.getElementById('rand').onclick = () => { Sfx.unlock(); Sfx.tap(); startRandom(); };
  document.getElementById('mute').onclick = () => { Sfx.toggle(); render(); };
  // 音樂鍵：關著就打開，開著就換下一首
  document.getElementById('music').onclick = () => {
    if (!Sfx.isBgmOn()) Sfx.toggleBgm(); else Sfx.nextTrack();
    render();
  };
  document.getElementById('music').oncontextmenu = e => { e.preventDefault(); Sfx.toggleBgm(); render(); };
  document.getElementById('check').onclick = () => { Sfx.tap(); view = 'check'; render(); };
  document.getElementById('map').onclick = () => { location.href = './map.html'; };
  document.getElementById('back').onclick = () => { location.href = './index.html'; };
  document.getElementById('reset').onclick = () => {
    if (confirm('要清除「' + who().name + '」的所有紀錄嗎？')) {
      localStorage.removeItem(pKey('progress'));
      localStorage.removeItem(pKey('seen'));   // 舊版留下的，清掉
      localStorage.removeItem(pKey('ends'));
      localStorage.removeItem(pKey('predict'));
      render();
    }
  };
}

// 隨機挑一個，但避開剛剛玩過的那個（不然常常連抽到同一個）
function startRandom() {
  const pool = SCENARIOS.filter(s => s.id !== lastId);
  const list = pool.length ? pool : SCENARIOS;
  startScenario(list[Math.floor(Math.random() * list.length)].id);
}

function startScenario(id) {
  cur = SCENARIOS.find(s => s.id === id);
  if (!cur) return;
  lastId = id;
  nodeId = null;      // null = 顯示開場白
  runSeen = {};       // 灰色只記這一輪
  path = [];
  ending = null;
  endingKey = null;
  predicting = false;
  view = 'story';
  render();
}

function renderStory() {
  // 開場白
  if (nodeId === null) {
    app.innerHTML = `
      <div class="card anim">
        <h1>${cur.emoji} ${esc(cur.title)}</h1>
        <div class="sub">${esc(cur.tag)}</div>
        <div class="stage">
          <div class="narr">${narrate(cur.intro)}</div>
        </div>
        <div class="choices">
          <button class="choice" id="go" style="text-align:center; background:#6b4a9e; color:#fff;">開始 ▶</button>
        </div>
        <div class="row">
          <button class="mini" id="music2">${Sfx.isBgmOn() ? '🎵 音樂開' : '🎵 音樂關'}</button>
          <button class="mini" id="quit">← 選別的故事</button>
        </div>
      </div>
    `;
    document.getElementById('go').onclick = () => { Sfx.page(); nodeId = cur.start; render(); };
    document.getElementById('music2').onclick = () => { Sfx.toggleBgm(); render(); };
    document.getElementById('quit').onclick = () => { view = 'menu'; render(); };
    return;
  }

  const n = cur.nodes[nodeId];
  const depth = path.length;
  app.innerHTML = `
    <div class="card anim">
      <div class="steps">
        ${Array.from({ length: Math.max(depth + 1, 3) }, (_, i) =>
          `<span class="dot ${i <= depth ? 'on' : ''}"></span>`).join('')}
      </div>
      <div style="text-align:center; font-size:13px; font-weight:800; color:#6b4a9e;">
        ${cur.emoji} ${esc(cur.title)}
      </div>
      <div class="storygrid">
        <div class="stage">
          <div class="narr">${narrate(n.text)}</div>
          ${n.hint ? `<div class="hint">🤔 ${narrate(n.hint)}</div>` : ''}
        </div>
        <div>
          <div style="font-size:14px; font-weight:800; color:#6b4a9e; margin-bottom:7px;">你要怎麼做？</div>
          <div class="choices">
            ${n.choices.map((c, i) => {
              // 只標「這一輪」按過的：走到一半繞回同一題時，才知道剛剛選過哪一個
              const taken = isSeen(nodeId, i);
              const cls = taken ? ' seen' : '';
              const mark = taken ? '<span class="seenmark">這次選過了</span>' : '';
              return `<button class="choice${cls}" data-i="${i}">${esc(c.label)}${mark}</button>`;
            }).join('')}
          </div>
        </div>
      </div>
      <div class="row">
        <button class="mini" id="music2">${Sfx.isBgmOn() ? '🎵 音樂開' : '🎵 音樂關'}</button>
        <button class="mini" id="quit">← 離開這個故事</button>
      </div>
    </div>
  `;
  document.querySelectorAll('.choice').forEach(b => {
    b.onclick = () => choose(parseInt(b.dataset.i, 10));
  });
  document.getElementById('music2')?.addEventListener('click', () => { Sfx.toggleBgm(); render(); });
  document.getElementById('quit').onclick = () => { view = 'menu'; render(); };
}

function choose(i) {
  const n = cur.nodes[nodeId];
  const c = n.choices[i];
  markSeen(nodeId, i);
  path.push({ text: plain(n.text), label: c.label });
  const nxt = c.to;
  if (cur.nodes[nxt]) {
    Sfx.page();
    nodeId = nxt;
    render();
  } else if (cur.endings[nxt]) {
    ending = cur.endings[nxt];
    endingKey = nxt;
    const firstTime = !(loadEnds()[cur.id] || {})[nxt];
    recordEnding(cur.id, nxt);
    predicting = firstTime && !isCons(cur);
    if (isCons(cur)) {
      improved = false;
      Sfx.good();                       // 中性的收尾音，不用高低分暗示好壞
    } else {
      improved = recordResult(cur.id, ending.grade);
      // 還在等她押判斷的時候，不能用音效先洩漏答案
      if (predicting) Sfx.page();
      else ({ best: Sfx.best, good: Sfx.good, escape: Sfx.escape, bad: Sfx.bad }[ending.grade] || Sfx.good)();
    }
    view = 'end';
    render();
  } else {
    console.error('找不到目標節點:', nxt);
  }
}

function renderGuess() {
  app.innerHTML = `
    <div class="card anim">
      <div class="result">
        <div class="cover"><div class="q">🖼️</div><div class="c">先猜猜看，再看圖片</div></div>
      </div>
      <div class="stage" style="margin-top:12px;">
        <div class="narr">${narrate(ending.text)}</div>
      </div>
      <div class="guess">
        <div class="guess-q">你覺得這個選擇，結果好嗎？</div>
        <div class="guess-s">先自己想一想再看答案。<br>猜錯不會扣分——猜錯的那幾題，才是最值得跟爸媽聊的。</div>
        <div class="guess-btns">
          <button id="g-good">🙂 我覺得應該不錯</button>
          <button id="g-bad">😟 好像不太好</button>
          <button id="g-idk">🤔 我不確定</button>
        </div>
      </div>
    </div>
  `;
  const pick = p => {
    recordPredict(cur.id, endingKey, p, ending.grade);
    predicting = false;
    ({ best: Sfx.best, good: Sfx.good, escape: Sfx.escape, bad: Sfx.bad }[ending.grade] || Sfx.good)();
    render();
  };
  document.getElementById('g-good').onclick = () => pick('good');
  document.getElementById('g-bad').onclick = () => pick('bad');
  document.getElementById('g-idk').onclick = () => pick('idk');
}

/* 判斷紀錄：她以為對、結果不是的題目 —— 給爸媽看的 */
function renderCheck() {
  const d = loadPredict();
  const rows = [];
  SCENARIOS.forEach(sc => Object.keys(d[sc.id] || {}).forEach(k => {
    const r = d[sc.id][k], e = sc.endings[k];
    if (!e) return;
    rows.push({ sc: sc, e: e, key: k, p: r.p, out: predictOutcome(r.p, r.g) });
  }));
  const over = rows.filter(r => r.out === 'over');
  const under = rows.filter(r => r.out === 'under');
  const hit = rows.filter(r => r.out === 'hit');
  const idk = rows.filter(r => r.out === 'idk');
  const m = g => GRADE_META[g];
  const line = r => `
    <div class="chk-row">
      <span>${r.sc.emoji}</span>
      <span class="w"><b style="color:#6b4a9e;">${esc(r.sc.title)}</b><br>
        <span style="color:#6b5a7e; font-size:12px;">${esc(r.e.title)}</span></span>
      <span class="chk-tag" style="background:${m(r.e.grade).bg}; color:${m(r.e.grade).color};">${m(r.e.grade).label}</span>
    </div>`;
  app.innerHTML = `
    <div class="card anim">
      <h1>📊 判斷紀錄</h1>
      <div class="sub">${esc(who().name)} 走到每個結局之前，先猜了結果好不好</div>
      <div class="chk-num" style="margin-top:12px;">
        <div>猜過 <b>${rows.length}</b> 次</div>
        <div>猜對 <b>${hit.length}</b></div>
        <div>不確定 <b>${idk.length}</b></div>
      </div>
      ${rows.length === 0 ? `<div class="chk"><h3>還沒有紀錄</h3>
        <div style="font-size:13px; color:#6b5a7e; line-height:1.8;">
          第一次走到一個新結局的時候，遊戲會先問她覺得結果好不好，之後才揭曉。<br>
          玩過幾篇再回來看。</div></div>` : ''}
      ${over.length ? `<div class="chk">
        <h3>😮 她以為不錯，結果不是（${over.length}）</h3>
        <div style="font-size:12.5px; color:#6b5a7e; margin-bottom:6px;">這幾題最值得聊——她的判斷跟實際結果不一樣。</div>
        ${over.map(line).join('')}</div>` : ''}
      ${under.length ? `<div class="chk">
        <h3>🙂 她以為不好，其實不錯（${under.length}）</h3>
        <div style="font-size:12.5px; color:#6b5a7e; margin-bottom:6px;">她做對了但不太有把握，可以肯定她一下。</div>
        ${under.map(line).join('')}</div>` : ''}
      ${idk.length ? `<div class="chk">
        <h3>🤔 她說不確定（${idk.length}）</h3>
        ${idk.map(line).join('')}</div>` : ''}
      <div class="row" style="margin-top:12px;">
        <button id="chk-back" style="background:#6b4a9e; color:#fff;">← 回首頁</button>
      </div>
    </div>
  `;
  document.getElementById('chk-back').onclick = () => { Sfx.tap(); view = 'menu'; render(); };
}

function renderEnding() {
  if (predicting) return renderGuess();
  const cons = isCons(cur);
  const m = GRADE_META[ending.grade];
  app.innerHTML = `
    <div class="card">
      <div class="endgrid">
        <div class="result">
          <div class="scene pop">${sceneFor(cur.id, endingKey, ending.grade)}</div>
          <h1>${esc(ending.title)}</h1>
          ${cons
            ? `<span class="badge" style="background:#eee6f8; color:#6b4a9e;">💬 這個選擇的結果</span>`
            : `<span class="badge" style="background:${m.bg}; color:${m.color};">${m.label}結局</span>`}
          ${!cons && improved && ending.grade !== 'bad' ? `<div style="font-weight:900; color:#c9a000; margin-top:8px;">🎉 比上次更好了！</div>` : ''}
          <div style="font-size:12px; color:#6b5a7e; margin-top:8px; line-height:1.6;">
            ${cons ? '這個故事沒有滿分答案。<br>' : ''}你走過 ${endsSeen(cur.id)} / ${Object.keys(cur.endings).length} 種結局${endsSeen(cur.id) < Object.keys(cur.endings).length ? '，再走一次看看別條路' : '，全部都看過了 🎉'}。
          </div>
        </div>
        <div>
          <div class="stage" style="margin-top:0;">
            <div class="narr">${narrate(ending.text)}</div>
          </div>
          <div class="lesson">
            <div style="font-weight:900; margin-bottom:5px; color:#1e7d46;">${cons ? '🤔 想一想' : '💡 學到了什麼'}</div>
            ${narrate(ending.lesson)}
          </div>
          <div class="talkbox">
            <div class="talkbox-h">💬 跟爸爸媽媽討論</div>
            <div>${narrate(cur.talk || '把這個故事講給爸爸媽媽聽，問問看他們會怎麼做？')}</div>
          </div>
          <div class="safeframe mini">
            🌱 大部分的人都是安全、願意幫忙的。這個故事是在練習：<b>少數真的遇到危險的時候，你可以怎麼保護自己。</b>
          </div>
          <div class="replay">
            <h3>📖 回顧你的選擇</h3>
            ${path.map((p, i) => `
              <div class="step-row">
                <span class="step-n">${i + 1}</span>
                <span><span style="color:#6b5a7e;">${esc(p.text.slice(0, 26))}${p.text.length > 26 ? '…' : ''}</span><br>
                <b style="color:#6b4a9e;">→ ${esc(p.label)}</b></span>
              </div>`).join('')}
          </div>
        </div>
      </div>
      <div class="row">
        <button id="again" style="background:#6b4a9e; color:#fff;">🔁 再走一次</button>
        <button id="rand">🎲 隨機下一個</button>
        <button id="menu" style="background:#fff;">🎭 選別的故事</button>
      </div>
      <div class="row" style="margin-top:8px;">
        <button class="mini" id="music2">${Sfx.isBgmOn() ? '🎵 音樂開' : '🎵 音樂關'}</button>
      </div>
    </div>
  `;
  document.getElementById('again').onclick = () => { Sfx.tap(); startScenario(cur.id); };
  document.getElementById('rand').onclick = () => { Sfx.tap(); startRandom(); };
  document.getElementById('menu').onclick = () => { Sfx.tap(); view = 'menu'; render(); };
  document.getElementById('music2')?.addEventListener('click', () => { Sfx.toggleBgm(); render(); });
}

// 瀏覽器規定要有使用者動作才能播放聲音，第一次碰畫面就解鎖並開始音樂
['pointerdown', 'keydown'].forEach(ev =>
  document.addEventListener(ev, () => Sfx.unlock(), { once: true }));

render();
</script>
</body>
</html>
