<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    font-family: "Comic Sans MS", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    /* 底色跟著時間走。平常看的是現實時間（早上開就是晨光、晚上開就是夜色）；
       走「平安的一天」的時候改成跟著目前那一段，才有走過一天的感覺。
       只動卡片後面的背景，卡片本身維持白底，字的對比不受影響。 */
    background: var(--sky, linear-gradient(180deg, #efe4ff 0%, #ffe8f4 55%, #dceaff 100%));
    background-attachment: fixed;
    transition: background 900ms ease;
    min-height: 100vh;
    color: #33224a;
  }
  /* 主角與手足的裙子顏色。妹妹玩的時候兩個對調，
     這樣 118 張結局圖裡的主角就是她自己。 */
  body { --me: #ff8fb8; --sib: #ffd23f; }
  body[data-role="little"] { --me: #ffd23f; --sib: #ff8fb8; }

  body[data-tod="morning"] { --sky: linear-gradient(180deg, #ffe9c9 0%, #ffe4ec 50%, #dff0ff 100%); }
  body[data-tod="day"]     { --sky: linear-gradient(180deg, #d8ecff 0%, #eaf6ff 55%, #f3fff4 100%); }
  body[data-tod="dusk"]    { --sky: linear-gradient(180deg, #ffd9b0 0%, #f6c4d8 45%, #cdbde8 100%); }
  body[data-tod="night"]   { --sky: linear-gradient(180deg, #2f3b63 0%, #4a4a7a 45%, #6b5a8e 100%); }
  /* 夜裡卡片外的字（版本號那類）要看得見 */
  body[data-tod="night"] .app > p { color: #cfc7de !important; }
  .app { max-width: 620px; margin: 0 auto; position: relative; z-index: 2; }
  .card {
    background: #fff;
    border: 4px solid #33224a;
    border-radius: 22px;
    padding: 18px;
    box-shadow: 0 6px 0 rgba(0,0,0,.14), 0 10px 24px rgba(0,0,0,.16);
  }
  h1 {
    margin: 0 0 4px; text-align: center; font-size: 27px; color: #6b4a9e;
    text-shadow: 2px 2px 0 #fff;
    text-wrap: balance;
  }
  .sub { text-align: center; color: #6b5a7e; margin-bottom: 14px; font-size: 14px; }
  button {
    font-family: inherit; cursor: pointer;
    border: 3px solid #33224a; border-radius: 14px;
    padding: 10px 20px; font-size: 17px; font-weight: 800;
    background: #ffd23f; color: #33224a;
    box-shadow: 0 4px 0 rgba(0,0,0,.15);
  }
  button { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  @media (hover: hover) {
    button:hover:not(:disabled) { transform: translateY(-2px); }
    .pick:hover { background: #eadcff; }
    .choice:hover { background: #ffe9a8; }
  }
  button:active:not(:disabled) { transform: translateY(2px); }
  button:focus-visible { outline: 4px solid #ffaa00; outline-offset: 2px; }

  /* 劇本選單 */
  .pick-grid { display: grid; gap: 10px; margin-top: 12px; }
  .pick {
    display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
    background: #faf5ff; border: 3px solid #33224a; border-radius: 16px; padding: 12px 14px;
  }
  .pick .ico { font-size: 40px; line-height: 1; flex-shrink: 0; }
  .pick .t { font-size: 18px; font-weight: 900; display: block; }
  .pick .g { font-size: 12px; color: #6b5a7e; font-weight: 700; margin-top: 2px; display: block; }
  .pick .done { margin-left: auto; font-size: 26px; flex-shrink: 0; }

  /* 玩家列 */
  .whorow {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: #faf5ff; border: 3px solid #33224a; border-radius: 14px;
    padding: 7px 12px; margin-bottom: 8px; font-size: 14px;
  }
  .whoemo { font-size: 22px; line-height: 1; }
  .whoname { font-weight: 900; }
  .whoswap { margin-left: auto; font-size: 12px; color: #6b4a9e; font-weight: 800; }
  .who-pick.on { background: #eadcff; border-color: #6b4a9e; }

  /* 在家裡是老大還是老二。這不是裝飾：小事會照這個分 */
  .rolebox { background: #faf5ff; border: 3px solid #33224a; border-radius: 14px;
             padding: 11px 13px; margin-top: 12px; }
  .roleq { font-size: 14px; font-weight: 900; color: #6b4a9e; text-align: center; }
  .roles { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; }
  .role-pick.on { background: #ffd23f; border-color: #6b4a9e; }
  .rolenote { font-size: 11.5px; color: #8a7fa8; line-height: 1.7; margin-top: 9px; text-align: center; }

  /* 故事 */
  .stage {
    background: #faf5ff; border: 3px solid #33224a; border-radius: 18px;
    padding: 18px 16px; margin: 12px 0;
  }
  .stage .big { font-size: 62px; line-height: 1; text-align: center; margin-bottom: 8px; }
  .narr { font-size: 17px; line-height: 1.85; }
  .hint {
    margin-top: 10px; font-size: 13px; font-weight: 700; color: #6b4a9e;
    background: #fff3c4; border-radius: 10px; padding: 8px 12px; border: 2px dashed #c9a000;
  }
  .choices { display: grid; gap: 9px; }
  .choice {
    width: 100%; text-align: left; background: #fff; font-size: 16px; font-weight: 700;
    padding: 13px 15px; line-height: 1.5; border-radius: 14px;
    position: relative;
  }
  /* 這一輪已經選過的那個選項 → 變灰（重新開始故事就恢復） */
  .choice.seen {
    background: #efedf4; color: #877f9c; border-color: #a9a2bd;
    box-shadow: 0 4px 0 rgba(0,0,0,.07);
  }
  /* 按過了，但這條路裡面還有沒按過的選項 → 淡一點，但不要看起來像關掉了 */
  .choice.past { background: #fdfbff; color: #4a4260; }
  .seenmark, .pastmark {
    display: inline-block; margin-left: 8px; font-size: 11px; font-weight: 800;
    border-radius: 8px; padding: 2px 7px; vertical-align: middle; white-space: nowrap;
  }
  .seenmark { color: #6b5a8e; background: #ded8ea; }
  .pastmark { color: #8a7fa8; background: #efeaf7; }
  /* 結局圖鑑 */
  .galtop { text-align: center; margin: 12px 0 14px; }
  .galnum { font-size: 30px; font-weight: 900; color: #6b4a9e; line-height: 1.2; }
  .galnum small { font-size: 15px; color: #8a7fa8; font-weight: 800; }
  .gal-bar { height: 12px; border-radius: 999px; background: #e2dcee;
             border: 2px solid #cbbce0; overflow: hidden; margin-top: 8px; }
  .gal-bar i { display: block; height: 100%; background: linear-gradient(90deg, #a8e6c0, #7cc9a0); }

  .gal { background: #fff; border: 3px solid #33224a; border-radius: 14px;
         padding: 10px 12px; margin-bottom: 12px; }
  .gal h3 { margin: 0 0 8px; font-size: 15px; color: #6b4a9e;
            display: flex; align-items: center; gap: 6px; }
  .gal h3 .n { margin-left: auto; font-size: 13px; color: #8a7fa8; }
  /* 一定要用 minmax(0, 1fr)：1fr 等於 minmax(auto, 1fr)，而 auto 的下限是
     內容的 min-content——格子裡的 SVG 會把欄位撐得比容器還寬，整排就溢出畫面。 */
  .gal-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  @media (min-width: 560px) { .gal-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

  .gal-cell { border: 2.5px solid #cbbce0; border-radius: 10px; overflow: hidden;
              background: #fff; min-width: 0; }
  .gal-cell svg { width: 100%; display: block; }
  .gal-cap { font-size: 11px; font-weight: 800; padding: 5px 6px; line-height: 1.35; }

  .gal-lock {
    aspect-ratio: 200 / 130; min-width: 0;
    border: 2.5px dashed #cbbce0; border-radius: 10px;
    background: repeating-linear-gradient(45deg, #f4f0fb, #f4f0fb 10px, #eae4f4 10px, #eae4f4 20px);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; color: #b8abd4; font-weight: 900;
  }

  /* 心理安全框：提醒孩子這是在練習少數狀況，不是說世界很可怕。
     只出現在開始畫面——結局頁每一次都放的話，她看過幾十次就只會跳過。 */
  .safeframe {
    background: #eafaf1; border: 2px solid #7cc9a0; border-radius: 12px;
    padding: 10px 14px; margin: 14px 0 0; font-size: 13px; line-height: 1.75;
    color: #1e6b46; text-align: center; font-weight: 700;
  }
  .safeframe b { color: #14603c; }
  /* 給大人看的一句話，語氣要跟給小孩的那一框分開，所以不用綠色 */
  .grownup {
    background: #fff6e5; border: 2px dashed #e0b25c; border-radius: 12px;
    padding: 9px 13px; margin: 8px 0 0; font-size: 12.5px; line-height: 1.7;
    color: #7a5a1e; text-align: center;
  }
  .grownup b { color: #8a5a00; }

  /* 首頁底下的選項圖例：用跟遊戲裡一模一樣的顏色 */
  .legend {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    margin: 12px 0 0;
  }
  .lg {
    font-size: 11px; font-weight: 800; border-radius: 999px;
    padding: 4px 10px; border: 2px solid #33224a;
  }
  .lg-new     { background: #fff;    color: #33224a; }
  .lg-past    { background: #f7f5fb; color: #8a7fa8; }
  .lg-done    { background: #efedf4; color: #877f9c; border-color: #a9a2bd; }

  .steps {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    margin-bottom: 4px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #cbbce0; }
  .dot.on { background: #6b4a9e; transform: scale(1.35); }

  /* 結局 */
  .result { text-align: center; }
  .result .face { font-size: 76px; line-height: 1; }
  /* 小字級用大陰影會糊成兩層，結局標題改用淺陰影 */
  .result h1 { font-size: 24px; text-shadow: 2px 2px 0 #fff; }

  /* 結局插圖 */
  .scene { max-width: 300px; margin: 2px auto 4px; }
  .scene svg { width: 100%; height: auto; display: block; border-radius: 14px; }
  @keyframes rays-spin { to { transform: rotate(360deg); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes cape-wave { 0%,100% { transform: skewY(0deg) scaleX(1); } 50% { transform: skewY(-4deg) scaleX(1.07); } }
  @keyframes sway { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-2px) rotate(-1.2deg); } }
  @keyframes sway2 { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-2px) rotate(1.2deg); } }
  @keyframes hearts-rise { 0% { transform: translateY(6px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-14px); opacity: 0; } }
  @keyframes run-shake { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-3px,-3px); } }
  @keyframes dash { 0%,100% { opacity: .25; transform: translateX(0); } 50% { opacity: .95; transform: translateX(-6px); } }
  @keyframes puff { 0% { opacity: .8; transform: scale(.7); } 100% { opacity: 0; transform: scale(1.4); } }
  @keyframes dragon-miss { 0%,100% { transform: translateX(0) rotate(0deg); } 50% { transform: translateX(-7px) rotate(-5deg); } }
  @keyframes wing-flap { 0%,100% { transform: rotate(0deg) scaleY(1); } 50% { transform: rotate(-16deg) scaleY(.82); } }
  @keyframes fly-drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(6px,-6px); } }
  @keyframes dangle { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  @keyframes sparkle { 0%,100% { opacity: .3; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
  .rays { animation: rays-spin 24s linear infinite; }
  .bob { animation: bob 2.2s ease-in-out infinite; }
  .twinkle text { animation: twinkle 1.6s ease-in-out infinite; }
  .twinkle text:nth-child(2) { animation-delay: .4s; }
  .twinkle text:nth-child(3) { animation-delay: .8s; }
  .twinkle text:nth-child(4) { animation-delay: 1.2s; }
  .cape { animation: cape-wave 2s ease-in-out infinite; }
  .sway { animation: sway 2.6s ease-in-out infinite; }
  .sway2 { animation: sway2 2.6s ease-in-out infinite; }
  .sparkle { animation: sparkle 1.4s ease-in-out infinite; }
  .hearts text { animation: hearts-rise 2.4s ease-out infinite; }
  .hearts text:nth-child(2) { animation-delay: .8s; }
  .hearts text:nth-child(3) { animation-delay: 1.6s; }
  .run { animation: run-shake .38s ease-in-out infinite; }
  .dash path { animation: dash .5s ease-in-out infinite; }
  .dash path:nth-child(2) { animation-delay: .12s; }
  .dash path:nth-child(3) { animation-delay: .24s; }
  .puff circle { animation: puff 1s ease-out infinite; }
  .puff circle:nth-child(2) { animation-delay: .25s; }
  .puff circle:nth-child(3) { animation-delay: .5s; }
  .dragonMiss { animation: dragon-miss 1.1s ease-in-out infinite; }
  .wing { animation: wing-flap .7s ease-in-out infinite; transform-box: fill-box; transform-origin: 100% 60%; }
  .fly { animation: fly-drift 3.2s ease-in-out infinite; }
  .dangle { animation: dangle 1.6s ease-in-out infinite; }
  @keyframes claw-push { 0%,100% { transform: translateX(0); } 50% { transform: translateX(7px); } }
  @keyframes clash { 0%,100% { opacity: .5; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
  @keyframes pull-in { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-6px); } }
  @keyframes swirl { to { transform: rotate(360deg); } }
  @keyframes tilt { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-3deg); } }
  @keyframes shake-bits { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes crouch { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  @keyframes fade-danger { 0%,100% { opacity: .3; } 50% { opacity: .7; } }
  @keyframes ring { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  @keyframes snore { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  @keyframes zzz { 0% { opacity: 0; transform: translateY(4px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
  .clawPush { animation: claw-push 1.3s ease-in-out infinite; }
  .clash { animation: clash .8s ease-in-out infinite; }
  .pull { animation: pull-in 1.6s ease-in-out infinite; }
  .swirl { animation: swirl 6s linear infinite; }
  .tilt { animation: tilt 2.4s ease-in-out infinite; }
  .shakeBits circle { animation: shake-bits .5s ease-in-out infinite; }
  .shakeBits circle:nth-child(2) { animation-delay: .18s; }
  .crouch { animation: crouch 2s ease-in-out infinite; }
  .fadeDanger { animation: fade-danger 1.8s ease-in-out infinite; }
  .ring { animation: ring .9s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  .snore { animation: snore 2.6s ease-in-out infinite; }
  .zzz text { animation: zzz 2.4s ease-out infinite; }
  .zzz text:nth-child(2) { animation-delay: 1.2s; }
  .badge {
    display: inline-block; padding: 5px 16px; border-radius: 999px;
    font-weight: 900; font-size: 15px; border: 3px solid #33224a; margin-top: 6px;
  }
  .lesson {
    text-align: left; font-size: 15px; line-height: 1.85;
    background: #e8f8e6; border: 3px dashed #27ae60; border-radius: 16px;
    padding: 14px 16px; margin: 14px 0;
  }
  .lesson b { color: #1e7d46; }
  .talkbox {
    text-align: left; font-size: 15px; line-height: 1.8;
    background: #fff3c4; border: 3px dashed #c9a000; border-radius: 16px;
    padding: 13px 16px; margin: 12px 0;
  }
  .talkbox-h { font-weight: 900; color: #a07a00; margin-bottom: 5px; }
  /* 收起來的那一塊：按鈕要看起來像「還有東西」，不要看起來像主要內容 */
  .foldbtn {
    display: inline-flex; align-items: center; gap: 5px;
    background: transparent; border: none; box-shadow: none;
    font-size: 13.5px; font-weight: 800; color: #7a6a4a;
    padding: 4px 0; margin: 6px 0 0; width: auto; text-decoration: underline;
    text-underline-offset: 3px; cursor: pointer;
  }
  .lesson .foldbtn { color: #1e7d46; }
  .talkbox .foldbtn { color: #a07a00; margin: 0; font-size: 15px; }
  .replay .foldbtn { color: #6b4a9e; margin: 0; font-size: 15px; }
  .foldbtn .car { transition: transform .18s ease; display: inline-block; }
  .foldbtn.open .car { transform: rotate(180deg); }
  .foldbody { margin-top: 7px; }
  .replay { text-align: left; margin: 12px 0; }
  .replay h3 { font-size: 15px; margin: 0 0 8px; color: #6b4a9e; }
  .step-row {
    display: flex; gap: 9px; align-items: flex-start;
    font-size: 13px; line-height: 1.6; padding: 7px 0;
    border-bottom: 1px dashed #cbbce0;
  }
  .step-row:last-child { border-bottom: none; }
  .step-n {
    flex-shrink: 0; width: 21px; height: 21px; border-radius: 50%;
    background: #6b4a9e; color: #fff; font-size: 12px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
  }
  /* gap 從 9 拉到 13：按鈕高 44px 剛好是觸控的下限，
     間距太小的話小孩的手指很容易按到旁邊那一顆 */
  .row { display: flex; gap: 13px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
  .mini { font-size: 13px; padding: 7px 14px; background: #fff;
          min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .anim { animation: fadeUp .3s ease-out; }
  @keyframes pop { 0% { transform: scale(.6);} 50% { transform: scale(1.15);} 100% { transform: scale(1);} }
  .pop { animation: pop .45s ease-out; }
  @media (prefers-reduced-motion: reduce) { .anim, .pop { animation: none; } }

  /* 兩欄容器：手機／直向是一欄，橫向 iPad 變兩欄 */
  .endgrid, .storygrid { display: grid; gap: 14px; align-items: start; margin-top: 12px; }
  .storygrid > .stage { margin-top: 0; }

  /* ===== iPad 直向 ===== */
  @media (min-width: 700px) {
    .app { max-width: 720px; }
    .card { padding: 24px; border-radius: 26px; }
    h1 { font-size: 32px; }
    .sub { font-size: 16px; }
    .narr { font-size: 20px; line-height: 1.9; }
    .choice { font-size: 19px; padding: 17px 20px; }
    .pick { padding: 16px 18px; }
    .pick .ico { font-size: 46px; }
    .pick .t { font-size: 21px; }
    .pick .g { font-size: 14px; }
    .lesson { font-size: 17px; }
    .hint { font-size: 15px; }
    .step-row { font-size: 15px; }
    button { font-size: 19px; padding: 13px 24px; }
    .mini { font-size: 15px; padding: 9px 16px; }
    .scene { max-width: 360px; }
  }

  /* ===== 寬一點的螢幕：選單排兩欄 ===== */
  @media (min-width: 820px) {
    .app { max-width: 880px; }
    .pick-grid { grid-template-columns: 1fr 1fr; }
  }

  /* ===== iPad 橫向：故事與結局左右分欄，一頁看完不用捲 ===== */
  @media (min-width: 1000px) {
    .app { max-width: 1060px; }
    .endgrid { grid-template-columns: minmax(300px, 42%) 1fr; gap: 24px; }
    .storygrid { grid-template-columns: 1fr 1fr; gap: 24px; }
    /* 只有在左右分欄裡的插圖才撐滿——它的欄本來就只有 42%。
       開場定場圖不在格線裡，撐滿會變成一整片大圖，維持上面的 360px 上限。 */
    .endgrid .scene, .storygrid .scene { max-width: 100%; }
    .result h1 { font-size: 28px; }
  }

  /* 首頁的兩個玩法：並排，不要三條全寬的大按鈕疊在一起 */
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .modes button { width: 100%; padding: 13px 8px; line-height: 1.35;
                  display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .modes button small { font-size: 11.5px; font-weight: 700; opacity: .8; }

  /* 進度：兩個數字合成一行，整條可以點進圖鑑 */
  .statbar { width: 100%; background: #fff; font-size: 13px; font-weight: 800;
             color: #6b4a9e; padding: 9px 10px; margin-bottom: 10px;
             display: flex; align-items: center; justify-content: center;
             gap: 10px; flex-wrap: wrap; }
  .statbar .sep { color: #cbbce0; font-weight: 400; }

  /* ===== 小鎮 ===== */
  .town { border: 3px solid #33224a; border-radius: 14px; overflow: hidden;
          margin: 4px 0 10px; line-height: 0; background: #c8e6c0; }
  .town svg { display: block; width: 100%; height: auto; }
  .town .spot { cursor: pointer; }
  .town .spot:active { opacity: .75; }

  /* 鎮上的人講話。
     講話框浮在地圖中間，不是接在地圖下面：
     接在下面的話，框一出現整頁就被往下推，看起來會頓一下，
     而且她的眼睛要從剛剛點的那個人跳到畫面最底下。 */
  .townwrap { position: relative; }
  .saybox { position: absolute; inset: 0; display: flex;
            align-items: center; justify-content: center; padding: 10px; }
  .saybox[hidden] { display: none; }
  /* 壓得比一般的對話框小：框太高會把整張地圖蓋掉，
     她就看不到自己剛剛點的是誰、旁邊還有什麼。 */
  .saybox .says { width: 100%; max-width: 290px; margin: 0;
                  padding: 9px 11px; font-size: 13.5px; line-height: 1.6;
                  box-shadow: 0 6px 0 rgba(0,0,0,.14), 0 10px 24px rgba(0,0,0,.22);
                  animation: pop .2s ease-out; }
  .saybox .says .face { font-size: 22px; }
  .saybox .says { position: relative; }
  .saybox .says .more { margin-top: 4px; font-size: 11px; }
  /* 關起來的記號。點框上任何地方都會關，這個 ✕ 只是讓她看得出來可以關 */
  .saybox .says .x { position: absolute; top: 4px; right: 9px;
                     font-size: 13px; font-weight: 900; color: #c9a055; }
  .saybox .playhere { margin-top: 7px; padding: 9px 10px; font-size: 14px; }
  .saybox .playhere small { font-size: 11px; }

  .says { display: flex; align-items: flex-start; gap: 10px;
          background: #fff8e6; border: 3px solid #e8a33d; border-radius: 14px;
          padding: 11px 13px; font-size: 14px; line-height: 1.7; }
  .says .face { font-size: 26px; flex: 0 0 auto; }
  .says b { color: #a06a00; }
  .says .more { display: block; margin-top: 5px; font-size: 11.5px;
                font-weight: 800; color: #c08a00; }
  /* 天神爸爸：只在「再試」結局出現，給打氣 */
  .dadsay { display: flex; align-items: center; gap: 10px; margin-top: 10px;
            background: linear-gradient(135deg, #fff6e0, #ffe9c9);
            border: 3px solid #e8a33d; border-radius: 14px; padding: 10px 12px;
            font-size: 14px; line-height: 1.75; }
  .dadsay b { color: #a06a00; }
  .dadsay .dadart { flex: 0 0 62px; }
  .dadsay .dadart svg { width: 62px; height: 62px; display: block; }

  .playhere { width: 100%; margin-top: 8px; background: #6b4a9e; color: #fff;
              font-size: 15px; padding: 12px 10px; line-height: 1.4;
              display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .playhere small { font-size: 11.5px; font-weight: 700; opacity: .85; }

  .townhint { text-align: center; font-size: 13px; font-weight: 700;
              color: #6b5a7e; line-height: 1.7; }

  /* 每天藏的那個東西：說明 + 寶物盒 */
  .hunt { text-align: center; font-size: 12.5px; font-weight: 700; color: #6b5a7e;
          line-height: 1.65; margin: 6px 0 10px; }
  .hunt b { color: #6b4a9e; }
  /* 十二格一定要排得下一行，所以用 flex 讓它自己縮，不要固定寬度 */
  /* 撿到寶物的那一下：飛到畫面中間、放大、撒星星。
     跟講話框一樣浮在地圖上，不推版面。 */
  .foundbox { position: absolute; inset: 0; display: flex;
              align-items: center; justify-content: center; padding: 10px; }
  .foundbox[hidden] { display: none; }
  .foundcard {
    background: #fffaec; border: 3px solid #e8c46a; border-radius: 18px;
    padding: 10px 16px 9px; text-align: center; max-width: 250px;
    box-shadow: 0 6px 0 rgba(0,0,0,.14), 0 12px 28px rgba(0,0,0,.24);
    animation: found-pop .42s cubic-bezier(.2,1.5,.4,1);
  }
  /* 稀有的多了一段祝福，卡片會比地圖高。
     讓它直接超出地圖往上下長，不要在小框裡出現捲軸——
     一年級在那麼小的框裡捲很難用。 */
  .foundbox { overflow: visible; }
  @keyframes found-pop {
    0%   { transform: scale(.4); opacity: 0; }
    70%  { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); }
  }
  /* 星星從中間往外散，六顆各自延遲，看起來像一直在閃 */
  .bigfind { position: relative; height: 54px; display: flex;
             align-items: center; justify-content: center; }
  .bigfind .femo { font-size: 40px; line-height: 1; animation: bob 1.8s ease-in-out infinite; }
  .spark { position: absolute; font-size: 15px; animation: spark 1.5s ease-out infinite; }
  @keyframes spark {
    0%   { transform: translate(0,0) scale(.3); opacity: 0; }
    35%  { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.1); opacity: 0; }
  }
  .spark.s0 { --dx: -42px; --dy: -22px; animation-delay: 0s; }
  .spark.s1 { --dx:  42px; --dy: -22px; animation-delay: .25s; }
  .spark.s2 { --dx: -34px; --dy:  22px; animation-delay: .5s; }
  .spark.s3 { --dx:  34px; --dy:  22px; animation-delay: .75s; }
  .spark.s4 { --dx:   0px; --dy: -34px; animation-delay: 1s; }
  .spark.s5 { --dx:   0px; --dy:  32px; animation-delay: 1.25s; }
  /* 釣到的、挖到的才有這一行：「🎣 釣到了」 */
  .fwhat { font-size: 12px; font-weight: 900; color: #2f6f8f; letter-spacing: .5px;
           margin-bottom: 2px; }
  .fname { font-size: 16px; font-weight: 900; color: #6b4a9e; margin-top: 4px; }
  .fline { font-size: 12.5px; color: #8a7fa8; line-height: 1.6; margin-top: 4px; }
  .fhint { font-size: 11px; font-weight: 800; color: #c9a055; margin-top: 7px; }
  /* 稀有的才有：家裡的一個人跟她說一句話 */
  .bless { display: flex; align-items: flex-start; gap: 8px; text-align: left;
           background: #fff; border: 2.5px solid #e8c46a; border-radius: 12px;
           padding: 8px 10px; margin-top: 9px; font-size: 12.5px; line-height: 1.65; }
  .bless .bface { font-size: 20px; flex: 0 0 auto; line-height: 1.4; }
  .bless b { color: #a06a00; }
  @media (prefers-reduced-motion: reduce) {
    .foundcard, .bigfind .femo, .spark { animation: none; }
    .spark { opacity: .8; }
  }

  /* 進寶物圖鑑的那一顆。六十樣排不進小鎮那一行，細節留給圖鑑頁 */
  .boxbtn { display: block; margin: 7px auto 0; font-size: 13px; padding: 7px 16px;
            background: #fff; border-width: 2.5px; box-shadow: 0 3px 0 rgba(0,0,0,.12); }
  .rare { font-style: normal; font-size: 11px; font-weight: 800; color: #a06a00;
          background: #ffeec2; border-radius: 7px; padding: 1px 6px; }

  /* 寶物圖鑑：一格一樣東西，沒撿過的只給問號 */
  .tbox-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
  @media (min-width: 560px) { .tbox-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .tcell { border: 2.5px solid #cbbce0; border-radius: 10px; background: #fff;
           padding: 7px 5px; text-align: center; min-width: 0; }
  .tcell.rare { border-color: #e8c46a; background: #fffaec; }
  .tcell .te { font-size: 26px; line-height: 1.2; }
  .tcell .tn { font-size: 12px; font-weight: 900; color: #6b4a9e; margin-top: 2px;
               overflow-wrap: anywhere; }
  .tcell .tl { font-size: 10.5px; color: #8a7fa8; line-height: 1.5; margin-top: 3px;
               overflow-wrap: anywhere; }
  .tcell .tc { font-size: 10px; color: #a99ac9; font-weight: 800; margin-top: 3px; }
  .tcell.lock { border-style: dashed; color: #b8abd4; font-size: 24px; font-weight: 900;
                display: flex; align-items: center; justify-content: center; min-height: 76px;
                background: repeating-linear-gradient(45deg, #f4f0fb, #f4f0fb 10px, #eae4f4 10px, #eae4f4 20px); }

  /* 小鎮上方的問候 */
  .daytop { text-align: center; margin-bottom: 10px; }
  .greet { font-size: 15px; color: #33224a; margin-bottom: 6px; line-height: 1.6; }
  .greet b { display: block; font-size: 19px; color: #2f6f8f; }
  .wx { font-size: 12px; font-weight: 800; color: #6b7a85; margin-top: 2px; }

  /* ===== 妹妹版：字放大一點 =====
     小一的識字量還不夠，故事的長句她要一個字一個字認。
     字級是唯一不用外掛任何東西就能降低門檻的地方。
     刻意不做「關鍵字自動上色」：那等於先幫她圈出答案，
     這個遊戲練的就是自己從語氣裡讀出不對勁。 */
  body[data-role="little"] .narr { font-size: 19px; line-height: 1.95; }
  body[data-role="little"] .choice { font-size: 17px; line-height: 1.6; }
  body[data-role="little"] .hint { font-size: 14px; }
  @media (min-width: 700px) {
    body[data-role="little"] .narr { font-size: 22px; }
  }

  /* ===== 會暈的人：把動畫全部關掉 =====
     上面幾個 @media 只關掉了 .anim / .pop 跟慶祝那一張卡，
     插圖裡還有三十幾個動畫（搖晃、飛、閃、撲過來）沒有被關到。
     這一段是總開關，放在最後才蓋得過前面所有的宣告。 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
    /* 這一個不是裝飾：最後兩分鐘藏的東西會一閃一閃，是她找不到時的提示。
       動畫關掉之後那個字不會變暗（沒有 animation-fill-mode，會回到自己的
       opacity 1），但它就完全不顯眼了——提示等於沒有了。
       所以用一圈靜態的光暈代替那個「閃」，不會動的人也看得出是哪一個。
       opacity 那一行是保險：動畫掛在 .twinkle 裡面的 <text>，
       哪天有人給它加了 fill-mode，這一行會擋住它停在 .35。 */
    .twinkle { filter: drop-shadow(0 0 2px #ffd23f) drop-shadow(0 0 5px #f0a33d); }
    .twinkle text { opacity: 1 !important; }
  }

</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
