}

// 點小可愛：叫她做事
function showKidMenu(e) {
  openMenu([
    ['👋 打招呼', fufuPoke],
    ['💃 跳舞', fufuDance],
    [`🐾 陪${petName()}玩`, fufuPlayPet],
    ['🍙 吃東西', () => showFoodMenu('kid')],
    ['🛁 去洗澡', () => fufuGoFind('bath')],
    ['😴 去睡覺', () => fufuGoFind('sleep')],
    ['📖 去念書', () => fufuGoFind('study')]
  ], e);
}
function showItemMenu(it, e) {
  const def = FURN_BY_ID[it.id], use = FURNITURE_USE[it.id], act = FURNITURE_ACT[it.id];
  const entries = [];
  const add = (label, fn) => entries.push([label, fn]);
  if (use) add(use.use === 'lie' ? (use.bath ? '🛁 泡澡' : '😴 躺下睡覺') : '🪑 坐下', () => fufuGoUse(it));
  if (act) add(ACTIVITIES[act].label, () => fufuGoUse(it, false, act));
  if (PET_BEDS[it.id] && !PET_BEDS[it.id].withKid) add(`💤 讓${petName()}睡這裡`, () => {
    if (isEgg()) { toast('蛋還不會走路喔～'); return; }
    petGoNap(it, false);
  });
  if (G.away) { openMenu(entries, e); return; } // 親戚家只能用，不能搬、不能收
  /* 桌上放一樣小東西。一張桌子只放一樣——不然會疊在一起、會穿過桌面。
     收納裡沒有可以放的東西時就不顯示這一項，免得點了跳出空選單。 */
  if (canHaveTop(it.id)) {
    if (it.top) {
      const tdef = FURN_BY_ID[it.top];
      add(`⬇️ 把${tdef ? tdef.name : '桌上的東西'}收起來`, () => {
        if (it.top) addItem(it.top);
        it.top = null;
        toast('收起來了');
        commit();
      });
    } else {
      const can = ON_TABLE.filter(id => G.inv[id] > 0);
      if (can.length) add('🧺 放東西上去', () => openTopPicker(it));
      else add('🧺 放東西上去（我的東西裡沒有小東西）', () => {
        toast('先去商店買小盆栽、公仔這類小東西吧！');
      });
    }
  }
  add('✋ 搬動', () => startHoldFromRoom(it));
  add('📦 收起來', () => {
    curRoom().items = curRoom().items.filter(x => x.uid !== it.uid);
    addItem(it.id);
    toast(`${def.name} 收起來了`);
    commit();
  });
  openMenu(entries, e);
}

canvas.addEventListener('pointerup', e => {
  if (e.button === 2) return;
  if (pet.press) { petPressEnd(performance.now()); return; }
  if (compPressing) { compPressEnd(performance.now()); return; }
  if (!$('#foodMenu').hidden) { $('#foodMenu').hidden = true; return; }
  if (!$('#itemMenu').hidden) { hideItemMenu(); return; }
  const w = toWorld(e);
  if (hold) {
    if (e.pointerType !== 'mouse') {
      const before = [hold.x, hold.y, hold.side, hold.pos].join();
      moveGhost(w);
      if ([hold.x, hold.y, hold.side, hold.pos].join() !== before) { requestDraw(); return; } // 觸控：第一次點移動，同位置再點才放下
    } else moveGhost(w);
    placeHold();
    return;
  }
  if (visitorHit(w)) { openMenu(visitorMenuEntries(), e); return; }
  if (hostHit(w)) { openMenu(hostMenuEntries(), e); return; }
  const fa = farmHit(w);
  if (fa) { openMenu(farmMenuEntries(fa), e); return; }
  if (fufuHit(w)) { if (fufu.pose && fufu.pose.type === 'lie') fufuPoke(); else showKidMenu(e); return; } // 睡覺中點她就叫醒
  const it = pickItem(w);
  if (it) { if (canUse(it)) showItemMenu(it, e); else if (!G.away) startHoldFromRoom(it); return; }
  const wi = G.away ? null : pickWallItem(w);
  if (wi) { startHoldWall(wi); return; }
  const g = toGrid(w), room = curRoom();
  if (g.gx >= 0 && g.gy >= 0 && g.gx < room.w && g.gy < room.d) {
    fufu.pendingSay = null;
    fufuWalkTo(Math.floor(g.gx), Math.floor(g.gy));
  }
});
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  hideItemMenu();
  if (G.away) return;
  if (hold) { storeHold(); return; }
  const wi = pickItem(toWorld(e)) ? null : pickWallItem(toWorld(e));
  if (wi) {
    curRoom().wallItems = curRoom().wallItems.filter(x => x.uid !== wi.uid);
    addItem(wi.id);
    toast(`${FURN_BY_ID[wi.id].name} 收起來了`);
    hoverUid = null;
    commit();
    return;
  }
  const it = pickItem(toWorld(e));
  if (it) {
    curRoom().items = curRoom().items.filter(x => x.uid !== it.uid);
    addItem(it.id);
    toast(`${FURN_BY_ID[it.id].name} 收起來了`);
    hoverUid = null;
    commit();
  }
});
document.addEventListener('keydown', e => {
  if (!$('#modal').hidden) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return; // 正在打字時不觸發快捷鍵
  // 注音等中文輸入法開著時，e.key 會變成 'Process'，所以同時看實體按鍵 e.code
  const k = (e.key || '').toLowerCase(), code = e.code || '';
  if (k === 'r' || code === 'KeyR') { if (hold) { e.preventDefault(); rotateHold(); } }
  else if (k === 'escape' || code === 'Escape') { hideItemMenu(); cancelHold(); }
  else if (k === 'delete' || k === 'backspace' || code === 'Delete' || code === 'Backspace') { if (hold) { e.preventDefault(); storeHold(); } }
});
$('#btnPlace').onclick = placeHold;
$('#btnRotate').onclick = rotateHold;
$('#btnStore').onclick = storeHold;
$('#btnCancel').onclick = cancelHold;

// ── 上方列 ──
let lastBells = G.bells;
function refreshTop() {
  const b = $('#bells');
  b.textContent = fmt(G.bells);
  if (G.bells !== lastBells) { b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); lastBells = G.bells; }
  $('#score').textContent = fmt(totalScore());
  const tabs = $('#roomTabs');
  tabs.innerHTML = '';
  const add = (label, on, fn, cls) => {
    const btn = document.createElement('button');
    btn.textContent = label;
    btn.className = (on ? 'on ' : '') + (cls || '');
    btn.onclick = fn;
    tabs.appendChild(btn);
  };
  if (G.away) { // 在親戚家：回家按鈕＋那個地方的房間
    add('🏠 回家', false, goHome, 'go');
    PLACES[G.away.place].rooms.forEach((r, i) => add(r.name, i === G.away.idx, () => goPlaceRoom(i)));
    add('🚗 出門', false, () => { cancelHold(); openTravelMenu(); }, 'go'); // 從叔叔家直接去阿婆家，不用先回家
    return;
  }
  G.rooms.forEach((r, i) => add(r.name, i === G.cur, () => {
    cancelHold();
    if (i !== G.cur) roomDoors(r.name);
    G.cur = i; commit();
  }));
  add('🚗 出門', false, () => { cancelHold(); openTravelMenu(); }, 'go');
}

function openTab(name) {
  setBigRoom(false);                  // 放大房間時點了分頁：把面板打開
  if (tab !== name) sellMode = false; // 換分頁就離開賣東西模式
  tab = name;
  if (name !== tab) talkEdit = false;   // 離開這一頁，台詞自動鎖回去
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === name));
  renderTab();
}
document.querySelectorAll('#tabs button').forEach(b => { b.onclick = () => openTab(b.dataset.tab); });

/* ===== 手機上讓房間大一點 =====
   ① 「🔍 放大」：面板收成一排分頁，房間佔滿畫面；點任何分頁就打開面板。記住上次的選擇。
   ③ 提示條只在前幾次打開遊戲時顯示（拿著家具時一定顯示）。
   記在這台裝置的瀏覽器裡就好（不是存檔的一部分），讀寫失敗也不影響遊戲。 */
const BIG_KEY = 'myHouse_bigRoom', HINT_KEY = 'myHouse_hintRuns', HINT_RUNS = 5;
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* 私密瀏覽之類，算了 */ } };
function setBigRoom(on) {
  const was = document.body.classList.contains('bigroom');
  if (was === !!on) return;
  document.body.classList.toggle('bigroom', !!on);
  const b = $('#btnZoom');
  if (b) b.textContent = on ? '🔍 縮小' : '🔍 放大';
  lsSet(BIG_KEY, on ? '1' : '0');
}
$('#btnZoom').onclick = () => { setBigRoom(!document.body.classList.contains('bigroom')); Sound.play('click'); };
if (lsGet(BIG_KEY) === '1') setBigRoom(true);
const hintRuns = Number(lsGet(HINT_KEY) || 0) + 1;
lsSet(HINT_KEY, String(hintRuns));
if (hintRuns > HINT_RUNS) $('.stage').classList.add('hint-off');
function hintShown() { const h = $('#hint'); return !!(h && h.offsetParent); }

/* ===== ⏰ 休息提醒 =====
   家長希望小學生不要一次玩太久：連續玩 N 分鐘就請她們休息 M 分鐘。
   - 只算畫面開著的時間；關掉遊戲超過休息時間，回來就重新算（等於已經休息過）。
   - 時間到的時候如果正在玩小遊戲，等她玩完（最多再等 3 分鐘），不要打斷一場遊戲。
   - 提前 2 分鐘提醒「快要休息囉」，讓她有心理準備。
   - 休息時整個遊戲暫停：小可愛、寵物、小農場的動物都在睡覺，寵物不會在休息時變餓。
   - 重新整理也躲不掉（休息到幾點記在這台裝置上）。
   - 家長密碼：設了之後，關掉提醒、改時間、提早結束休息都要輸入密碼。
   這些是「這台裝置」的設定（記在瀏覽器），不是存檔的一部分，換存檔格也一樣有效。 */
const REST_CFG_KEY = 'myHouse_restCfg', REST_STATE_KEY = 'myHouse_restState';
const REST_PLAY_OPTS = [10, 15, 20, 30, 45, 60], REST_BREAK_OPTS = [3, 5, 10, 15];
const REST_GRACE_MS = 3 * 60000, REST_WARN_S = 120;
function restCfg() {
  let c = null;
  try { c = JSON.parse(lsGet(REST_CFG_KEY) || 'null'); } catch (e) { c = null; }
  return Object.assign({ on: true, play: 20, rest: 5, pin: '' }, c || {});
}
function saveRestCfg(c) { lsSet(REST_CFG_KEY, JSON.stringify(c)); }
function restState() {
  let s = null;
  try { s = JSON.parse(lsGet(REST_STATE_KEY) || 'null'); } catch (e) { s = null; }
  return Object.assign({ played: 0, restUntil: 0, lastSeen: 0, dueAt: 0, warned: false }, s || {});
}
function saveRestState(s) { lsSet(REST_STATE_KEY, JSON.stringify(s)); }
// 用 var：畫面的 loop 在載入時就先跑第一格（比這一行早），let 會在那時候丟錯、讓整段程式停掉
var resting = false, restUnlocked = false;

// 每秒呼叫一次。now、visible 可以從外面給（測試用）
function restTick(now, visible) {
  now = now || Date.now();
  const c = restCfg(), s = restState();
  if (s.restUntil > now) { showRest(s.restUntil); return; }
  if (resting) endRest();
  if (!c.on) { s.played = 0; s.lastSeen = now; s.dueAt = 0; s.warned = false; saveRestState(s); return; }
  // 離開超過休息時間 → 算已經休息過
  if (s.lastSeen && now - s.lastSeen >= c.rest * 60000) { s.played = 0; s.dueAt = 0; s.warned = false; }
  if (visible === undefined ? document.visibilityState === 'visible' : visible) {
    if (s.lastSeen && now - s.lastSeen < 5000) s.played += (now - s.lastSeen) / 1000;
    s.lastSeen = now;
  }
  const left = c.play * 60 - s.played;
  if (left <= REST_WARN_S && left > 0 && !s.warned) {
    s.warned = true;
    toast(`⏰ 再玩 ${Math.ceil(left / 60)} 分鐘就要休息囉～`);
    fufuSay('等一下要休息了，把這個玩完吧！', 3000);
  }
  if (left <= 0) {
    if (!s.dueAt) s.dueAt = now;
    // 只有「正在玩的一局小遊戲」可以等（看繪本、公告這些不算），最多再等 3 分鐘
    const inGame = !$('#modal').hidden && $('#modalCard').classList.contains('in-game');
    if (!inGame || now - s.dueAt >= REST_GRACE_MS) {
      s.restUntil = now + c.rest * 60000;
      s.played = 0; s.dueAt = 0; s.warned = false;
      saveRestState(s);
      showRest(s.restUntil);
      return;
    }
  }
  saveRestState(s);
}
// 時間已經到了、正在等她玩完這一局
function restIsDue() { const c = restCfg(); return c.on && restState().dueAt > 0; }
function forceRestNow() {
  const c = restCfg(), s = restState(), now = Date.now();
  s.restUntil = now + c.rest * 60000; s.played = 0; s.dueAt = 0; s.warned = false;
  saveRestState(s);
  showRest(s.restUntil);
}
function showRest(until) {
  let ov = document.getElementById('restOverlay');
  if (!ov) {
    ov = el('div', 'rest-overlay'); ov.id = 'restOverlay';
    ov.append(el('div', 'rest-zz', '😴'), el('div', 'rest-title', '眼睛累了，我們休息一下吧！'),
      el('div', 'rest-tips', '💧 去喝水\n👀 看看窗外遠的地方\n🙆 伸伸懶腰'),
      el('div', 'rest-time', ''), el('div', 'rest-sub', `${charName()}和寵物們也在睡覺喔，等一下見！\n今天也可以先玩到這裡，進度都存好了 👋`));
    const unlock = el('button', 'rest-parent', '👨‍👩‍👧 家長提早結束');
    unlock.onclick = () => askPin('提早結束休息', () => { const s = restState(); s.restUntil = 0; s.lastSeen = Date.now(); saveRestState(s); endRest(); });
    ov.appendChild(unlock);
    document.body.appendChild(ov);
  }
  if (!resting) {
    resting = true;
    if (typeof closeGameWindow === 'function' && !$('#modal').hidden) { try { closeGameWindow(); } catch (e) {} $('#modal').hidden = true; }
    Sound.play('click');
  }
  const left = Math.max(0, Math.ceil((until - Date.now()) / 1000));
  ov.querySelector('.rest-time').textContent = `還要休息 ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  ov.hidden = false;
}
function endRest() {
  const ov = document.getElementById('restOverlay');
  if (ov) ov.hidden = true;
  if (!resting) return;
  resting = false;
  // 休息的時候寵物在睡覺：從現在開始重新算肚子餓，不扣休息那段
  const now = Date.now();
  G.pet.lastTick = now; G.kid.lastTick = now;
  saveGame();
  fufuSay('休息好了！我們繼續玩吧～', 3000);
}
// 家長密碼：沒有設密碼就直接通過；設了就要輸入對
function askPin(why, ok) {
  const c = restCfg();
  if (!c.pin) { ok(); return; } // 每次都要輸入：只輸入一次就整段免驗證，小朋友就可以自己改
  const v = window.prompt(`${why}：請輸入家長密碼（4 位數字）`);
  if (v === null) return;
  if (v.trim() === c.pin) ok();
  else toast('密碼不對喔');
}
// 設定分頁裡的「⏰ 休息提醒」
function restSettings(body) {
  const c = restCfg();
  body.appendChild(h3('⏰ 休息提醒（家長設定）'));
  body.appendChild(note(c.on
    ? `現在：連續玩 ${c.play} 分鐘，就休息 ${c.rest} 分鐘。` + (c.pin ? '已經設了家長密碼。' : '建議設一個家長密碼，小朋友才不會自己關掉。')
    : '現在：休息提醒是關掉的。'));
  const row = (label, opts, cur, set) => {
    const r = el('div', 'filter themes');
    r.appendChild(el('span', 'flabel', label));
    opts.forEach(v => {
      const b = el('button', v === cur ? 'on' : '', typeof v === 'number' ? `${v} 分` : v);
      b.onclick = () => askPin('修改休息提醒', () => { const c2 = restCfg(); set(c2, v); saveRestCfg(c2); renderTab(); });
      r.appendChild(b);
    });
    body.appendChild(r);
  };
  row('提醒', ['開', '關'], c.on ? '開' : '關', (c2, v) => { c2.on = v === '開'; });
  if (c.on) {
    row('玩幾分鐘', REST_PLAY_OPTS, c.play, (c2, v) => { c2.play = v; });
    row('休息幾分鐘', REST_BREAK_OPTS, c.rest, (c2, v) => { c2.rest = v; });
  }
  const pinBtn = el('button', 'mini', c.pin ? '🔑 改家長密碼' : '🔑 設定家長密碼');
  pinBtn.onclick = () => askPin('修改家長密碼', () => {
    const v = window.prompt('請輸入新的 4 位數家長密碼（留空＝不用密碼）', '');
    if (v === null) return;
    const t = v.trim();
    if (t && !/^\d{4}$/.test(t)) { toast('密碼要是 4 位數字'); return; }
    const c2 = restCfg(); c2.pin = t; saveRestCfg(c2); restUnlocked = false;
    toast(t ? '🔑 家長密碼設好了，請記下來' : '已經取消家長密碼');
    renderTab();
  });
  body.appendChild(pinBtn);
}
setInterval(() => { try { restTick(); } catch (e) { /* 提醒出錯也不能讓遊戲壞掉 */ } }, 1000);

</script>
<script>
// 左側面板：收納、商店、壁紙地板、擴建、賺錢、圖鑑
'use strict';

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function h3(t) { return el('h3', '', t); }
function note(t) { return el('p', 'note', t); }

function furnCard(def, sub, onClick, count) {
  const c = el('button', 'card');
  c.appendChild(thumb(def));
  c.appendChild(el('div', 'nm', def.name));
  if (sub) c.appendChild(el('div', 'pr', sub));
  if (count) c.appendChild(el('span', 'ct', '×' + count));
  c.onclick = onClick;
  return c;
}

function renderTab() {
  const body = $('#tabBody');
  body.innerHTML = '';
  ({ inv: tabInv, shop: tabShop, deco: tabInv, build: tabBuild, earn: tabEarn, book: tabBook, talk: tabTalk, dress: tabDress, pets: tabPets, save: tabSave })[tab](body);
}

// ── 賣回商店 ──
let sellMode = false; // 切換分頁時會關掉（ui.js）
let talkEdit = false;  // 台詞編輯模式；換分頁就鎖回去，不存進存檔

function sellToggle(body, extraNote) {
  const b = el('button', 'sellbtn' + (sellMode ? ' on' : ''), sellMode ? '✓ 賣完了，回到一般模式' : '💰 賣回商店（半價）');
  b.onclick = () => { sellMode = !sellMode; Sound.play('click'); renderTab(); };
  body.appendChild(b);
  if (sellMode) body.appendChild(note(`點要賣的東西，可以拿回原價一半的鈴錢。賣掉之後想再買，要付原價喔。${extraNote || ''}`));
}

// 賣之前一定先問一次，避免小朋友點錯
function confirmSell(name, price, doSell) {
  const card = $('#modalCard');
  card.innerHTML = '';
  card.appendChild(el('h2', '', '💰 賣回商店'));
  card.appendChild(el('p', 'sell-q', `要把「${name}」賣掉嗎？`));
  const info = el('div', 'sell-info');
  info.append(
    el('div', '', `可以拿到　💰 ${fmt(sellValue(price))}`),
    el('div', 'muted', `之後想買回來要　💰 ${fmt(price)}`)
  );
  card.appendChild(info);
  const yes = el('button', 'big warnbtn', '賣掉');
  const no = el('button', 'big alt', '不要，留著');
  const close = () => { $('#modal').hidden = true; };
  yes.onclick = () => {
    close();
    const got = doSell();
    if (got) { Sound.play('coin'); toast(`賣掉「${name}」，拿到 ${fmt(got)} 鈴錢`); }
    commit();
  };
  no.onclick = () => { close(); Sound.play('click'); };
  card.append(yes, no);
  $('#modal').hidden = false;
}

function sellCard(visual, name, price, block, count, onSell) {
  const c = el('button', 'card' + (block ? ' dim' : ' sellable'));
  c.appendChild(visual);
  c.appendChild(el('div', 'nm', name));
  c.appendChild(el('div', 'pr', block || `賣 💰 ${fmt(sellValue(price))}`));
  if (count) c.appendChild(el('span', 'ct', '×' + count));
  c.onclick = () => {
    if (block) { toast(`「${name}」${block}，不能賣`); return; }
    confirmSell(name, price, onSell);
  };
  return c;
}

function tabInv(body) {
  const ids = Object.keys(G.inv).filter(id => G.inv[id] > 0);
  const foods = Object.keys(G.food).filter(id => G.food[id] > 0);
  sellToggle(body, '房間裡的家具要先收起來才能賣；正在用的壁紙地板也要先換成別的。');
  body.appendChild(h3('🛋️ 家具'));
  if (!ids.length) {
    body.appendChild(note('還沒有家具。去「商店」買家具，或到「賺錢」搖樹看看會不會掉東西下來。'));
  } else {
    if (!sellMode) body.appendChild(note('點一下家具，再點房間地板放下。掛畫、時鐘這類掛飾要點在牆上。'));
    const grid = el('div', 'grid');
    ids.forEach(id => {
      const def = FURN_BY_ID[id];
      grid.appendChild(sellMode
        ? sellCard(thumb(def), def.name, def.price, furnSellBlock(id), G.inv[id], () => sellFurniture(id))
        : furnCard(def, THEME_NAMES[def.theme], () => startHoldFromInv(id), G.inv[id]));
    });
    body.appendChild(grid);
  }
  /* 壁紙、地板也是買回來的東西，跟家具放在一起（以前是獨立的「壁紙地板」分頁）。
     這裡只列自己有的，點了就換上；還沒買的在「商店」→「🎨 壁紙地板」。 */
  const room = curRoom();
  if (!sellMode && G.away) body.appendChild(note(`現在在${PLACES[G.away.place].name}，回家才能換壁紙地板喔。`));
  else {
    if (!sellMode) body.appendChild(note(`點一下就換到「${room.name}」。牆和地板跟家具同風格，評分會加分。想要新的去「商店」→「🎨 壁紙地板」。`));
    body.appendChild(h3('🧱 壁紙'));
    body.appendChild(decoGrid('wall', WALLPAPERS, G.walls, room.wall, 'own'));
    body.appendChild(h3('🟫 地板'));
    body.appendChild(decoGrid('floor', FLOORS, G.floors, room.floor, 'own'));
  }
  const kidFoods = Object.keys(G.kidFood).filter(id => G.kidFood[id] > 0);
  if (sellMode && kidFoods.length) { // 賣東西時也可以賣食物
    body.appendChild(h3(`${charName()}的食物`));
    const kg = el('div', 'grid');
    kidFoods.forEach(id => {
      const f = KID_FOOD_BY_ID[id];
      kg.appendChild(sellCard(el('div', 'emoji', f.emoji), f.name, f.price, kidFoodSellBlock(id), G.kidFood[id], () => sellKidFood(id)));
    });
    body.appendChild(kg);
  }
  if (sellMode && foods.length) {
    body.appendChild(h3('寵物食物'));
    const fg = el('div', 'grid');
    foods.forEach(id => {
      const f = FOOD_BY_ID[id];
      fg.appendChild(sellCard(el('div', 'emoji', f.emoji), f.name, f.price, foodSellBlock(id), G.food[id], () => sellFood(id)));
    });
    body.appendChild(fg);
  }
}

// 商店的食物卡片
function foodShopGrid(list, stock, buy, subText) {
  const fg = el('div', 'grid');
  list.forEach(food => {
    const c = el('button', 'card' + (G.bells < food.price ? ' dim' : ''));
    c.appendChild(el('div', 'emoji', food.emoji));
    c.appendChild(el('div', 'nm', food.name));
    c.appendChild(el('div', 'pr', `💰 ${fmt(food.price)}　${subText(food)}`));
    if (stock[food.id]) c.appendChild(el('span', 'ct', '×' + stock[food.id]));
    c.onclick = () => {
      if (buy(food.id)) { Sound.play('coin'); toast(`買了「${food.name}」`); commit(); }
      else toast('鈴錢不夠，去賺一點吧！');
    };
    fg.appendChild(c);
  });
  return fg;
}

function tabShop(body) {
  body.appendChild(h3('小狸商店'));
  // 第一排：她在想的事（我要一張床）。第二排：想湊風格加成的時候才用
  const f = el('div', 'filter kinds');
  [['all', '', '全部'], ['food', '🍎', '食物'], ['paper', '🎨', '壁紙地板']]
    .concat(FURN_KINDS.map(k => [k.id, k.icon, k.name]))
    .forEach(([k, icon, n]) => {
      const b = el('button', k === shopKind ? 'on' : '');
      if (icon) b.appendChild(el('span', 'fi', icon));
      b.appendChild(el('span', '', n));
      b.onclick = () => { shopKind = k; renderTab(); };
      f.appendChild(b);
    });
  body.appendChild(f);
  /* 風格：只列「這一類真的有東西」的風格，後面寫有幾樣，前面加小圖示（妹妹看圖就知道）。
     以前五個風格永遠都在，選「佈置」再選「衛浴」就是一整頁空白。
     這一類只有一種風格（或是食物）就不顯示這一排。 */
  const counts = shopThemeCounts(shopKind);
  const themes = Object.keys(THEME_NAMES).filter(t => counts[t] > 0);
  if (shopTheme !== 'all' && !themes.includes(shopTheme)) shopTheme = 'all';
  if (themes.length > 1) {
    const f2 = el('div', 'filter themes');
    f2.appendChild(el('span', 'flabel', '風格'));
    [['all', '', '全部']].concat(themes.map(t => [t, THEME_ICONS[t], `${THEME_NAMES[t]} ${counts[t]}`])).forEach(([k, icon, n]) => {
      const b = el('button', k === shopTheme ? 'on' : '');
      if (icon) b.appendChild(el('span', 'fi', icon));
      b.appendChild(el('span', '', n));
      b.onclick = () => { shopTheme = k; renderTab(); };
      f2.appendChild(b);
    });
    body.appendChild(f2);
  }
  if (shopKind === 'paper') { shopDeco(body); return; }
  /* 在「全部」選了風格：食物沒有風格，不要再把食物擺最上面——
     不然點了風格，畫面看起來完全沒變（家具在很下面） */
  if (shopKind === 'food' || (shopKind === 'all' && shopTheme === 'all')) {
    body.appendChild(h3(`${charName()}的食物`));
    body.appendChild(foodShopGrid(KID_FOODS, G.kidFood, buyKidFood,
      food => food.grow ? '💪 健康長大' : `飽足+${food.hunger}`));
    body.appendChild(h3(`寵物食物（${charName()}也可以吃）`));
    body.appendChild(foodShopGrid(FOODS, G.food, buyFood, food => `飽足+${food.hunger}`));
    if (shopKind === 'food') return;
    body.appendChild(h3('家具'));
  } else if (shopKind === 'all') body.appendChild(h3(`${THEME_ICONS[shopTheme]} ${THEME_NAMES[shopTheme]}風格的家具`));
  const grid = el('div', 'grid');
  FURNITURE.filter(d => !d.gift)
    .filter(d => shopKind === 'all' || shopKind === 'food' || furnKind(d.id) === shopKind)
    .filter(d => shopTheme === 'all' || d.theme === shopTheme)
    .forEach(def => {
    const card = furnCard(def, '💰 ' + fmt(def.price), () => {
      if (buyFurniture(def.id)) { Sound.play('coin'); toast(`買了「${def.name}」，放進「我的東西」了`); commit(); }
      else toast('鈴錢不夠，去賺一點吧！');
    }, G.inv[def.id]);
    if (G.bells < def.price) card.classList.add('dim');
    if (def.fresh || isNewItem(def.id)) card.appendChild(el('span', 'tag new', '新'));
    grid.appendChild(card);
  });
  body.appendChild(grid);
  if (shopKind === 'all') shopDeco(body);
}
// 這一類商品裡，每個風格有幾樣（壁紙地板只算還沒買的）
const THEME_ICONS = { wood: '🪵', cute: '🎀', modern: '🏙️', nature: '🌿', bath: '🛁' };
function shopThemeCounts(kind) {
  const c = {};
  const add = t => { c[t] = (c[t] || 0) + 1; };
  if (kind !== 'paper') FURNITURE.filter(d => !d.gift && (kind === 'all' || furnKind(d.id) === kind)).forEach(d => add(d.theme));
  if (kind === 'all' || kind === 'paper') {
    WALLPAPERS.filter(w => !G.walls.includes(w.id)).forEach(w => add(w.theme));
    FLOORS.filter(f => !G.floors.includes(f.id)).forEach(f => add(f.theme));
  }
  return c;
}
// 商店的壁紙地板：只賣還沒有的；買了直接換上
function shopDeco(body) {
  if (G.away) { body.appendChild(h3('🎨 壁紙地板')); body.appendChild(note(`現在在${PLACES[G.away.place].name}，回家才能買壁紙地板喔。`)); return; }
  const room = curRoom();
  body.appendChild(h3('🧱 壁紙'));
  const wg = decoGrid('wall', WALLPAPERS, G.walls, room.wall, 'shop');
  const allTheme = shopTheme === 'all';
  body.appendChild(wg.children.length ? wg : note(allTheme ? '壁紙全部都買齊了！' : '這個風格的壁紙都買齊了！'));
  body.appendChild(h3('🟫 地板'));
  const fg = decoGrid('floor', FLOORS, G.floors, room.floor, 'shop');
  body.appendChild(fg.children.length ? fg : note(allTheme ? '地板全部都買齊了！' : '這個風格的地板都買齊了！'));
}

/* mode：'own'＝我的東西（只列有的，點了換上）；'shop'＝商店（只列還沒有的，點了買＋換上） */
function decoGrid(kind, list, owned, current, mode) {
  const grid = el('div', 'grid');
  list.forEach(item => {
    const has = owned.includes(item.id);
    if (mode === 'own' && !has) return;
    if (mode === 'shop' && has) return;
    if (mode === 'shop' && shopTheme !== 'all' && item.theme !== shopTheme) return;
    if (sellMode) {
      if (!has) return; // 賣東西時只列出自己有的
      const sw = renderSwatch(kind, item, 56);
      sw.className = 'sw';
      grid.appendChild(sellCard(sw, item.name, item.price, decoSellBlock(kind, item.id), 0, () => sellDeco(kind, item.id)));
      return;
    }
    const c = el('button', 'card' + (item.id === current ? ' cur' : '') + (!has && G.bells < item.price ? ' dim' : ''));
    const sw = renderSwatch(kind, item, 56);
    sw.className = 'sw';
    c.appendChild(sw);
    c.appendChild(el('div', 'nm', item.name));
    c.appendChild(el('div', 'pr', has ? (item.id === current ? '使用中' : '已擁有') : '💰 ' + fmt(item.price)));
    c.onclick = () => {
      if (G.away) { toast('在別人家不能換壁紙地板，回家再換吧！'); return; }
      if (buyDeco(kind, item.id)) { Sound.play(has ? 'click' : 'coin'); toast(has ? `換上「${item.name}」了` : `買了「${item.name}」，已經換上了（之後在「我的東西」可以換回來）`); commit(); }
      else toast('鈴錢不夠，去賺一點吧！');
    };
    grid.appendChild(c);
  });
  return grid;
}

function tabBuild(body) {
  if (G.away) { body.appendChild(note(`現在在${PLACES[G.away.place].name}，不能擴建喔。按上面的「🏠 回家」再蓋吧！`)); return; }
  const room = curRoom(), n = nextSize(room);
  body.appendChild(h3(`${room.name}（目前 ${room.w}×${room.d} 格）`));
  if (n) {
    const cost = EXPAND_COST[n];
    const b = el('button', 'big', `擴建成 ${n}×${n}　💰 ${fmt(cost)}`);
    b.disabled = G.bells < cost;
    b.onclick = () => { if (expandRoom()) { toast(`${room.name}變大了！`); fufuSay(pickLine('expand')); commit(); } };
    body.appendChild(b);
  } else body.appendChild(note('這間已經是最大尺寸了。'));

  body.appendChild(h3('增加房間'));
  if (G.rooms.length < ROOM_NAMES.length) body.appendChild(note(`每多蓋一間房間，就能多帶一隻寵物出來一起玩（最多 ${Math.min(MAX_PETS_OUT, 1 + ROOM_NAMES.length)} 隻）。`));
  if (G.rooms.length >= ROOM_NAMES.length) body.appendChild(note('房間已經全部蓋好了！'));
  else if (!canAddRoom()) body.appendChild(note(`先把「${G.rooms[0].name}」擴建到 6×6，才能蓋新房間。`));
  else {
    const cost = newRoomCost();
    const b = el('button', 'big alt', `蓋「${ROOM_NAMES[G.rooms.length]}」　💰 ${fmt(cost)}`);
    b.disabled = G.bells < cost;
    b.onclick = () => {
      cancelHold();
      const before = petsOutLimit();
      if (!addRoom()) return;
      const more = petsOutLimit() > before;
      toast(more ? '新房間蓋好了！可以多帶一隻寵物出來玩（到「寵物」分頁選）' : '新房間蓋好了！');
      fufuSay(pickLine(more ? 'morePets' : 'newRoom'), 3500);
      commit();
    };
    body.appendChild(b);
  }
  body.appendChild(h3('擴建價目'));
  Object.entries(EXPAND_COST).forEach(([s, c]) => {
    const r = el('div', 'row');
    r.append(el('span', '', `擴建成 ${s}×${s}`), el('span', '', '💰 ' + fmt(c)));
    body.appendChild(r);
  });
}

function tabEarn(body) {
  body.appendChild(h3('每日禮物'));
  const gift = el('button', 'big', G.lastGift === today() ? '今天已領過 🎁' : '領取今日禮物 🎁 💰1,000');
  gift.disabled = G.lastGift === today();
  gift.onclick = () => { const n = claimGift(); if (n) { Sound.play('coin'); toast(`收到 ${fmt(n)} 鈴錢！`); commit(); } };
  body.appendChild(gift);

  body.appendChild(h3('居家評分獎金'));
  const s = totalScore();
  const claim = el('button', 'big alt', G.lastClaim === today() ? '今天已領過 ⭐' : `領取評分獎金 ⭐ 💰${fmt(s)}`);
  claim.disabled = G.lastClaim === today() || s <= 0;
  claim.onclick = () => { const n = claimScore(); if (n) { Sound.play('coin'); toast(`評分獎金 ${fmt(n)} 鈴錢！`); commit(); } };
  body.appendChild(claim);
  body.appendChild(note('每天一次。家具越多、種類越多、同風格湊滿 3 件和 6 件、牆和地板搭配同風格，分數越高。'));

  body.appendChild(h3('搖樹（點樹）'));
  const tree = el('div', 'tree', '🌳');
  regen(G.tree, TREE_MAX, TREE_REGEN_MS);
  const left = G.tree.n;
  tree.onclick = () => {
    tree.classList.remove('shake'); void tree.offsetWidth; tree.classList.add('shake');
    const r = shakeTree();
    if (r.tired) { Sound.play('miss'); toast('🌳 ' + pickLine('treeTired')); fufuSay(pickLine('treeTired'), 3000); return; }
    if (!r.wait) { Sound.play('shake'); if (r.bells || r.food || r.item) setTimeout(() => Sound.play('coin'), 350); }
    if (r.wait) toast(`樹還在晃，${r.wait} 秒後再試`);
    else if (r.bells) toast(`掉下 ${fmt(r.bells)} 鈴錢！`);
    else if (r.item) toast(`掉下「${r.item.name}」！放進「我的東西」了`);
    else if (r.food) toast(`掉下一顆${r.food.emoji}${r.food.name}！可以餵${petName()}`);
    else toast('🐝 蜂窩掉下來了！快跑！');
    if (!r.wait) commit();
  };
  body.appendChild(tree);
  // 還能搖幾次：🍎 是還有的果子，⚪ 是還沒長回來的
  body.appendChild(el('div', 'tree-left', '🍎'.repeat(left) + '⚪'.repeat(TREE_MAX - left) + `　還可以搖 ${left} 次`));
  if (!left) body.appendChild(note('樹累了。陪寵物玩、餵東西、做家事、玩小遊戲、跟鄰居聊天，每做一件事樹就會長回一顆果子（等一下也會自己長回來）。'));

  body.appendChild(h3('釣魚'));
  const fishBtn = el('button', 'big', '🎣 去釣魚');
  fishBtn.onclick = openFishing;
  body.appendChild(fishBtn);

  body.appendChild(h3('小遊戲'));
  body.appendChild(note('每場 1 分鐘內玩完，分數越高拿到越多鈴錢。'));
  const games = el('div', 'game-list');
  [['🃏', '翻牌配對', openMemoryGame], ['🧺', `${petName()}接水果`, openCatchGame], ['🫧', '戳泡泡', openBubbleGame],
    ['🥤', '杯子躲貓貓', openCupGame], ['🥞', '疊疊鬆餅', openStackGame], ['🎵', '跟著唱', openSimonGame],
    ['🎯', '彈弓丟蘋果', openSlingGame],
    ['🧩', '拼圖', openPuzzleGame],
    ['🪙', '接金幣', openCoinGame],
    ['⚪', '彈珠台', openMarbleGame]].forEach(([icon, label, fn]) => {
    const b = el('button', 'game-pick');
    b.append(el('span', 'gi', icon), el('span', '', label));
    b.onclick = () => { Sound.play('click'); fn(); };
    games.appendChild(b);
  });
  body.appendChild(games);
}

/* 📖 圖鑑：所有收集都在這一頁。最上面一排是總覽，點了跳到那一段。
   妹妹看不懂字，所以每一段都有圖示，總覽也是圖示＋數字。 */
function tabBook(body) {
  const got = FURNITURE.filter(f => G.seen[f.id]).length;
  const count = o => Object.keys(o || {}).length;
  const sections = [
    ['dexFurn', '🛋️', '家具', got, FURNITURE.length],
    ['dexFish', '🐟', '魚', FISH.filter(f => G.fish[f.name]).length, FISH.length],
    ['dexFriend', '🐻', '好朋友', NEIGHBORS.filter(n => G.friends[n.id]).length, NEIGHBORS.length],
    ['dexAnimal', '🐮', '動物', count(G.animals), ANIMAL_DEX().length],
    ['dexComic', '📚', '漫畫', count(G.comics), COMICS.length],
    ['dexSticker', '⭐', '貼紙', count(G.stickers), STICKERS.length],
    ['dexBfly', '🦋', '蝴蝶', count(G.butterflies), BUTTERFLIES.length],
    ['dexPass', '📗', '閱讀護照', count(G.passport), STORYBOOKS.length]
  ];
  const sum = el('div', 'dex-sum');
  sections.forEach(([id, icon, name, n, all]) => {
    const b = el('button', 'dex-chip' + (n >= all ? ' full' : ''));
    b.append(el('span', 'dex-ic', icon), el('span', 'dex-nm', name), el('span', 'dex-n', `${n}/${all}`));
    b.onclick = () => { const t = document.getElementById(id); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    sum.appendChild(b);
  });
  body.appendChild(sum);
  const sec = (id, text) => { const h = h3(text); h.id = id; return h; };
  body.appendChild(sec('dexFurn', `🛋️ 家具圖鑑 ${got} / ${FURNITURE.length}`));
  body.appendChild(note('買過、或搖樹掉下來拿到的家具，就會收進圖鑑。淡淡的是還沒收集到的。'));
  const grid = el('div', 'grid');
  FURNITURE.forEach(def => {
    const c = furnCard(def, G.seen[def.id] ? THEME_NAMES[def.theme] : '還沒收集', () => {});
    if (!G.seen[def.id]) c.classList.add('dim');
    grid.appendChild(c);
  });
  body.appendChild(grid);

  const fishGot = FISH.filter(f => G.fish[f.name]).length;
  body.appendChild(sec('dexFish', `🐟 魚類圖鑑 ${fishGot} / ${FISH.length}`));
  FISH.forEach(f => {
    const r = el('div', 'row');
    r.append(el('span', '', G.fish[f.name] ? f.name : '？？？'), el('span', '', G.fish[f.name] ? `釣到 ${G.fish[f.name]} 次` : '—'));
    body.appendChild(r);
  });
  const met = NEIGHBORS.filter(n => G.friends[n.id]);
  body.appendChild(sec('dexFriend', `🐻 好朋友 ${met.length} / ${NEIGHBORS.length}`));
  body.appendChild(note('動物鄰居會不定時來家裡玩。點他們可以聊天、請他們坐下來聊、一起跳舞。'));
  const fg = el('div', 'grid');
  NEIGHBORS.forEach(n => {
    const has = !!G.friends[n.id];
    const c = el('div', 'card dex' + (has ? '' : ' dim'));
    c.appendChild(renderNeighborPortrait(n, 60, 54, !has));
    c.appendChild(el('div', 'nm', has ? n.name : '？？？'));

    c.appendChild(el('div', 'nm', met ? `${n.emoji} ${n.name}` : '？？？'));

  // 🦋 蝴蝶相簿
  body.appendChild(sec('dexBfly', `🦋 蝴蝶相簿 ${count(G.butterflies)} / ${BUTTERFLIES.length}`));
  body.appendChild(note('在公園的花圃拍蝴蝶就會收集到。彩虹蝴蝶很少見喔！'));

    const n = (G.butterflies || {})[b.id];
    const cell = el('div', 'bfly' + (n ? '' : ' none'));
    if (n) {
      const cv = document.createElement('canvas'); cv.width = 64; cv.height = 52;
      drawButterfly(cv.getContext('2d'), 32, 28, b, 1.2, 1.5);
      cell.append(cv, el('span', '', `${b.name} ×${n}`));
    } else cell.append(el('b', '', '？'), el('span', '', '還沒拍到'));
    bg.appendChild(cell);
  });
  body.appendChild(bg);

  // 📗 閱讀護照：看過的點一下可以再看一次
  body.appendChild(sec('dexPass', `📗 閱讀護照 ${count(G.passport)} / ${STORYBOOKS.length}`));
  body.appendChild(note('在圖書館看完一本繪本就蓋一個章。全部蓋滿可以拿獎狀！看過的點一下可以再看一次。'));
  const pg = el('div', 'pass-grid');
  STORYBOOKS.forEach(b => {
    const has = !!(G.passport || {})[b.id];
    const cell = el('button', 'pass' + (has ? ' done' : ''));
    cell.append(el('div', 'pass-cover', b.cover), el('span', '', b.title));
    if (has) { cell.appendChild(el('div', 'pass-stamp', '讀')); cell.onclick = () => openStorybook(b.id); }
    else cell.disabled = true;
    pg.appendChild(cell);
  });
  body.appendChild(pg);

  /* 「累計賺到」留在這裡（它是收集的一部分），
     但「重新開始」搬去設定分頁了——那是整個遊戲最危險的按鈕，
     不該藏在收集品頁面，而且它跟備份、存檔格本來就是同一件事。 */
  body.appendChild(h3('紀錄'));
  const r = el('div', 'row');
  r.append(el('span', '', '累計賺到'), el('span', '', '💰 ' + fmt(G.earned)));
  body.appendChild(r);
}

// 清除存檔要確認兩次：先看清楚會失去什麼，再自己打「重新開始」四個字，避免小朋友點錯（115.9.19 謝會）
function confirmReset() {
  const card = $('#modalCard'), close = () => { $('#modal').hidden = true; };
  card.innerHTML = '';
  card.appendChild(el('h2', '', '⚠️ 真的要重新開始嗎？'));
  card.appendChild(el('p', 'sell-q', '房子、家具、衣服、寵物、鈴錢，全部都會不見喔！'));
  // 以前這裡寫「救不回來」。現在清掉之前會自動留一份，所以講實話，
  // 但還是要她先自己存一份——自動留的那一份只有一次，再清一次就蓋掉了
  card.appendChild(note('清掉之前會自動留一份，到「備份」分頁按「把上一份換回來」還救得回來。' +
    '不過只留最近一次，想保險一點的話，先去「備份」分頁存一份再清。'));
  const no = el('button', 'big', '不要，我要繼續玩');
  const yes = el('button', 'big alt', '我確定，下一步');
  no.onclick = () => { close(); Sound.play('click'); };
  yes.onclick = () => {
    card.innerHTML = '';
    card.appendChild(el('h2', '', '最後一次確認'));
    card.appendChild(note('如果真的要全部清掉，請在下面打「重新開始」四個字：'));
    const input = el('input', 'textin');
    input.placeholder = '重新開始';
    const doIt = el('button', 'big warnbtn', '清除所有進度');
    doIt.disabled = true;
    input.oninput = () => { doIt.disabled = input.value.trim() !== '重新開始'; };
    doIt.onclick = () => {
      if (input.value.trim() !== '重新開始') return;
      close();
      // 清掉之前整份收起來，到「備份」分頁按「把上一份換回來」就回得去
      try { localStorage.setItem(UNDO_KEY, makeBackup()); } catch (e) {}
      G = newGame(); cancelHold(); hold = null; updateHoldUI(); commit();
      toast('已經重新開始了（「備份」分頁可以反悔）');
    };
    const back = el('button', 'big', '不要，我要繼續玩');
    back.onclick = () => { close(); Sound.play('click'); };
    card.append(input, doIt, back);
    input.focus();
  };
  card.append(no, yes);
  $('#modal').hidden = false;
}

// 畫一個穿著指定衣服的小可愛（ids: {slot: 衣服 id}）
const girlThumbCache = {};
function renderGirl(ids, w, h, opts) {
  const back = !!(opts && opts.back);
  /* 髮型也要進快取的 key。不加的話，五款髮型的預覽圖會因為
     ids/w/h/back 都一樣而共用同一張快取——全部長成第一張畫的那一款。 */
  const hair = (opts && opts.hair) || (G && G.hair) || DEFAULT_HAIR;
  const key = JSON.stringify([ids, w, h, back, hair]);
  const dpr = window.devicePixelRatio || 1;
  const c = document.createElement('canvas');
  c.width = w * dpr; c.height = h * dpr;
  c.style.width = w + 'px'; c.style.height = h + 'px';
  const g = c.getContext('2d');
  if (girlThumbCache[key]) {
    const img = new Image();
    img.onload = () => g.drawImage(img, 0, 0);
    img.src = girlThumbCache[key];
    return c;
  }
  const outfit = {};
  OUTFIT_SLOTS.forEach(({ key: k }) => { outfit[k] = CLOTHES_BY_ID[ids[k]]; });
  const s = (h - 6) / 74 * dpr; // 含帽子約 74 高
  g.setTransform(s, 0, 0, s, c.width / 2, c.height - 3 * dpr);
  drawGirl(g, { t: 0, back, outfit, hair });
  girlThumbCache[key] = c.toDataURL();
  return c;
}

let dressBack = false; // 預覽看背面
function tabDress(body) {
  const name = charName();
  const head = el('div', 'dress-head');
  const preview = el('div', 'dress-preview');
  preview.appendChild(renderGirl(G.outfit, 120, 150, { back: dressBack }));
  head.appendChild(preview);
  const side = el('div', 'dress-side');
  side.appendChild(el('h3', '', `幫${name}換衣服`));
  side.appendChild(note('點衣服就能穿上；還沒有的衣服會先用鈴錢買下來，買過的隨時可以換。'));
  const turn = el('button', 'mini', dressBack ? '看正面' : '轉身看背面');
  turn.onclick = () => { dressBack = !dressBack; renderTab(); };
  side.appendChild(turn);
  head.appendChild(side);
  body.appendChild(head);
  sellToggle(body, '正在穿的衣服要先換掉才能賣。');

  /* ── 髮型與髮色 ──
     髮型要買，顏色買了之後隨便換。顏色不收錢是刻意的：
     小孩換髮色是一直換著玩的，每換一次收一次錢她就不會玩了。 */
  if (!sellMode) {
    body.appendChild(h3('髮型'));
    const hgrid = el('div', 'grid');
    HAIR_STYLES.forEach(hs => {
      const has = (G.hairOwned || []).includes(hs.id), wearing = G.hair.style === hs.id;
      const c = el('div', 'card' + (wearing ? ' cur' : ''));
      // 預覽用現在的髮色畫，她才看得出換上去是什麼樣子
      c.appendChild(renderGirl(G.outfit, 56, 70, { hair: { style: hs.id, color: G.hair.color } }));
      c.appendChild(el('div', 'nm', hs.name));
      c.appendChild(el('div', 'pr', wearing ? '✓ 用這個' : has ? '已經有了' : `💰 ${fmt(hs.price)}`));
      c.onclick = () => {
        if (wearing) return;
        if (!has) {
          if (!spend(hs.price)) { toast('鈴錢不夠，去賺一點吧！'); return; }
          G.hairOwned.push(hs.id);
          Sound.play('coin');
        } else Sound.play('click');
        G.hair.style = hs.id;
        commit();
      };
      hgrid.appendChild(c);
    });
    body.appendChild(hgrid);

    body.appendChild(h3('髮色'));
    body.appendChild(note('髮色可以隨便換，不用錢。'));
    const cgrid = el('div', 'hair-colors');
    HAIR_COLORS.forEach(hc => {
      const b = el('button', 'swatch' + (G.hair.color === hc.id ? ' on' : ''));
      b.style.background = hc.c;
      b.title = hc.name;
      b.setAttribute('aria-label', hc.name);
      b.onclick = () => { G.hair.color = hc.id; Sound.play('click'); commit(); };
      cgrid.appendChild(b);
    });
    body.appendChild(cgrid);
  }

  OUTFIT_SLOTS.forEach(slot => {
    body.appendChild(h3(slot.name));
    const grid = el('div', 'grid');
    CLOTHES.filter(c => c.slot === slot.key).forEach(item => {
      const has = ownsClothes(item.id), wearing = G.outfit[slot.key] === item.id;
      if (sellMode) {
        if (!has) return; // 賣東西時只列出自己有的
        const pic = renderGirl(Object.assign({}, G.outfit, { [slot.key]: item.id }), 56, 70);
        grid.appendChild(sellCard(pic, item.name, item.price, clothesSellBlock(item.id), 0, () => sellClothes(item.id)));
        return;
      }
      const card = el('button', 'card' + (wearing ? ' cur' : '') + (!has && G.bells < item.price ? ' dim' : ''));
      const tryOn = Object.assign({}, G.outfit, { [slot.key]: item.id });
      card.appendChild(renderGirl(tryOn, 56, 70));
      card.appendChild(el('div', 'nm', item.name));
      card.appendChild(el('div', 'pr', wearing ? '穿著中' : has ? '已擁有' : '💰 ' + fmt(item.price)));
      card.onclick = () => {
        if (wearing) return;
        const isNew = !has;
        if (!buyAndWear(item.id)) { toast('鈴錢不夠，去賺一點吧！'); Sound.play('miss'); return; }
        Sound.play(isNew ? 'coin' : 'click');
        if (isNew) toast(`買了「${item.name}」`);
        if (!fufu.pose) { fufu.jumpT = .35; fufu.back = false; } // 開心跳一下
        fufuSay(pickLine('newOutfit'));
        commit();
      };
      grid.appendChild(card);
    });
    body.appendChild(grid);
  });
}

// ── 寵物：成長進度、我的寵物們、寵物蛋、寵物圖鑑 ──
function tabPets(body) {
  const cur = G.pet, sp = PET_SPECIES_BY_ID[cur.species], st = stageOf(cur);

  // 目前帶出來的寵物
  const head = el('div', 'pet-head');
  const pic = el('div', 'pet-portrait');
  pic.appendChild(renderPetPortrait(cur, 110, 100));
  head.appendChild(pic);
  const info = el('div', 'pet-info');
  info.appendChild(el('div', 'pet-name', petName()));
  info.appendChild(el('div', 'pet-kind', cur.stage === 'egg' ? '還不知道會孵出什麼寶寶' : `${sp.name}・${st.name}`));
  if (st.next) {
    const bar = el('div', 'grow-bar'), fill = el('b', '');
    fill.style.width = Math.min(100, cur.growth / st.next * 100) + '%';
    bar.appendChild(fill);
    info.appendChild(bar);
    const nextName = PET_STAGE_BY_ID[nextStageId(cur.stage)].name;
    info.appendChild(el('div', 'grow-text', cur.stage === 'egg' ? `再摸摸牠，快孵出來了（${cur.growth}/${st.next}）` : `長成${nextName}還要照顧一下（${cur.growth}/${st.next}）`));
  } else {
    info.appendChild(el('div', 'grow-text', '🎉 已經是大朋友了！'));
  }
  head.appendChild(info);
  body.appendChild(head);
  body.appendChild(note(cur.stage === 'egg'
    ? '蛋不用吃東西，常常點牠摸一摸，暖暖的就會孵出來。'
    : '餵食、洗澡、摸摸、捏捏，還有一起玩「接水果」，都會讓寵物慢慢長大：寶寶 → 小朋友 → 大朋友。'));

  // 我的寵物們
  body.appendChild(h3(`我的寵物們（${G.pets.length}）`));
  const limit = petsOutLimit();
  body.appendChild(note(`有 ${G.rooms.length} 間房間，可以同時帶 ${limit} 隻寵物出來。⭐ 是要照顧的那隻，🐾 是一起逛的，不會餓也不會髒。`
    + (limit < MAX_PETS_OUT ? `蓋好「${ROOM_NAMES[G.rooms.length] || '新房間'}」就能多帶一隻！` : '')));
  const grid = el('div', 'grid');
  /* 排序：照顧中的 → 一起逛的 → 蛋 → 其他。
     十八種收齊之後這一串會很長，正在照顧的那隻不該被埋在中間。
     排序只影響顯示，索引還是用原本的 i（activePet / companions 都靠索引）。 */
  const order = G.pets.map((p, i) => i).sort((a, b) => {
    const rank = i => (i === G.activePet ? 0 : isCompanion(i) ? 1 : G.pets[i].stage === 'egg' ? 2 : 3);
    return rank(a) - rank(b) || a - b;
  });
  order.forEach(i => {
    const p = G.pets[i];
    const active = i === G.activePet, comp = isCompanion(i), egg = p.stage === 'egg';
    const c = el('div', 'card' + (active ? ' cur' : comp ? ' comp' : ''));
    c.appendChild(renderPetPortrait(p, 60, 54));
    c.appendChild(el('div', 'nm', petNameOf(p)));
    c.appendChild(el('div', 'pr', active ? '⭐ 照顧中' : comp ? '🐾 一起逛' : PET_STAGE_BY_ID[p.stage].name));
    if (!active) {
      const main = el('button', 'mini', '⭐ 照顧牠');
      main.onclick = () => {
        switchMainPet(i);
        Sound.play('petHappy');
        fufuSay(pickLine('petSwitch', { 寵物: petName() }));
        toast(`現在照顧${petName()}`);
        commit();
      };
      c.appendChild(main);
      if (!egg) {
        const go = el('button', 'mini', comp ? '🏠 回家' : '🐾 一起逛');
        go.disabled = !comp && !canAddCompanion();
        if (go.disabled) go.title = limit > 1 ? `最多同時 ${limit} 隻，先讓一隻回家` : '蓋第二間房間就能多帶一隻';
        go.onclick = () => {
          if (!toggleCompanion(i)) return;
          if (comp) toast(`${petNameOf(p)}回寵物屋休息了`);
          else { compArrive(i); Sound.play('petHappy'); toast(`${petNameOf(p)}一起出來玩！`); }
          commit();
        };
        c.appendChild(go);
      }
      /* 買太多可以送回寵物店，拿回一半的蛋錢。
         刻意只給「現在沒在照顧的」那幾隻——要送走正在照顧的那隻，
         得先把別隻設成照顧中。多一步，就不會手滑送掉她最寶貝的那一隻。
         最後一隻也不給送，不然她會變成一隻寵物都沒有。 */
      if (G.pets.length > 1) {
        const bye = el('button', 'mini', '👋 送回店裡');
        bye.onclick = () => {
          if (!confirm(`要把「${petNameOf(p)}」送回寵物店嗎？\n\n` +
                       `會拿回 💰 ${fmt(sellValue(EGG_PRICE))}。\n` +
                       '送走之後就不在你家了喔。')) return;
          const nm = petNameOf(p);
          if (!releasePet(i)) return;
          Sound.play('coin');
          toast(`${nm}回寵物店了，拿回 💰 ${fmt(sellValue(EGG_PRICE))}`);
          commit();
        };
        c.appendChild(bye);
      }
    }
    grid.appendChild(c);
  });
  body.appendChild(grid);

  // 寵物蛋
  body.appendChild(h3('寵物蛋'));
  const have = new Set(G.pets.map(p => p.species));
  const left = PET_SPECIES.filter(s => !have.has(s.id)).length;
  /* 收齊了就不給買。買蛋本來就是「優先孵還沒有的種類」，
     收齊之後再買只會孵出重複的，而重複的在這個遊戲裡完全沒有用途
     （不能繁殖、不能交換、不會加分），只會變成一長串列表，
     而且她有十萬塊，不擋的話會買出三十幾顆沒意義的蛋。
     條件用「還有沒有沒收集到的」而不是數顆數：數顆數的話，
     萬一先買到重複的就永遠湊不滿圖鑑了。 */
  /* 收齊之後還是可以買，但要先問一次——再買只會孵出重複的，
     而重複的在這個遊戲裡沒有用途。她有十萬塊，不問的話
     會一路點出三十幾顆沒意義的蛋。買錯了可以在下面送回寵物店。 */
  body.appendChild(note(left
    ? `孵出來的寶寶是隨機的，會先孵出還沒有的種類（還有 ${left} 種沒有）。蛋上的斑點顏色是小提示喔！`
    : `${PET_SPECIES.length} 種都收集到了 🎉　再買的話會孵出重複的，` +
      `不想要可以送回寵物店，拿回 💰 ${fmt(sellValue(EGG_PRICE))}。`));
  const egg = el('button', 'big',
    left ? `🥚 買一顆寵物蛋　💰 ${fmt(EGG_PRICE)}` : `🥚 再買一顆（會重複）　💰 ${fmt(EGG_PRICE)}`);
  egg.disabled = G.bells < EGG_PRICE;
  egg.onclick = () => {
    if (!left && !confirm(`${PET_SPECIES.length} 種都收集到了。\n\n` +
        '再買一顆的話，孵出來會是已經有的種類喔。要買嗎？')) return;
    const i = buyEgg();
    if (i == null) { toast('鈴錢不夠，去賺一點吧！'); return; }
    Sound.play('coin');
    switchMainPet(i);
    toast('買到一顆寵物蛋！摸摸牠讓牠孵出來吧');
    commit();
  };
  body.appendChild(egg);

  // 寵物圖鑑
  const got = collectedSpecies();
  body.appendChild(h3(`寵物圖鑑 ${got.size} / ${PET_SPECIES.length}`));
  const dex = el('div', 'grid');
  const owned = {};
  G.pets.forEach(p => { if (p.stage !== 'egg') owned[p.species] = (owned[p.species] || 0) + 1; });
  PET_SPECIES.forEach(s => {
    const has = got.has(s.id), n = owned[s.id] || 0;
    const c = el('div', 'card dex' + (has ? '' : ' dim'));
    c.appendChild(renderPetPortrait({ species: s.id, stage: 'adult', growth: 0 }, 60, 54, { silhouette: !has }));
    c.appendChild(el('div', 'nm', has ? s.name : '？？？'));
    if (n > 1) c.appendChild(el('span', 'ct', '×' + n));   // 養了不只一隻
    if (s.rare) c.appendChild(el('span', 'tag', '⭐稀有'));
    dex.appendChild(c);
  });
  body.appendChild(dex);
}

/* ===== 備份 =====
   存檔在 localStorage，只活在這一台機器的這個瀏覽器裡。
   之前住在 Artifact 的 iframe 裡，iPad 關掉瀏覽器就會被清掉；
   搬成獨立網頁之後留得住了，但「換裝置、清網站資料、
   加到主畫面之前的那段期間」還是會不見，而且不見了救不回來。

   所以給一份看得到、帶得走的備份：按一下複製成一段文字，
   貼到記事本或傳給自己就是一份存檔，要用的時候貼回來。
   以複製貼上為主而不是下載檔案——iPad 的 Safari 下載很難用。

   這一頁是給大人看的，所以字可以多一點、講清楚一點。 */
// UNDO_KEY / SAVE_KEY 在存檔格那一段就算好了（跟著「現在玩哪一格」走）
const SAVE_TAG = 'myHouse-save';

function makeBackup() {
  return JSON.stringify({ tag: SAVE_TAG, v: 1,
    at: new Date().toISOString().slice(0, 16).replace('T', ' '),
    data: localStorage.getItem(SAVE_KEY) || '' });
}
// 回傳 { data, at } 或 null。壞掉的字串一定要擋下來，不能半套蓋上去
function readBackup(txt) {
  let o;
  try { o = JSON.parse(String(txt || '').trim()); } catch (e) { return null; }
  if (!o || o.tag !== SAVE_TAG || typeof o.data !== 'string' || !o.data) return null;
  let g;
  try { g = JSON.parse(o.data); } catch (e) { return null; }
  // 真的是這個遊戲的存檔才收：normalizeSave 會把舊版缺的欄位補齊，格式不對回傳 null
  try { if (!normalizeSave(g)) return null; } catch (e) { return null; } // 格式怪的備份不能讓整頁當掉
  return { data: o.data, at: o.at || '' };
}
const hasUndo = () => !!readBackup(localStorage.getItem(UNDO_KEY));

/* 把一份備份寫進存檔。抽成函式是為了走查驗得到真正的寫入路徑——
   按鈕最後會 location.reload()，走查沒辦法在點下去之後繼續驗。
   寫進去的一定是備份「裡面那一份存檔」，不是貼進來的那整段字。
   蓋掉之前先留一份可以反悔的：她可能貼到一份舊的備份。 */
function applyBackup(txt) {
  const s = readBackup(txt);
  if (!s) return false;
  try {
    localStorage.setItem(UNDO_KEY, makeBackup());
    localStorage.setItem(SAVE_KEY, s.data);
  } catch (e) { return false; }
  return true;
}

// 按下複製／下載的那一刻才產生備份（頁面開著的時候寵物等狀態還在變）
function freshBackup() { saveGame(); return makeBackup(); }
function tabSave(body) {
  const code = makeBackup();
  if (SAVE_LOCKED != null) { // 讀不出來的紀錄：處理按鈕放最上面
    const rb = el('button', 'big', '⚠️ 這份紀錄讀不出來，按這裡處理');
    rb.onclick = openRescue;
    body.appendChild(rb);
  }
  const nb = el('button', 'mini', '📣 看最近的更新');
  nb.onclick = () => openNews(NEWS.slice(0, 1));
  body.appendChild(nb);
  restSettings(body);

  /* ── 存檔格 ──
     兩個小孩各玩各的。每一格是完全獨立的一間房子，互不影響。 */
  body.appendChild(h3('🏠 現在玩的是：' + curSlotName()));
  body.appendChild(note('每一格是一間完全獨立的房子，錢、家具、寵物都分開。' +
    '換一格不會動到另一格。'));

  const list = slots(), cur = curSlotId();
  list.forEach(s => {
    const info = slotInfo(s.id);
    const card = el('div', 'slotrow' + (s.id === cur ? ' on' : ''));
    const left = el('div', 'slotmain');
    left.appendChild(el('div', 'slotname', (s.id === cur ? '▶ ' : '') + s.name));
    left.appendChild(el('div', 'slotsub', info
      ? `💰 ${fmt(info.bells)}　⭐ ${fmt(info.score)}　${info.rooms} 個房間・擺了 ${info.items} 件`
      : '還沒開始玩'));
    card.appendChild(left);
    if (s.id !== cur) {
      const go = el('button', 'mini', '換成這個');
      go.onclick = () => { Sound.play('click'); switchSlot(s.id); };
      card.appendChild(go);
    }
    body.appendChild(card);
  });

  // 改名字：直接改現在這一格，打完就存
  const nm = el('input', 'textin');
  nm.value = curSlotName();
  nm.maxLength = 10;
  nm.placeholder = '幫這一間取個名字';
  nm.oninput = () => { renameSlot(cur, nm.value); };
  nm.onblur = () => { renderTab(); };
  body.appendChild(nm);

  const add = el('button', 'big alt', '＋ 開一間新的');
  add.onclick = () => {
    if (slots().length >= 6) { toast('最多六間'); return; }
    Sound.play('click');
    switchSlot(addSlot(''));     // 開好就直接換過去
  };
  body.appendChild(add);

  if (list.length > 1) {
    const del = el('button', 'mini', '🗑️ 刪掉「' + curSlotName() + '」這一間');
    del.onclick = () => askPin('刪掉存檔格', () => {
      if (!confirm('要刪掉「' + curSlotName() + '」整間房子嗎？\n\n' +
                   '這一格的錢、家具、寵物全部都會不見。\n' +
                   '（刪掉的那一格救不回來，建議先存成檔案）')) return;
      if (removeSlot(cur)) location.reload();
    });
    body.appendChild(del);
  }

  body.appendChild(h3('📤 把「' + curSlotName() + '」複製起來'));
  body.appendChild(note('她玩的東西只存在這一台機器的這個瀏覽器裡。換裝置、' +
    '清掉網站資料，紀錄就會不見，而且沒有辦法救回來。' +
    '偶爾按一次下面那顆，貼到記事本或傳給自己，就有一份帶得走的存檔。'));
  const info = el('div', 'sell-info',
    `💰 ${fmt(G.bells)}　·　⭐ ${fmt(totalScore())}　·　${(code.length / 1024).toFixed(1)} KB`);
  body.appendChild(info);

  const copy = el('button', 'big', '📋 複製備份');
  copy.onclick = async () => {
    Sound.play('click');
    try {
      await navigator.clipboard.writeText(freshBackup());
      toast('複製好了，貼到記事本存起來');
    } catch (e) {
      // clipboard 在非 https 或舊 Safari 會沒有／被擋，一定要留後路，
      // 不然按下去完全沒反應，她會以為壞掉
      box.value = freshBackup(); box.focus(); box.select();
      toast('請長按下面的框→拷貝');
    }
  };
  body.appendChild(copy);

  const dl = el('button', 'big alt', '💾 存成檔案（電腦比較好用）');
  dl.onclick = () => {
    Sound.play('click');
    try {
      downloadText(freshBackup(), '我的小屋備份-' + today() + '.json');
      toast('存好了');
    } catch (e) { toast('這台機器存不了檔案，請用上面那顆複製'); }
  };
  body.appendChild(dl);

  body.appendChild(h3('📥 把備份放回來'));
  body.appendChild(note('選檔案或直接貼上，然後按「還原」。現在的進度會被整份蓋掉，' +
    '不過蓋掉之前會自動留一份，按錯了可以反悔。'));

  /* 選檔案匯入。本來只能貼上，所以「存成檔案」存下來的那個檔
     沒有辦法放回去——存得出來、匯不進來，等於白存。 */
  const pick = el('input', 'fileopen');
  pick.type = 'file';
  pick.accept = 'application/json,.json,text/plain';
  pick.onchange = () => {
    const f = pick.files && pick.files[0];
    if (!f) return;
    const r = new FileReader();
    // 讀進來先驗一次就告訴她結果，不要讓她按了「還原」才發現選錯檔案
    r.onload = () => {
      if (!putBackup(String(r.result))) toast('這個檔案不是小屋的備份');
      else toast('讀好了，按下面的「還原」');
    };
    r.onerror = () => toast('這個檔案讀不出來');
    r.readAsText(f);
    pick.value = '';   // 清掉才選得了同一個檔案第二次
  };
  body.appendChild(pick);

  const box = el('textarea', 'talkbox');
  box.rows = 4;
  box.placeholder = '…或把備份貼在這裡';
  body.appendChild(box);
  // 選檔案跟貼上走同一條路：驗過才填進框裡
  function putBackup(txt) {
    if (!readBackup(txt)) return false;
    box.value = txt;
    return true;
  }

  const restore = el('button', 'big', '↩️ 還原');
  restore.onclick = () => askPin('用備份蓋掉現在的進度', () => {
    const s = readBackup(box.value);
    if (!s) { toast('這段不是小屋的備份，沒有動到任何東西'); return; }
    if (!confirm('要用這一份備份蓋掉現在的進度嗎？\n\n備份時間：' + (s.at || '不詳'))) return;
    if (!applyBackup(box.value)) { toast('寫不進去，沒有動到任何東西'); return; }
    location.reload();   // 整個重讀最乾淨，G 跟畫面都會跟著換
  });
  body.appendChild(restore);

  if (hasUndo()) {
    body.appendChild(h3('⏪ 反悔'));
    body.appendChild(note('上一次還原之前的那一份還留著。'));
    const undo = el('button', 'big alt', '把上一份換回來');
    undo.onclick = () => askPin('換回上一份', () => {
      const s = readBackup(localStorage.getItem(UNDO_KEY));
      if (!s) return;
      if (!confirm('要換回上一份嗎？（' + (s.at || '不詳') + '）')) return;
      // applyBackup 自己會先收起現況，所以按兩次就是來回切
      if (!applyBackup(localStorage.getItem(UNDO_KEY))) { toast('寫不進去'); return; }
      location.reload();
    });
    body.appendChild(undo);
  }

  body.appendChild(h3('⚠️ 重新開始'));
  body.appendChild(note('把「' + curSlotName() + '」整間清掉，從頭開始。' +
    '清掉之前會自動留一份，上面的「把上一份換回來」還救得回來。'));
  const reset = el('button', 'big', '重新開始（清除存檔）');
  reset.style.background = 'var(--warn)';
  reset.onclick = () => askPin('重新開始（清除存檔）', confirmReset);
  body.appendChild(reset);

  /* ── 版本與強制更新 ──
     加到主畫面的網頁 App 在 iOS 上有自己的一套快取，而且非常黏，
     跟 Safari 不共用。她回報「新的小遊戲看不到」就是這個——
     檔案早就更新了，她那台還在用舊的。
     所以把版本顯示出來（用 document.lastModified，不需要任何建置步驟），
     再給一顆真的清得掉快取的按鈕。 */
  body.appendChild(h3('ℹ️ 版本'));
  body.appendChild(note('這一份的日期：' + document.lastModified +
    '\n如果我跟你說改了什麼、你卻看不到，按下面那顆。'));
  const upd = el('button', 'big alt', '🔄 強制更新（清掉快取重新下載）');
  upd.onclick = async () => {
    upd.disabled = true;
    upd.textContent = '更新中…';
    try {
      if ('caches' in window) {
        const ks = await caches.keys();
        await Promise.all(ks.map(k => caches.delete(k)));
      }
      if (navigator.serviceWorker) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
    } catch (e) {}
    // 加一個用過就丟的參數，確保不會再拿到舊的那一份
    location.replace(location.pathname + '?v=' + Date.now());
  };
  body.appendChild(upd);
  body.appendChild(note('按了不會動到任何進度，只是把遊戲本身重新下載。'));

  body.appendChild(h3('📱 建議加到主畫面'));
  body.appendChild(note('用 Safari 開這一頁 → 分享鈕 → 「加入主畫面」。' +
    '這樣玩起來是全螢幕，而且 iPhone／iPad 不會把太久沒開的網站資料回收掉——' +
    '一般用瀏覽器開的網站，七天沒玩存檔就可能被清掉。'));
}

function tabTalk(body) {
  body.appendChild(h3('角色名字'));
  const name = el('input', 'textin');
  name.value = G.charName || '';
  name.placeholder = DEFAULT_CHAR_NAME;
  name.maxLength = 12;
  name.oninput = () => { G.charName = name.value; saveGame(); updateHoldUI(); };
  body.appendChild(name);

  body.appendChild(h3('寵物名字'));
  const pname = el('input', 'textin');
  pname.value = G.pet.name || '';
  pname.placeholder = DEFAULT_PET_NAME;
  pname.maxLength = 10;
  pname.oninput = () => { G.pet.name = pname.value; saveGame(); updatePetCard(); };
  body.appendChild(pname);

  body.appendChild(h3('房間名字'));
  G.rooms.forEach((r, i) => {
    const rn = el('input', 'textin');
    rn.value = r.name;
    rn.placeholder = ROOM_NAMES[i] || '房間';
    rn.maxLength = 8;
    rn.style.marginBottom = '6px';
    rn.oninput = () => { renameRoom(i, rn.value); saveGame(); refreshTop(); };
    body.appendChild(rn);
  });

  /* 台詞預設是鎖住的。
     名字（角色、寵物、房間）她想改隨時改，那是她的東西；
     但台詞有幾十組、每組好幾行，小孩手指點進去一滑就整段不見，
     而且不會發現，等到那隻寵物不說話了才知道。
     要改就先按「✏️ 編輯」，離開這一頁就自動鎖回去。 */
  body.appendChild(h3('小可愛說的話'));
  const lock = el('button', 'big alt', talkEdit ? '🔒 改好了，鎖起來' : '✏️ 我要改台詞');
  lock.onclick = () => { talkEdit = !talkEdit; Sound.play('click'); renderTab(); };
  body.appendChild(lock);
  body.appendChild(note(talkEdit
    ? '每一行是一句話，會隨機挑一句說。清空就會用回預設的句子。改完記得按上面那顆鎖起來。'
    : '這裡可以改小可愛、寵物、鄰居說的話。現在是鎖住的，要改請先按上面那顆。'));

  LINE_TYPES.forEach(t => {
    const head = el('div', 'talkhead');
    head.appendChild(el('h3', '', t.label + (t.hint && talkEdit ? `（${t.hint}）` : '')));
    const test = el('button', 'mini', '試說');
    test.onclick = () => fufuSay(pickLine(t.key, { 家具: '原木椅', 寵物: petName() }), 3000);
    head.appendChild(test);
    body.appendChild(head);
    const box = el('textarea', 'talkbox' + (talkEdit ? '' : ' locked'));
    box.value = lineList(t.key).join('\n');
    box.rows = Math.min(6, Math.max(2, lineList(t.key).length));
    box.readOnly = !talkEdit;
    box.oninput = () => {
      if (!talkEdit) return;          // 鎖著就什麼都不寫，連存檔都不碰
      const lines = box.value.split('\n').map(x => x.trim()).filter(Boolean);
      if (lines.length) G.lines[t.key] = lines; else delete G.lines[t.key];
      saveGame();
    };
    body.appendChild(box);
  });
  const reset = el('button', 'big alt', '全部恢復預設台詞');
  reset.onclick = () => {
    if (confirm('確定要把所有台詞和名字恢復成預設嗎？')) {
      G.lines = {};
      G.charName = DEFAULT_CHAR_NAME;
      saveGame();
      updateHoldUI();
      renderTab();
    }
  };
  body.appendChild(reset);
}

// ── 釣魚小遊戲 ──
let fishTimer = null;
function openFishing() {
  closeGameWindow();          // 先把上一個遊戲（如果有）清乾淨
  const card = $('#modalCard');
  card.classList.add('in-game');
  if (restIsDue()) setTimeout(forceRestNow, 0);
  card.innerHTML = '';
  card.appendChild(el('h2', '', '🎣 釣魚'));
  card.appendChild(note('指針進入綠色區域時按「拉竿」（或空白鍵）。'));
  const bar = el('div', 'fishbar'), zone = el('div', 'zone'), mark = el('div', 'mark');
  bar.append(zone, mark);
  card.appendChild(bar);
  const result = el('p', '', '　');
  card.appendChild(result);
  const pull = el('button', 'big', '拉竿！');
  const close = el('button', 'big alt', G.away ? '離開' : '回家');
  card.append(pull, close);
  $('#modal').hidden = false;

  const shadow = el('p', 'fish-shadow', '　');
  card.insertBefore(shadow, bar);
  let pos = 0, dir = 1, speed = 0, zStart = 0, zW = 0, active = false;
  let fish = null, streak = 0;
  function round() {
    fish = rollFish();                       // 先決定這一竿是什麼
    const T = FISH_TIERS[fishTier(fish)];
    shadow.textContent = '🌊 水裡有' + T.shadow;
    shadow.dataset.tier = fishTier(fish);
    zW = T.zone;
    zStart = 5 + Math.random() * (90 - zW);
    zone.style.left = zStart + '%';
    zone.style.width = zW + '%';
    pos = 0; dir = 1; speed = T.speed * (.9 + Math.random() * .2); active = true;
    pull.textContent = '拉竿！';
  }
  openFishing.test = { round: round, fish: () => fish, zone: () => [zStart, zW],
                       setPos: v => { pos = v; }, pull: () => doPull(), streak: () => streak };
  let last = performance.now();
  function tick(now) {
    const dt = Math.min(50, (now || last) - last) / 16.7; // 依實際經過時間移動，不受螢幕更新率影響
    last = now || last;
    if (active) {
      pos += dir * speed * dt;
      if (pos >= 100) { pos = 100; dir = -1; }
      if (pos <= 0) { pos = 0; dir = 1; }
      mark.style.left = `calc(${pos}% - 3px)`;
    }
    fishTimer = requestAnimationFrame(tick);
  }
  function doPull() {
    if (!active) { result.textContent = '　'; round(); return; }
    active = false;
    if (pos >= zStart && pos <= zStart + zW) {
      const f = fish;
      catchFish(f);
      streak++;
      // 連續釣到有加成：第二竿起每多一竿 +10%，最多 +50%
      const bonus = streak >= 2 ? Math.round(f.price * Math.min(.5, (streak - 1) * .1)) : 0;
      if (bonus) addBells(bonus);
      Sound.play('catchFish');
      const big = f.price >= 3000;
      result.textContent = (big ? `🎉 釣到「${f.name}」！` : `釣到「${f.name}」，`) +
        `賣了 ${fmt(f.price)} 鈴錢` + (bonus ? `（連續 ${streak} 竿，再加 ${fmt(bonus)}）` : '');
      commit();
    } else {
      // 沒拉到也告訴她剛剛是什麼——「那是鮪魚！」會讓她想再試
      result.textContent = `💨 跑掉了…剛剛那是「${fish.name}」！`;
      streak = 0;
      Sound.play('miss');
    }
    pull.textContent = '再釣一次';
  }
  function onKey(e) { if (e.code === 'Space') { e.preventDefault(); doPull(); } }
  pull.onclick = doPull;
  /* 動畫和空白鍵統一交給 gameCleanup：休息提醒、別的遊戲打開時呼叫 closeGameWindow()
     才清得掉（以前只有「回家」按鈕會清，被休息畫面關掉時動畫和按鍵還留著） */
  gameCleanup = () => { active = false; cancelAnimationFrame(fishTimer); fishTimer = null; document.removeEventListener('keydown', onKey); };
  close.onclick = () => {
    closeGameWindow();
    renderTab();
  };
  document.addEventListener('keydown', onKey);
  round();
  tick();
}

// ── 啟動 ──
refreshTop();
renderTab();
setTimeout(() => maybeShowNews(), 1500);
updateHoldUI();
resize();
// 好久沒來玩：小可愛開心打招呼
if (hoursAway >= WELCOME_BACK_HOURS) {
  setTimeout(() => {
    if (!fufu.pose) { fufu.jumpT = .35; fufu.back = false; fufu.idleUntil = performance.now() + 4000; }
    fufuSay(pickLine('welcomeBack'), 3500);
  }, 1200);
}
