<script>
// 寵物：在房間跳來跳去，可以摸摸、捏捏、餵食、洗澡；照顧會長大（蛋→寶寶→小朋友→大朋友）
'use strict';

const PET_SPEED = 1.6; // 每秒幾格

// 寵物在房間裡的動作狀態（牠的數值、種類、階段存在 G.pet）
const pet = {
  room: -1, x: 1.5, y: 1.5, path: [], t: 0, facing: 1,
  idleUntil: 0, blinkAt: 0,
  squish: 0, squishV: 0,     // 被壓扁的程度與回彈速度
  lean: 0, leanV: 0,         // 被拖曳時歪向一邊（蛋被摸時左右搖）
  press: null,               // 按住中 {t0, x0, y0, moved}
  happyUntil: 0,             // 開心瞇眼
  thinkAt: 0, thinkUntil: 0, // 肚子餓時頭上冒出食物泡泡
  lastGrowAt: 0,             // 摸摸、捏捏加成長的冷卻
  particles: [],
  z: 0,                      // 離地高度（睡在床上時）
  sleep: null,               // 睡覺中 {uid, snap, lx, ly, z, kind:'nap'|'bed', until, zzzAt}
  task: null,                // 正在走去睡覺的地方 {uid, kind}
  nextNapAt: performance.now() + 60000
};

const isEgg = () => G.pet.stage === 'egg';
const petScale = () => stageOf(G.pet).scale;

// ── 小效果：愛心、泡泡、食物、星星 ──
function petBurst(opt, n, a) {
  a = a || pet;
  const p = iso(a.x, a.y, a.z || 0);
  for (let i = 0; i < n; i++) {
    a.particles.push({
      kind: opt.kind, emoji: opt.emoji, x: p.x + (Math.random() - .5) * 26, y: p.y - 18 - Math.random() * 14,
      vx: (Math.random() - .5) * (opt.spread || 20), vy: -18 - Math.random() * 22,
      life: 1.1 + Math.random() * .6, age: 0
    });
  }
}

// ── 長大 ──
// 加成長並處理慶祝；摸摸、捏捏這類可以連點的動作要帶 cooldown
function petGainGrowth(amount, cooldown) {
  const now = performance.now();
  if (cooldown && now - pet.lastGrowAt < cooldown) return null;
  if (cooldown) pet.lastGrowAt = now;
  const up = addPetGrowth(amount);
  if (up) celebrateStage(up);
  return up;
}
// p、a 省略時是主要那隻；一起逛的寵物長大也用這個慶祝
function celebrateStage(up, p, a) {
  p = p || G.pet; a = a || pet;
  const name = petNameOf(p), sp = PET_SPECIES_BY_ID[p.species];
  Sound.play('catchFish');
  a.happyUntil = performance.now() + 3000;
  a.squishV = -8;
  a.path = [];
  petBurst({ kind: 'emoji', emoji: '✨', spread: 60 }, 6, a);
  petBurst({ kind: 'heart', spread: 50 }, 5, a);
  if (up.from === 'egg') {
    fufuSay(pickLine('petHatch', { 寵物: name }), 3500);
    toast(`🎉 孵出來了！是${sp.name}${sp.rare ? '（稀有！）' : ''}${up.firstOfSpecies ? '，圖鑑多了一種！' : ''}`);
  } else {
    fufuSay(pickLine('petGrow', { 寵物: name }), 3500);
    toast(`🎉 ${name}長成${PET_STAGE_BY_ID[up.to].name}了！`);
  }
  saveGame();
}

// ── 每一幀更新 ──
// 主要那隻和一起逛的寵物共用：換房間、彈簧、粒子、走路
function actorEnterRoom(a, room) {
  if (a.room === roomKey()) return;
  a.room = roomKey(); // 換房間：寵物跟著過去
  const c = nearestFree(room, room.w / 2 + 1 + (a.offset || 0), room.d / 2 + 1);
  if (c) { a.x = c[0] + .5; a.y = c[1] + .5; }
  a.path = [];
}
function actorSpring(a, dt, now, egg) {
  // 捏捏的彈簧：按住時慢慢壓扁，放開後噗嚕噗嚕回彈（蛋不會被壓扁，只會搖）
  if (a.press && !egg) {
    const held = (now - a.press.t0) / 1000;
    a.squish += (Math.min(.45, held * 1.6) - a.squish) * Math.min(1, dt * 14);
    a.lean += (a.press.dragX - a.lean) * Math.min(1, dt * 16);
    a.squishV = a.leanV = 0;
  } else {
    a.squishV += (-260 * a.squish - 9 * a.squishV) * dt;
    a.squish += a.squishV * dt;
    a.leanV += (-200 * a.lean - 8 * a.leanV) * dt;
    a.lean += a.leanV * dt;
  }
  a.particles.forEach(p => { p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 6 * dt; });
  a.particles = a.particles.filter(p => p.age < p.life);
}
// follow：閒下來時跑去小可愛旁邊的機率
function actorWalk(a, dt, now, room, blk, follow) {
  // 腳下被家具蓋住：跳開
  const ti = Math.floor(a.x), tj = Math.floor(a.y);
  if (ti >= room.w || tj >= room.d || !blk[ti] || blk[ti][tj]) {
    const c = nearestFree(room, a.x, a.y);
    if (c) { a.x = c[0] + .5; a.y = c[1] + .5; a.path = []; a.squishV = -4; }
  }
  if (a.path.length) {
    const [ni, nj] = a.path[0];
    if (blk[ni] && blk[ni][nj]) { a.path = []; return; }
    const tx = ni + .5, ty = nj + .5, dx = tx - a.x, dy = ty - a.y;
    const dist = Math.hypot(dx, dy), step = PET_SPEED * dt;
    if (Math.abs(dx - dy) > .01) a.facing = dx - dy > 0 ? 1 : -1;
    if (dist <= step) {
      a.x = tx; a.y = ty; a.path.shift();
      a.squishV -= 2.5; // 落地時彈一下
      if (!a.path.length) a.idleUntil = now + 2000 + Math.random() * 4000;
    } else {
      a.x += dx / dist * step; a.y += dy / dist * step;
    }
  } else if (now > a.idleUntil && !hold) {
    a.idleUntil = now + 3000;
    // 有時候跟在小可愛旁邊，有時候自己亂跳
    const f = Math.random() < follow;
    const bx = f ? fufu.x : a.x, by = f ? fufu.y : a.y;
    const tx = Math.max(0, Math.min(room.w - 1, Math.floor(bx) + Math.floor(Math.random() * 5) - 2));
    const ty = Math.max(0, Math.min(room.d - 1, Math.floor(by) + Math.floor(Math.random() * 5) - 2));
    a.path = findPath(room, Math.floor(a.x), Math.floor(a.y), tx, ty).slice(0, 4);
  }
}

function petUpdate(dt, now) {
  const room = curRoom();
  pet.t += dt;
  if (pet.room !== roomKey()) { pet.sleep = null; pet.task = null; pet.z = 0; } // 換房間就醒來跟過去
  actorEnterRoom(pet, room);
  actorSpring(pet, dt, now, isEgg());
  compUpdate(dt, now, room);

  if (isEgg()) return; // 蛋不會走路也不會餓

  // 肚子餓：偶爾在頭上想著食物
  if (G.pet.hunger < 35 && now > pet.thinkAt) {
    pet.thinkUntil = now + 2200;
    pet.thinkAt = now + 9000;
    if (Math.random() < .35) Sound.play('petSad'); // 肚子餓偶爾叫一聲，不要一直叫
  }

  if (pet.sleep) { petSleepUpdate(now, room); return; }
  if (pet.press) return; // 被捏著的時候不走動
  if (pet.task && !pet.path.length) { petArriveBed(now, room); if (pet.sleep) return; } // 躺好了就別再走路（不然會被當成卡在家具裡跳開）
  // 房間裡有寵物床：偶爾自己去睡午覺
  if (!pet.task && !pet.path.length && now > pet.nextNapAt && !hold) {
    pet.nextNapAt = now + 90000 + Math.random() * 90000;
    if (Math.random() < .5) petGoNap(null, true);
  }
  actorWalk(pet, dt, now, room, blockedGrid(room), .35);
}

// ── 睡覺：寵物床、寵物小屋，或跳上小可愛的床一起睡 ──
function petGoTo(it, kind) {
  const room = curRoom();
  const path = findPathToItem(room, Math.floor(pet.x), Math.floor(pet.y), it);
  if (!path) return false;
  pet.path = path;
  pet.task = { uid: it.uid, kind };
  pet.idleUntil = performance.now() + 30000;
  return true;
}
// it 省略時自己找房間裡的寵物床
function petGoNap(it, quiet) {
  if (isEgg() || pet.sleep) return false;
  const room = curRoom();
  if (!it) {
    const beds = room.items.filter(x => PET_BEDS[x.id] && !PET_BEDS[x.id].withKid);
    it = beds[Math.floor(Math.random() * beds.length)];
  }
  if (!it) return false;
  if (!petGoTo(it, 'nap')) { if (!quiet) fufuSay(pickLine('blocked')); return false; }
  return true;
}
// 小可愛躺上床時呼叫：寵物偶爾會跟上來一起睡
function petMaybeJoinBed(it) {
  if (isEgg() || pet.sleep || !PET_BEDS[it.id] || Math.random() > .5) return;
  petGoTo(it, 'bed');
}
function petArriveBed(now, room) {
  const t = pet.task;
  pet.task = null;
  const it = room.items.find(x => x.uid === t.uid);
  if (!it) return;
  const def = FURN_BY_ID[it.id], fp = footprint(def, it.rot);
  // 被家具擋住沒走到旁邊就算了
  const near = pet.x > it.x - 1.6 && pet.x < it.x + fp.w + 1.6 && pet.y > it.y - 1.6 && pet.y < it.y + fp.d + 1.6;
  if (!near) return;
  if (t.kind === 'bed' && !(fufu.pose && fufu.pose.type === 'lie' && fufu.pose.uid === it.uid)) return;
  const spot = PET_BEDS[it.id], p = rotatePoint(def, it.rot, spot.x, spot.y);
  pet.sleep = { uid: it.uid, snap: `${it.x},${it.y},${it.rot}`, lx: p.x, ly: p.y, z: spot.z, kind: t.kind,
    until: now + (t.kind === 'bed' ? 120000 : 20000 + Math.random() * 15000), zzzAt: now + 900 };
  pet.x = it.x + p.x; pet.y = it.y + p.y; pet.z = spot.z;
  pet.path = []; pet.squishV = -5; pet.thinkUntil = 0;
  Sound.play('boing');
  if (t.kind === 'bed') fufuSay(pickLine('petJoinBed', { 寵物: petName() }), 3000);
  else if (Math.random() < .5) fufuSay(pickLine('petNap', { 寵物: petName() }), 2600);
}
function petSleepUpdate(now, room) {
  const s = pet.sleep, it = room.items.find(x => x.uid === s.uid);
  if (!it || `${it.x},${it.y},${it.rot}` !== s.snap) { petWake(false); return; } // 床被搬走
  if (s.kind === 'bed' && !(fufu.pose && fufu.pose.uid === s.uid)) { petWake(false); return; } // 小可愛起床了
  if (now > s.until) { petWake(true); return; }
  if (now > s.zzzAt) { s.zzzAt = now + 1600; petBurst({ kind: 'emoji', emoji: '💤', spread: 8 }, 1); }
}
function petWake(talk) {
  if (!pet.sleep) return;
  pet.sleep = null; pet.z = 0;
  const c = nearestFree(curRoom(), pet.x, pet.y);
  if (c) { pet.x = c[0] + .5; pet.y = c[1] + .5; }
  pet.squishV = -6;
  pet.idleUntil = performance.now() + 2500;
  patPet(6); // 睡飽了心情好
  if (talk && Math.random() < .5) fufuSay(pickLine('petWake', { 寵物: petName() }));
}
// 睡在家具上時，跟家具一起畫（drawRoom 的 occupants）
function petOccupant() {
  const s = pet.sleep;
  if (!s) return null;
  return { uid: s.uid, pose: 'pet', lx: s.lx, ly: s.ly, z: s.z, h: 26 * petScale(), draw: ctx => drawPetActor(ctx, pet, G.pet) };
}

// ── 一起逛的寵物：跟著小可愛到處走，可以摸摸捏捏，不會餓也不會髒 ──
const comps = {}; // G.pets 的索引 → 動作狀態
function compActor(i) {
  if (!comps[i]) {
    comps[i] = { idx: i, room: -1, x: 1.5, y: 1.5, path: [], t: Math.random() * 5, facing: 1, idleUntil: 0, blinkAt: 0,
      squish: 0, squishV: 0, lean: 0, leanV: 0, press: null, happyUntil: 0, lastGrowAt: 0, particles: [],
      offset: Object.keys(comps).length % 2 ? -2 : 2 };
  }
  return comps[i];
}
function compList() { return G.companions.map(compActor); }
function compUpdate(dt, now, room) {
  Object.keys(comps).forEach(k => { if (!G.companions.includes(+k)) delete comps[k]; }); // 回寵物屋的不用再算
  if (!G.companions.length) return;
  const blk = blockedGrid(room);
  compList().forEach(a => {
    a.t += dt;
    actorEnterRoom(a, room);
    actorSpring(a, dt, now, false);
    if (!a.press) actorWalk(a, dt, now, room, blk, .6); // 比主要那隻更黏小可愛
  });
}
// 剛帶出來：出現在小可愛旁邊
function compArrive(i) {
  const a = compActor(i), room = curRoom();
  const c = nearestFree(room, fufu.x - 1, fufu.y + 1);
  if (c) { a.x = c[0] + .5; a.y = c[1] + .5; }
  a.room = roomKey(); a.path = []; a.squishV = -6;
  a.happyUntil = performance.now() + 1500;
  a.idleUntil = performance.now() + 2500;
  petBurst({ kind: 'heart' }, 3, a);
}
function compHit(w) {
  return compList().find(a => {
    const p = iso(a.x, a.y), k = stageOf(G.pets[a.idx]).scale;
    return w.x > p.x - 17 * k && w.x < p.x + 17 * k && w.y > p.y - 32 * k && w.y < p.y + 5;
  }) || null;
}
let compPressing = null;
function compPressStart(a, w, now) {
  a.press = { t0: now, x0: w.x, y0: w.y, dragX: 0, moved: false };
  a.path = [];
  compPressing = a;
  Sound.play('squish');
}
function compPressEnd(now) {
  const a = compPressing;
  if (!a) return;
  compPressing = null;
  const tap = now - a.press.t0 < 250 && !a.press.moved;
  a.press = null;
  a.idleUntil = now + 2500;
  a.happyUntil = now + 1500;
  Sound.play(tap ? 'petHappy' : 'boing');
  if (tap) a.squishV = -5;
  petBurst({ kind: 'heart' }, tap ? 2 : 1, a);
  // 摸摸、捏捏也會慢慢長大（和主要那隻一樣有冷卻）
  if (now - a.lastGrowAt >= GROWTH.patCooldownMs) {
    a.lastGrowAt = now;
    const p = G.pets[a.idx], up = addPetGrowth(tap ? GROWTH.pat : GROWTH.squish, p);
    if (up) celebrateStage(up, p, a);
  }
  saveGame();
}

function petCallOver() {
  if (isEgg()) { toast('蛋還不會走路喔～摸摸牠讓牠快點孵出來！'); return; }
  petWake(false); pet.task = null;
  const room = curRoom();
  pet.path = findPath(room, Math.floor(pet.x), Math.floor(pet.y), Math.floor(fufu.x) + 1, Math.floor(fufu.y));
  pet.idleUntil = performance.now() + 4000;
}

// 換寵物時，新帶出來的那隻出現在小可愛旁邊
function petArrive() {
  const room = curRoom();
  const c = nearestFree(room, fufu.x + 1, fufu.y);
  if (c) { pet.x = c[0] + .5; pet.y = c[1] + .5; }
  pet.path = []; pet.particles = []; pet.squish = 0; pet.lean = 0;
  pet.squishV = -6;
  pet.happyUntil = performance.now() + 1500;
  pet.idleUntil = performance.now() + 2500;
  petBurst({ kind: 'heart' }, 3);
}

// 換主要那隻：原本一起逛的就在原地變成主要，舊的主要那隻在原地變成一起逛（不會瞬間移動）
function switchMainPet(i) {
  const old = G.activePet, from = comps[i] ? { x: comps[i].x, y: comps[i].y } : null;
  const oldPos = { x: pet.x, y: pet.y };
  if (!setActivePet(i)) return false;
  delete comps[i];
  pet.sleep = null; pet.task = null; pet.z = 0;
  petArrive();
  pet.thinkUntil = 0;
  if (from) { pet.x = from.x; pet.y = from.y; }
  if (isCompanion(old)) { const a = compActor(old); a.x = oldPos.x; a.y = oldPos.y; a.room = roomKey(); }
  return true;
}

// ── 互動 ──
function petHit(w) {
  const p = iso(pet.x, pet.y, pet.z || 0), k = petScale();
  return w.x > p.x - 17 * k && w.x < p.x + 17 * k && w.y > p.y - 32 * k && w.y < p.y + 5;
}
function petPressStart(w, now) {
  petWake(false); // 睡覺時被摸就醒來
  pet.task = null;
  pet.press = { t0: now, x0: w.x, y0: w.y, dragX: 0, moved: false };
  if (!isEgg()) Sound.play('squish');
  pet.path = [];
}
function petPressMove(w) {
  if (!pet.press) return;
  const dx = w.x - pet.press.x0;
  if (Math.abs(dx) > 3 || Math.abs(w.y - pet.press.y0) > 3) pet.press.moved = true;
  pet.press.dragX = Math.max(-14, Math.min(14, dx * .6));
}
function petPressEnd(now) {
  if (!pet.press) return;
  const held = now - pet.press.t0, tap = held < 250 && !pet.press.moved;
  pet.press = null;
  pet.idleUntil = now + 2500;
  if (isEgg()) { // 摸摸蛋：蛋左右搖一搖，暖暖的就會孵出來
    Sound.play('pickUp');
    pet.leanV = (Math.random() < .5 ? -1 : 1) * 60;
    petBurst({ kind: 'heart' }, 1);
    petGainGrowth(GROWTH.eggPat, GROWTH.eggCooldownMs);
    saveGame();
    return;
  }
  pet.happyUntil = now + 1500;
  const wasSad = G.pet.mood < 35 || G.pet.hunger < 25;
  if (tap) { // 摸摸
    Sound.play(wasSad ? 'petSad' : 'petHappy');
    patPet(3);
    pet.squishV = -5;
    petBurst({ kind: 'heart' }, 2);
    petGainGrowth(GROWTH.pat, GROWTH.patCooldownMs);
  } else { // 捏捏
    Sound.play('boing');
    patPet(2);
    petBurst({ kind: 'heart' }, 1);
    if (Math.random() < .3) fufuSay(pickLine('petSquish', { 寵物: petName() }));
    petGainGrowth(GROWTH.squish, GROWTH.patCooldownMs);
  }
  saveGame();
}

function eggNotYet() { toast('蛋還不用吃東西、洗澡喔～摸摸牠讓牠快點孵出來！'); Sound.play('click'); }

function petFeed(foodId) {
  if (isEgg()) { eggNotYet(); return false; }
  if (!feedPet(foodId)) return false;
  petWake(false);
  didSomething();
  const f = FOOD_BY_ID[foodId];
  Sound.play('eat');
  pet.path = [];
  pet.happyUntil = performance.now() + 2200;
  pet.thinkUntil = 0;
  pet.thinkAt = performance.now() + 20000; // 剛吃完先不要又想吃
  pet.squishV = -6;
  petBurst({ kind: 'emoji', emoji: f.emoji }, 1);
  petBurst({ kind: 'heart' }, 3);
  fufuSay(pickLine('petFeed', { 寵物: petName() }));
  petGainGrowth(GROWTH.feed);
  saveGame();
  return true;
}
function petBath() {
  if (isEgg()) { eggNotYet(); return; }
  petWake(false);
  didSomething();
  bathPet();
  Sound.play('bath');
  setTimeout(() => Sound.play('petHappy'), 700);
  pet.path = [];
  pet.happyUntil = performance.now() + 2200;
  pet.squishV = -5;
  petBurst({ kind: 'bubble' }, 12);
  fufuSay(pickLine('petBath', { 寵物: petName() }));
  petGainGrowth(GROWTH.bath);
  saveGame();
}

// ── 繪圖：各種寵物共用一個身體，耳朵、嘴巴、花紋依種類變化 ──
// 原點在腳底中心；look: {happy, sad, blink, fx(臉朝向偏移), clean, t, adult}
function drawCreature(ctx, sp, look) {
  const { body, edge, belly, inner } = sp;
  const L = 1;

  // 雲朵羊：身體外圍一圈蓬蓬的毛
  if (sp.fluffy) {
    ctx.fillStyle = body; ctx.strokeStyle = edge; ctx.lineWidth = L;
    [[-13, -7], [-12, -15], [-6, -20], [2, -21], [9, -18], [13, -11], [13, -4], [-14, -2]].forEach(([x, y]) => {
      ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    });
  }

  // 耳朵（在身體後面）
  ctx.fillStyle = body; ctx.strokeStyle = edge; ctx.lineWidth = L;
  if (sp.ears === 'round') {
    [-7, 7].forEach(ex => { ctx.beginPath(); ctx.ellipse(ex, -21, 4, 5, ex * .03, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); });
    ctx.fillStyle = inner;
    [-7, 7].forEach(ex => { ctx.beginPath(); ctx.ellipse(ex, -21, 2, 2.8, 0, 0, Math.PI * 2); ctx.fill(); });
  } else if (sp.ears === 'long') {
    [-1, 1].forEach(s => {
      ctx.save(); ctx.translate(s * 6, -19); ctx.rotate(s * .18);
      ctx.beginPath(); ctx.ellipse(0, -8, 3.6, 9.5, 0, 0, Math.PI * 2); ctx.fillStyle = body; ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, -8, 1.8, 7, 0, 0, Math.PI * 2); ctx.fillStyle = inner; ctx.fill();
      ctx.restore();
    });
  } else if (sp.ears === 'pointy') {
    [-1, 1].forEach(s => {
      ctx.beginPath(); ctx.moveTo(s * 3, -18); ctx.lineTo(s * 9, -30); ctx.lineTo(s * 13, -14); ctx.closePath();
      ctx.fillStyle = body; ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s * 5.5, -18); ctx.lineTo(s * 9, -26); ctx.lineTo(s * 11, -16); ctx.closePath();
      ctx.fillStyle = inner; ctx.fill();
    });
  } else if (sp.ears === 'tuft') {
    ctx.strokeStyle = edge; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    [[-2, -24, -4, -28], [0, -24, 0, -30], [2, -24, 4, -28]].forEach(([x1, y1, x2, y2]) => {
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(x1, y2 + 1, x2, y2); ctx.stroke();
    });
  } else if (sp.ears === 'horns') {
    [-1, 1].forEach(s => {
      ctx.beginPath(); ctx.moveTo(s * 4, -19); ctx.quadraticCurveTo(s * 7, -26, s * 9, -29); ctx.lineTo(s * 9.5, -19); ctx.closePath();
      ctx.fillStyle = inner; ctx.fill(); ctx.strokeStyle = edge; ctx.stroke();
    });
  } else if (sp.ears === 'curl') {
    [-1, 1].forEach(s => {
      ctx.beginPath(); ctx.arc(s * 13, -15, 4.5, 0, Math.PI * 2); ctx.fillStyle = inner; ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(s * 13, -15, 2.2, 0, Math.PI * 1.5); ctx.stroke();
    });
  }

  // 橘子龍：背上的小刺
  if (sp.spikes) {
    ctx.fillStyle = inner; ctx.strokeStyle = edge; ctx.lineWidth = L;
    [[-9, -17], [-3, -20.5], [3, -20.5]].forEach(([x, y]) => {
      ctx.beginPath(); ctx.moveTo(x - 2.5, y + 1.5); ctx.lineTo(x, y - 4); ctx.lineTo(x + 2.5, y + 1.5); ctx.closePath(); ctx.fill(); ctx.stroke();
    });
  }

  // 身體
  ctx.beginPath();
  ctx.moveTo(-14, -4);
  ctx.bezierCurveTo(-15, -22, 15, -22, 14, -4);
  ctx.quadraticCurveTo(14, 0, 9, 0);
  ctx.lineTo(-9, 0);
  ctx.quadraticCurveTo(-14, 0, -14, -4);
  ctx.fillStyle = body; ctx.fill();
  ctx.strokeStyle = edge; ctx.lineWidth = L; ctx.stroke();
  ctx.fillStyle = belly;
  const bigBelly = sp.id === 'penguin' || sp.bigBelly;
  ctx.beginPath(); ctx.ellipse(0, -5, bigBelly ? 10 : 8, bigBelly ? 7 : 4.5, 0, 0, Math.PI * 2); ctx.fill();
  if (sp.mane) { // 小馬：頭頂一撮鬃毛
    ctx.fillStyle = sp.mane;
    ctx.beginPath(); ctx.ellipse(-2, -19, 6, 2.6, -.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(3, -19.5, 4, 2.2, .3, 0, Math.PI * 2); ctx.fill();
  }
  if (sp.face) { // 猴子：臉是淺色的一塊
    ctx.fillStyle = sp.face;
    ctx.beginPath(); ctx.ellipse((look.fx || 0), -10, 8.5, 6.2, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  ctx.beginPath(); ctx.ellipse(-6, -15, 3, 1.8, -.5, 0, Math.PI * 2); ctx.fill();

  // 花紋
  if (sp.stripes) {
    ctx.strokeStyle = edge; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
    [-4, 0, 4].forEach(x => { ctx.beginPath(); ctx.moveTo(x, -19.5); ctx.lineTo(x * .9, -16); ctx.stroke(); });
  }
  if (sp.starMark) star(ctx, 0, -17, 2.6, inner);
  if (sp.spots) { // 小牛：黑色花斑
    ctx.fillStyle = '#3a3240';
    [[-10, -14, 2.8, 2.2], [9, -6, 2.6, 2], [7, -17, 2, 1.6]].forEach(([x, y, rx, ry]) => { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, .3, 0, Math.PI * 2); ctx.fill(); });
  }

  // 髒髒
  if (look.clean < 40) {
    ctx.fillStyle = 'rgba(130,90,50,.55)';
    [[-9, -8, 2.2], [6, -13, 1.8], [9, -5, 1.6], [-3, -17, 1.4]].slice(0, look.clean < 25 ? 4 : 2)
      .forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); });
  }

  // 表情
  const fx = look.fx || 0, ey = -11;
  ctx.strokeStyle = '#4a2f35'; ctx.fillStyle = '#4a2f35'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  [-4.5, 4.5].forEach(ex => {
    ctx.beginPath();
    if (look.happy) { ctx.arc(ex + fx, ey + 1, 2.2, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }       // ^ ^
    else if (look.blink) { ctx.moveTo(ex + fx - 2, ey); ctx.lineTo(ex + fx + 2, ey); ctx.stroke(); }
    else if (look.sad) { // 難過：眉毛內側高、外側低（八字眉）
      ctx.arc(ex + fx, ey, 1.6, 0, Math.PI * 2); ctx.fill();
      const inn = ex < 0 ? 1 : -1;
      ctx.beginPath(); ctx.moveTo(ex + fx - inn * 2.5, ey - 2.6); ctx.lineTo(ex + fx + inn * 2.2, ey - 4.6); ctx.stroke();
    }
    else { ctx.arc(ex + fx, ey, 1.8, 0, Math.PI * 2); ctx.fill(); }
  });
  ctx.fillStyle = 'rgba(255,110,140,.5)';
  [-9, 9].forEach(cx => { ctx.beginPath(); ctx.arc(cx + fx, ey + 4, 2.2, 0, Math.PI * 2); ctx.fill(); });
  if (sp.snout) { // 小豬：圓圓的鼻子、兩個鼻孔
    ctx.fillStyle = sp.inner; ctx.strokeStyle = sp.edge; ctx.lineWidth = .8;
    ctx.beginPath(); ctx.ellipse(fx, ey + 4.5, 3.4, 2.4, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#b5566e';
    [-1.2, 1.2].forEach(nx => { ctx.beginPath(); ctx.ellipse(fx + nx, ey + 4.5, .6, .9, 0, 0, Math.PI * 2); ctx.fill(); });
  } else if (sp.beak) { // 鳥類：小嘴喙
    ctx.beginPath(); ctx.moveTo(fx - 2.4, ey + 3); ctx.lineTo(fx + 2.4, ey + 3); ctx.lineTo(fx, ey + 6); ctx.closePath();
    ctx.fillStyle = '#f5a623'; ctx.fill();
  } else {
    ctx.beginPath();
    if (look.happy) { ctx.fillStyle = '#c94f6d'; ctx.arc(fx, ey + 4, 2.4, 0, Math.PI); ctx.fill(); }
    else if (look.sad) { ctx.arc(fx, ey + 6, 2, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); }
    else { ctx.arc(fx, ey + 3.5, 1.8, .15 * Math.PI, .85 * Math.PI); ctx.stroke(); }
  }

  // 大朋友：脖子上的小領結
  if (look.adult) {
    ctx.fillStyle = edge;
    ctx.beginPath(); ctx.moveTo(0, -3.5); ctx.lineTo(-5, -6); ctx.lineTo(-5, -1); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -3.5); ctx.lineTo(5, -6); ctx.lineTo(5, -1); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -3.5, 1.5, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.fill();
  }
}

// 蛋：斑點用寵物的顏色（小提示），快孵的時候出現裂痕
function drawEgg(ctx, sp, progress) {
  ctx.beginPath(); ctx.ellipse(0, -14, 11, 14, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#fff8ec'; ctx.fill();
  ctx.strokeStyle = '#e2d3b8'; ctx.lineWidth = 1; ctx.stroke();
  const light = ['#ffffff', '#fff4e6'].includes(sp.body); // 身體太淺的（雲朵羊、奶油兔）改用耳朵內側的顏色
  ctx.fillStyle = light ? sp.inner : sp.body;
  [[-5, -18, 2.6], [4, -22, 2], [5, -11, 2.8], [-3, -7, 2], [0, -15, 1.6]].forEach(([x, y, r]) => {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  });
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.beginPath(); ctx.ellipse(-4, -21, 2.4, 3.5, -.4, 0, Math.PI * 2); ctx.fill();
  if (progress > .5) { // 裂痕
    ctx.strokeStyle = '#8a7a64'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-7, -17); ctx.lineTo(-4, -14); ctx.lineTo(-1, -17); ctx.lineTo(2, -14); ctx.lineTo(5, -17);
    if (progress > .8) { ctx.lineTo(7, -14); ctx.moveTo(-1, -17); ctx.lineTo(0, -21); }
    ctx.stroke();
  }
}

// 靜態小圖（寵物分頁、圖鑑用）；silhouette 為 true 時畫成剪影
function renderPetPortrait(p, w, h, opts) {
  const dpr = window.devicePixelRatio || 1;
  const c = document.createElement('canvas');
  c.width = w * dpr; c.height = h * dpr;
  c.style.width = w + 'px'; c.style.height = h + 'px';
  const g = c.getContext('2d');
  const sp = PET_SPECIES_BY_ID[p.species], st = PET_STAGE_BY_ID[p.stage];
  // 寵物含長耳朵、角大約 46 單位高；大朋友畫滿框，寶寶小一點，看得出大小差別
  const k = (h - 6) / 46 * dpr * (p.stage === 'egg' ? 1.25 : .8 + .2 * (st.scale / 1.18));
  g.setTransform(k, 0, 0, k, c.width / 2, c.height - 4 * dpr);
  if (p.stage === 'egg') drawEgg(g, sp, p.growth / st.next);
  else drawCreature(g, sp, { happy: !(opts && opts.silhouette), clean: 100, adult: p.stage === 'adult' });
  if (opts && opts.silhouette) {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = 'rgba(120,105,90,1)';
    g.fillRect(0, 0, c.width, c.height);
    g.globalCompositeOperation = 'source-over';
  }
  return c;
}

function actorDrawEntry(a, st) {
  const k = stageOf(st).scale;
  return { x: a.x - .15, y: a.y - .15, w: .3, d: .3, z: 0, h: 26 * k, drawFn: ctx => drawPetActor(ctx, a, st) };
}
// 主要那隻加上一起逛的，全部交給 drawRoom 排前後
function petDrawEntries() {
  // 一起逛的不用照顧，一律畫成乾乾淨淨、心情好的樣子
  const fine = p => Object.assign({}, p, { hunger: 100, clean: 100, mood: 100 });
  const main = pet.sleep ? [] : [actorDrawEntry(pet, G.pet)]; // 睡在家具上時由 petOccupant 畫
  return main.concat(compList().map(a => actorDrawEntry(a, fine(G.pets[a.idx]))));
}

function drawPetActor(ctx, pet, st) {
  const now = performance.now(), sp = PET_SPECIES_BY_ID[st.species];
  const p = iso(pet.x, pet.y, pet.z || 0), k = stageOf(st).scale, asleep = !!pet.sleep;
  const moving = pet.path.length > 0;
  const hop = moving ? Math.abs(Math.sin(pet.t * 9)) * 7 : 0;
  const s = pet.squish, sx = 1 + s * .8, sy = Math.max(.35, 1 - s);
  const breathe = 1 + Math.sin(pet.t * 2.6) * .025;

  // 影子
  ctx.fillStyle = 'rgba(40,30,20,.2)';
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, (13 * sx - hop * .5) * k, 5 * k, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(p.x, p.y - hop);
  ctx.scale(k, k);
  if (st.stage === 'egg') {
    ctx.rotate(pet.lean / 120); // 被摸時左右搖
    drawEgg(ctx, sp, st.growth / stageOf(st).next);
    ctx.restore();
    return;
  }
  ctx.transform(sx, 0, -pet.lean / 22, sy * breathe, 0, 0); // 壓扁、拉寬、歪一邊
  if (pet.t > pet.blinkAt + .12) pet.blinkAt = pet.t + 2 + Math.random() * 3;
  drawCreature(ctx, sp, {
    happy: !asleep && (now < pet.happyUntil || !!pet.press),
    sad: !asleep && (st.mood < 35 || st.hunger < 25),
    blink: asleep || pet.t > pet.blinkAt, // 睡覺時閉眼
    fx: pet.facing * 1.5,
    clean: st.clean,
    adult: st.stage === 'adult'
  });
  ctx.restore();

  // 臭臭的線
  if (st.clean < 25) {
    ctx.strokeStyle = 'rgba(120,150,90,.7)'; ctx.lineWidth = 1.2;
    [-8, 8].forEach((ox, i) => {
      const wob = Math.sin(pet.t * 4 + i) * 2;
      ctx.beginPath();
      ctx.moveTo(p.x + ox * k, p.y - 26 * k - hop);
      ctx.quadraticCurveTo(p.x + (ox + 4 + wob) * k, p.y - 31 * k - hop, p.x + ox * k, p.y - 36 * k - hop);
      ctx.stroke();
    });
  }
}

// 畫在最上層：想吃東西的泡泡、愛心、泡泡、食物
function petDrawOverlay(ctx) {
  const now = performance.now(), p = iso(pet.x, pet.y, pet.z || 0), k = petScale();
  if (now < pet.thinkUntil && !isEgg()) {
    const bx = p.x + 16 * k, by = p.y - 42 * k;
    ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.strokeStyle = 'rgba(74,59,42,.3)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(p.x + 8 * k, p.y - 28 * k, 2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(bx, by, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.font = '12px "Segoe UI Emoji", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🍎', bx, by + 1);
    ctx.textAlign = 'start';
  }
  [pet].concat(compList()).forEach(a => drawParticles(ctx, a));
}
function drawParticles(ctx, pet) {
  pet.particles.forEach(q => {
    const a = Math.max(0, 1 - q.age / q.life);
    ctx.globalAlpha = a;
    if (q.kind === 'heart') {
      const r = 3.2;
      ctx.fillStyle = '#ff6f98';
      ctx.beginPath();
      ctx.arc(q.x - r / 2, q.y, r / 1.6, Math.PI, 0);
      ctx.arc(q.x + r / 2, q.y, r / 1.6, Math.PI, 0);
      ctx.lineTo(q.x, q.y + r * 1.3);
      ctx.closePath(); ctx.fill();
    } else if (q.kind === 'bubble') {
      ctx.strokeStyle = 'rgba(120,190,230,.9)'; ctx.fillStyle = 'rgba(220,245,255,.6)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(q.x, q.y, 2.5 + (q.age * 3) % 2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else if (q.kind === 'emoji') {
      ctx.font = '14px "Segoe UI Emoji", sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(q.emoji, q.x, q.y); ctx.textAlign = 'start';
    }
  });
  ctx.globalAlpha = 1;
}
</script>
<script>
// 動物鄰居來玩：隔一段時間會有一位鄰居敲門進來，陪小可愛逛、聊天、邀她出去玩，
// 點鄰居可以請他坐下來聊天（有桌子就坐桌子旁的椅子）、一起跳舞、說再見；回家時偶爾送小禮物
'use strict';

const VISIT_FIRST_MS = 90000;             // 打開遊戲後多久第一位鄰居來
const VISIT_GAP_MS = [240000, 360000];    // 之後每隔 4～6 分鐘來一位
const VISIT_STAY_MS = 70000;              // 每次待多久
const VISITOR_K = 1.55;                   // 畫得比寵物大

const vis = {
  who: null,       // NEIGHBORS 裡的一位
  a: null,         // 動作狀態（跟寵物共用 actorWalk 那一套）
  state: 'none',   // 'visit' 在玩、'leaving' 正在離開
  alpha: 0,        // 進門淡入、離開淡出
  nextAt: performance.now() + VISIT_FIRST_MS,
  leaveAt: 0, nextTalkAt: 0, danceUntil: 0, nextHop: 0,
  say: null, sayUntil: 0,
  chat: null,      // 坐下聊天中 {step, nextAt, started, standing}
  seatTask: null,  // 正在走去的椅子 {uid, si}
  seat: null       // 坐著 {uid, lx, ly, z}
};

const visVars = () => ({ 寵物: petName(), 名字: charName(), 朋友: vis.who ? vis.who.short : '' });
function visSay(text, ms) {
  if (!text) return;
  vis.say = text;
  vis.sayUntil = performance.now() + (ms || 3200);
  Sound.play('talk', text);
}

// ── 來、走 ──
function visitorArrive(now) {
  if (!$('#modal').hidden) { vis.nextAt = now + 10000; return; } // 在玩小遊戲時先等一下
  // 還沒來過的鄰居優先
  const fresh = NEIGHBORS.filter(n => !G.friends[n.id]);
  const pool = fresh.length ? fresh : NEIGHBORS.filter(n => !vis.last || n.id !== vis.last);
  const n = pool[Math.floor(Math.random() * pool.length)];
  const room = curRoom(), c = nearestFree(room, room.w - .5, room.d - .5) || [0, 0]; // 從房間最前面的角落進來
  vis.who = n;
  vis.a = { room: roomKey(), x: c[0] + .5, y: c[1] + .5, z: 0, path: [], t: 0, facing: -1, idleUntil: now + 1500, blinkAt: 0,
    squish: 0, squishV: -6, lean: 0, leanV: 0, press: null, happyUntil: now + 2000, particles: [] };
  vis.state = 'visit'; vis.alpha = 0;
  vis.leaveAt = now + VISIT_STAY_MS;
  vis.nextTalkAt = now + 9000;
  vis.chat = null; vis.seat = null; vis.seatTask = null;
  G.friends[n.id] = (G.friends[n.id] || 0) + 1;
  saveGame();
  Sound.play('knock');
  toast(`🚪 叩叩！${n.name}來找${charName()}玩了！`);
  visSay(pickLine('visitorHello', visVars()));
  setTimeout(() => { if (vis.who === n && !fufu.pose) fufuSay(pickLine('kidWelcome', visVars()), 2800); }, 1800);
  // 走到小可愛附近
  const [ti, tj] = fufuTile();
  vis.a.path = findPath(room, c[0], c[1], ti, tj).slice(0, -1);
}

function visitorLeave(now) {
  if (!vis.who || vis.state === 'leaving') return;
  endChat(false);
  vis.state = 'leaving';
  visSay(pickLine('visitorBye', visVars()), 2600);
  visitorGift();
}
function visitorGone(now) {
  vis.last = vis.who && vis.who.id;
  vis.who = null; vis.a = null; vis.state = 'none'; vis.say = null;
  vis.nextAt = now + VISIT_GAP_MS[0] + Math.random() * (VISIT_GAP_MS[1] - VISIT_GAP_MS[0]);
}

// 回家時六成機率送禮物：鈴錢、寵物食物或小可愛的食物
function visitorGift() {
  if (Math.random() > .6) return;
  const r = Math.random();
  let what;
  if (r < .4) { const b = 100 * (1 + Math.floor(Math.random() * 3)); addBells(b); what = `${b} 鈴錢`; }
  else if (r < .7) { const f = FOODS[Math.floor(Math.random() * FOODS.length)]; G.food[f.id] = (G.food[f.id] || 0) + 1; what = `${f.emoji}${f.name}`; }
  else { const f = KID_FOODS[Math.floor(Math.random() * KID_FOODS.length)]; G.kidFood[f.id] = (G.kidFood[f.id] || 0) + 1; what = `${f.emoji}${f.name}`; }
  setTimeout(() => {
    visSay(pickLine('visitorGift', visVars()), 2400);
    toast(`🎁 ${vis.who ? vis.who.short : '鄰居'}送你${what}！`);
    Sound.play('coin');
  }, 900);
  saveGame(); refreshTop();
}

// ── 每一幀 ──
function visitorTick(dt, now) {
  if (G.away) { // 去親戚家時鄰居不會來；正在玩的鄰居先回家
    if (vis.who) visitorGone(now);
    else vis.nextAt = Math.max(vis.nextAt, now + 60000);
    hostTick(dt, now);
    return;
  }
  if (host.n) { host.n = null; host.a = null; host.say = null; farm.actors = []; } // 回家了：親戚、小牛小羊留在他們家
  if (!vis.who) { if (now > vis.nextAt) visitorArrive(now); return; }
  const a = vis.a, room = curRoom();
  a.t += dt;
  if (a.room !== roomKey()) { endChat(false); a.z = 0; } // 換房間：跟過去
  actorEnterRoom(a, room);
  actorSpring(a, dt, now, false);
  vis.alpha = vis.state === 'leaving' ? Math.max(0, vis.alpha - dt * 1.2) : Math.min(1, vis.alpha + dt * 1.5);
  if (vis.state === 'leaving') { if (vis.alpha <= 0) visitorGone(now); return; }
  if (now < vis.danceUntil && now > vis.nextHop) { vis.nextHop = now + 420; a.squishV = -8; a.happyUntil = now + 500; a.facing = -a.facing; }
  if (vis.chat) { chatTick(dt, now, room); return; }
  if (now > vis.leaveAt && !vis.seat) { visitorLeave(now); return; }
  if (now > vis.nextTalkAt) { // 偶爾聊聊天、邀她出去玩
    vis.nextTalkAt = now + 11000 + Math.random() * 6000;
    visSay(pickLine(Math.random() < .5 ? 'visitorInvite' : 'visitorChat', visVars()));
    if (Math.random() < .6) setTimeout(() => { if (vis.who && !vis.chat) fufuSay(pickLine('kidReply'), 2600); }, 2800);
  }
  if (!vis.seat) actorWalk(a, dt, now, room, blockedGrid(room), .7);
}

/* ===== 爸爸媽媽送小安素 =====
   她玩到一半最常卡的事是「沒東西餵」——小可愛每分鐘掉 6.7 的飽足，
   寵物掉 4.0，加起來每 10 分鐘要 5.3 瓶才養得活兩個。
   這裡每 10 分鐘送 3 瓶（約六成），夠她不會一直餓著，
   但還是要去商店買、搖果樹、摘水果，賺錢跟商店才有存在意義。

   家裡最多放 12 瓶，滿了就不送：她可能開著頁面好幾個小時，
   不設上限會累積上百瓶，之後永遠不用管吃飯了。

   刻意不綁真實的早午晚餐時間——她可能下午三點才打開，
   那樣會看到「今天三餐都錯過了」。固定間隔對小孩友善得多。 */
const SUPPLY_MS = 10 * 60000;
const SUPPLY_N = 3;
const SUPPLY_CAP = 12;
/* 爸爸媽媽專用的衣服：不放進 CLOTHES，商店和換裝看不到 */
const PARENT_CLOTHES = {
  dad_black_tee:    { id: 'dad_black_tee', slot: 'top', style: 'tee', color: '#26262b' },
  dad_cargo_shorts: { id: 'dad_cargo_shorts', slot: 'bottom', style: 'shorts', color: '#6e6a58' }
};
const PARENTS = [
  { id: 'mom', short: '媽媽',
    outfit: { head: 'head_none', top: 'pink_tee', bottom: 'jeans', shoes: 'white_sneakers' },
    hair: { style: 'long', color: 'brown' }, k: 1.32,
    lines: ['小安素來囉～記得喝完喔！',
            '媽媽買了小安素，放桌上了。',
            '肚子餓了就喝一瓶，不要餓著。',
            '寵物也可以一起喝喔～',
            '長高高要靠這個，加油！'] },
  { id: 'dad', short: '爸爸',
    outfit: { head: 'head_none', top: 'dad_black_tee', bottom: 'dad_cargo_shorts', shoes: 'black_shoes' },
    hair: { style: 'short', color: 'black' }, k: 1.38,
    glasses: '#2b2b33', // 爸爸戴細框方眼鏡
    lines: ['爸爸送貨來囉！',
            '剛好經過，順便帶幾瓶過來。',
            '收好收好，別讓寵物自己偷喝光。',
            '喝完記得把瓶子收好喔。',
            '爸爸下次再帶別的來。'] }
];

const supplyStock = () => (G.kidFood.xiaoansu || 0) + (G.food.xiaoansu || 0);
function supplyDue(now) {
  if (supplyStock() >= SUPPLY_CAP) return false;     // 還有一堆就先不送
  return now - (G.supplyAt || 0) >= SUPPLY_MS;
}
/* 送一次。小可愛跟寵物各一份：兩邊的食物櫃本來就是分開的，
   合成一份的話其中一邊永遠拿不到。 */
function doSupply(now) {
  G.supplyAt = now;
  const who = PARENTS[(G.supplyWho || 0) % PARENTS.length];
  G.supplyWho = ((G.supplyWho || 0) + 1) % PARENTS.length;
  G.kidFood.xiaoansu = Math.min(SUPPLY_CAP, (G.kidFood.xiaoansu || 0) + SUPPLY_N);
  G.food.xiaoansu = Math.min(SUPPLY_CAP, (G.food.xiaoansu || 0) + SUPPLY_N);
  Sound.play('coin');
  toast(`📦 ${who.short}送來 ${SUPPLY_N} 瓶小安素！`);
  fufuSay(who.lines[Math.floor(Math.random() * who.lines.length)], 3200);
  saveGame();
  renderTab();
  return who;
}
let nextSupplyCheck = 0;
/* ===== 送貨的爸爸媽媽（會走進來） =====
   刻意不接進訪客系統：那一套跟聊天、坐下、送禮纏在一起，
   硬接進去容易把鄰居來訪弄壞。這裡自己一個很小的狀態機，
   只借用底層的走路、找路、畫人。

   流程：從房間最前面的角落走進來 → 走到小可愛旁邊 → 說一句、
   放下箱子（這一刻才真的給食物）→ 走回角落 → 淡出。
   全程大約六秒，她不用做任何事。

   她不在家（去親戚家）或正在玩小遊戲的時候不走這一套，
   直接默默給——不然她回來會看到一個卡在半路的人。 */
const SUP_K = 1.3;                        // 大人畫得比小可愛大一點
const sup = { who: null, a: null, state: 'none', alpha: 0,
              say: null, sayUntil: 0, actAt: 0, from: null };

function supplyArrive(now) {
  const room = curRoom();
  const c = nearestFree(room, room.w - .5, room.d - .5) || [0, 0];
  const who = PARENTS[(G.supplyWho || 0) % PARENTS.length];
  sup.who = who;
  sup.from = c;
  sup.a = { room: roomKey(), x: c[0] + .5, y: c[1] + .5, z: 0, path: [], t: 0, facing: -1,
            idleUntil: 0, blinkAt: 0, squish: 0, squishV: -6, lean: 0, leanV: 0,
            press: null, happyUntil: now + 1500, particles: [] };
  sup.state = 'in'; sup.alpha = 0; sup.say = null;
  sup.actAt = now + 5200;                 // 最久走五秒就一定要放下箱子
  // 走到小可愛旁邊
  const t = nearestFree(room, Math.round(fufu.x), Math.round(fufu.y)) || c;
  sup.a.path = findPath(room, c[0], c[1], t[0], t[1]).slice(0, -1);
}

function supSay(text, ms) { sup.say = text; sup.sayUntil = performance.now() + (ms || 3000); }

function supplyDeliver(now) {
  const who = doSupply(Date.now());       // 真正給食物的是這一行
  supSay(who.lines[Math.floor(Math.random() * who.lines.length)], 3400);
  sup.state = 'out';
  sup.actAt = now + 3400;
  const room = curRoom();
  sup.a.path = findPath(room, Math.round(sup.a.x), Math.round(sup.a.y),
                        sup.from[0], sup.from[1]).slice(0, -1);
  setTimeout(() => { if (!fufu.pose) fufuSay('謝謝！', 2200); }, 1400);
}

function supplyTick(now) {
  // 沒人在送的時候才看時間到了沒
  if (!sup.who) {
    if (now < nextSupplyCheck) return;
    nextSupplyCheck = now + 4000;
    if (!supplyDue(Date.now())) return;
    // 不在家、或正在玩小遊戲：不走動畫，默默給
    if (G.away || !$('#modal').hidden) { doSupply(Date.now()); return; }
    supplyArrive(now);
    return;
  }
  const a = sup.a, room = curRoom();
  a.t += (1 / 60);
  if (a.room !== roomKey()) { supplyGone(); return; }   // 她換房間就算了，下次再送
  actorEnterRoom(a, room);
  actorSpring(a, 1 / 60, now, false);
  sup.alpha = sup.state === 'gone' ? Math.max(0, sup.alpha - .04) : Math.min(1, sup.alpha + .05);

  if (sup.state === 'in') {
    // 走到了（或等太久）就放下箱子
    const near = Math.hypot(a.x - fufu.x, a.y - fufu.y) < 1.8;
    if ((!a.path.length && near) || now > sup.actAt) supplyDeliver(now);
  } else if (sup.state === 'out') {
    if (!a.path.length || now > sup.actAt) { sup.state = 'gone'; sup.actAt = now + 1200; }
  } else if (sup.state === 'gone') {
    if (sup.alpha <= 0) supplyGone();
  }

// ── 坐下聊天 ──
function sitSpots(room) {
  const spots = [];
  room.items.forEach(it => {
    const u = FURNITURE_USE[it.id];
    if (!u || u.use !== 'sit') return;
    u.seats.forEach((s, si) => {
      const p = rotatePoint(FURN_BY_ID[it.id], it.rot, s.x, s.y);
      spots.push({ it, si, wx: it.x + p.x, wy: it.y + p.y });
    });
  });
  return spots;
}
function visitorStartChat() {
  if (!vis.who || vis.state !== 'visit' || vis.chat) return;
  const now = performance.now(), room = curRoom(), a = vis.a;
  vis.leaveAt = Math.max(vis.leaveAt, now + 45000);
  const spots = sitSpots(room);
  if (spots.length < 2) { // 沒有兩個座位：站著聊
    visSay(pickLine('visitorNoChair', visVars()));
    vis.chat = { step: 0, nextAt: now + 2500, started: true, standing: true };
    if (fufu.pose) fufuStandUp(false);
    const [si, sj] = fufuTile();
    fufu.path = findPath(room, si, sj, Math.floor(a.x), Math.floor(a.y)).slice(0, -1);
    fufu.task = null; fufu.act = null;
    return;
  }
  // 有桌子：找離桌子最近的兩個座位；沒有桌子：找彼此最近的兩個座位
  const table = room.items.find(it => TABLE_IDS.includes(it.id));
  let pair;
  if (table) {
    const fp = footprint(FURN_BY_ID[table.id], table.rot), cx = table.x + fp.w / 2, cy = table.y + fp.d / 2;
    pair = spots.slice().sort((p, q) => Math.hypot(p.wx - cx, p.wy - cy) - Math.hypot(q.wx - cx, q.wy - cy)).slice(0, 2);
  } else {
    let best = Infinity;
    spots.forEach((p, i) => spots.slice(i + 1).forEach(q => {
      const d = Math.hypot(p.wx - q.wx, p.wy - q.wy);
      if (d < best) { best = d; pair = [p, q]; }
    }));
  }
  visSay(pickLine('visitorSit', visVars()));
  if (fufuGoUse(pair[0].it, true)) fufu.task.seat = pair[0].si;
  const path = findPathToItem(room, Math.floor(a.x), Math.floor(a.y), pair[1].it);
  a.path = path || [];
  a.idleUntil = now + 60000;
  vis.seatTask = { uid: pair[1].it.uid, si: pair[1].si };
  vis.chat = { step: 0, nextAt: now + 20000, started: false }; // 20 秒內沒坐好也照樣開始聊
}
function visitorSit(room) {
  const st = vis.seatTask, a = vis.a;
  vis.seatTask = null;
  const it = room.items.find(x => x.uid === st.uid);
  if (!it) return;
  const def = FURN_BY_ID[it.id], use = FURNITURE_USE[it.id], seat = use.seats[st.si];
  const p = rotatePoint(def, it.rot, seat.x, seat.y), f = rotateDir(it.rot, use.front[0], use.front[1]);
  vis.seat = { uid: it.uid, snap: `${it.x},${it.y},${it.rot}`, lx: p.x, ly: p.y, z: seat.z };
  a.x = it.x + p.x; a.y = it.y + p.y; a.z = seat.z;
  a.facing = f.dx - f.dy >= 0 ? 1 : -1;
  a.path = []; a.squishV = -5;
}
function chatTick(dt, now, room) {
  const a = vis.a, c = vis.chat;
  if (vis.seat) {
    const it = room.items.find(x => x.uid === vis.seat.uid);
    if (!it || `${it.x},${it.y},${it.rot}` !== vis.seat.snap) { endChat(true); return; } // 椅子被搬走
  } else if (vis.seatTask) {
    if (!a.path.length) visitorSit(room);
    else actorWalk(a, dt, now, room, blockedGrid(room), 0);
  }
  if (!c.started) {
    const kidReady = fufu.pose && fufu.pose.type === 'sit';
    if ((kidReady && vis.seat) || now > c.nextAt) { c.started = true; c.nextAt = now + 900; }
    else return;
  }
  if (fufu.pose) fufu.pose.until = now + 4000; // 聊天中不要自己站起來
  if (now < c.nextAt) return;
  c.step++;
  if (c.step > 6) { visSay(pickLine('visitorChatEnd', visVars())); endChat(true); return; }
  if (c.step % 2) visSay(pickLine(c.step === 1 || Math.random() < .5 ? 'visitorChat' : 'visitorInvite', visVars()));
  else fufuSay(pickLine('kidReply'), 2800);
  c.nextAt = now + 3200;
}
function endChat(talked) {
  if (!vis.chat) return;
  const now = performance.now(), a = vis.a;
  vis.chat = null; vis.seatTask = null;
  if (vis.seat) {

    const c = nearestFree(curRoom(), a.x, a.y);
    if (c) { a.x = c[0] + .5; a.y = c[1] + .5; }
    a.squishV = -6;

  if (fufu.pose) fufu.pose.until = now + 2500;

}

// 鄰居、叔叔、阿婆共用的畫法
function drawNeighborActor(ctx, a, n, alpha, seated, happy, scale) {
  const now = performance.now();
  const p = iso(a.x, a.y, a.z || 0), k = scale || VISITOR_K, moving = a.path.length > 0;

  ].concat(f.visitor ? [] : [['🐮 照顧小牛小羊', openFarmGame]]);
}

/* ===== 出門的過場：走一段路 =====
   本來點了地點是直接瞬移，沒有「出門」的感覺。

   刻意不做成一整個可以自由走動的街道場景：那要新的導航、新的美術，
   而且風險高。這裡是一段兩三秒的過場——小可愛走路、背景往後捲、
   路上有機會遇到一件小事，就有「走過去」的感覺了，成本小很多。

   路上那件小事是重點：純轉場看第三次就只想跳過，
   但「路上可能撿到東西」會讓她願意多跑幾趟。
   一半的機率什麼都沒有，不然就不稀奇了。

   一定要可以跳過：點一下畫面就直接到。第一次看完整，之後想快就快。 */
const TRIP_MS = 2600;
const TRIP_EVENTS = [
  { w: 50, kind: 'none' },
  { w: 14, kind: 'coin', emoji: '💰', say: '撿到錢了！' },
  { w: 12, kind: 'friend', emoji: '👋', say: '遇到鄰居，打個招呼～' },
  { w: 8,  kind: 'scene', emoji: '🦋', say: '有一隻蝴蝶跟著我走！' },
  { w: 8,  kind: 'scene', emoji: '🌸', say: '路邊的花開了～' },
  { w: 8,  kind: 'scene', emoji: '🐱', say: '一隻貓咪在曬太陽' }
];
function rollTripEvent() {
  let r = Math.random() * TRIP_EVENTS.reduce((a, e) => a + e.w, 0);
  for (const e of TRIP_EVENTS) { if ((r -= e.w) < 0) return e; }
  return TRIP_EVENTS[0];
}

let tripRaf = 0, tripDone = null;
/* label 是要去哪裡（回家時是「家」）。done 一定會被呼叫到，
   不管是走完、被點掉、還是中途出錯——不然她會卡在黑畫面裡。 */
function walkTrip(label, done, dest) {
  const stage = $('.stage');
  if (!stage) { done(); return; }
  const old = document.getElementById('tripLayer');
  if (old) old.remove();

  const layer = el('div', '', '');
  layer.id = 'tripLayer';
  layer.className = 'trip';
  const c = document.createElement('canvas');
  const W = 360, H = 240, dpr = window.devicePixelRatio || 1;
  c.width = W * dpr; c.height = H * dpr;
  c.className = 'trip-canvas';
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  layer.appendChild(c);
  const tip = el('div', 'trip-tip', '點一下跳過');
  layer.appendChild(tip);
  stage.appendChild(layer);

  const ev = rollTripEvent();
  const start = performance.now();
  let fired = false, ended = false;
  tripDone = finish;

  function fire() {
    if (fired) return;
    fired = true;
    if (ev.kind === 'coin') {
      const n = 20 + Math.floor(Math.random() * 61);
      addBells(n);
      ev.gain = n;
    } else if (ev.kind === 'friend') {
      const list = NEIGHBORS.filter(Boolean);
      const n = list[Math.floor(Math.random() * list.length)];
      if (n) { G.friends[n.id] = (G.friends[n.id] || 0) + 1; ev.who = n.short; }
    }
  }
  function finish() {
    if (ended) return;
    ended = true;
    cancelAnimationFrame(tripRaf);
    fire();                       // 被點掉也算數，不然跳過等於懲罰她
    layer.remove();
    tripDone = null;
    if (ev.kind === 'coin') toast(`💰 路上撿到 ${ev.gain} 鈴錢！`);
    else if (ev.kind === 'friend' && ev.who) toast(`👋 路上遇到${ev.who}`);
    saveGame();
    done();
  }
  layer.onclick = finish;

  (function frame(now) {
    now = now || performance.now();
    const p = Math.min(1, (now - start) / TRIP_MS);
    if (p >= .45) fire();
    const t = (now - start) / 1000, scroll = (now - start) * .18;

    // 天空與地面
    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#bfe6f2'); sky.addColorStop(1, '#eaf6e4');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    g.fillStyle = '#d8c9a8'; g.fillRect(0, H - 56, W, 56);
    g.fillStyle = '#cbb892'; g.fillRect(0, H - 56, W, 4);

    // 往後捲的房子與樹
    for (let i = -1; i < 7; i++) {
      const x = ((i * 110 - scroll) % 770 + 770) % 770 - 110;
      const hh = 54 + (i % 3) * 16;
      g.fillStyle = ['#ffe3ec', '#e8e0f5', '#fff4d6'][i % 3];
      g.fillRect(x, H - 56 - hh, 64, hh);
      g.strokeStyle = 'rgba(80,60,50,.25)'; g.lineWidth = 1.5;
      g.strokeRect(x, H - 56 - hh, 64, hh);
      g.fillStyle = ['#c9587f', '#7d6aa8', '#e8a33d'][i % 3];
      g.beginPath();
      g.moveTo(x - 6, H - 56 - hh); g.lineTo(x + 32, H - 56 - hh - 18); g.lineTo(x + 70, H - 56 - hh);
      g.closePath(); g.fill();
      g.fillStyle = '#cfe6ff';
      g.fillRect(x + 12, H - 56 - hh + 14, 14, 14);
      g.fillRect(x + 38, H - 56 - hh + 14, 14, 14);
      // 兩棟中間一棵樹
      const tx = x + 88;
      g.fillStyle = '#8a6a45'; g.fillRect(tx - 2, H - 76, 4, 20);
      g.fillStyle = '#7cc9a0';
      g.beginPath(); g.arc(tx, H - 82, 13, 0, Math.PI * 2); g.fill();
    }
    // 去學校：後半段學校從右邊出現，最後停在前面
    if (dest === 'school' && p > .35) drawTripSchool(g, W, H, W + 20 - Math.min(1, (p - .35) / .5) * (W + 20 - (W - SCHOOL_W) / 2)); // 最後停在正中間
    // 路面的虛線
    g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 3;
    g.setLineDash([16, 14]); g.lineDashOffset = -scroll * 2;
    g.beginPath(); g.moveTo(0, H - 26); g.lineTo(W, H - 26); g.stroke();
    g.setLineDash([]);

    // 小可愛走路
    g.save();
    g.translate(W / 2 - 30, H - 22);
    g.scale(1.5, 1.5);
    const outfit = {};
    OUTFIT_SLOTS.forEach(({ key }) => { outfit[key] = CLOTHES_BY_ID[G.outfit[key]]; });
    drawGirl(g, { t: t, walking: true, blink: (t % 3) > 2.85, outfit: outfit, hair: G.hair });
    g.restore();

    // 路上遇到的小事
    if (fired && ev.kind !== 'none') {
      g.font = '30px sans-serif'; g.textAlign = 'center';
      g.fillText(ev.emoji, W / 2 + 54, H - 54 + Math.sin(t * 5) * 4);
      g.font = '600 14px "Noto Sans TC", sans-serif';
      const txt = ev.kind === 'coin' ? `撿到 ${ev.gain} 鈴錢！`
                : ev.kind === 'friend' && ev.who ? `遇到${ev.who}，打個招呼～` : ev.say;
      const tw = g.measureText(txt).width;
      g.fillStyle = 'rgba(255,255,255,.95)';
      g.beginPath(); g.roundRect(W / 2 - tw / 2 - 11, 18, tw + 22, 28, 12); g.fill();
      g.strokeStyle = 'rgba(95,120,90,.5)'; g.lineWidth = 1.4; g.stroke();
      g.fillStyle = '#4a3b2a'; g.textBaseline = 'middle';
      g.fillText(txt, W / 2, 33);
      g.textAlign = 'start'; g.textBaseline = 'alphabetic';
    }
    // 要去哪裡
    g.font = '700 15px "Noto Sans TC", sans-serif'; g.textAlign = 'center';
    g.fillStyle = 'rgba(74,59,42,.75)';
    g.fillText('往 ' + label + ' 的路上…', W / 2, H - 8);
    g.textAlign = 'start';

    if (p >= 1) { finish(); return; }
    tripRaf = requestAnimationFrame(frame);
  })();
}

/* ===== 換房間的開門動畫 =====
   本來點房間是瞬間換掉，換了哪間不太有感覺。
   現在：兩扇門先關著、門上寫房間名字，然後往兩邊打開，看到新房間。
   房間是「馬上」換好的，門只是蓋在上面的畫面——
   不擋點擊、不延後任何事情，連點好幾間也不會亂掉。 */
function roomDoors(name) {
  const stage = $('.stage');
  if (!stage) return;
  const old = document.getElementById('roomDoors');
  if (old) old.remove();
  const d = el('div', 'room-doors');
  d.id = 'roomDoors';
  d.append(el('div', 'door l'), el('div', 'door r'), el('div', 'door-name', '🚪 ' + name));
  stage.appendChild(d);
  Sound.play('click');
  setTimeout(() => d.remove(), 1200);
}

/* 過場裡的學校外觀：照校門口的照片畫（家長同意），但不寫校名、不畫校徽、門牌留白。
   兩側是長長的側翼樓、一排一排拱形陽台；中間主樓比較高，兩邊紅色塔柱、
   頂上一格一格白色城垛；前面是深紅色的大門廊（白柱子），
   右邊一支很高的灰色石柱、左邊矮石柱，中間拉門；門口有紅花花圃、大樹。
   x 是整棟的左邊，寬 SCHOOL_W。 */
const SCHOOL_W = 250;
function drawTripSchool(g, W, H, x) {
  const base = H - 56, BW = SCHOOL_W, cx = x + BW / 2;
  const peach = '#f1c49d', salmon = '#d9826a', white = '#fbf6ee', maroon = '#7a3b3b', stone = '#a9a7a1';
  const arch = (ax, ay, aw, ah, c) => { // 拱形開口
    g.fillStyle = c;
    g.beginPath(); g.moveTo(ax, ay + ah); g.lineTo(ax, ay + aw / 2); g.arc(ax + aw / 2, ay + aw / 2, aw / 2, Math.PI, 0); g.lineTo(ax + aw, ay + ah); g.closePath(); g.fill();
  };
  g.save();
  // 兩側的側翼：三層，每層一排拱形陽台
  g.fillStyle = peach; g.fillRect(x, base - 96, BW, 96);
  g.fillStyle = white; g.fillRect(x, base - 100, BW, 5);
  [base - 90, base - 60, base - 30].forEach(ry => {
    g.fillStyle = white; g.fillRect(x, ry + 24, BW, 3);
    for (let ax = x + 4; ax < x + BW - 10; ax += 15) arch(ax, ry, 10, 22, '#8a6a5a');
  });
  // 中間的主樓（比較高），兩邊紅色塔柱
  const mw = 120, mx = cx - mw / 2, mt = base - 150;
  g.fillStyle = peach; g.fillRect(mx, mt + 10, mw, 150 - 10);
  g.fillStyle = salmon; g.fillRect(mx - 6, mt, 24, 150); g.fillRect(mx + mw - 18, mt, 24, 150);
  g.fillStyle = white;
  g.fillRect(mx - 8, mt - 4, 28, 6); g.fillRect(mx + mw - 20, mt - 4, 28, 6);           // 塔頂
  for (let bx = mx - 8; bx < mx + 20; bx += 7) g.fillRect(bx, mt - 9, 4, 5);             // 塔上的城垛
  for (let bx = mx + mw - 20; bx < mx + mw + 8; bx += 7) g.fillRect(bx, mt - 9, 4, 5);
  for (let bx = mx + 22; bx < mx + mw - 22; bx += 9) g.fillRect(bx, mt + 4, 5, 6);       // 主樓頂的一格一格
  g.fillRect(mx + 18, mt + 10, mw - 36, 3);
  // 主樓的窗：上面一排拱形窗、下面一排方窗
  for (let i = 0; i < 6; i++) {
    const wx = mx + 24 + i * 12.5;
    arch(wx, mt + 18, 9, 18, '#cfe0ea');
    g.fillStyle = '#cfe0ea'; g.fillRect(wx, mt + 44, 9, 14);
  }
  g.fillStyle = white; g.fillRect(mx + 18, mt + 40, mw - 36, 2); g.fillRect(mx + 18, mt + 62, mw - 36, 2);
  // 大門廊：深紅色、平頂，下面拱形，兩根白柱子；門牌留白（不寫校名）
  const pw = 104, px = cx - pw / 2, pt = base - 62;
  g.fillStyle = maroon; g.fillRect(px, pt, pw, 62);
  g.fillStyle = '#5e2c2c'; g.fillRect(px - 3, pt - 4, pw + 6, 6);
  g.fillStyle = '#3a2a26';
  g.beginPath(); g.moveTo(px + 12, base); g.lineTo(px + 12, pt + 26); g.quadraticCurveTo(cx, pt + 12, px + pw - 12, pt + 26); g.lineTo(px + pw - 12, base); g.closePath(); g.fill();
  g.fillStyle = '#ece8e0'; g.fillRect(cx - 22, pt + 26, 5, base - pt - 26); g.fillRect(cx + 17, pt + 26, 5, base - pt - 26);
  g.fillStyle = '#9a8f86'; g.fillRect(cx - 14, base - 8, 28, 8);                          // 台階
  g.fillStyle = '#8f4a48'; g.fillRect(cx - 26, pt + 6, 52, 9);                              // 空白門牌
  g.strokeStyle = '#c9a85a'; g.lineWidth = 1; g.strokeRect(cx - 26, pt + 6, 52, 9);
  // 石柱和拉門
  g.fillStyle = stone;
  g.fillRect(px + 2, base - 46, 10, 46);                                                    // 左邊矮石柱
  g.fillRect(x + BW * .8, base - 124, 18, 124);                                             // 右邊高石柱
  g.fillRect(x + BW * .8 - 4, base - 128, 26, 8);
  g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(x + BW * .8 + 13, base - 120, 5, 120);
  g.strokeStyle = '#8d8a84'; g.lineWidth = 1.2;                                             // 拉門的鐵條
  for (let gx = px + 14; gx < cx + 12; gx += 5) { g.beginPath(); g.moveTo(gx, base); g.lineTo(gx, base - 20); g.stroke(); }
  g.beginPath(); g.moveTo(px + 12, base - 20); g.lineTo(cx + 12, base - 20); g.stroke();
  // 門口的紅花花圃
  g.fillStyle = '#3f7d46'; g.fillRect(x - 6, base - 9, px - x, 9);
  g.fillStyle = '#e8503a';
  for (let fx = x - 3; fx < px - 8; fx += 6) { g.beginPath(); g.arc(fx, base - 9 + (fx % 3), 3, 0, Math.PI * 2); g.fill(); }
  // 大樹：左邊兩棵大的、右邊一棵小的
  [[x + 8, 58, 30], [x + 40, 50, 24], [x + BW - 6, 40, 18]].forEach(([tx, th, r]) => {
    g.fillStyle = '#6b4e33'; g.fillRect(tx - 3, base - th, 6, th);
    g.fillStyle = '#3f8a4a'; g.beginPath(); g.arc(tx, base - th - r * .4, r, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#56a35e'; g.beginPath(); g.arc(tx - r * .35, base - th - r * .7, r * .6, 0, Math.PI * 2); g.fill();
  });
  // 紅磚地
  g.fillStyle = '#b5644f'; g.fillRect(x - 10, base, BW + 20, 8);
  g.restore();
}

// ── 出門、回家 ──
function travelTo(place) {
  if (G.away && G.away.place === place) return;
  cancelHold(); hideItemMenu();
  if (fufu.pose) fufuStandUp(false);
  walkTrip(PLACES[place].name, () => travelArrive(place), place);
}
function travelArrive(place) {
  G.away = { place, idx: 0 };
  host.n = null; // 讓 hostTick 重新迎接
  fufuSay(pickLine('travelGo', { 地點: PLACES[place].name }), 3000);
  toast(`🚗 出發去${PLACES[place].name}！`);
  Sound.play('jump');
  commit();
}
function goPlaceRoom(i) {
  if (!G.away) return;
  if (i !== G.away.idx) roomDoors(PLACES[G.away.place].rooms[i].name);
  G.away.idx = i;
  commit();
}
function goHome() {
  if (!G.away) return;
  if (fufu.pose) fufuStandUp(false);
  walkTrip('家', homeArrive);
}
function homeArrive() {
  G.away = null;
  fufuSay(pickLine('travelHome'), 2600);
  toast('🏠 回到家了');
  commit();
}
/* 出門選單：每個地方一張卡，有主人的附上主人的小圖。
   在親戚家也能打開：直接去另一家，不用先回家再出門。
   現在在的那一家標「你在這裡」、不能點。
   之後的學校、公園、圖書館沒有主人，就用大大的圖示代替小圖——
   PLACES 多加一筆就會出現在這裡，不用改選單。 */
function openTravelMenu() {
  const card = $('#modalCard');
  card.innerHTML = '';
  card.appendChild(el('h2', '', '🚗 要去哪裡玩？'));
  const pick = (icon, title, desc, fn, here) => {
    const b = el('button', 'place-pick' + (here ? ' here' : ''));
    b.appendChild(icon);
    const t = el('div', 'place-txt');
    t.append(el('b', '', title), el('span', '', desc));
    b.appendChild(t);
    if (here) b.disabled = true;
    else b.onclick = () => { $('#modal').hidden = true; fn(); };
    card.appendChild(b);
  };
  if (G.away) pick(el('div', 'place-emoji', '🏠'), '🏠 回家', '回到自己的小屋', goHome, false);

// 圖鑑用的小圖；silhouette 為 true 時畫成剪影
function renderNeighborPortrait(n, w, h, silhouette) {
  const dpr = window.devicePixelRatio || 1;
  const c = document.createElement('canvas');
  c.width = w * dpr; c.height = h * dpr;
  c.style.width = w + 'px'; c.style.height = h + 'px';
  const g = c.getContext('2d');
  const k = (h - 6) / 46 * dpr;
  g.setTransform(k, 0, 0, k, c.width / 2, c.height - 4 * dpr);
  drawNeighbor(g, n, { happy: !silhouette, clean: 100 });

    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = 'rgba(120,105,90,1)';
    g.fillRect(0, 0, c.width, c.height);

function resize() {

function computeView() {
  const room = curRoom(), r = canvas.getBoundingClientRect();
  const minX = iso(0, room.d).x - 30, maxX = iso(room.w, 0).x + 30;
  const minY = iso(0, 0, WALL_H).y - 20, maxY = iso(room.w, room.d).y + 40;
  const hintH = hintShown() ? 50 : 12; // 提示條收起來，房間就可以往下長
  const fitW = r.width / (maxX - minX), fitH = (r.height - hintH) / (maxY - minY);
  let scale = Math.min(fitW, fitH, 1.9);
  let ox = r.width / 2 - (minX + maxX) / 2 * scale;
  /* 放大房間＋直立的手機：房間被「寬度」卡住，只給它更高的空間不會變大。
     所以放大時讓房間比螢幕寬（最多 1.7 倍），畫面左右跟著小可愛走，

    const fp = iso(fufu.x, fufu.y, 0);
    const lo = r.width - maxX * scale, hi = -minX * scale;
    const want = Math.max(lo, Math.min(hi, r.width / 2 - fp.x * scale));
    const key = roomKey() + ':' + scale.toFixed(3);
    cam.ox = cam.key === key ? cam.ox + (want - cam.ox) * .12 : want;
    cam.key = key;
    ox = cam.ox;
  } else cam.key = null;

  const room = curRoom();

  ctx.fillStyle = 'rgba(60,90,60,.18)';
  ctx.beginPath();
  const c = iso(room.w / 2, room.d / 2);
  ctx.ellipse(c.x, c.y + 18, (room.w + room.d) * TW / 4 + 20, (room.w + room.d) * TH / 4 + 14, 0, 0, Math.PI * 2);
  ctx.fill();
  drawRoom(ctx, room, { ghost: hold, hoverUid: hold ? null : hoverUid, showGrid: !!hold, extras: [fufuDrawEntry()].concat(petDrawEntries(), visitorDrawEntries(), hostDrawEntries(), supplyDrawEntries()), occupants: [fufuOccupant(), petOccupant(), visitorOccupant()] });
  petDrawOverlay(ctx);
  visitorDrawOverlay(ctx, performance.now());

}

let lastFrame = performance.now(), nextPetTick = 0, nextCard = 0;
// 一格畫面的遊戲邏輯。休息中整個暫停（也比較省電）；回傳有沒有動
function gameStep(dt, now) {
  if (resting) return false;
  fufuUpdate(dt, now);
  fufuArrivalCheck();
  petUpdate(dt, now);
  visitorTick(dt, now);
  supplyTick(now);
  if (now > nextPetTick) { nextPetTick = now + 5000; if (petTick()) saveGame(); }
  if (now > nextCard) { nextCard = now + 300; updatePetCard(); }
  if (hold) $('#btnPlace').disabled = !hold.ok; // 放不下的位置，「放這裡」按鈕變灰
  draw(); // 小可愛一直在動，每幀都重畫
  dirty = false;
  return true;
}
(function loop(now) {
  now = now || performance.now();
  const dt = Math.max(0, Math.min(.05, (now - lastFrame) / 1000));
  lastFrame = now;
  gameStep(dt, now);
  requestAnimationFrame(loop);
})();

// ── 座標換算與點選 ──
function toWorld(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left - view.ox) / view.scale, y: (e.clientY - r.top - view.oy) / view.scale };
}
function toGrid(w) {
  return { gx: (w.x / (TW / 2) + w.y / (TH / 2)) / 2, gy: (w.y / (TH / 2) - w.x / (TW / 2)) / 2 };
}

function pickItem(w) {
  const room = curRoom();
  const entries = room.items.map(it => {
    const def = FURN_BY_ID[it.id], fp = footprint(def, it.rot);
    return { x: it.x, y: it.y, w: fp.w, d: fp.d, z: 0, h: def.layer === 'floor' ? 2 : itemHeight(def), it, flat: def.layer === 'floor' };
  });
  const order = sortBoxes(entries.filter(e => !e.flat)).reverse().concat(entries.filter(e => e.flat));
  for (const e of order) {
    const p = new Path2D(), pts = [
      iso(e.x, e.y, e.h), iso(e.x + e.w, e.y, e.h), iso(e.x + e.w, e.y, 0),
      iso(e.x + e.w, e.y + e.d, 0), iso(e.x, e.y + e.d, 0), iso(e.x, e.y + e.d, e.h)
    ];
    p.moveTo(pts[0].x, pts[0].y);
    pts.slice(1).forEach(q => p.lineTo(q.x, q.y));
    p.closePath();
    if (pickCtx.isPointInPath(p, w.x, w.y)) return e.it;
  }

}

// 掛飾：滑鼠在畫面右半邊就掛右上牆，左半邊掛左上牆
function wallSpot(w, def) {
  const side = w.x >= 0 ? 'R' : 'L', room = curRoom();
  const pos = Math.round(Math.abs(w.x) / (TW / 2) - def.w / 2);
  return { side, pos: Math.max(0, Math.min(wallLength(room, side) - def.w, pos)) };
}
function pickWallItem(w) {
  const room = curRoom();
  return room.wallItems.slice().reverse().find(it => {
    const def = FURN_BY_ID[it.id];
    const u = it.side === 'R' ? w.x : -w.x;
    if (u < 0) return false;
    const v = .5 * u - w.y;
    return u >= it.pos * TW / 2 && u <= (it.pos + def.w) * TW / 2 && v >= def.z && v <= def.z + def.h;
  }) || null;
}

function moveGhost(w) {
  if (hold.def.layer === 'wall') {
    Object.assign(hold, wallSpot(w, hold.def));
    hold.ok = canPlaceWall(curRoom(), hold.def, hold.side, hold.pos, hold.fromUid);
    return;
  }
  const g = toGrid(w), fp = footprint(hold.def, hold.rot);
  hold.x = Math.round(g.gx - fp.w / 2);
  hold.y = Math.round(g.gy - fp.d / 2);
  hold.ok = canPlace(curRoom(), hold.def, hold.x, hold.y, hold.rot, hold.fromUid);
}

// ── 拿起／放下 ──
// 親戚家的擺設是固定的
function awayNoEdit() {
  if (!G.away) return false;
  toast(`這是${PLACES[G.away.place].name}，不能搬家具喔！回家再布置吧`);
  return true;
}
function startHoldFromInv(id) {
  if (awayNoEdit()) return;

  const room = curRoom();
  if (FURN_BY_ID[id].layer === 'wall') {
    const def = FURN_BY_ID[id];
    hold = { def, side: 'R', pos: 0, fromUid: null };
    // 先找一個空位當起點
    outer: for (const side of ['R', 'L'])
      for (let pos = 0; pos + def.w <= wallLength(room, side); pos++)
        if (canPlaceWall(room, def, side, pos, null)) { hold.side = side; hold.pos = pos; break outer; }
    hold.ok = canPlaceWall(room, def, hold.side, hold.pos, null);

}

  room.items = room.items.filter(x => x.uid !== it.uid);

}
function placeHold() {
  if (!hold || !hold.ok) { toast('這裡放不下喔'); Sound.play('miss'); return; }
  Sound.play('place');
  const room = curRoom(), onWall = hold.def.layer === 'wall';
  const spot = onWall ? { side: hold.side, pos: hold.pos } : { x: hold.x, y: hold.y, rot: hold.rot };
  const list = onWall ? room.wallItems : room.items;
  if (hold.fromUid) {
    list.push(Object.assign({ uid: hold.fromUid, id: hold.def.id }, spot));
  } else {
    if (!G.inv[hold.def.id]) { cancelHold(); return; }
    G.inv[hold.def.id]--;
    if (!G.inv[hold.def.id]) delete G.inv[hold.def.id];
    list.push(Object.assign({ uid: G.uid++, id: hold.def.id }, spot));

}
function rotateHold() {
  if (!hold) return;
  if (hold.def.layer === 'wall') { // 掛飾：換到另一面牆
    const room = curRoom();
    hold.side = hold.side === 'R' ? 'L' : 'R';
    hold.pos = Math.min(hold.pos, wallLength(room, hold.side) - hold.def.w);
    hold.ok = canPlaceWall(room, hold.def, hold.side, hold.pos, hold.fromUid);

function refreshSoundButtons() {

function showFoodMenu(who) {

// ── 滑鼠與觸控 ──
// ── 寵物：按住捏捏、點一下摸摸 ──
canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0 || hold || !$('#itemMenu').hidden || !$('#foodMenu').hidden) return;
  const w = toWorld(e);
  if (petHit(w)) petPressStart(w, performance.now());
  else { const a = compHit(w); if (!a) return; compPressStart(a, w, performance.now()); }
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 不支援就算了 */ }

// ── 椅子、床的小選單 ──

/* 選一樣小東西放到桌上。用既有的 modal，卡片沿用商店那一套，

  card.appendChild(el('h2', '', '🧺 放什麼在桌上？'));
  const grid = el('div', 'grid');
  ON_TABLE.filter(id => G.inv[id] > 0).forEach(id => {
    const def = FURN_BY_ID[id];
    if (!def) return;
    grid.appendChild(furnCard(def, '有 ×' + G.inv[id], () => {
      if (!takeItem(id)) return;
      it.top = id;
      $('#modal').hidden = true;
      Sound.play('place');
      toast(`${def.name} 放到桌上了`);
      commit();
    }));
  });
  card.appendChild(grid);
  const no = el('button', 'big alt', '不要了');
  no.onclick = () => { $('#modal').hidden = true; };
