<script>
// 小遊戲：翻牌配對、圓圓接水果、戳泡泡（都在彈出視窗裡玩，1 分鐘內結束）
'use strict';

// ── 共用：開一個遊戲視窗，關掉時清掉計時器與事件 ──
let gameCleanup = null;
function openGameWindow(title, howTo) {
  closeGameWindow();
  const card = $('#modalCard');
  card.innerHTML = '';
  card.classList.add('game-card', 'in-game');
  card.appendChild(el('h2', '', title));
  if (restIsDue()) setTimeout(forceRestNow, 0); // 時間已經到了（在寬限中）：不能再開新的一局
  card.appendChild(note(howTo));
  const stage = el('div', 'game-stage');
  card.appendChild(stage);
  const status = el('p', 'game-status', '　');
  card.appendChild(status);
  const btns = el('div', 'game-btns');
  card.appendChild(btns);
  $('#modal').hidden = false;
  return { card, stage, status, btns };
}
function closeGameWindow() {
  if (gameCleanup) { gameCleanup(); gameCleanup = null; }
  $('#modalCard').classList.remove('game-card', 'in-game');
  $('#modal').hidden = true;
}
function gameButtons(w, again) {
  w.btns.innerHTML = '';
  const replay = el('button', 'big', '再玩一次');
  replay.onclick = again;
  const home = el('button', 'big alt', G.away ? '離開' : '回家'); // 在親戚家玩，按鈕叫「離開」
  home.onclick = () => { closeGameWindow(); renderTab(); };
  w.btns.append(replay, home);
}
/* 選難度的畫面也要能離開：她點進來發現不想玩，不能只能硬選一個玩完。
   開始玩之後這顆還在，玩到一半不想玩也可以走（不給錢）。 */
function leaveButton(w) {
  const b = el('button', 'big alt', G.away ? '不想玩了，離開' : '不想玩了，回家');
  b.onclick = () => { closeGameWindow(); renderTab(); };
  w.btns.appendChild(b);
}
function payReward(w, bells, extra) {
  addBells(bells);
  didSomething(); // 玩完一場小遊戲，樹長回一顆果子
  if (extra) extra();
  Sound.play('catchFish');
  saveGame();
  refreshTop();
  return bells;
}
// 產生一個跟著裝置解析度的畫布
function gameCanvas(stage, w, h) {
  const dpr = window.devicePixelRatio || 1;
  const c = document.createElement('canvas');
  c.width = w * dpr; c.height = h * dpr;
  c.className = 'game-canvas';
  c.style.aspectRatio = `${w} / ${h}`;
  stage.appendChild(c);
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  // 滑鼠、手指的位置換成畫布座標
  const pos = e => { const r = c.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * w, y: (e.clientY - r.top) / r.height * h }; };
  return { c, g, pos };
}

// ── 1. 翻牌配對 ──
function openMemoryGame() {
  const w = openGameWindow('🃏 翻牌配對', '翻開兩張一樣的圖就配成一對。用越少步數完成，獎金越多！');
  const icons = ['🍎', '🍰', '🧸', '🌷', '🐟', '⭐', '🍮', '🎀'];
  let first = null, lock = false, moves = 0, found = 0, timers = [];
  gameCleanup = () => timers.forEach(clearTimeout);
  const grid = el('div', 'memory-grid');
  w.stage.appendChild(grid);
  const deck = icons.concat(icons).map(v => ({ v, open: false, done: false })).sort(() => Math.random() - .5);
  const status = () => { w.status.textContent = `步數 ${moves}　配對 ${found} / ${icons.length}`; };
  deck.forEach(cardData => {
    const b = el('button', 'memory-card', '');
    b.setAttribute('aria-label', '蓋著的牌');
    b.onclick = () => {
      if (lock || cardData.open || cardData.done) return;
      cardData.open = true; b.classList.add('open'); b.textContent = cardData.v;
      Sound.play('click');
      if (!first) { first = { cardData, b }; return; }
      moves++;
      const a = first; first = null;
      if (a.cardData.v === cardData.v) {
        a.cardData.done = cardData.done = true;
        a.b.classList.add('done'); b.classList.add('done');
        found++;
        Sound.play('petHappy');
        status();
        if (found === icons.length) {
          const bells = Math.max(200, 1200 - (moves - icons.length) * 60);
          payReward(w, bells);
          w.status.textContent = `🎉 全部配對完成！${moves} 步，拿到 ${fmt(bells)} 鈴錢`;
          fufuSay('好厲害！');
          gameButtons(w, openMemoryGame);
        }
      } else {
        lock = true;
        timers.push(setTimeout(() => {
          [a, { cardData, b }].forEach(x => { x.cardData.open = false; x.b.classList.remove('open'); x.b.textContent = ''; });
          lock = false;
        }, 750));
        status();
      }
    };
    grid.appendChild(b);
  });
  status();
  gameButtons(w, openMemoryGame);
}

// ── 2. 圓圓接水果 ──
function openCatchGame() {
  const pname = petName();
  const w = openGameWindow(`🧺 ${pname}接水果`, `左右移動${pname}接住水果！⭐ 分數最多，碰到🐛會頭暈一下。電腦可以用方向鍵。`);
  const W = 360, H = 420, { c, g, pos } = gameCanvas(w.stage, W, H);
  const FRUITS = [['🍎', 10], ['🍓', 10], ['🍌', 10], ['🍇', 15], ['⭐', 50], ['🐛', 0]];
  let px = W / 2, target = W / 2, items = [], score = 0, dizzyUntil = 0, keys = {}, raf = 0, ended = false;
  const start = performance.now(), DURATION = 30000;
  let nextDrop = start, last = start;

  const onMove = e => { target = Math.max(24, Math.min(W - 24, pos(e).x)); };
  const onKey = e => {
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') { keys[e.code] = e.type === 'keydown'; e.preventDefault(); }
  };
  c.addEventListener('pointermove', onMove);
  c.addEventListener('pointerdown', onMove);
  document.addEventListener('keydown', onKey);
  document.addEventListener('keyup', onKey);
  gameCleanup = () => {
    cancelAnimationFrame(raf);
    document.removeEventListener('keydown', onKey);
    document.removeEventListener('keyup', onKey);
  };

  function drawPet(x, y, dizzy, t) {
    g.save(); g.translate(x, y);
    g.fillStyle = 'rgba(0,0,0,.12)'; g.beginPath(); g.ellipse(0, 4, 26, 6, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#ffb3c7';
    [-12, 12].forEach(ex => { g.beginPath(); g.ellipse(ex, -34, 6, 8, 0, 0, Math.PI * 2); g.fill(); });
    g.beginPath(); g.ellipse(0, -16, 26, 20, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#e98aa6'; g.lineWidth = 1.5; g.stroke();
    g.fillStyle = '#4a2f35'; g.strokeStyle = '#4a2f35'; g.lineWidth = 2; g.lineCap = 'round';
    if (dizzy) { // 眼睛轉圈圈
      [-8, 8].forEach(ex => { g.beginPath(); g.arc(ex, -18, 3, t * 10, t * 10 + Math.PI * 1.5); g.stroke(); });
    } else {
      [-8, 8].forEach(ex => { g.beginPath(); g.arc(ex, -18, 3, 0, Math.PI * 2); g.fill(); });
    }
    g.fillStyle = 'rgba(255,110,140,.5)';
    [-16, 16].forEach(cx => { g.beginPath(); g.arc(cx, -11, 3.5, 0, Math.PI * 2); g.fill(); });
    g.fillStyle = '#c94f6d'; g.beginPath(); g.arc(0, -10, 4, 0, Math.PI); g.fill();
    g.restore();
  }

  function frame(now) {
    const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now;
    const left = Math.max(0, DURATION - (now - start));
    const dizzy = now < dizzyUntil;
    if (!dizzy) {
      if (keys.ArrowLeft) target = Math.max(24, target - 320 * dt);
      if (keys.ArrowRight) target = Math.min(W - 24, target + 320 * dt);
      px += (target - px) * Math.min(1, dt * 12);
    }
    // 掉東西：越後面越快
    const speedUp = 1 + (now - start) / DURATION;
    if (now > nextDrop && left > 0) {
      const r = Math.random();
      const pick = r < .08 ? FRUITS[4] : r < .22 ? FRUITS[5] : FRUITS[Math.floor(Math.random() * 4)];
      items.push({ x: 20 + Math.random() * (W - 40), y: -20, v: (110 + Math.random() * 60) * speedUp, e: pick[0], pts: pick[1] });
      nextDrop = now + (650 - 250 * (speedUp - 1)) * (.7 + Math.random() * .6);
    }
    items.forEach(it => { it.y += it.v * dt; });
    // 接到了嗎
    items = items.filter(it => {
      if (it.y > H - 70 && it.y < H - 20 && Math.abs(it.x - px) < 32) {
        if (it.pts) { score += it.pts; Sound.play('coin'); }
        else { dizzyUntil = now + 1000; Sound.play('miss'); }
        return false;
      }
      return it.y < H + 30;
    });

    g.clearRect(0, 0, W, H);
    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#bfe6f2'); sky.addColorStop(1, '#e8f5e4');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    g.fillStyle = '#8cc47a'; g.fillRect(0, H - 18, W, 18);
    g.font = '28px "Segoe UI Emoji", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    items.forEach(it => g.fillText(it.e, it.x, it.y));
    drawPet(px, H - 20, dizzy, now / 1000);
    g.fillStyle = '#4a3b2a'; g.font = 'bold 18px "Noto Sans TC", "Microsoft JhengHei", sans-serif';
    g.textAlign = 'left'; g.fillText(`分數 ${score}`, 12, 22);
    g.textAlign = 'right'; g.fillText(`⏱ ${Math.ceil(left / 1000)}`, W - 12, 22);

    if (left <= 0 && !ended) {
      ended = true;
      const bells = payReward(w, score, () => {
        if (score >= 200) G.food.apple = (G.food.apple || 0) + 1; // 表現好送一顆蘋果
        patPet(5);                                                // 一起玩，寵物心情變好
      });
      setTimeout(() => petGainGrowth(GROWTH.game), 400);         // 一起玩也會長大
      w.status.textContent = `🎉 時間到！分數 ${score}，拿到 ${fmt(bells)} 鈴錢${score >= 200 ? '，還多送一顆🍎' : ''}`;
      gameButtons(w, openCatchGame);
      return;
    }
    raf = requestAnimationFrame(frame);
  }
  w.status.textContent = '開始！';
  gameButtons(w, openCatchGame);
  raf = requestAnimationFrame(frame);
}

// ── 3. 戳泡泡 ──
function openBubbleGame() {
  const w = openGameWindow('🫧 戳泡泡', '30 秒內點破越多泡泡越好！裡面有💰的泡泡分數比較多。');
  const W = 360, H = 420, { c, g, pos } = gameCanvas(w.stage, W, H);
  const COLORS = ['#ffb3c7', '#b3e0ff', '#c9f2b8', '#ffe39a', '#dcc8ff'];
  let bubbles = [], pops = [], score = 0, raf = 0, ended = false;
  const start = performance.now(), DURATION = 30000;
  let nextSpawn = start, last = start;
  gameCleanup = () => cancelAnimationFrame(raf);

  c.addEventListener('pointerdown', e => {
    if (ended) return;
    const p = pos(e);
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      // 泡泡會左右飄，用畫面上實際的位置判斷有沒有點到
      if (Math.hypot(p.x - (b.drawX ?? b.x), p.y - b.y) < b.r + 6) {
        score += b.coin ? 20 : 5;
        pops.push({ x: b.x, y: b.y, r: b.r, age: 0, text: b.coin ? '+20' : '+5' });
        bubbles.splice(i, 1);
        Sound.play(b.coin ? 'coin' : 'pickUp');
        break;
      }
    }
  });

  function frame(now) {
    const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now;
    const left = Math.max(0, DURATION - (now - start));
    if (now > nextSpawn && left > 0) {
      const r = 16 + Math.random() * 16;
      bubbles.push({ x: r + Math.random() * (W - r * 2), y: H + r, r, v: 50 + Math.random() * 60, wob: Math.random() * 6,
        color: COLORS[Math.floor(Math.random() * COLORS.length)], coin: Math.random() < .15 });
      nextSpawn = now + 380 + Math.random() * 300;
    }
    bubbles.forEach(b => { b.y -= b.v * dt; b.wob += dt * 2; });
    bubbles = bubbles.filter(b => b.y > -b.r);
    pops.forEach(p => { p.age += dt; });
    pops = pops.filter(p => p.age < .5);

    g.clearRect(0, 0, W, H);
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#dff3fb'); bg.addColorStop(1, '#fdf6ff');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    bubbles.forEach(b => {
      const x = b.x + Math.sin(b.wob) * 6;
      b.drawX = x;
      g.beginPath(); g.arc(x, b.y, b.r, 0, Math.PI * 2);
      g.fillStyle = b.color + '99'; g.fill();
      g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 2; g.stroke();
      g.beginPath(); g.arc(x - b.r * .35, b.y - b.r * .35, b.r * .22, 0, Math.PI * 2);
      g.fillStyle = 'rgba(255,255,255,.8)'; g.fill();
      if (b.coin) { g.font = `${Math.round(b.r)}px "Segoe UI Emoji", sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('💰', x, b.y + 1); }
    });
    pops.forEach(p => {
      g.globalAlpha = 1 - p.age / .5;
      g.strokeStyle = '#ffffff'; g.lineWidth = 2;
      g.beginPath(); g.arc(p.x, p.y, p.r + p.age * 40, 0, Math.PI * 2); g.stroke();
      g.fillStyle = '#e8505b'; g.font = 'bold 16px sans-serif'; g.textAlign = 'center';
      g.fillText(p.text, p.x, p.y - p.age * 40);
      g.globalAlpha = 1;
    });
    g.fillStyle = '#4a3b2a'; g.font = 'bold 18px "Noto Sans TC", "Microsoft JhengHei", sans-serif'; g.textBaseline = 'middle';
    g.textAlign = 'left'; g.fillText(`分數 ${score}`, 12, 22);
    g.textAlign = 'right'; g.fillText(`⏱ ${Math.ceil(left / 1000)}`, W - 12, 22);

    if (left <= 0 && !ended) {
      ended = true;
      const bells = payReward(w, score);
      w.status.textContent = `🎉 時間到！分數 ${score}，拿到 ${fmt(bells)} 鈴錢`;
      gameButtons(w, openBubbleGame);
      return;
    }
    raf = requestAnimationFrame(frame);
  }
  w.status.textContent = '開始！';
  gameButtons(w, openBubbleGame);
  raf = requestAnimationFrame(frame);
}
</script>
<script>
// 第二批小遊戲：杯子躲貓貓、疊疊鬆餅、跟著唱（共用 games.js 的視窗與獎金工具）
'use strict';

// ── 4. 杯子躲貓貓：寵物躲進杯子，洗牌後猜牠在哪 ──
/* 杯子躲貓貓：可以選 3／4／5 個杯子。
   本來只有 3 個、沒得選——對小一的妹妹剛好，對姊姊太簡單。
   杯子越多、越難、每找到一次越值錢。連續找到還有加成。 */
const CUP_LEVELS = [
  { n: 3, name: '3 個杯子', per: 120, all: 200, k: 1 },
  { n: 4, name: '4 個杯子', per: 200, all: 350, k: .9 },
  { n: 5, name: '5 個杯子', per: 300, all: 500, k: .8 }
];
function openCupGame() {
  const w = openGameWindow('🥤 杯子躲貓貓', `${petName()}會躲進其中一個杯子，看清楚杯子怎麼換位置，再點牠躲的那個杯子！一共 5 回合。`);
  w.stage.innerHTML = ''; w.btns.innerHTML = '';
  w.status.textContent = '要幾個杯子？';
  leaveButton(w);
  const row = el('div', 'lv-row');
  CUP_LEVELS.forEach((L, i) => {
    const b = levelButton(i);
    b.append(el('span', 'lv-n', L.name), el('span', 'lv-p', `一次 💰 ${L.per}`));
    b.onclick = () => { Sound.play('click'); w.stage.innerHTML = ''; playCupGame(w, L); };
    row.appendChild(b);
  });
  w.stage.appendChild(row);
}
function playCupGame(w, L) {
  const pname = petName();
  const W = 360, H = 300, { c, g, pos } = gameCanvas(w.stage, W, H);
  const N = L.n, K = L.k, BASE_Y = 240, ROUNDS = 5;
  // 杯子平均排開：3 個時維持原本的 70／180／290
  const M = N === 3 ? 70 : 46, GAP = (W - 2 * M) / (N - 1);
  const SLOT_X = Array.from({ length: N }, (_, i) => M + i * GAP);
  let streak = 0, extra = 0;
  const sp = PET_SPECIES_BY_ID[G.pet.species], egg = G.pet.stage === 'egg';
  let round = 0, correct = 0, raf = 0, ended = false;
  let cups, petCup, phase, phaseAt, swaps, swapIdx, swapDur, picked = -1, timers = [];
  gameCleanup = () => { cancelAnimationFrame(raf); timers.forEach(clearTimeout); };

  function startRound() {
    round++;
    cups = SLOT_X.map((x, slot) => ({ slot, x, lift: 1, dy: 0 }));
    petCup = Math.floor(Math.random() * N);
    cups.forEach((cup, i) => { cup.lift = i === petCup ? 1 : 0; });
    swapDur = Math.max(.2, .52 - round * .065);
    swaps = [];
    for (let i = 0; i < 3 + round; i++) {
      const a = Math.floor(Math.random() * N);
      let b = Math.floor(Math.random() * (N - 1)); if (b >= a) b++;
      swaps.push([a, b]);
    }
    swapIdx = 0; picked = -1;
    phase = 'show'; phaseAt = performance.now();
    w.status.textContent = `第 ${round} 回合：${pname}躲在這裡喔！`;
  }

  function drawCup(cup) {
    const y = BASE_Y - cup.lift * 75 + cup.dy;
    g.save(); g.translate(cup.x, y); g.scale(K, K);
    g.fillStyle = 'rgba(0,0,0,.12)';
    if (cup.lift < .05) { g.beginPath(); g.ellipse(0, 4, 40, 7, 0, 0, Math.PI * 2); g.fill(); }
    g.beginPath(); g.moveTo(-38, 0); g.lineTo(-27, -78); g.lineTo(27, -78); g.lineTo(38, 0); g.closePath();
    g.fillStyle = '#ff8fb3'; g.fill();
    g.strokeStyle = '#e06a92'; g.lineWidth = 2; g.stroke();
    g.fillStyle = '#ffffff'; g.fillRect(-33, -44, 66, 10);
    g.beginPath(); g.ellipse(0, -78, 27, 6, 0, 0, Math.PI * 2); g.fillStyle = '#ffb3c9'; g.fill(); g.stroke();
    g.beginPath(); g.ellipse(0, 0, 38, 7, 0, 0, Math.PI); g.fillStyle = '#e06a92'; g.fill();
    g.restore();
  }

  function frame(now) {
    const el2 = (now - phaseAt) / 1000;
    if (phase === 'show' && el2 > 1.1) { phase = 'lower'; phaseAt = now; }
    else if (phase === 'lower') {
      cups[petCup].lift = Math.max(0, 1 - el2 / .35);
      if (el2 > .45) { phase = 'shuffle'; phaseAt = now; w.status.textContent = '仔細看喔…'; }
    } else if (phase === 'shuffle') {
      const [a, b] = swaps[swapIdx];
      const ca = cups.find(x => x.slot === a), cb = cups.find(x => x.slot === b);
      const t = Math.min(1, el2 / swapDur), e = t * t * (3 - 2 * t);
      ca.x = SLOT_X[a] + (SLOT_X[b] - SLOT_X[a]) * e; ca.dy = -Math.sin(t * Math.PI) * 22;
      cb.x = SLOT_X[b] + (SLOT_X[a] - SLOT_X[b]) * e; cb.dy = Math.sin(t * Math.PI) * 10;
      if (t >= 1) {
        ca.slot = b; cb.slot = a; ca.x = SLOT_X[b]; cb.x = SLOT_X[a]; ca.dy = cb.dy = 0;
        Sound.play('click');
        swapIdx++; phaseAt = now;
        if (swapIdx >= swaps.length) { phase = 'pick'; w.status.textContent = `${pname}躲在哪一個杯子？點點看！`; }
      }
    } else if (phase === 'reveal') {
      cups.forEach((cup, i) => { if (i === picked || i === petCup) cup.lift = Math.min(1, el2 / .3); });
    }

    g.clearRect(0, 0, W, H);
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#fff3e0'); bg.addColorStop(1, '#ffe2c2');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    g.fillStyle = '#e8c49a'; g.fillRect(0, BASE_Y + 6, W, H - BASE_Y);
    // 寵物先畫，杯子蓋在上面
    const pc = cups[petCup];
    g.save(); g.translate(pc.x, BASE_Y); g.scale(1.55 * K, 1.55 * K);
    if (egg) drawEgg(g, sp, 0); else drawCreature(g, sp, { happy: phase === 'reveal', clean: 100, adult: G.pet.stage === 'adult' });
    g.restore();
    cups.forEach(drawCup);
    g.fillStyle = '#4a3b2a'; g.font = 'bold 17px "Noto Sans TC", "Microsoft JhengHei", sans-serif';
    g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillText(`找到 ${correct} / ${ROUNDS}`, 12, 20);
    g.textAlign = 'right'; g.fillText(`第 ${round} 回合`, W - 12, 20);
    if (!ended) raf = requestAnimationFrame(frame);
  }

  c.addEventListener('pointerdown', e => {
    if (phase !== 'pick') return;
    const p = pos(e);
    const hit = cups.findIndex(cup => Math.abs(p.x - cup.x) < 42 * K && p.y > BASE_Y - 90 * K && p.y < BASE_Y + 12);
    if (hit < 0) return;
    picked = hit; phase = 'reveal'; phaseAt = performance.now();
    if (hit === petCup) {
      correct++; streak++;
      // 連續找到：第二次起每多一次 +30
      if (streak >= 2) extra += (streak - 1) * 30;
      Sound.play('petHappy');
      w.status.textContent = streak >= 2 ? `🎉 找到${pname}了！連續 ${streak} 次！` : `🎉 找到${pname}了！`;
    } else { streak = 0; Sound.play('miss'); w.status.textContent = `差一點點！${pname}躲在另一個杯子`; }
    timers.push(setTimeout(() => {
      if (round < ROUNDS) { startRound(); return; }
      ended = true;
      const bells = payReward(w, correct * L.per + (correct === ROUNDS ? L.all : 0) + extra);
      setTimeout(() => petGainGrowth(GROWTH.game), 400);
      w.status.textContent = `🎉 找到 ${correct} 次！拿到 ${fmt(bells)} 鈴錢${correct === ROUNDS ? `（全部答對加獎 ${L.all}）` : ''}`;
      gameButtons(w, openCupGame);
    }, 1400));
  });

  gameButtons(w, openCupGame);
  startRound();
  openCupGame.test = { n: N, slots: SLOT_X, cups: () => cups, petCup: () => petCup,
                       phase: () => phase, setPick: () => { phase = 'pick'; },
                       tap: x => c.dispatchEvent(new PointerEvent('pointerdown', {
                         clientX: c.getBoundingClientRect().left + x / W * c.getBoundingClientRect().width,
                         clientY: c.getBoundingClientRect().top + (BASE_Y - 30 * K) / H * c.getBoundingClientRect().height,
                         bubbles: true })) };
  raf = requestAnimationFrame(frame);
}

// ── 5. 疊疊鬆餅：看準時機點下去，越疊越高 ──
/* skin 'hay'＝阿婆家的疊稻草：玩法一樣，換成稻草捆、木棧板、穀倉的天空。
   「再玩一次」的按鈕會把點擊事件傳進來，所以只認字串 'hay'。 */
const STACK_SKINS = {
  pancake: { title: '🥞 疊疊鬆餅', thing: '鬆餅', dark: '#d8913f', light: '#f1c27d', sky: ['#ffe9f2', '#fff7e6'], base: '#ffffff', baseEdge: '#e4d8c3', top: '#fff6d6' },
  hay:     { title: '🌾 疊稻草',   thing: '稻草', dark: '#c9a23a', light: '#e8c35a', sky: ['#bfe6f2', '#f3f7dc'], base: '#a0703f', baseEdge: '#7a5230', top: null }
};
function openStackGame(skin) {
  skin = skin === 'hay' ? 'hay' : 'pancake';
  const S = STACK_SKINS[skin];
  openStackGame.skin = skin;
  const w = openGameWindow(S.title, `${S.thing}會左右滑動，點一下（或按空白鍵）放下去。沒對齊的部分會掉下去，對得剛剛好有「完美」加分！`);
  const W = 360, H = 420, { c, g } = gameCanvas(w.stage, W, H);
  const LAYER_H = 16, BASE_Y = H - 40, MAX_LAYERS = 20;
  let layers = [{ x: W / 2, w: 150 }], moving, falling = [], perfects = 0, raf = 0, ended = false, flash = 0, camY = 0;
  let last = performance.now();
  gameCleanup = () => { cancelAnimationFrame(raf); document.removeEventListener('keydown', onKey); };

  function newMoving() {
    const top = layers[layers.length - 1];
    const speed = 130 + layers.length * 14;
    moving = { x: layers.length % 2 ? top.w / 2 : W - top.w / 2, w: top.w, dir: layers.length % 2 ? 1 : -1, speed };
  }
  function layerY(i) { return BASE_Y - i * LAYER_H; } // 第 i 層鬆餅的上緣（第 1 層貼著盤子）

  function drop() {
    if (ended || !moving) return;
    const top = layers[layers.length - 1], dx = moving.x - top.x;
    if (Math.abs(dx) <= 4) { // 完美
      layers.push({ x: top.x, w: top.w });
      perfects++; flash = 1; Sound.play('perfect');
    } else {
      const l = Math.max(moving.x - moving.w / 2, top.x - top.w / 2), r = Math.min(moving.x + moving.w / 2, top.x + top.w / 2);
      if (r - l <= 2) { // 沒疊到
        falling.push({ x: moving.x, y: layerY(layers.length), w: moving.w, vy: 0 });
        return finish(false);
      }
      const cutL = moving.x - moving.w / 2 < l, cutW = moving.w - (r - l);
      falling.push({ x: cutL ? l - cutW / 2 : r + cutW / 2, y: layerY(layers.length), w: cutW, vy: 0 });
      layers.push({ x: (l + r) / 2, w: r - l });
      Sound.play('stack');
    }
    if (layers.length - 1 >= MAX_LAYERS) return finish(true);
    newMoving();
    w.status.textContent = `疊了 ${layers.length - 1} 層${perfects ? `，完美 ${perfects} 次` : ''}`;
  }
  function finish(full) {
    ended = true; moving = null;
    const n = layers.length - 1;
    const bells = payReward(w, n * 30 + perfects * 20 + (full ? 200 : 0));
    w.status.textContent = `🎉 ${full ? '疊到最高了！' : '倒了！'}疊了 ${n} 層、完美 ${perfects} 次，拿到 ${fmt(bells)} 鈴錢`;
    gameButtons(w, () => openStackGame(skin));
  }
  const onKey = e => { if (e.code === 'Space') { e.preventDefault(); drop(); } };
  document.addEventListener('keydown', onKey);
  c.addEventListener('pointerdown', drop);

  function drawPancake(x, y, wd, top) {
    const rad = skin === 'hay' ? 3 : 7;
    g.fillStyle = S.dark; g.beginPath(); g.roundRect(x - wd / 2, y, wd, LAYER_H, rad); g.fill();
    g.fillStyle = S.light; g.beginPath(); g.roundRect(x - wd / 2, y, wd, LAYER_H - 6, rad); g.fill();
    if (skin === 'hay' && wd > 24) { // 稻草捆的兩條繩子
      g.fillStyle = '#8a5a33'; g.fillRect(x - wd / 4, y, 2, LAYER_H); g.fillRect(x + wd / 4 - 2, y, 2, LAYER_H);
    }
    if (top && wd > 20 && S.top) { // 最上面一層加奶油
      g.fillStyle = S.top; g.beginPath(); g.roundRect(x - 9, y - 5, 18, 8, 3); g.fill();
    }
  }

  function frame(now) {
    const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now;
    if (moving) {
      moving.x += moving.dir * moving.speed * dt;
      if (moving.x > W - moving.w / 2) { moving.x = W - moving.w / 2; moving.dir = -1; }
      if (moving.x < moving.w / 2) { moving.x = moving.w / 2; moving.dir = 1; }
    }
    falling.forEach(f => { f.vy += 900 * dt; f.y += f.vy * dt; });
    falling = falling.filter(f => f.y < H + camY + 60);
    flash = Math.max(0, flash - dt * 2);
    const targetCam = Math.max(0, (layers.length + 2) * LAYER_H - H * .55);
    camY += (targetCam - camY) * Math.min(1, dt * 5);

    g.clearRect(0, 0, W, H);
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, S.sky[0]); bg.addColorStop(1, S.sky[1]);
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    g.save(); g.translate(0, camY);
    if (skin === 'hay') { // 木棧板
      g.fillStyle = S.base; g.fillRect(W / 2 - 95, BASE_Y, 190, 12);
      g.strokeStyle = S.baseEdge; g.lineWidth = 2; g.strokeRect(W / 2 - 95, BASE_Y, 190, 12);
    } else {
      g.fillStyle = S.base; g.beginPath(); g.ellipse(W / 2, BASE_Y + 6, 100, 12, 0, 0, Math.PI * 2); g.fill();
      g.strokeStyle = S.baseEdge; g.lineWidth = 2; g.stroke();
    }
    layers.slice(1).forEach((L, i) => drawPancake(L.x, layerY(i + 1), L.w, i === layers.length - 2 && ended));
    if (layers.length === 1) { g.fillStyle = 'rgba(0,0,0,.08)'; g.fillRect(layers[0].x - layers[0].w / 2, BASE_Y - 2, layers[0].w, 3); }
    falling.forEach(f => drawPancake(f.x, f.y, f.w, false));
    if (moving) drawPancake(moving.x, layerY(layers.length), moving.w, false);
    g.restore();
    if (flash > 0) {
      g.globalAlpha = flash; g.fillStyle = '#e8505b'; g.font = 'bold 26px "Noto Sans TC", "Microsoft JhengHei", sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('完美！', W / 2, 70); g.globalAlpha = 1;
    }
    g.fillStyle = '#4a3b2a'; g.font = 'bold 17px "Noto Sans TC", "Microsoft JhengHei", sans-serif';
    g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillText(`${layers.length - 1} 層`, 12, 20);
    raf = requestAnimationFrame(frame);
  }

  // 第一層的底座寬度就是盤子上的範圍
  layers = [{ x: W / 2, w: 150 }];
  newMoving();
  w.status.textContent = `點一下放${S.thing}！`;
  gameButtons(w, () => openStackGame(skin));
  raf = requestAnimationFrame(frame);
}

// ── 6. 跟著唱：記住動物唱的順序，照著按 ──
function openSimonGame() {
  const w = openGameWindow('🎵 跟著唱', '動物們會依序唱歌，仔細聽、仔細看，然後照同樣的順序按。每過一關多一個音，答錯有一次「再聽一次」的機會。');
  const PADS = [['🐰', '#ffb3c7'], ['🐻', '#e3b88a'], ['🐥', '#ffe680'], ['🐧', '#9cc0ee']];
  const MAX_LEVEL = 12;
  const grid = el('div', 'simon-grid');
  const pads = PADS.map(([icon, color], i) => {
    const b = el('button', 'simon-pad', icon);
    b.style.background = color;
    b.setAttribute('aria-label', `第 ${i + 1} 個動物`);
    grid.appendChild(b);
    return b;
  });
  w.stage.appendChild(grid);
  let seq = [], input = 0, listening = false, retry = true, timers = [], ended = false;
  gameCleanup = () => timers.forEach(clearTimeout);
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));

  function light(i, ms) {
    pads[i].classList.add('lit');
    Sound.play('note', i);
    later(() => pads[i].classList.remove('lit'), ms);
  }
  function playback() {
    listening = false;
    w.status.textContent = `第 ${seq.length} 關：仔細聽…`;
    const on = seq.length > 5 ? 360 : 440, gap = seq.length > 5 ? 130 : 180;
    seq.forEach((n, k) => later(() => light(n, on), 500 + k * (on + gap)));
    later(() => { listening = true; input = 0; w.status.textContent = '換你了！照順序按'; }, 500 + seq.length * (on + gap));
  }
  function nextLevel() {
    seq.push(Math.floor(Math.random() * 4));
    playback();
  }
  function finish() {
    ended = true; listening = false;
    const cleared = seq.length - 1;
    const bells = payReward(w, cleared * 90 + (cleared >= MAX_LEVEL ? 300 : 0));
    w.status.textContent = `🎉 過了 ${cleared} 關，拿到 ${fmt(bells)} 鈴錢${cleared >= MAX_LEVEL ? '（全部過關加獎 300）' : ''}`;
    gameButtons(w, openSimonGame);
  }

  pads.forEach((b, i) => {
    b.onclick = () => {
      if (!listening || ended) return;
      light(i, 220);
      if (seq[input] !== i) {
        listening = false;
        if (retry) {
          retry = false;
          w.status.textContent = '差一點點！再聽一次～';
          Sound.play('miss');
          later(playback, 900);
        } else {
          Sound.play('miss');
          later(finish, 600);
        }
        return;
      }
      input++;
      if (input === seq.length) {
        listening = false;
        if (seq.length >= MAX_LEVEL) { seq.push(-1); later(finish, 500); return; }
        w.status.textContent = '答對了！';
        later(() => { Sound.play('petHappy'); nextLevel(); }, 600);
      }
    };
  });

  gameButtons(w, openSimonGame);
  nextLevel();
}
</script>
<script>
// 親戚家專屬小遊戲：叔叔的打磚塊、阿婆的照顧小牛小羊（共用 games.js 的視窗與獎金工具）
'use strict';

/* ===== 叔叔家的電動：三台機器各有自己的遊戲 =====
   本來「大型電玩」點下去是隨機開家裡那些小遊戲（翻牌、戳泡泡…），
   一點都不像在打電動；「電視遊樂器」更是只有動畫、根本沒有遊戲。
   現在：大型電玩 → 打地鼠、電視遊樂器 → 賽車閃避、電競桌 → 打磚塊（原本就有）。
   三種難度、越難越多錢，跟家裡的新遊戲同一套規矩。 */

// ── 🕹️ 打地鼠：只要點，小一的妹妹也會玩 ──
const MOLE_LEVELS = [
  { name: '慢慢來', up: 1150, max: 1, bomb: .1,  mul: 1 },
  { name: '普通',   up: 820,  max: 2, bomb: .16, mul: 2 },
  { name: '超快！', up: 560,  max: 3, bomb: .22, mul: 3 }
];
function openMoleGame() {
  const w = openGameWindow('🕹️ 打地鼠', '地鼠冒出來就點牠！點到炸彈會扣分喔。30 秒內打越多越好。');
  pickLevelRow(w, MOLE_LEVELS, L => `一隻 💰 ${15 * L.mul}`, L => playMole(w, L));
}
function playMole(w, L) {
  w.stage.innerHTML = '';
  const board = el('div', 'mole-board');
  const holes = [];
  for (let i = 0; i < 9; i++) {
    const h = el('button', 'mole-hole');
    h.dataset.i = i;
    h.onclick = () => hit(i);
    board.appendChild(h);
    holes.push({ el: h, kind: null, until: 0 });
  }
  w.stage.appendChild(board);
  let score = 0, left = 30, ended = false, timers = [];
  gameCleanup = () => timers.forEach(t => { clearTimeout(t); clearInterval(t); });

  function paint() {
    holes.forEach(h => { h.el.textContent = h.kind === 'mole' ? '🐹' : h.kind === 'bomb' ? '💣' : ''; h.el.classList.toggle('up', !!h.kind); });
    w.status.textContent = `${L.name}　還有 ${left} 秒　打到 ${score} 隻`;
  }
  function pop() {
    if (ended) return;
    const now = performance.now();
    holes.forEach(h => { if (h.kind && now > h.until) h.kind = null; });
    const upNow = holes.filter(h => h.kind).length;
    if (upNow < L.max) {
      const free = holes.filter(h => !h.kind);
      const h = free[Math.floor(Math.random() * free.length)];
      if (h) { h.kind = Math.random() < L.bomb ? 'bomb' : 'mole'; h.until = now + L.up; }
    }
    paint();
    timers.push(setTimeout(pop, L.up * .45));
  }
  function hit(i) {
    if (ended) return;
    const h = holes[i];
    if (h.kind === 'mole') { score++; Sound.play('pickUp'); }
    else if (h.kind === 'bomb') { score = Math.max(0, score - 2); Sound.play('bad'); }
    else return;
    h.kind = null;
    paint();
  }
  function finish() {
    if (ended) return;
    ended = true;
    gameCleanup();
    holes.forEach(h => { h.kind = null; });
    paint();
    const bells = payReward(w, score * 15 * L.mul);
    w.status.textContent = `打到 ${score} 隻！💰 +${fmt(bells)}`;
    toast(`🕹️ 打到 ${score} 隻，拿到 💰 ${fmt(bells)}`);
    gameButtons(w, openMoleGame);
  }
  openMoleGame.test = { holes: () => holes.map(h => h.kind), hit: hit, finish: finish,
                        force: (i, kind) => { holes[i].kind = kind; holes[i].until = performance.now() + 99999; paint(); },
                        score: () => score, level: L };
  timers.push(setInterval(() => { if (ended) return; left--; if (left <= 0) finish(); else paint(); }, 1000));
  pop();
}

// ── 📺 賽車閃避：點左半邊往左、右半邊往右，躲路障、吃金幣 ──
const RACE_LEVELS = [
  { name: '慢慢開', speed: 150, gap: 950, mul: 1 },
  { name: '普通',   speed: 220, gap: 760, mul: 2 },
  { name: '飆車！', speed: 300, gap: 600, mul: 3 }
];
function openRaceGame() {
  const w = openGameWindow('📺 賽車閃避', '點畫面左邊往左、右邊往右，躲開路障 🚧，吃到金幣 🪙！撞到 3 次就結束，最多 30 秒。');
  pickLevelRow(w, RACE_LEVELS, L => `一枚 💰 ${20 * L.mul}`, L => playRace(w, L));
}
function playRace(w, L) {
  w.stage.innerHTML = '';
  const W = 340, H = 360, { c, g, pos } = gameCanvas(w.stage, W, H);
  const LANES = [W * .2, W * .5, W * .8], CAR_Y = H - 56;
  let lane = 1, things = [], coins = 0, lives = 3, left = 30, ended = false, raf = 0, timers = [];
  let last = performance.now(), nextDrop = 0, hurtUntil = 0, road = 0;
  gameCleanup = () => { cancelAnimationFrame(raf); timers.forEach(t => clearInterval(t)); };

  function steer(dir) { if (!ended) { lane = Math.max(0, Math.min(2, lane + dir)); Sound.play('click'); } }
  c.addEventListener('pointerdown', e => steer(pos(e).x < W / 2 ? -1 : 1));
  const onKey = e => { if (e.key === 'ArrowLeft') steer(-1); if (e.key === 'ArrowRight') steer(1); };
  document.addEventListener('keydown', onKey);
  const oldCleanup = gameCleanup;
  gameCleanup = () => { oldCleanup(); document.removeEventListener('keydown', onKey); };

  function finish() {
    if (ended) return;
    ended = true;
    gameCleanup();
    // 撐完 30 秒沒撞爛，再加一筆
    const bonus = lives > 0 && left <= 0 ? 100 * L.mul : 0;
    const bells = payReward(w, coins * 20 * L.mul + bonus);
    w.status.textContent = `吃到 ${coins} 枚金幣${bonus ? '，還撐完全程！' : ''}　💰 +${fmt(bells)}`;
    toast(`📺 拿到 💰 ${fmt(bells)}`);
    gameButtons(w, openRaceGame);
  }
  openRaceGame.test = { steer: steer, lane: () => lane, finish: finish,
                        addCoins: n => { coins += n; }, level: L, lives: () => lives,
                        hitWall: () => { lives--; if (lives <= 0) finish(); } };
  timers.push(setInterval(() => { if (ended) return; left--; if (left <= 0) finish(); }, 1000));

  (function frame(now) {
    now = now || performance.now();
    const dt = Math.max(0, Math.min(.05, (now - last) / 1000));
    last = now;
    if (!ended) {
      road = (road + L.speed * dt) % 40;
      if (now > nextDrop) {
        nextDrop = now + L.gap * (.75 + Math.random() * .5);
        things.push({ lane: Math.floor(Math.random() * 3), y: -20, coin: Math.random() < .45 });
      }
      things.forEach(t => { t.y += L.speed * dt; });
      things = things.filter(t => {
        if (t.lane === lane && Math.abs(t.y - CAR_Y) < 28) {
          if (t.coin) { coins++; Sound.play('coin'); }
          else if (now > hurtUntil) { lives--; hurtUntil = now + 900; Sound.play('bad'); if (lives <= 0) finish(); }
          return false;
        }
        return t.y < H + 30;
      });
      w.status.textContent = `${L.name}　還有 ${left} 秒　❤️×${Math.max(0, lives)}　🪙×${coins}`;
    }
    // 路面
    g.fillStyle = '#5d6470'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#7cc9a0'; g.fillRect(0, 0, 18, H); g.fillRect(W - 18, 0, 18, H);
    g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = 4; g.setLineDash([22, 18]); g.lineDashOffset = -road;
    [W * .35, W * .65].forEach(x => { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); });
    g.setLineDash([]);
    g.font = '30px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    things.forEach(t => g.fillText(t.coin ? '🪙' : '🚧', LANES[t.lane], t.y));
    // 車子：撞到的時候閃
    if (!(now < hurtUntil && Math.floor(now / 100) % 2)) {
      g.font = '40px sans-serif';
      g.fillText('🚗', LANES[lane], CAR_Y);
    }
    g.textAlign = 'start'; g.textBaseline = 'alphabetic';
    if (!ended) raf = requestAnimationFrame(frame);
  })();
}

/* 難度按鈕：前面一排星星（⭐ 簡單、⭐⭐、⭐⭐⭐ 難），妹妹不用看字也知道哪個比較簡單；
   最簡單的那顆用綠框特別標出來 */
function levelButton(i) {
  const b = el('button', 'lv-btn' + (i === 0 ? ' easy' : ''));
  b.appendChild(el('span', 'lv-stars', '⭐'.repeat(i + 1)));
  return b;
}
// 三種難度的選單，三個遊戲共用
function pickLevelRow(w, levels, sub, play) {
  w.stage.innerHTML = ''; w.btns.innerHTML = '';
  w.status.textContent = '選一個難度';
  leaveButton(w);
  const row = el('div', 'lv-row');
  levels.forEach((L, i) => {
    const b = levelButton(i);
    b.append(el('span', 'lv-n', L.name), el('span', 'lv-p', sub(L)));
    b.onclick = () => { Sound.play('click'); play(L); };
    row.appendChild(b);
  });
  w.stage.appendChild(row);
}

/* ===== 親戚家的事情要有效果 =====
   本來叔叔家的看漫畫、看公仔、找點心，阿婆家的喝茶、烤火、搬稻草、加水，
   都只有動畫，做完什麼都沒變。

   刻意不全部做成小遊戲：每件事都要「玩完才有東西」會讓她覺得在工作。
   照那件事本來的意思給效果——
     吃東西就真的飽、喝茶烤火就放鬆、幫忙做事就拿零用錢、
     看漫畫看公仔就有小驚喜。

   全部都有冷卻：不然她可以一直點冰箱刷飽足、一直搬稻草刷錢。
   而且只有「她自己點的」才算——小可愛閒晃時自己去做的不給，
   不然她什麼都不用做，小可愛就自己在那邊賺錢吃飯。 */
const RELATIVE_CD_MS = 10 * 60000;

// key → 效果。who：在哪一家才有（null＝哪裡都可以）
const RELATIVE_PERKS = {
  snack:   { who: 'uncle',   kid: 20, say: '叔叔的冰箱好多零食！',  toast: '🧃 吃了叔叔的點心，飽足 +20' },
  tea:     { who: 'grandma', kid: 10, pet: 15, say: '跟阿婆喝茶好放鬆～', toast: '🍵 好放鬆，飽足 +10、寵物心情 +15' },
  warm:    { who: null,      pet: 15, say: '暖呼呼的…',             toast: '🔥 暖呼呼，寵物心情 +15' },
  hay:     { who: 'grandma', money: [50, 100], say: '阿婆說我好棒！', toast: '🌾 幫阿婆搬稻草，拿到零用錢' },
  trough:  { who: 'grandma', money: [50, 100], say: '小牛小羊喝得好開心！', toast: '💧 幫忙加水，阿婆給了零用錢' },
  comic:   { who: 'uncle',   comic: true, cd: 5 * 60000 }, // 漫畫是收集的樂趣，等 5 分鐘就好
  figures: { who: 'uncle',   figure: true },
  // 交作業不給錢（寫作業本來就是自己的事），老師給一張貼紙，可以收集

// 冷卻時間：每件事可以自己設（cd），沒設就是 10 分鐘
const relativeCD = key => (RELATIVE_PERKS[key] && RELATIVE_PERKS[key].cd) || RELATIVE_CD_MS;
function relativeReady(key) {
  const t = (G.actCD || {})[key] || 0;
  return Date.now() - t >= relativeCD(key);
}
function relativeMinsLeft(key) {
  const t = (G.actCD || {})[key] || 0;
  return Math.max(1, Math.ceil((relativeCD(key) - (Date.now() - t)) / 60000));
}

/* 回傳 true＝這次有給效果。冷卻中會講還要等幾分鐘，不會默默沒反應。 */
function relativePerk(key) {
  const P = RELATIVE_PERKS[key];
  if (!P) return false;
  if (P.who && !(G.away && [].concat(P.who).includes(G.away.place))) return false; // who 可以是好幾個地方
  if (P.buy) { // 用買的：錢夠就買，不夠就說
    const f = KID_FOOD_BY_ID[P.buy.kidFood];
    if (!spend(P.buy.cost)) { toast(`💰 錢不夠，${f.name}要 ${P.buy.cost}`); return false; }
    G.kidFood[f.id] = (G.kidFood[f.id] || 0) + 1;
    toast(`${f.emoji} 買了一支${f.name}（-${P.buy.cost}），放進小可愛的食物了`);
    Sound.play('coin'); refreshTop();
    return true;
  }
  if (!relativeReady(key)) {
    toast(`⏳ 等一下再來，還要 ${relativeMinsLeft(key)} 分鐘`);
    return false;
  }
  G.actCD = G.actCD || {};
  G.actCD[key] = Date.now();
  if (P.kid) G.kid.hunger = clampStat(G.kid.hunger + P.kid);
  if (P.pet) G.pet.mood = clampStat((G.pet.mood || 0) + P.pet);
  if (P.money) {
    const n = P.money[0] + Math.floor(Math.random() * (P.money[1] - P.money[0] + 1));
    addBells(n);
    toast(`${P.toast} 💰${n}`);
    Sound.play('coin');
  } else if (P.toast) toast(P.toast);
  if (P.say) setTimeout(() => fufuSay(P.say, 2800), 600);
  if (P.comic) setTimeout(() => { if ($('#modal').hidden) openComic(); }, 1200);
  if (P.sticker) { // 貼紙先記下來，畫面晚一點再跳（她如果剛好在玩別的，貼紙也不會不見）
    const st = giveSticker();
    setTimeout(() => { if ($('#modal').hidden) openSticker(st); }, 1200);
  }
  if (P.figure) figureGift();
  return true;
}

/* ===== 📝 學校的小考 =====
   三種難度（畫面上不寫年級）：簡單＝妹妹也能玩（加減 10 以內，下面畫蘋果可以數），
   普通＝100 以內加減，挑戰＝姊姊玩的九九乘法和除法。
   不限時間：小考是要她算對，不是要她手忙腳亂。
   答錯不扣錢，告訴她正確答案就換下一題。 */
const QUIZ_N = 10;
const QUIZ_LEVELS = [
  { name: '簡單', sub: '10 以內加減', mul: 1, apples: true },
  { name: '普通', sub: '100 以內加減', mul: 2 },
  { name: '挑戰！', sub: '乘法、除法', mul: 3 }
];
const quizRnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
// 出一題：{ a, b, op, ans, text }
function quizQuestion(L) {
  let a, b, op;
  if (L === QUIZ_LEVELS[0]) {
    op = Math.random() < .5 ? '+' : '−';
    if (op === '+') { a = quizRnd(1, 9); b = quizRnd(1, 10 - a); } else { a = quizRnd(2, 10); b = quizRnd(1, a - 1); }
  } else if (L === QUIZ_LEVELS[1]) {
    op = Math.random() < .5 ? '+' : '−';
    if (op === '+') { a = quizRnd(10, 89); b = quizRnd(1, 99 - a); } else { a = quizRnd(20, 99); b = quizRnd(1, a - 1); }
  } else {
    op = Math.random() < .6 ? '×' : '÷';
    const x = quizRnd(2, 9), y = quizRnd(2, 9);
    if (op === '×') { a = x; b = y; } else { a = x * y; b = x; }
  }
  const ans = op === '+' ? a + b : op === '−' ? a - b : op === '×' ? a * b : a / b;
  return { a, b, op, ans, text: `${a} ${op} ${b} = ?` };
}
// 四個選項：正確答案＋三個「看起來很像」的錯誤答案，不會有負數、不會重複
// small：簡單的答案只有 0~10，錯誤答案也只差 1~3（差 10 的一眼就知道不對）
function quizChoices(ans, small) {
  const set = new Set([ans]);
  const near = small ? [1, -1, 2, -2, 3, -3] : [1, -1, 2, -2, 10, -10, 3, -3, 5, -5];
  for (let i = 0; set.size < 4 && i < 200; i++) {
    const v = ans + near[Math.floor(Math.random() * near.length)];
    if (v >= 0) set.add(v);
  }
  for (let v = ans + 4; set.size < 4; v++) set.add(v);
  const out = [...set];
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
  return out;
}
function openQuizGame() {
  const w = openGameWindow('📝 小考', `${QUIZ_N} 題，點你覺得對的答案。不用急，慢慢算！答對越多拿越多。`);
  pickLevelRow(w, QUIZ_LEVELS, L => `${L.sub}・一題 💰 ${15 * L.mul}`, L => playQuiz(w, L));
}
function playQuiz(w, L) {
  w.stage.innerHTML = '';
  let n = 0, right = 0, q = null, locked = false, ended = false, timer = 0;
  gameCleanup = () => clearTimeout(timer);
  const box = el('div', 'quiz');
  const qEl = el('div', 'quiz-q'), pics = el('div', 'quiz-pics'), row = el('div', 'quiz-choices');
  box.append(qEl, pics, row);
  w.stage.appendChild(box);

  function show() {
    q = quizQuestion(L);
    locked = false;
    qEl.textContent = q.text;
    pics.innerHTML = '';
    if (L.apples) { // 簡單：下面畫蘋果，數得出來。減掉的那幾顆畫淡淡的
      const tot = q.op === '+' ? q.a + q.b : q.a;
      for (let i = 0; i < tot; i++) {
        const s = el('span', q.op === '−' && i >= q.a - q.b ? 'gone' : '', '🍎');
        if (q.op === '+' && i === q.a) pics.appendChild(el('span', 'plus', '＋'));
        pics.appendChild(s);
      }
    }
    row.innerHTML = '';
    quizChoices(q.ans, !!L.apples).forEach(v => {
      const b = el('button', 'quiz-c', String(v));
      b.onclick = () => choose(v, b);
      row.appendChild(b);
    });
    w.status.textContent = `${L.name}　第 ${n + 1} / ${QUIZ_N} 題　答對 ${right} 題`;
  }
  function choose(v, btn) {
    if (locked || ended) return;
    locked = true;
    const ok = v === q.ans;
    if (ok) { right++; Sound.play('coin'); }
    else Sound.play('bad');
    [...row.children].forEach(b => {
      if (Number(b.textContent) === q.ans) b.classList.add('right');
      else if (b === btn) b.classList.add('wrong');
    });
    qEl.textContent = `${q.a} ${q.op} ${q.b} = ${q.ans}　${ok ? '⭕' : '❌'}`;
    n++;
    timer = setTimeout(() => (n >= QUIZ_N ? finish() : show()), ok ? 700 : 1500); // 答錯多留一點時間看正確答案
  }
  function finish() {
    if (ended) return;
    ended = true;
    clearTimeout(timer);
    const all = right === QUIZ_N;
    const bells = payReward(w, right * 15 * L.mul + (all ? 100 * L.mul : 0));
    w.stage.innerHTML = '';
    w.stage.appendChild(el('div', 'quiz-end', all ? '💯' : right >= QUIZ_N * .7 ? '🌟' : '👍'));
    w.status.textContent = `答對 ${right} / ${QUIZ_N} 題${all ? '，全對！' : ''}　💰 +${fmt(bells)}`;
    toast(`📝 小考答對 ${right} 題，拿到 💰 ${fmt(bells)}`);
    gameButtons(w, openQuizGame);
  }
  openQuizGame.test = { q: () => q, choose: v => choose(v, null), finish, right: () => right, n: () => n, level: L,
                        next: () => { clearTimeout(timer); if (!ended) (n >= QUIZ_N ? finish() : show()); } };
  show();
}

/* ===== 🏃 操場賽跑 =====
   照片參考：學校操場的藍色跑道（深藍、淺藍交錯，白線分道）。
   一直點「跑！」就會往前跑，跟熊熊阿布、兔兔米米、狐狸露露比賽。
   不用看字：點越快跑越快，第幾名用獎牌表示。 */
const RUN_LEN = 100;
const RUN_LEVELS = [
  { name: '慢慢跑', speed: 4.6, mul: 1 },
  { name: '普通',   speed: 6.6, mul: 2 },
  { name: '運動會！', speed: 8.4, mul: 3 }
];
const RUN_STEP = 1.6;                  // 點一下跑多遠
const RUN_PRIZE = [200, 100, 50, 20];  // 第 1~4 名（再乘難度）
function openRunGame() {
  const w = openGameWindow('🏃 操場賽跑', '一直點「跑！」（或點畫面）就會往前跑，點越快跑越快！跟同學比賽，看誰先到終點。');
  pickLevelRow(w, RUN_LEVELS, L => `第一名 💰 ${RUN_PRIZE[0] * L.mul}`, L => playRun(w, L));
}
function playRun(w, L) {
  w.stage.innerHTML = '';
  const W = 340, H = 260, { c, g } = gameCanvas(w.stage, W, H);
  const go = el('button', 'big run-go', '🏃 跑！');
  w.stage.appendChild(go);
  const mates = NEIGHBORS.filter(Boolean).slice(0, 3).map((n, i) => ({ n, x: 0, v: L.speed * (.9 + Math.random() * .15) * (1 - i * .03), done: 0 }));
  let me = 0, myDone = false, order = [], ended = false, raf = 0, last = performance.now(), t = 0, countdown = 3, bounce = 0;
  gameCleanup = () => cancelAnimationFrame(raf);

  function tap() {
    if (ended || countdown > 0) return;
    me = Math.min(RUN_LEN, me + RUN_STEP);
    bounce = 1;
    if (me >= RUN_LEN && !myDone) { myDone = true; order.push('me'); } // 用 true，不要存時間：t 可能剛好是 0
  }
  go.onclick = tap;
  c.addEventListener('pointerdown', tap);
  function tick(dt) {
    if (ended) return;
    if (countdown > 0) { countdown -= dt; return; }
    t += dt;
    mates.forEach(m => {
      if (m.x >= RUN_LEN) return;
      m.x = Math.min(RUN_LEN, m.x + m.v * dt);
      if (m.x >= RUN_LEN) { m.done = t; order.push(m); }
    });
    // 自己跑到終點就結束（後面的不用等），或三個同學都到了也結束（最後一名）
    if (myDone || mates.every(m => m.x >= RUN_LEN)) finish();
  }
  function place() { const i = order.indexOf('me'); return i < 0 ? 4 : i + 1; }
  function finish() {
    if (ended) return;
    ended = true;
    const p = place();
    const bells = payReward(w, RUN_PRIZE[p - 1] * L.mul);
    const medal = ['🥇', '🥈', '🥉', '🎽'][p - 1];
    w.status.textContent = `${medal} 第 ${p} 名！💰 +${fmt(bells)}`;
    toast(`🏃 賽跑第 ${p} 名 ${medal}，拿到 💰 ${fmt(bells)}`);
    go.disabled = true;
    gameButtons(w, openRunGame);
  }
  openRunGame.test = { tap, tick, me: () => me, mates, place, finish, level: L, skipCountdown: () => { countdown = 0; } };

  const LANE_H = 50, TOP = 40, X0 = 30, X1 = W - 30;
  const xOf = d => X0 + (X1 - X0) * d / RUN_LEN;
  function frame(now) {
    now = now || performance.now();
    const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now;
    tick(dt);
    bounce = Math.max(0, bounce - dt * 6);
    // 跑道：深藍淺藍交錯、白線分道，兩邊是草地
    g.fillStyle = '#5fae6f'; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 4; i++) { g.fillStyle = i % 2 ? '#4a9be8' : '#2f6fd1'; g.fillRect(0, TOP + i * LANE_H, W, LANE_H); }
    g.fillStyle = '#ffffff';
    for (let i = 0; i <= 4; i++) g.fillRect(0, TOP + i * LANE_H - 1, W, 2);
    g.fillRect(X0 - 1, TOP, 3, LANE_H * 4);                                  // 起跑線
    for (let y = 0; y < LANE_H * 4; y += 8) for (let k = 0; k < 2; k++) {     // 終點：黑白格
      g.fillStyle = (y / 8 + k) % 2 ? '#222' : '#fff'; g.fillRect(X1 + k * 5, TOP + y, 5, 8);
    }
    // 同學（上面三道）和自己（最下面一道）
    mates.forEach((m, i) => {
      g.save(); g.translate(xOf(m.x), TOP + i * LANE_H + LANE_H - 8); g.scale(.85, .85);
      drawNeighbor(g, m.n, { happy: m.x >= RUN_LEN, fx: 1.5, clean: 100 });
      g.restore();
    });
    g.save(); g.translate(xOf(me), TOP + 3 * LANE_H + LANE_H - 6 - bounce * 4); g.scale(.62, .62);
    const outfit = {}; OUTFIT_SLOTS.forEach(({ key }) => { outfit[key] = CLOTHES_BY_ID[G.outfit[key]]; });
    drawGirl(g, { t: now / 1000, walking: countdown <= 0 && !ended, outfit, hair: G.hair });
    g.restore();
    // 倒數
    g.textAlign = 'center'; g.textBaseline = 'middle';
    if (countdown > 0) {
      g.fillStyle = 'rgba(255,255,255,.92)'; g.font = 'bold 56px sans-serif';
      g.fillText(String(Math.ceil(countdown)), W / 2, H / 2);
    } else if (t < .6) { g.fillStyle = '#ffd35c'; g.font = 'bold 44px sans-serif'; g.fillText('開始！', W / 2, H / 2); }
    g.textAlign = 'start'; g.textBaseline = 'alphabetic';
    if (!ended) w.status.textContent = countdown > 0 ? '準備…' : `${L.name}　點「跑！」一直跑！`;
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
}

/* ===== 📷 公園拍蝴蝶 =====
   蝴蝶在花叢裡飛來飛去，點一下就「喀嚓」拍一張；點到蜜蜂會被嚇一跳（扣一張）。
   公園的花不能摘、蝴蝶也不抓——用拍照的，拍完牠還是自由的。
   蝴蝶有六種顏色，拍過的會記在「蝴蝶相簿」，彩虹蝴蝶很少見。 */
const BUTTERFLIES = [
  { id: 'red',    name: '紅蝴蝶', c: '#e8505b', c2: '#ffb3b8', w: 22 },
  { id: 'yellow', name: '黃蝴蝶', c: '#ffcf3a', c2: '#fff1a8', w: 22 },
  { id: 'blue',   name: '藍蝴蝶', c: '#3f8ee0', c2: '#a9d4ff', w: 18 },
  { id: 'purple', name: '紫蝴蝶', c: '#9b6ad8', c2: '#dcc8ff', w: 16 },
  { id: 'white',  name: '白蝴蝶', c: '#f4f4f0', c2: '#ffffff', w: 16 },
  { id: 'rainbow', name: '彩虹蝴蝶', c: 'rainbow', c2: '#ffffff', w: 6 }
];
const BFLY_LEVELS = [
  { name: '慢慢飛', n: 3, speed: 50, bee: 1, mul: 1 },
  { name: '普通',   n: 4, speed: 80, bee: 2, mul: 2 },
  { name: '飛好快！', n: 5, speed: 115, bee: 3, mul: 3 }
];
function pickButterfly() {
  let r = Math.random() * BUTTERFLIES.reduce((a, b) => a + b.w, 0);
  return BUTTERFLIES.find(b => (r -= b.w) < 0) || BUTTERFLIES[0];
}
function drawButterfly(g, x, y, sp, flap, s) {
  g.save(); g.translate(x, y); g.scale(s || 1, s || 1);
  const open = .35 + .65 * Math.abs(Math.sin(flap));
  const col = sp.c === 'rainbow' ? (() => { const gr = g.createLinearGradient(-14, 0, 14, 0); ['#e8505b', '#ffcf3a', '#7bd389', '#3f8ee0', '#9b6ad8'].forEach((c, i) => gr.addColorStop(i / 4, c)); return gr; })() : sp.c;
  [-1, 1].forEach(side => {
    g.fillStyle = col; g.strokeStyle = 'rgba(60,40,40,.45)'; g.lineWidth = 1;
    g.beginPath(); g.ellipse(side * 7 * open, -4, 8 * open, 7, side * .5, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = sp.c2;
    g.beginPath(); g.ellipse(side * 5 * open, 5, 5 * open, 4.5, -side * .4, 0, Math.PI * 2); g.fill(); g.stroke();
  });
  g.fillStyle = '#3a3240'; g.fillRect(-1.3, -8, 2.6, 16);
  g.strokeStyle = '#3a3240'; g.beginPath(); g.moveTo(0, -8); g.lineTo(-4, -13); g.moveTo(0, -8); g.lineTo(4, -13); g.stroke();
  g.restore();
}
function openButterflyGame() {
  const w = openGameWindow('📷 拍蝴蝶', '點蝴蝶就會拍一張照片！小心不要點到蜜蜂 🐝。30 秒內拍越多越好，拍到新的蝴蝶會放進相簿。');
  pickLevelRow(w, BFLY_LEVELS, L => `一張 💰 ${15 * L.mul}`, L => playButterfly(w, L));
}
function playButterfly(w, L) {
  w.stage.innerHTML = '';
  const W = 340, H = 340, { c, g, pos } = gameCanvas(w.stage, W, H);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const spawn = bee => ({ bee, sp: bee ? null : pickButterfly(), x: rnd(30, W - 30), y: rnd(40, H - 70),
    vx: rnd(-1, 1), vy: rnd(-1, 1), flap: rnd(0, 6), turn: 0 });
  let things = [], photos = 0, left = 30, ended = false, raf = 0, last = performance.now(), flash = 0, oops = 0, timers = [];
  const got = {};
  for (let i = 0; i < L.n; i++) things.push(spawn(false));
  for (let i = 0; i < L.bee; i++) things.push(spawn(true));
  gameCleanup = () => { cancelAnimationFrame(raf); timers.forEach(t => clearInterval(t)); };

  function shoot(px, py) {
    if (ended) return;
    // 點最近的那一隻（手指比較粗，範圍給大一點）
    let best = null, bd = 30 * 30;
    things.forEach(t => { const d = (t.x - px) ** 2 + (t.y - py) ** 2; if (d < bd) { bd = d; best = t; } });
    if (!best) return;
    if (best.bee) { photos = Math.max(0, photos - 1); oops = 1; Sound.play('bad'); }
    else {
      photos++; flash = 1; Sound.play('pickUp');
      got[best.sp.id] = (got[best.sp.id] || 0) + 1;
    }
    Object.assign(best, spawn(best.bee), { x: Math.random() < .5 ? -20 : W + 20 }); // 拍完飛走，換一隻從旁邊飛進來
  }
  c.addEventListener('pointerdown', e => { const p = pos(e); shoot(p.x, p.y); });
  function finish() {
    if (ended) return;
    ended = true;
    gameCleanup();
    const album = G.butterflies = G.butterflies || {};
    const fresh = Object.keys(got).filter(id => !album[id]);
    Object.keys(got).forEach(id => { album[id] = (album[id] || 0) + got[id]; });
    const bells = payReward(w, photos * 15 * L.mul);
    const names = fresh.map(id => BUTTERFLIES.find(b => b.id === id).name);
    w.status.textContent = `拍了 ${photos} 張！💰 +${fmt(bells)}${names.length ? `　✨ 新的：${names.join('、')}` : ''}`;
    toast(`📷 拍了 ${photos} 張蝴蝶，蝴蝶相簿 ${Object.keys(album).length} / ${BUTTERFLIES.length}`);
    gameButtons(w, openButterflyGame);
  }
  openButterflyGame.test = { things: () => things, shoot, finish, photos: () => photos, got, level: L };
  timers.push(setInterval(() => { if (ended) return; left--; if (left <= 0) finish(); }, 1000));

  function frame(now) {
    const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now;
    if (!ended) things.forEach(t => {
      t.turn -= dt;
      if (t.turn <= 0) { t.turn = rnd(.4, 1.2); const a = rnd(0, Math.PI * 2); t.vx = Math.cos(a); t.vy = Math.sin(a); }
      t.x += t.vx * L.speed * dt; t.y += t.vy * L.speed * dt * .7;
      if (t.x < 20) t.vx = Math.abs(t.vx); if (t.x > W - 20) t.vx = -Math.abs(t.vx);
      if (t.y < 30) t.vy = Math.abs(t.vy); if (t.y > H - 70) t.vy = -Math.abs(t.vy);
      t.flap += dt * (t.bee ? 30 : 12);
    });
    flash = Math.max(0, flash - dt * 4); oops = Math.max(0, oops - dt * 2);
    // 公園的草地和花叢
    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#d9f1ff'); sky.addColorStop(.7, '#eaf8df'); sky.addColorStop(1, '#bfe3a8');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    g.fillStyle = '#8fc27a'; g.fillRect(0, H - 60, W, 60);
    ['#e8505b', '#ffd35c', '#ff9ec4', '#b18cff', '#ffffff', '#ffa53a'].forEach((col, i) => {
      for (let k = 0; k < 4; k++) {
        const fx = 14 + i * 56 + k * 13, fy = H - 40 + (k % 2) * 14;
        g.strokeStyle = '#4f9150'; g.lineWidth = 2; g.beginPath(); g.moveTo(fx, fy); g.lineTo(fx, fy + 18); g.stroke();
        g.fillStyle = col; g.beginPath(); g.arc(fx, fy, 5, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#ffd35c'; g.beginPath(); g.arc(fx, fy, 1.8, 0, Math.PI * 2); g.fill();
      }
    });
    things.forEach(t => {
      if (t.bee) {
        g.font = '24px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText('🐝', t.x, t.y + Math.sin(t.flap) * 1.5);
        g.textAlign = 'start'; g.textBaseline = 'alphabetic';
      } else drawButterfly(g, t.x, t.y, t.sp, t.flap, 1.2);
    });
    if (flash > 0) { g.fillStyle = `rgba(255,255,255,${flash * .7})`; g.fillRect(0, 0, W, H); }
    if (oops > 0) { g.fillStyle = `rgba(232,80,91,${oops * .25})`; g.fillRect(0, 0, W, H); }
    w.status.textContent = ended ? w.status.textContent : `${L.name}　還有 ${left} 秒　📷 ${photos} 張`;
    if (!ended) raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
}

function openStorybook(id) {
  const book = STORYBOOKS.find(b => b.id === id) || STORYBOOKS[Math.floor(Math.random() * STORYBOOKS.length)];
  let page = -1, readAloud = false; // -1 是封面
  const card = $('#modalCard');
  function show() {
    card.innerHTML = '';
    const pg = el('div', 'book-page');
    if (page < 0) {
      pg.append(el('div', 'book-pic', book.cover), el('div', 'book-title', `📖 ${book.title}`));
    } else {
      const [pic, text] = book.pages[page];
      pg.append(el('div', 'book-pic', pic), el('div', 'book-txt', text), el('div', 'book-no', `${page + 1} / ${book.pages.length}`));
    }
    card.appendChild(pg);
    const row = el('div', 'book-btns');
    if (page >= 0) { const prev = el('button', 'big alt', '⬅️'); prev.onclick = () => { page--; show(); }; row.appendChild(prev); }
    // 🔊 聽故事：妹妹還不太認字。按過一次之後，翻頁會自動念下一頁
    const pageText = page < 0 ? book.title : book.pages[page][1];
    if (canSpeak()) {
      const say = el('button', 'big alt book-say', '🔊');
      say.title = '聽故事';
      say.onclick = () => { readAloud = true; speak(pageText); };
      row.appendChild(say);
      if (readAloud) speak(pageText);
    }
    const last = page === book.pages.length - 1;
    const next = el('button', 'big', last ? '看完了！' : page < 0 ? '翻開 ➡️' : '➡️');
    next.onclick = () => { if (last) finishBook(book); else { page++; Sound.play('click'); show(); } };
    row.appendChild(next);
    card.appendChild(row);
    $('#modal').hidden = false;
  }
  openStorybook.test = { book, next: () => card.querySelector('.book-btns button:last-child').onclick(), page: () => page };
  show();
}
// 念出來（iPad／iPhone 都有內建中文語音）。不支援的機器就不顯示按鈕
const canSpeak = () => typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
function speak(text) {
  if (!canSpeak()) return false;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/[「」]/g, ''));
    u.lang = 'zh-TW'; u.rate = .9; u.pitch = 1.1;
    speechSynthesis.speak(u);
    return true;
  } catch (e) { return false; }
}
// 看完最後一頁才蓋章（翻一半就關掉不算）
function finishBook(book) {
  const pass = G.passport = G.passport || {};
  const isNew = !pass[book.id];
  pass[book.id] = (pass[book.id] || 0) + 1;
  const n = Object.keys(pass).length;
  if (isNew && n === STORYBOOKS.length) { // 八本都看完：館員送獎狀

    toast('🏅 閱讀護照蓋滿了！館員送你一張獎狀（放進「我的東西」了）');
  } else toast(isNew ? `📗 閱讀護照蓋了一個新章！（${n} / ${STORYBOOKS.length}）` : '📗 這本看過了，再看一次也很好看');
  Sound.play('coin');
  saveGame();
  openPassport();
}
