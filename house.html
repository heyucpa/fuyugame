<style>
:root {
  --bg: #f4efe3;
  --panel: #fffaf0;
  --ink: #4a3b2a;
  --muted: #8b7a64;
  --line: #e4d8c3;
  --accent: #5fae7c;
  --accent-ink: #fff;
  --warn: #d0664f;
  --chip: #f1e7d4;
  --sky1: #bfe6f2;
  --sky2: #e8f5e4;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  display: flex; flex-direction: column;
}
button { font: inherit; color: inherit; cursor: pointer; }

.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: var(--panel); border-bottom: 2px solid var(--line);
  flex-wrap: wrap;
}
.brand { font-weight: 800; font-size: 18px; }
.rooms { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
.rooms button {
  border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 12px; white-space: nowrap;
}
.rooms button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rooms button.go { border-style: dashed; border-color: #e7a94a; color: #a26d12; background: #fff6df; }
/* 出門選單 */
.place-pick {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; margin: 8px 0; padding: 8px 12px;
  border: 2px solid var(--line); border-radius: 14px; background: #fff;
}
.place-pick:hover { border-color: var(--accent); }
.place-txt { display: flex; flex-direction: column; gap: 2px; }
.place-txt b { font-size: 16px; }
.place-txt span { font-size: 13px; color: var(--muted); }
/* 照顧小牛小羊：工具按鈕 */
.farm-tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.farm-tool { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 4px; font-size: 16px; font-weight: 700; }
.farm-tool.on { border-color: var(--accent); background: #e8f6ec; box-shadow: 0 0 0 2px var(--accent) inset; }
/* 搖樹剩幾次 */
.tree-left { text-align: center; font-size: 14px; color: var(--muted); margin: -4px 0 8px; }
.stats { display: flex; gap: 8px; }
.pill { background: var(--chip); border-radius: 999px; padding: 4px 12px; font-size: 15px; }
.pill b { font-variant-numeric: tabular-nums; }
.pill.sound { border: none; cursor: pointer; padding: 4px 10px; position: relative; }
.pill.sound.off { opacity: .45; }
.pill.sound.off::after { /* 關閉時畫一條斜線 */
  content: ""; position: absolute; left: 8px; right: 8px; top: 50%; height: 2px;
  background: var(--warn); transform: rotate(-35deg);
}
.pill.sound:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bells b.bump { animation: bump .4s; display: inline-block; }
@keyframes bump { 40% { transform: scale(1.35); color: #d18a00; } }

.layout { flex: 1; display: flex; min-height: 0; }
.panel {
  width: 320px; background: var(--panel); border-right: 2px solid var(--line);
  display: flex; flex-direction: column; min-height: 0;
}
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 10px; }
.tabs button {
  border: none; background: var(--chip); border-radius: 10px; padding: 6px 0; font-size: 13px; white-space: nowrap;
  /* 圖示放在字的「上面」，不是同一行：妹妹還不認得國字，圖示要夠大才看得懂，
     但擠在同一行的話「壁紙地板」四個字加圖示在 360 寬會爆版 */
  display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.25;
}
.tabs .ti { font-size: 19px; line-height: 1.15; }
@media (max-width: 420px) { .tabs .ti { font-size: 17px; } }
.tabs button.on { background: var(--ink); color: #fff; }
.tabbody { flex: 1; overflow-y: auto; padding: 0 10px 16px; }
.tabbody h3 { margin: 14px 2px 6px; font-size: 14px; color: var(--muted); font-weight: 600; }
.tabbody p.note { margin: 4px 2px 10px; font-size: 13px; color: var(--muted); line-height: 1.6; }

.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.card canvas, .card img { max-width: 100%; height: auto; }
.card {
  background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 6px 4px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center;
  position: relative;
}
.card:hover { border-color: var(--accent); }
.card.dim { opacity: .5; }
.card .nm { font-size: 12px; line-height: 1.3; }
.card .pr { font-size: 11px; color: var(--muted); }
.card .ct {
  position: absolute; top: 4px; right: 4px; background: var(--accent); color: #fff;
  border-radius: 999px; font-size: 11px; padding: 0 6px;
}
.card .tag {
  position: absolute; top: 4px; left: 4px; font-size: 10px; color: var(--muted);
}
.card .emoji { font-size: 36px; line-height: 64px; height: 64px; }
.card.cur { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
/* 換裝分頁 */
.dress-head { display: flex; gap: 12px; align-items: center; margin: 10px 0 4px; }
.dress-preview {
  flex: none; width: 128px; height: 158px; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 60%, #fff 0 55%, var(--chip) 56%); border-radius: 16px;
}
.dress-side h3 { margin-top: 0; }
.dress-side .mini { margin-top: 2px; }
/* 寵物分頁 */
.pet-head { display: flex; gap: 12px; align-items: center; margin: 10px 0 4px; }
.pet-portrait {
  flex: none; width: 118px; height: 108px; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 65%, #fff 0 52%, #ffe9f0 53%); border-radius: 16px;
}
.pet-info { flex: 1; min-width: 0; }
.pet-name { font-size: 17px; font-weight: 800; }
.pet-kind { font-size: 13px; color: var(--muted); margin: 2px 0 8px; }
.grow-bar { height: 10px; background: #efe4d0; border-radius: 999px; overflow: hidden; }
.grow-bar b { display: block; height: 100%; background: linear-gradient(90deg, #ffb3c7, #ff7fa3); border-radius: 999px; }
.grow-text { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.5; }
.card.dex { cursor: default; }
.card.comp { border-color: #8fc97a; }
/* 卡片只有 80～95px 寬（手機、還有 iPad 橫向時左欄只有 320），
   裡面的小按鈕一定要能換行，不然字一長就把整個格子撐出畫面 */
.card .mini { white-space: normal; word-break: break-word; max-width: 100%; }
.card .tag.new { background: #e8505b; color: #fff; border-radius: 999px; padding: 0 6px; font-weight: 700; }
.card .mini { margin-top: 3px; padding: 3px 8px; white-space: nowrap; }
.card .mini:disabled { opacity: .45; }
.card canvas.sw { width: 56px; height: 56px; border-radius: 8px; margin: 4px 0; }
.filter { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; }
.filter button { border: none; background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
.filter button.on { background: var(--accent); color: #fff; }
/* 用途那一排：圖示放在字前面，按鈕加大一點（小孩手指不準），
   而且是她最常用的那一排，視覺上要比風格那排明顯 */
.filter.kinds button { padding: 5px 11px; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
.filter.kinds .fi { font-size: 15px; line-height: 1; }
/* 風格那一排是次要的：小一點、前面加一個標籤說明這排在幹嘛 */
.filter.themes { margin-top: 2px; align-items: center; }
.filter.themes button { font-size: 11.5px; padding: 2px 9px; }
.flabel { font-size: 11.5px; color: var(--muted); margin-right: 2px; }

.big {
  display: block; width: 100%; border: none; border-radius: 12px; padding: 12px;
  background: var(--accent); color: #fff; font-weight: 700; font-size: 15px; margin: 8px 0;
}
.big.alt { background: #e7a94a; }
.big.warnbtn { background: var(--warn); }
.big:disabled, .big.alt:disabled { background: #cfc6b6; cursor: not-allowed; } /* 錢不夠時按鈕變灰 */
/* 賣回商店 */
.sellbtn {
  display: block; width: 100%; margin: 10px 0 2px; padding: 8px; border-radius: 12px;
  border: 2px dashed #d9b36a; background: #fff6df; color: #8a6420; font-weight: 700; font-size: 14px;
}
.sellbtn.on { border-style: solid; background: #e7a94a; border-color: #e7a94a; color: #fff; }
.card.sellable { border-color: #e7c27a; }
.card.sellable .pr { color: #a26d12; font-weight: 700; }
.sell-q { font-size: 17px; font-weight: 700; margin: 6px 0 10px; }
.sell-info { background: var(--chip); border-radius: 12px; padding: 10px; line-height: 1.9; font-size: 15px; }
.sell-info .muted { color: var(--muted); font-size: 13px; }
/* 小遊戲 */
.game-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.game-pick {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px;
  border: 2px solid var(--line); border-radius: 14px; background: #fff; font-size: 13px; font-weight: 600;
}
.game-pick:hover { border-color: var(--accent); }
.game-pick .gi { font-size: 30px; line-height: 1; }
.modal-card.game-card { width: min(440px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; }
.game-stage { margin: 8px 0; }
.game-canvas { width: 100%; max-width: 100%; display: block; border-radius: 14px; touch-action: none; }
.game-status { font-weight: 700; min-height: 1.5em; margin: 6px 0; }
.game-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.game-btns .big { margin: 0; }
.memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.memory-card {
  aspect-ratio: 1; border: none; border-radius: 12px; font-size: 30px;
  background: repeating-linear-gradient(45deg, #ffc2d6 0 8px, #ffb3c7 8px 16px);
  box-shadow: 0 3px 0 rgba(0,0,0,.12); transition: transform .15s;
}
.memory-card.open { background: #fff; transform: rotateY(0); }
.memory-card.done { background: #dff5e3; opacity: .8; }
.simon-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.simon-pad {
  aspect-ratio: 1; border: none; border-radius: 22px; font-size: 52px;
  box-shadow: 0 5px 0 rgba(0,0,0,.14); filter: saturate(.75) brightness(.97);
  transition: transform .08s, filter .08s, box-shadow .08s;
}
.simon-pad.lit { filter: saturate(1.3) brightness(1.12); transform: translateY(3px) scale(1.04); box-shadow: 0 0 0 5px #fff, 0 0 18px 6px rgba(255,255,255,.9); }
@media (prefers-reduced-motion: reduce) { .simon-pad { transition: none; } }
/* 存檔格：一列一間房子 */
.slotrow {
  display: flex; align-items: center; gap: 10px; margin: 6px 0;
  padding: 9px 11px; border: 2px solid var(--line); border-radius: 12px; background: #fff;
}
.slotrow.on { border-color: var(--accent); background: #f1faf3; }
.slotmain { flex: 1; min-width: 0; }
.slotname { font-weight: 800; font-size: 14px; }
.slotrow.on .slotname { color: var(--accent); }
.slotsub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.slotrow .mini { flex: 0 0 auto; margin-top: 0; }

/* 選檔案匯入：原生的 file input 在 iPad 上又小又醜，包成一塊好按的虛線框 */
.fileopen {
  display: block; width: 100%; margin: 0 0 8px; padding: 10px;
  border: 2px dashed var(--line); border-radius: 12px; background: #fff;
  font: inherit; font-size: 13px; color: var(--muted);
}
.fileopen::file-selector-button {
  font: inherit; font-size: 13px; font-weight: 700; margin-right: 10px;
  padding: 6px 12px; border: none; border-radius: 999px;
  background: var(--chip); color: var(--ink); cursor: pointer;
}
.textin, .talkbox {
  width: 100%; border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px;
  font: inherit; font-size: 14px; color: var(--ink); background: #fff; resize: vertical;
}
.textin:focus, .talkbox:focus { outline: none; border-color: var(--accent); }
.talkbox.locked { background: #f4f1ea; color: var(--muted); border-style: dashed; }
/* 髮色色票：圓形、夠大好按（小孩手指不準），選中的加一圈深色外框 */
.hair-colors { display: flex; flex-wrap: wrap; gap: 10px; padding: 4px 2px 2px; }
.swatch {
  width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff;
  box-shadow: 0 0 0 2px var(--line); padding: 0;
}
.swatch.on { box-shadow: 0 0 0 3px var(--ink); }
/* 拼圖：難度選單與拼盤 */
/* 釣魚：水面的影子。越大的魚字越大越醒目，她一看就知道這竿值得拚 */
.fish-shadow { text-align: center; font-weight: 800; margin: 4px 0 8px; color: #2f6f8f; font-size: 15px; }
.fish-shadow[data-tier="2"] { color: #c9772e; font-size: 17px; }
.fish-shadow[data-tier="3"] { color: #d0453a; font-size: 19px; }

/* 打地鼠：九個洞，洞要夠大好點（小一的手指） */
.mole-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: 6px auto; }
.mole-hole { aspect-ratio: 1; border: none; border-radius: 50%; font-size: 40px; line-height: 1;
  background: radial-gradient(ellipse at 50% 70%, #5a3d22 0 45%, #8a6a45 46% 100%); }
.mole-hole.up { background: radial-gradient(ellipse at 50% 70%, #5a3d22 0 45%, #c9a06a 46% 100%); }

/* 換房間的門：關著的兩扇門往兩邊打開（不擋點擊） */
.room-doors { position: absolute; inset: 0; z-index: 25; pointer-events: none; display: flex; overflow: hidden; }
.room-doors .door { flex: 1; position: relative;
  background: repeating-linear-gradient(90deg, #c99a66 0 22px, #bb8b58 22px 24px);
  box-shadow: inset 0 0 0 4px #8a5a33; animation: doorL .6s ease-in .3s forwards; }
.room-doors .door.r { animation-name: doorR; }
.room-doors .door::after { content: ''; position: absolute; top: 64%; width: 10px; height: 10px; border-radius: 50%; background: #ffd35c; box-shadow: 0 0 0 2px #8a5a33; }
.room-doors .door.l::after { right: 12px; }
.room-doors .door.r::after { left: 12px; }
.room-doors .door-name { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  background: #fffaf0; border: 3px solid #8a5a33; border-radius: 14px; padding: 8px 16px;
  font-size: 20px; font-weight: 800; color: #4a3b2a; white-space: nowrap; animation: doorName .25s ease-in .3s forwards; }
@keyframes doorL { to { transform: translateX(-100%); } }
@keyframes doorR { to { transform: translateX(100%); } }
@keyframes doorName { to { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .room-doors { display: none; } }
.place-pick.here { opacity: .55; }
.place-emoji { width: 64px; height: 58px; display: flex; align-items: center; justify-content: center; font-size: 40px; flex: none; }

/* 出門的過場：蓋在房間畫面上，點一下跳過 */
.trip {
  position: absolute; inset: 0; z-index: 30; display: flex;
  flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background: rgba(20,16,12,.45); cursor: pointer;
}
.trip-canvas { width: min(92%, 420px); aspect-ratio: 3 / 2; border-radius: 16px;
  box-shadow: 0 10px 28px rgba(0,0,0,.3); background: #bfe6f2; }
.trip-tip { font-size: 13px; font-weight: 700;
  color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5); }

.comic { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0 10px; }
.comic-p { border: 3px solid #4a3b2a; border-radius: 10px; background: #fffdf6; padding: 8px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0;
  opacity: 0; animation: comicIn .4s ease forwards; }
.comic-pic { font-size: 38px; line-height: 1.15; }
.comic-txt { font-size: 14px; font-weight: 700; text-align: center; }
@media (prefers-reduced-motion: reduce) { .comic-p { animation: none; opacity: 1; } }
@keyframes comicIn { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
.run-go { display: block; margin: 10px auto 0; font-size: 22px; padding: 14px 48px; touch-action: manipulation; }
.quiz { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 6px 0; }
.quiz-q { font-size: 34px; font-weight: 800; color: #4a3b2a; letter-spacing: 1px; }
.quiz-pics { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; font-size: 24px; min-height: 30px; max-width: 320px; }
.quiz-pics .gone { opacity: .22; }
.quiz-pics .plus { font-weight: 800; color: var(--muted); padding: 0 4px; }
.quiz-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(100%, 320px); }
.quiz-c { font-size: 26px; font-weight: 800; padding: 14px 0; border-radius: 14px; border: 2px solid var(--line); background: #fff; }
.quiz-c.right { background: #d9f3df; border-color: #5fae7c; }
.quiz-c.wrong { background: #fde0e0; border-color: #e8505b; }
.quiz-end { font-size: 72px; text-align: center; }
.sticker-big { font-size: 72px; text-align: center; animation: comicIn .4s ease; }
.sticker-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 8px 0; }
.sticker { font-size: 26px; text-align: center; background: #fffaf0; border: 2px solid var(--line); border-radius: 12px; padding: 4px 0; }
.sticker.none { color: #c8bfae; font-size: 18px; font-weight: 800; padding: 8px 0; }
.bfly-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0; }
.bfly { display: flex; flex-direction: column; align-items: center; gap: 2px; background: #fffaf0; border: 2px solid var(--line); border-radius: 12px; padding: 6px 2px; min-width: 0; }
.bfly canvas { width: 64px; height: 52px; }
.bfly span { font-size: 12px; color: var(--muted); }
.bfly.none b { font-size: 28px; color: #c8bfae; line-height: 52px; }
.book-page { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 8px 10px;
  background: #fffdf6; border: 3px solid #e2c79c; border-radius: 16px; min-height: 230px; justify-content: center; }
.book-pic { font-size: 84px; line-height: 1.1; }
.book-title { font-size: 24px; font-weight: 800; color: #4a3b2a; }
.book-txt { font-size: 22px; font-weight: 700; color: #4a3b2a; text-align: center; line-height: 1.5; }
.book-no { font-size: 13px; color: var(--muted); }
.book-btns { display: flex; gap: 10px; margin-top: 12px; }
.book-btns button { flex: 1; font-size: 20px; }
.pass-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0; }

// 遊戲資料：家具、壁紙、地板、魚、擴建價格
// 家具 parts 單位：x/y/w/d 為格數（可小數），z/h 為像素高度
'use strict';

function schoolDeskParts(bag) {
  return [
    { x: .14, y: .2, w: .08, d: .08, z: 0, h: 26, c: '#8a5a33' },
    { x: .78, y: .2, w: .08, d: .08, z: 0, h: 26, c: '#8a5a33' },
    { x: .14, y: .72, w: .08, d: .08, z: 0, h: 26, c: '#8a5a33' },
    { x: .78, y: .72, w: .08, d: .08, z: 0, h: 26, c: '#8a5a33' },
    { x: .1, y: .16, w: .8, d: .68, z: 18, h: 6, c: '#a8784a' },      // 抽屜
    { x: .08, y: .14, w: .84, d: .72, z: 24, h: 2, c: '#a8784a' },     // 桌面木框
    { x: .08, y: .14, w: .84, d: .72, z: 26, h: 2, c: '#2f9e7a' },     // 綠色桌墊
    { x: .3, y: .62, w: .4, d: .07, z: 28, h: 5, c: '#ffffff' },       // 空白名牌
    { x: .93, y: .32, w: .06, d: .3, z: 6, h: 14, c: bag }             // 掛在桌邊的布袋
  ];
}
function chairParts(c) {
  return [
    { x: .25, y: .25, w: .5, d: .5, z: 0, h: 18, c: c.leg },
    { x: .18, y: .18, w: .64, d: .64, z: 18, h: 6, c: c.seat },
    { x: .18, y: .12, w: .64, d: .12, z: 18, h: 36, c: c.back }
  ];
}
function tableParts(c, w, d) {
  const L = .12, p = [];
  [[.1, .1], [w - .22, .1], [.1, d - .22], [w - .22, d - .22]].forEach(([x, y]) =>
    p.push({ x, y, w: L, d: L, z: 0, h: 30, c: c.leg }));
  p.push({ x: .04, y: .04, w: w - .08, d: d - .08, z: 30, h: 6, c: c.top });
  return p;
}
function bedParts(c) {
  return [
    { x: 0, y: 0, w: 2, d: .16, z: 0, h: 52, c: c.frame },
    { x: 0, y: .16, w: 2, d: 2.84, z: 0, h: 16, c: c.frame },
    { x: .08, y: .2, w: 1.84, d: 2.72, z: 16, h: 10, c: '#fbf7ee' },
    { x: .3, y: .3, w: 1.4, d: .55, z: 26, h: 8, c: c.pillow },
    { x: .06, y: 1.1, w: 1.88, d: 1.84, z: 22, h: 8, c: c.blanket, cover: true }
  ];
}
function sofaParts(c) {
  return [
    { x: 0, y: .1, w: 3, d: .9, z: 0, h: 20, c: c.base },
    { x: 0, y: 0, w: 3, d: .3, z: 0, h: 46, c: c.base },
    { x: 0, y: .1, w: .32, d: .9, z: 0, h: 32, c: c.base },
    { x: 2.68, y: .1, w: .32, d: .9, z: 0, h: 32, c: c.base },
    { x: .34, y: .32, w: 1.14, d: .64, z: 20, h: 8, c: c.cushion },
    { x: 1.52, y: .32, w: 1.14, d: .64, z: 20, h: 8, c: c.cushion }
  ];
}
function plantParts(pot, leaf, size) {
  const s = size || 1;
  return [
    { x: .3, y: .3, w: .4, d: .4, z: 0, h: 20, c: pot },
    { k: 'ball', x: .5, y: .5, z: 20 + 22 * s, r: 18 * s, c: leaf }

}

const FURNITURE = [
  // ── 原木系 ──
  { id: 'wood_chair', name: '原木椅', price: 800, theme: 'wood', w: 1, d: 1,
    parts: chairParts({ leg: '#8a5a33', seat: '#c68b52', back: '#b07843' }) },

  { id: 'wood_bed', name: '原木床', price: 4500, theme: 'wood', w: 2, d: 3,
    parts: bedParts({ frame: '#9b6a3e', pillow: '#fff', blanket: '#7fae6e' }) },

// ── 牆面掛飾：draw(ctx, W, H) 用一般 2D 座標畫在 W×H 的方框內；w 為佔幾格寬，h 高度、z 離地高度（像素）──
function frameRect(ctx, W, H, color) {
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, W, H);
}
const WALL_DECOR = [
  { id: 'art_mountain', name: '山景畫', price: 1200, theme: 'nature', w: 1, h: 26, z: 58,

      ctx.fillStyle = '#ffd35c'; ctx.beginPath(); ctx.arc(W - 9, 9, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#6aa865'; ctx.beginPath(); ctx.moveTo(3, H - 3); ctx.lineTo(12, 9); ctx.lineTo(20, H - 3); ctx.fill();
      ctx.fillStyle = '#4f8c4f'; ctx.beginPath(); ctx.moveTo(12, H - 3); ctx.lineTo(22, 12); ctx.lineTo(W - 3, H - 3); ctx.fill();
    } },

    draw(ctx, W, H) {

      ctx.fillStyle = '#fff4f8'; ctx.fillRect(3, 3, W - 6, H - 6);
      ctx.fillStyle = '#7fb069'; ctx.fillRect(W / 2 - .7, 10, 1.4, H - 14);
      [[W / 2, 9, '#ff8fb3'], [W / 2 - 6, 13, '#ffd35c'], [W / 2 + 6, 13, '#9ec9ff']].forEach(([x, y, c]) => {
        ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, 3.2, 0, Math.PI * 2); ctx.fill();

  { id: 'wall_clock', name: '掛鐘', price: 1500, theme: 'wood', w: 1, h: 28, z: 70,
    draw(ctx, W, H) { // 顯示真實時間
      const r = Math.min(W, H) / 2 - 1, cx = W / 2, cy = H / 2, now = new Date();
      ctx.fillStyle = '#8a5a33'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fbf7ee'; ctx.beginPath(); ctx.arc(cx, cy, r - 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8a5a33';
      for (let i = 0; i < 12; i += 3) { const a = i / 12 * Math.PI * 2; ctx.fillRect(cx + Math.sin(a) * (r - 5) - .6, cy - Math.cos(a) * (r - 5) - .6, 1.2, 1.2); }
      const hand = (a, len, wdt, c) => {
        ctx.strokeStyle = c; ctx.lineWidth = wdt; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.sin(a) * len, cy - Math.cos(a) * len); ctx.stroke();
      };
      const m = now.getMinutes() + now.getSeconds() / 60, h = now.getHours() % 12 + m / 60;
      hand(h / 12 * Math.PI * 2, r * .45, 1.6, '#3a2e28');
      hand(m / 60 * Math.PI * 2, r * .7, 1.1, '#3a2e28');
    } },

      ['#ff6b6b', '#ffb84d', '#ffe066', '#7bd389', '#6bb6ff', '#b18cff'].forEach((c, i) => {
        ctx.strokeStyle = c; ctx.beginPath(); ctx.arc(W / 2, H - 3, 22 - i * 3, Math.PI, 0); ctx.stroke();
      });
      ctx.fillStyle = '#ffffff';
      [[W / 2 - 22, H - 4], [W / 2 + 22, H - 4]].forEach(([x, y]) => {
        ctx.beginPath(); ctx.arc(x - 3, y, 4, 0, Math.PI * 2); ctx.arc(x + 3, y, 4, 0, Math.PI * 2); ctx.arc(x, y - 3, 4, 0, Math.PI * 2); ctx.fill();

      ctx.strokeStyle = '#6b6b6b'; ctx.lineWidth = .8;
      ctx.beginPath(); ctx.moveTo(0, 2); ctx.quadraticCurveTo(W / 2, H + 2, W, 2); ctx.stroke();
      ['#ffe066', '#ff8fb3', '#9ec9ff', '#7bd389', '#ffb84d'].forEach((c, i) => {
        const u = (i + .5) / 5, x = u * W, y = 2 + 4 * u * (1 - u) * H * .9;
        ctx.globalAlpha = .55 + .45 * Math.max(0, Math.sin(t + i * 1.3));

})();

<script>
// 斜角 2.5D 繪圖
'use strict';

const TW = 64, TH = 32, WALL_H = 120;

function iso(gx, gy, z) {
  return { x: (gx - gy) * TW / 2, y: (gx + gy) * TH / 2 - (z || 0) };
}

function shade(hex, f) {
  let h = hex.slice(1);
  if (h.length === 3) h = h.split('').map(ch => ch + ch).join('');
  const n = parseInt(h, 16);
  const r = Math.min(255, Math.round(((n >> 16) & 255) * f));
  const g = Math.min(255, Math.round(((n >> 8) & 255) * f));
  const b = Math.min(255, Math.round((n & 255) * f));
  return `rgb(${r},${g},${b})`;
}

function poly(ctx, pts, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}

function drawBox(ctx, x, y, w, d, z, h, color) {
  const top = [iso(x, y, z + h), iso(x + w, y, z + h), iso(x + w, y + d, z + h), iso(x, y + d, z + h)];
  const line = 'rgba(40,30,20,.18)';
  if (h > 0) {
    poly(ctx, [iso(x, y + d, z), iso(x + w, y + d, z), iso(x + w, y + d, z + h), iso(x, y + d, z + h)], shade(color, .84), line);
    poly(ctx, [iso(x + w, y, z), iso(x + w, y + d, z), iso(x + w, y + d, z + h), iso(x + w, y, z + h)], shade(color, .7), line);
  }
  poly(ctx, top, color, line);
}

function drawBall(ctx, x, y, z, r, color) {
  const p = iso(x, y, z);
  ctx.beginPath();
  ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = 'rgba(40,30,20,.18)';
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(p.x - r * .35, p.y - r * .35, r * .3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.fill();
}

// ── 旋轉與排序 ──
// 轉 90 度：原本朝前（+y）的正面改朝右前（+x），第一次旋轉就看得到正面
function rotatePart(p, W) {
  if (p.k === 'ball') return Object.assign({}, p, { x: p.y, y: W - p.x });
  return Object.assign({}, p, { x: p.y, y: W - p.x - p.w, w: p.d, d: p.w });
}

const partCache = {};
function getParts(def, rot) {
  const key = def.id + ':' + rot;
  if (partCache[key]) return partCache[key];
  let parts = def.parts, W = def.w, D = def.d;
  for (let i = 0; i < rot; i++) {
    parts = parts.map(p => rotatePart(p, W));
    [W, D] = [D, W];
  }
  return (partCache[key] = sortBoxes(parts.map(toBounds)).map(b => b.src));
}

function toBounds(p) {
  if (p.k === 'ball') {
    const s = p.r / TW;
    return { x: p.x - s, y: p.y - s, w: s * 2, d: s * 2, z: p.z - p.r, h: p.r * 2, src: p };
  }
  return { x: p.x, y: p.y, w: p.w, d: p.d, z: p.z, h: p.h, src: p };
}

// A 是否整個在 B 後方（應先畫）
function isBehind(a, b) {
  const e = 1e-6;
  return a.x + a.w <= b.x + e || a.y + a.d <= b.y + e || a.z + a.h <= b.z + e;
}

function sortBoxes(list) {
  const rest = list.slice(), out = [];
  while (rest.length) {
    let idx = rest.findIndex(r => !rest.some(s => s !== r && isBehind(s, r) && !isBehind(r, s)));
    if (idx < 0) idx = 0;
    out.push(rest.splice(idx, 1)[0]);
  }
  return out;
}

function footprint(def, rot) {
  return rot % 2 ? { w: def.d, d: def.w } : { w: def.w, d: def.d };
}


/* ===== 桌上可以放一樣小東西 =====
   叔叔送的卡帶現在只能放地上，看起來像垃圾掉在那裡。

   一張桌子只放一樣——她提的這個限制是對的：
   自由擺放會疊在一起、會穿過桌面，小孩擺到一半就亂了；
   把桌面切成格子又太複雜，而且 1×1 的小桌子根本放不下。
   一張一個最簡單，而且一眼看得懂。 */
const TABLE_TOPS = ['wood_table', 'cute_table', 'lemon_table', 'dining_table',
                    'desk', 'pink_desk', 'lemon_desk',
                    'nightstand', 'pink_nightstand', 'lemon_nightstand',
                    'dresser', 'cupboard', 'kitchen'];
// 適合放桌上的小東西：本來就是 1×1，單獨佔一格地板反而奇怪
const ON_TABLE = ['game_cart', 'mini_figure', 'comic_book', 'robot_toy',
                  'plant_s', 'cactus', 'fishtank', 'globe'];
const canHaveTop = id => TABLE_TOPS.indexOf(id) >= 0;
const canSitOnTable = id => ON_TABLE.indexOf(id) >= 0;

/* 把桌上那樣東西的零件抬到桌面高度、擺在桌子中央，直接接在桌子的零件後面。
   這樣排前後、遮擋、縮圖全部沿用原本那一套，不用另外寫一套畫法。 */
function topParts(def, rot, it) {
  const topDef = it && it.top ? FURN_BY_ID[it.top] : null;
  if (!topDef) return [];
  const h = itemHeight(def);                       // 桌面高度
  const W = (rot % 2) ? def.d : def.w, D = (rot % 2) ? def.w : def.d;
  const dx = W / 2 - topDef.w / 2, dy = D / 2 - topDef.d / 2;
  return getParts(topDef, 0).map(pp =>
    Object.assign({}, pp, { x: pp.x + dx, y: pp.y + dy, z: pp.z + h }));
}

function itemHeight(def) {
  return def.parts.reduce((m, p) => Math.max(m, p.k === 'ball' ? p.z + p.r : p.z + p.h), 0);
}

function drawPart(ctx, p, gx, gy) {
  ctx.globalAlpha = (ctx.__baseAlpha || 1) * (p.a || 1);
  if (p.k === 'ball') drawBall(ctx, gx + p.x, gy + p.y, p.z, p.r, p.c);
  else drawBox(ctx, gx + p.x, gy + p.y, p.w, p.d, p.z, p.h, p.c);
  ctx.globalAlpha = ctx.__baseAlpha || 1;
}

// it 有給的時候（房間裡的家具），套用使用中的效果：螢幕閃、生火、碗盤…（itemLook 在 character.js）
function drawItem(ctx, def, gx, gy, rot, it) {
  let parts = it && typeof itemLook === 'function' ? itemLook(def, rot, it, getParts(def, rot)) : getParts(def, rot);
  if (it && it.top) parts = parts.concat(topParts(def, rot, it));
  parts.forEach(p => drawPart(ctx, p, gx, gy));
}
// 在未旋轉座標寫的額外零件，轉成家具目前的方向
function rotateParts(parts, def, rot) {
  let W = def.w, D = def.d;
  for (let i = 0; i < rot; i++) { parts = parts.map(p => rotatePart(p, W)); [W, D] = [D, W]; }
  return parts;
}

// 家具上有角色（坐著或躺著）：角色跟家具零件一起排前後
// occ: {pose:'sit'|'lie', lx, ly, z, draw(ctx)}，lx/ly 為家具內的相對格座標
// occs 可以有好幾個（例如小可愛躺床、寵物睡在棉被上）；h 省略時當作 50 高
function drawItemWithOccupants(ctx, def, gx, gy, rot, occs) {
  const parts = getParts(def, rot);
  const lie = occs.find(o => o.pose === 'lie');
  if (lie) { // 先畫床和枕頭，再畫人，再蓋棉被，最後畫趴在棉被上的寵物
    parts.filter(p => !p.cover).forEach(p => drawPart(ctx, p, gx, gy));
    lie.draw(ctx);
    parts.filter(p => p.cover).forEach(p => drawPart(ctx, p, gx, gy));
    occs.filter(o => o !== lie).forEach(o => o.draw(ctx));
    return;
  }
  const boxes = parts.map(toBounds);
  occs.forEach(o => boxes.push({ x: o.lx - .2, y: o.ly - .2, w: .4, d: .4, z: o.z, h: o.h || 50, occ: o }));
  sortBoxes(boxes).forEach(b => (b.occ ? b.occ.draw(ctx) : drawPart(ctx, b.src, gx, gy)));
}

// 家具旋轉後，某個點（未旋轉座標）與方向的位置
function rotatePoint(def, rot, px, py) {
  let x = px, y = py, W = def.w, D = def.d;
  for (let i = 0; i < rot; i++) { [x, y] = [y, W - x]; [W, D] = [D, W]; }
  return { x, y };
}
function rotateDir(rot, dx, dy) {
  for (let i = 0; i < rot; i++) [dx, dy] = [dy, -dx];
  return { dx, dy };
}

// ── 牆面與地板 ──
function wallPattern(ctx, wp, len) {
  ctx.fillStyle = wp.base;
  ctx.fillRect(0, 0, len, WALL_H);
  ctx.fillStyle = wp.alt || wp.base;
  if (wp.pattern === 'stripe') {
    for (let u = 0; u < len; u += 16) ctx.fillRect(u, 0, 8, WALL_H);
  } else if (wp.pattern === 'dots') {
    for (let v = 12; v < WALL_H; v += 20)
      for (let u = (v / 20) % 2 ? 6 : 16; u < len; u += 20) {
        ctx.beginPath(); ctx.arc(u, v, 3.5, 0, Math.PI * 2); ctx.fill();
      }
  } else if (wp.pattern === 'plank') {
    for (let v = 0; v < WALL_H; v += 20) if ((v / 20) % 2) ctx.fillRect(0, v, len, 20);
    ctx.fillStyle = 'rgba(60,35,15,.25)';
    for (let v = 20; v < WALL_H; v += 20) ctx.fillRect(0, v, len, 1.2);
  } else if (wp.pattern === 'brick') {
    ctx.fillStyle = 'rgba(240,225,210,.55)';
    for (let v = 0, row = 0; v < WALL_H; v += 12, row++) {
      ctx.fillRect(0, v, len, 1.5);
      for (let u = row % 2 ? 12 : 0; u < len; u += 24) ctx.fillRect(u, v, 1.5, 12);
    }
  } else if (wp.pattern === 'tile') {
    ctx.fillStyle = wp.alt;
    for (let u = 0; u <= len; u += 14) ctx.fillRect(u, 0, 1, WALL_H);
    for (let v = 0; v < WALL_H; v += 14) ctx.fillRect(0, v, len, 1);
  } else if (wp.pattern === 'panel') {
    ctx.fillStyle = 'rgba(0,0,0,.08)';
    for (let u = 64; u < len; u += 64) ctx.fillRect(u, 0, 1.2, WALL_H);
    ctx.fillRect(0, 60, len, 1.2);
    ctx.fillStyle = 'rgba(0,0,0,.12)';
    for (let u = 16; u < len; u += 32) for (let v = 16; v < WALL_H; v += 30) ctx.fillRect(u, v, 2, 2);
  }
  // 踢腳板
  ctx.fillStyle = 'rgba(80,55,35,.55)';
  ctx.fillRect(0, 0, len, 6);
}

function drawWalls(ctx, room, wp) {
  const lenX = room.w * TW / 2, lenY = room.d * TW / 2;
  // 右上牆（沿 y=0）
  ctx.save();
  ctx.transform(1, .5, 0, -1, 0, 0);
  wallPattern(ctx, wp, lenX);
  ctx.restore();
  // 左上牆（沿 x=0），稍暗
  ctx.save();
  ctx.transform(-1, .5, 0, -1, 0, 0);
  wallPattern(ctx, wp, lenY);
  ctx.fillStyle = 'rgba(0,0,0,.08)';
  ctx.fillRect(0, 0, lenY, WALL_H);
  ctx.restore();
  // 牆頂
  const T = .18;
  poly(ctx, [iso(-T, -T, WALL_H), iso(room.w, -T, WALL_H), iso(room.w, 0, WALL_H), iso(0, 0, WALL_H)], '#f7f1e6', 'rgba(40,30,20,.2)');
  poly(ctx, [iso(-T, -T, WALL_H), iso(0, 0, WALL_H), iso(0, room.d, WALL_H), iso(-T, room.d, WALL_H)], '#eee6d6', 'rgba(40,30,20,.2)');
  // 牆的外側厚度
  poly(ctx, [iso(room.w, -T, 0), iso(room.w, 0, 0), iso(room.w, 0, WALL_H), iso(room.w, -T, WALL_H)], '#d9cfbd');
  poly(ctx, [iso(-T, room.d, 0), iso(0, room.d, 0), iso(0, room.d, WALL_H), iso(-T, room.d, WALL_H)], '#e5dccb');
}

// ── 牆面掛飾 ──
// side：'R' 右上牆（沿 x 方向）、'L' 左上牆（沿 y 方向）；pos：從牆角算起第幾格
function withWallSpace(ctx, side, pos, def, fn) {
  const W = def.w * TW / 2, H = def.h;
  ctx.save();
  if (side === 'R') {
    ctx.transform(1, .5, 0, -1, 0, 0);
    ctx.translate(pos * TW / 2, def.z + H);
    ctx.scale(1, -1);
  } else {
    ctx.transform(-1, .5, 0, -1, 0, 0);
    ctx.translate(pos * TW / 2 + W, def.z + H);
    ctx.scale(-1, -1);
  }
  fn(W, H);
  ctx.restore();
}

function drawWallDecor(ctx, room, ghost) {
  const one = (id, side, pos, alpha, tint) => {
    const def = FURN_BY_ID[id];
    withWallSpace(ctx, side, pos, def, (W, H) => {
      ctx.globalAlpha = alpha;
      ctx.fillStyle = 'rgba(40,30,20,.12)'; // 牆上的淡影子
      ctx.fillRect(2, 2, W, H);
      def.draw(ctx, W, H);
      if (side === 'L') { ctx.fillStyle = 'rgba(0,0,0,.06)'; ctx.fillRect(0, 0, W, H); }
      if (tint) { ctx.fillStyle = tint; ctx.fillRect(-2, -2, W + 4, H + 4); }
      ctx.globalAlpha = 1;
    });
  };
  (room.wallItems || []).forEach(w => one(w.id, w.side, w.pos, 1, w.uid === ghost.hoverUid ? 'rgba(255,220,90,.25)' : null));
  if (ghost.wall) one(ghost.wall.def.id, ghost.wall.side, ghost.wall.pos, .75, ghost.wall.ok ? 'rgba(90,200,120,.3)' : 'rgba(230,80,80,.35)');
}

function drawFloor(ctx, room, fl) {
  // 地板厚度
  const H = 14;
  poly(ctx, [iso(0, room.d, 0), iso(room.w, room.d, 0), iso(room.w, room.d, -H), iso(0, room.d, -H)], shade(fl.b, .72));
  poly(ctx, [iso(room.w, 0, 0), iso(room.w, room.d, 0), iso(room.w, room.d, -H), iso(room.w, 0, -H)], shade(fl.b, .6));
  ctx.save();
  ctx.transform(TW / 2, TH / 2, -TW / 2, TH / 2, 0, 0);
  for (let i = 0; i < room.w; i++) {
    for (let j = 0; j < room.d; j++) {
      if (fl.pattern === 'plank') {
        ctx.fillStyle = (i + j * 3) % 3 ? fl.a : fl.b;
        ctx.fillRect(i, j, 1, .5);
        ctx.fillStyle = (i * 2 + j) % 3 ? fl.a : fl.b;
        ctx.fillRect(i, j + .5, 1, .5);
      } else {
        ctx.fillStyle = (i + j) % 2 ? fl.b : fl.a;
        ctx.fillRect(i, j, 1, 1);
      }
    }
  }
  if (fl.speckle) { // 磨石子：每格固定幾顆小點（用座標算，不用亂數，畫面才不會閃）
    for (let i = 0; i < room.w; i++) for (let j = 0; j < room.d; j++) for (let k = 0; k < 6; k++) {
      const h = (i * 73 + j * 151 + k * 37) % 97;
      ctx.fillStyle = fl.speckle[(i + j + k) % fl.speckle.length];
      ctx.fillRect(i + (h % 10) / 10, j + ((h * 7) % 10) / 10, .05, .05);
    }
  }
  if (fl.path) { // 公園的步道和磚地
    const [px0, px1] = fl.path;
    ctx.fillStyle = '#d3cec4'; ctx.fillRect(px0 + .1, 0, px1 - px0 - .2, room.d);
    ctx.fillStyle = '#bdb7ac'; ctx.fillRect(px0 + .05, 0, .06, room.d); ctx.fillRect(px1 - .11, 0, .06, room.d);
    const [qx0, qy0, qx1, qy1] = fl.plaza;
    for (let i = qx0; i < qx1; i += .5) for (let j = qy0; j < qy1; j += .5) {
      ctx.fillStyle = Math.round((i + j) * 2) % 2 ? '#e7d3c4' : '#d98c7a'; ctx.fillRect(i, j, .5, .5);
    }
  }
  if (fl.pattern === 'track') { // 前面幾道是跑道，後面是球場
    const t0 = room.d - fl.lanes * fl.laneW;
    ctx.fillStyle = fl.a; ctx.fillRect(0, 0, room.w, t0);
    ctx.fillStyle = fl.stripe; ctx.fillRect(0, t0 * .45, room.w, .35);          // 球場中間的紅色帶
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = .05;
    ctx.strokeRect(.5, .5, room.w - 1, t0 - 1);                                  // 球場白線
    for (let k = 0; k < fl.lanes; k++) {
      ctx.fillStyle = fl.lane[k % 2]; ctx.fillRect(0, t0 + k * fl.laneW, room.w, fl.laneW);
    }
    ctx.fillStyle = '#ffffff';
    for (let k = 0; k <= fl.lanes; k++) ctx.fillRect(0, t0 + k * fl.laneW - .025, room.w, .05);
    ctx.fillRect(1, t0, .06, fl.lanes * fl.laneW);                                // 起跑線
  }
  ctx.fillStyle = 'rgba(0,0,0,.12)';
  if (fl.pattern === 'plank') {
    for (let j = 0; j < room.d; j += .5) ctx.fillRect(0, j, room.w, .03);
    for (let i = 0; i < room.w; i++) for (let j = 0; j < room.d; j++)
      ctx.fillRect(i + ((i + j) % 2 ? .5 : 0), j + ((i + j) % 2 ? 0 : .5), .03, .5);
  }
  ctx.restore();
}

function drawGrid(ctx, room) {
  ctx.save();
  ctx.transform(TW / 2, TH / 2, -TW / 2, TH / 2, 0, 0);
  ctx.strokeStyle = 'rgba(255,255,255,.45)';
  ctx.lineWidth = .03;
  for (let i = 0; i <= room.w; i++) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, room.d); ctx.stroke(); }
  for (let j = 0; j <= room.d; j++) { ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(room.w, j); ctx.stroke(); }
  ctx.restore();
}

function drawFootprint(ctx, x, y, w, d, fill, stroke) {
  poly(ctx, [iso(x, y), iso(x + w, y), iso(x + w, y + d), iso(x, y + d)], fill, stroke);
}

// room: {w,d,wall,floor,items:[{uid,id,x,y,rot}]}
// opts: {ghost:{def,x,y,rot,ok}, hoverUid, showGrid}
function drawRoom(ctx, room, opts) {
  const wp = WALLPAPERS.find(x => x.id === room.wall) || WALLPAPERS[0];
  const fl = floorById(room.floor) || FLOORS[0];
  drawFloor(ctx, room, fl);
  drawWalls(ctx, room, wp);
  const isWallGhost = opts.ghost && opts.ghost.def.layer === 'wall';
  drawWallDecor(ctx, room, { wall: isWallGhost ? opts.ghost : null, hoverUid: opts.hoverUid });
  if (isWallGhost) opts = Object.assign({}, opts, { ghost: null });

  const entries = room.items.map(it => {
    const def = FURN_BY_ID[it.id], fp = footprint(def, it.rot);
    return { x: it.x, y: it.y, w: fp.w, d: fp.d, z: 0, h: itemHeight(def), def, it };
  });
  const flat = entries.filter(e => e.def.layer === 'floor');
  const solid = entries.filter(e => e.def.layer !== 'floor');

  flat.forEach(e => drawItem(ctx, e.def, e.x, e.y, e.it.rot, e.it));
  if (opts.showGrid) drawGrid(ctx, room);

  const g = opts.ghost;
  if (g) {
    const fp = footprint(g.def, g.rot);
    drawFootprint(ctx, g.x, g.y, fp.w, fp.d, g.ok ? 'rgba(90,200,120,.35)' : 'rgba(230,80,80,.35)', g.ok ? '#3fa86a' : '#d04545');
  }
  const hov = entries.find(e => e.it.uid === opts.hoverUid);
  if (hov) drawFootprint(ctx, hov.x, hov.y, hov.w, hov.d, 'rgba(255,220,90,.3)', '#e8b43a');

  const draw = solid.slice();
  if (g && g.def.layer !== 'floor') {
    const fp = footprint(g.def, g.rot);
    draw.push({ x: g.x, y: g.y, w: fp.w, d: fp.d, z: 0, h: itemHeight(g.def), def: g.def, ghost: g });
  }
  (opts.extras || []).forEach(x => x && draw.push(x)); // 角色等會移動的東西，跟家具一起排前後
  const occs = (opts.occupants || []).filter(Boolean);
  sortBoxes(draw).forEach(e => {
    const here = e.it ? occs.filter(o => o.uid === e.it.uid) : [];
    if (e.drawFn) e.drawFn(ctx);
    else if (here.length) drawItemWithOccupants(ctx, e.def, e.x, e.y, e.it.rot, here);
    else if (e.ghost) {
      ctx.__baseAlpha = .7;
      ctx.globalAlpha = .7;
      drawItem(ctx, e.def, e.x, e.y, e.ghost.rot);
      ctx.__baseAlpha = 1;
      ctx.globalAlpha = 1;
    } else drawItem(ctx, e.def, e.x, e.y, e.it.rot, e.it);
  });
  if (g && g.def.layer === 'floor') {
    ctx.__baseAlpha = .7; ctx.globalAlpha = .7;
    drawItem(ctx, g.def, g.x, g.y, g.rot);
    ctx.__baseAlpha = 1; ctx.globalAlpha = 1;
  }
}

// 單件家具的小預覽圖（商店與收納用）
function renderThumb(def, size) {
  const c = document.createElement('canvas');
  const dpr = window.devicePixelRatio || 1;
  c.width = c.height = size * dpr;
  c.style.width = c.style.height = size + 'px';
  const ctx = c.getContext('2d');
  if (def.layer === 'wall') { // 掛飾：正面平面圖
    const w = def.w * TW / 2, h = def.h, s = Math.min(size * .8 / w, size * .8 / h) * dpr;
    ctx.setTransform(s, 0, 0, s, (c.width - w * s) / 2, (c.height - h * s) / 2);
    def.draw(ctx, w, h);
    return c;
  }
  const W = (def.w + def.d) * TW / 2, H = (def.w + def.d) * TH / 2 + itemHeight(def);
  const s = Math.min(size / (W + 8), size / (H + 8)) * dpr;
  ctx.setTransform(s, 0, 0, s, c.width / 2 - ((def.w - def.d) * TW / 4) * s,
    c.height / 2 + (itemHeight(def) / 2 - (def.w + def.d) * TH / 4) * s);
  drawItem(ctx, def, 0, 0, 0);
  return c;
}

function renderSwatch(kind, item, size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  if (kind === 'wall') {
    ctx.save(); ctx.scale(size / 64, size / WALL_H); ctx.translate(0, WALL_H); ctx.scale(1, -1);
    wallPattern(ctx, item, 64); ctx.restore();
  } else {
    const q = size / 4;
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
      ctx.fillStyle = item.pattern === 'plank' ? ((i + j * 3) % 3 ? item.a : item.b) : ((i + j) % 2 ? item.b : item.a);
      ctx.fillRect(i * q, j * q, q, q);
    }
  }
  return c;
}

/* ===== 粉紅色與黃色的版本 =====
   書櫃、書桌、衣櫃、床頭櫃本來都只有一種，而且是原木／灰白色系，
   不是她們喜歡的顏色。造型沿用原本那一個，只換顏色——
   縮圖是從 parts 自動畫的，所以換了顏色就自動有新的圖，
   擺放、碰撞、佔格也全部沿用，不會有新的 bug。

   顏色一律歸在 cute 這個主題：⭐ 居家評分裡「同主題擺滿 3 件 +300、
   6 件 +500」，粉紅跟黃色算同一類，她混搭也拿得到加成。 */
const recolor = (parts, map) => parts.map(p =>
  map[p.c] ? Object.assign({}, p, { c: map[p.c] }) : Object.assign({}, p));

const PINK = { // 原木→粉紅
  '#8a5a33': '#f0a8c0', '#b07843': '#ffc0d6', '#a8733f': '#ffb7d0', '#9b6a3e': '#f7b4c9',
  '#6b4524': '#e58aa8', '#e8c36a': '#fff0f5', '#e6d3b0': '#ffe3ec',
  // 書櫃上那排書維持彩色，只把最上層的米色換掉
  '#dfe3e8': '#ffd6e4', '#f2f4f6': '#ffe8f1', '#6b7280': '#f0a8c0',
  '#3b4252': '#ff8fb3', '#9aa3ad': '#ffc8da', '#f2b33d': '#ff6f9c',
};
const LEMON = { // 原木→檸檬黃
  '#8a5a33': '#e8b84a', '#b07843': '#ffd76b', '#a8733f': '#ffcf55', '#9b6a3e': '#f2c75c',
  '#6b4524': '#c99a2e', '#e8c36a': '#fff6d8', '#e6d3b0': '#fff1b8',
  '#dfe3e8': '#ffe8a8', '#f2f4f6': '#fff6d8', '#6b7280': '#e8b84a',
  '#3b4252': '#c99a2e', '#9aa3ad': '#ffe08a', '#f2b33d': '#ff9f43',
  '#c68b52': '#ffd76b', '#c9925a': '#ffd76b', '#f3c1d2': '#f2c75c',
};
(function addColorVariants() {
  const base = Object.fromEntries(FURNITURE.map(f => [f.id, f]));
  [
    ['bookshelf',  'pink_bookshelf',  '粉紅書櫃',  3400, PINK],
    ['bookshelf',  'lemon_bookshelf', '檸檬書櫃',  3400, LEMON],
    ['desk',       'pink_desk',       '粉紅書桌',  3000, PINK],
    ['desk',       'lemon_desk',      '檸檬書桌',  3000, LEMON],
    ['wardrobe',   'pink_wardrobe',   '粉紅衣櫃',  4000, PINK],
    ['wardrobe',   'lemon_wardrobe',  '檸檬衣櫃',  4000, LEMON],
    ['nightstand', 'pink_nightstand', '粉紅床頭櫃', 1600, PINK],
    ['nightstand', 'lemon_nightstand', '檸檬床頭櫃', 1600, LEMON],
    ['wood_chair', 'lemon_chair',     '檸檬椅',    900, LEMON],
    ['wood_table', 'lemon_table',     '檸檬桌',   2000, LEMON],
    ['wood_bed',   'lemon_bed',       '檸檬床',   5000, LEMON],
  ].forEach(([from, id, name, price, map]) => {
    const b = base[from];
    if (!b) return;                                 // 來源被改名就跳過，不要整個壞掉
    FURNITURE.push(Object.assign({}, b, {
      id: id, name: name, price: price, theme: 'cute', parts: recolor(b.parts, map) }));
  });
})();

/* ===== 價格打四折 =====
   原本全部買齊（四間房擴建到最大＋每樣東西一個）要 45 萬，開局只有 10 萬，
   小朋友會覺得目標太遠、玩起來灰心，家長也不希望要玩很久。
   調成四折：全部買齊大約 18 萬，還差 8 萬左右，大概玩兩個小時。
   家具、壁紙、地板、衣服、髮型在這裡統一打折（取整到 50 或 100，價格比較好看）；
   房間、擴建、寵物蛋直接改在上面的常數。食物是消耗品，不打折。 */
const PRICE_SCALE = .4;
function scaledPrice(p) {
  if (!p) return 0;
  const v = p * PRICE_SCALE;
  return v < 1000 ? Math.max(50, Math.round(v / 50) * 50) : Math.round(v / 100) * 100;
}
(() => {
  const done = new Set();
  [FURNITURE, WALLPAPERS, FLOORS, CLOTHES, HAIR_STYLES].forEach(list => list.forEach(x => {
    if (done.has(x) || typeof x.price !== 'number') return;
    done.add(x);
    x.price = scaledPrice(x.price);
  }));
})();
const FURN_BY_ID = Object.fromEntries(FURNITURE.map(f => [f.id, f]));
PLACE_FURNITURE.forEach(f => { FURN_BY_ID[f.id] = f; }); // 親戚家專用的家具（不在商店、圖鑑裡）
</script>
<script>
// 遊戲狀態、存檔、經濟與評分
'use strict';

/* ===== 存檔格 =====
   兩個小孩要各玩各的，所以一份存檔不夠用。

   做法刻意選了最不會出錯的一種：SAVE_KEY 還是一個常數，只是在
   載入的時候才算出「現在是哪一格」。換格一律 location.reload()，
   所以這兩個常數在一次執行裡永遠不會變——
   原本幾十處用到 SAVE_KEY / UNDO_KEY 的地方一行都不用改。

   搬家：還沒有存檔格之前的那一份存在 myHouseGame_v1（沒有後綴）。
   第一次跑到這裡會把它複製進第 1 格，而且刻意「不刪原本那一份」——
   萬一哪裡沒想到，那份原始資料還在，救得回來。 */
const LEGACY_KEY = 'myHouseGame_v1';
const SLOTS_KEY  = 'myHouseGame_slots';
const CUR_KEY    = 'myHouseGame_cur';
const slotSave = id => LEGACY_KEY + ':' + id;
const slotUndo = id => 'myHouseGame_undo:' + id;

function slots() {
  try {
    const a = JSON.parse(localStorage.getItem(SLOTS_KEY));
    if (Array.isArray(a) && a.length && a.every(s => s && s.id)) return a;
  } catch (e) { /* 壞掉就當成沒有，用預設的一格 */ }
  return [{ id: 'p1', name: '第 1 間' }];
}
function saveSlots(list) {
  try { localStorage.setItem(SLOTS_KEY, JSON.stringify(list)); } catch (e) {}
}
function curSlotId() {
  const list = slots(), id = localStorage.getItem(CUR_KEY);
  return list.some(s => s.id === id) ? id : list[0].id;
}
function curSlotName() {
  const s = slots().find(x => x.id === curSlotId());
  return (s && s.name) || '第 1 間';
}
(function migrateToSlots() {
  try {
    const old = localStorage.getItem(LEGACY_KEY);
    if (!old) return;                                  // 全新的人，沒東西要搬
    if (localStorage.getItem(slotSave('p1'))) return;  // 搬過了
    localStorage.setItem(slotSave('p1'), old);
    const u = localStorage.getItem('myHouseGame_undo');
    if (u) localStorage.setItem(slotUndo('p1'), u);
  } catch (e) {}
})();

const SAVE_KEY = slotSave(curSlotId());
const UNDO_KEY = slotUndo(curSlotId());

/* 換一格來玩。先把現在這格存好再換，然後整個重讀——
   G 跟畫面上所有東西都要跟著換，重讀是最不會漏的做法。 */
function switchSlot(id) {
  if (id === curSlotId()) return;
  saveGame();
  try { localStorage.setItem(CUR_KEY, id); } catch (e) { return; }
  location.reload();
}
function addSlot(name) {
  const list = slots();
  let n = 1;
  list.forEach(s => { const m = /^p(\d+)$/.exec(s.id); if (m) n = Math.max(n, +m[1] + 1); });
  const id = 'p' + n;
  list.push({ id: id, name: name || ('第 ' + n + ' 間') });
  saveSlots(list);
  return id;
}
function renameSlot(id, name) {
  const list = slots();
  const s = list.find(x => x.id === id);
  if (!s) return;
  s.name = String(name || '').trim().slice(0, 10) || s.name;
  saveSlots(list);
}
// 刪掉一格。最後一格不給刪——刪完沒有任何一格可以玩
function removeSlot(id) {
  const list = slots();
  if (list.length <= 1) return false;
  const rest = list.filter(s => s.id !== id);
  if (rest.length === list.length) return false;
  saveSlots(rest);
  try {
    localStorage.removeItem(slotSave(id));
    localStorage.removeItem(slotUndo(id));
  } catch (e) {}
  if (id === localStorage.getItem(CUR_KEY)) {
    try { localStorage.setItem(CUR_KEY, rest[0].id); } catch (e) {}
  }
  return true;
}
// 每一格的概況，給列表顯示用。不會動到正在玩的那一格
function slotInfo(id) {
  try {
    const raw = localStorage.getItem(slotSave(id));
    if (!raw) return null;
    const g = normalizeSave(JSON.parse(raw));
    if (!g) return null;
    return { bells: g.bells,
             score: g.rooms.reduce((a, r) => a + roomScore(r).score, 0),
             rooms: g.rooms.length,
             items: g.rooms.reduce((a, r) => a + r.items.length + (r.wallItems || []).length, 0) };
  } catch (e) { return null; }
}

/* 開局金幣。本來是 3000。
   之前的存檔住在 Artifact 的 iframe 裡，被 iOS 當暫時資料清掉了，
   她布置到一半的東西全沒了，這是補償，也是讓她一口氣布置得起來。
   137 件家具全部買一輪要 227,970，10 萬大約是四成——
   夠一次弄得有樣子，又不會一次玩完、沒東西可以賺。 */
const START_BELLS = 100000;

/* ===== 📣 更新公告 =====
   之後每次加了新東西，就在最上面加一筆。每個存檔格第一次打開會跳出來一次
   （兩個小孩各自都會看到），看過就不再跳；設定頁可以再看一次。
   妹妹看不懂字，所以每一行前面都有大圖示，字也盡量短。
   newItems：這次新進商店的家具 id，兩個禮拜內在商店會掛「新」，買過就不掛。 */
const NEWS = [
  { id: '2026-10-04', title: '小屋更新了！', lines: [
    ['🏫', '可以去學校、公園、圖書館玩了！點上面的「🚗 出門」'],
    ['🐮', '阿婆家的小農場會有動物跑來玩，收集動物圖鑑'],
    ['🏷️', '東西都變便宜了！'],
    ['📖', '圖鑑可以看到所有收集'],
    ['😴', '玩一陣子要休息一下，眼睛才不會累喔']
  ], newItems: [] }
];
const NEWS_FRESH_DAYS = 14;
function unseenNews(g) { g = g || G; const seen = g.newsSeen || []; return NEWS.filter(n => !seen.includes(n.id)); }
// 這件家具是不是「最近新進商店、還沒買過」
function isNewItem(id) {
  const now = Date.now();
  return NEWS.some(n => (n.newItems || []).includes(id) && now - Date.parse(n.id) < NEWS_FRESH_DAYS * 864e5) && !(G.seen || {})[id];
}
function openNews(list) {
  list = list && list.length ? list : NEWS.slice(0, 1);
  const card = $('#modalCard');
  card.innerHTML = '';
  card.appendChild(el('h2', '', '✨ ' + list[0].title));
  list.slice(0, 2).forEach(n => {
    const box = el('div', 'news');
    n.lines.forEach(([ic, tx]) => { const r = el('div', 'news-row'); r.append(el('span', 'news-ic', ic), el('span', 'news-tx', tx)); box.appendChild(r); });
    card.appendChild(box);
  });
  const ok = el('button', 'big', '好！去玩囉');
  ok.onclick = () => { $('#modal').hidden = true; };
  card.appendChild(ok);
  $('#modal').hidden = false;
  G.newsSeen = Array.from(new Set((G.newsSeen || []).concat(list.map(n => n.id))));
  saveGame();
  Sound.play('coin');
}
// 打開遊戲一會兒之後才跳（等畫面、休息畫面都穩定）；別的視窗開著就晚一點再試
function maybeShowNews(tries) {
  tries = tries || 0;
  const list = unseenNews();
  if (!list.length || tries > 20) return;
  if (!$('#modal').hidden || (typeof resting !== 'undefined' && resting) || (typeof hold !== 'undefined' && hold)) { setTimeout(() => maybeShowNews(tries + 1), 3000); return; }
  openNews(list);
}

function newGame() {

    earned: 0,
    inv: { wood_bed: 1, wood_chair: 1, wood_table: 1, plant_s: 1 },
    walls: ['wp_cream'],
    floors: ['fl_wood'],
    rooms: [{ name: ROOM_NAMES[0], w: MIN_ROOM_SIZE, d: MIN_ROOM_SIZE, wall: 'wp_cream', floor: 'fl_wood', items: [], wallItems: [] }],
    cur: 0,
    seen: {},
    fish: {},
    lastGift: '',
    lastClaim: '',
    uid: 1,
    lines: {},               // 玩家自訂台詞 {key: [句子...]}
    charName: DEFAULT_CHAR_NAME,
    pets: [newPet('mochi', 'kid', DEFAULT_PET_NAME)], // 收集到的寵物（含還沒孵的蛋）
    activePet: 0,                                      // 目前帶出來玩的是第幾隻；G.pet 指向牠
    companions: [],                                    // 一起跟著逛的寵物（G.pets 的索引），不會餓也不會髒
    friends: {},                                       // 來玩過的動物鄰居 {id: 來玩幾次}
    tree: { n: TREE_MAX, t: Date.now() },              // 樹上還有幾顆果子可以搖

    away: null,                                        // 在親戚家 {place, idx}；null＝在自己家
    giftAt: {},                                        // 親戚上次送禮物的時間 {uncle: ms, grandma: ms}
    food: { apple: 3, cookie: 2 },
    kid: newKid(),                              // 小可愛自己的飽足與身高
    kidFood: { xiaoansu: 2, sandwich: 2 },
    outfit: Object.assign({}, DEFAULT_OUTFIT), // 小可愛目前穿的 {slot: 衣服 id}
    wardrobe: CLOTHES.filter(c => !c.price).map(c => c.id), // 已經擁有的衣服
    /* 新存檔一開始就是 10 萬，等於補償已經給了。
       本來沒寫這一行：新開的存檔沒有旗標，第二次打開時被當成舊存檔，
       她花剩多少都會被補回 10 萬——每開一間新的就白送一次錢。 */
    newsSeen: NEWS.map(n => n.id), // 新開的存檔不用看以前的更新公告
    topup100k: true,
    supplyAt: Date.now(),                       // 上次送小安素的時間
    supplyWho: 0,                               // 下一次輪到誰送（媽媽、爸爸輪流）
    hair: Object.assign({}, DEFAULT_HAIR),        // 現在的髮型與髮色
    hairOwned: HAIR_STYLES.filter(h => !h.price).map(h => h.id)  // 買過的髮型
  };
  g.pet = g.pets[0];
  Object.keys(g.inv).forEach(id => (g.seen[id] = true));
  return g;
}

// stage：egg 蛋、baby 寶寶、kid 小朋友、adult 大朋友；growth：這個階段累積的成長
function newPet(species, stage, name) {
  return { species: species || 'mochi', stage: stage || 'kid', growth: 0, name: name || '',
    hunger: stage === 'egg' ? 100 : 80, clean: stage === 'egg' ? 100 : 90, mood: stage === 'egg' ? 100 : 80, lastTick: Date.now() };
}
function newKid() {
  return { hunger: 90, height: KID_START_HEIGHT, lastTick: Date.now() };
}

/* 讀不出來的存檔：以前會直接開新遊戲，接著一存檔就把原本的紀錄蓋掉了。
   現在：原文留在 SAVE_LOCKED（也另外複製一份到 rescue），這一輪不自動存檔，
   跳出畫面讓家長選：下載原始資料、用備份還原、換一格、或這一格重新開始。 */
var SAVE_LOCKED = null;
const rescueKey = () => 'myHouseGame_rescue:' + curSlotId();
function loadGame() {
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { raw = null; }
  if (!raw) return newGame();
  try {
    const ok = normalizeSave(JSON.parse(raw));
    if (ok) return ok;
  } catch (e) { /* 下面當成壞掉處理 */ }
  SAVE_LOCKED = raw;
  try { localStorage.setItem(rescueKey(), raw); } catch (e) { /* 存不下就算了，原文還在原位 */ }
  return newGame();
}

// 補齊舊版存檔缺少的欄位；格式不對回傳 null
function normalizeSave(g) {
  if (!g || typeof g !== 'object' || !Array.isArray(g.rooms) || !g.rooms.length) return null;
  /* 舊版少欄位可以補；「型態不對」是壞掉的資料，不能當成舊版收下來
     （例如 items 變成物件，後面一跑 forEach 就整個當掉）。 */
  const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
  const num = v => typeof v === 'number' && isFinite(v);
  if (g.rooms.some(r => !isObj(r)
      || (r.items != null && !Array.isArray(r.items)) || (r.wallItems != null && !Array.isArray(r.wallItems))
      || (r.w != null && !num(r.w)) || (r.d != null && !num(r.d)))) return null;
  if (g.rooms.some(r => (r.items || []).some(it => !isObj(it) || typeof it.id !== 'string' || !num(it.x) || !num(it.y))
      || (r.wallItems || []).some(it => !isObj(it) || typeof it.id !== 'string'))) return null;
  if ((g.bells != null && !num(g.bells)) || (g.inv != null && !isObj(g.inv))
      || (g.pets != null && !Array.isArray(g.pets)) || (g.cur != null && !num(g.cur))) return null;
  g.rooms.forEach(r => {
    r.wallItems = r.wallItems || []; // 舊存檔沒有掛飾欄位
    r.items = r.items || [];
    /* 桌上那樣東西：舊存檔沒有這個欄位；放了不存在的東西（改版拿掉了）
       也要清掉，不然會在桌上畫出一個空的。 */
    r.items.forEach(it => {
      if (it.top && !(FURN_BY_ID[it.top] && canHaveTop(it.id) && canSitOnTable(it.top))) it.top = null;
    });
    // 舊版的 4×4 房間免費升級成 6×6；往前方擴大，原本的家具位置不變
    if (r.w < MIN_ROOM_SIZE) r.w = MIN_ROOM_SIZE;
    if (r.d < MIN_ROOM_SIZE) r.d = MIN_ROOM_SIZE;
  });
  const out = Object.assign(newGame(), g);
  if (!Array.isArray(g.newsSeen)) out.newsSeen = []; // 舊存檔：還沒看過任何公告，要讓她看到這次更新了什麼
  /* 補償也要發給「已經存在的存檔」——只改 newGame() 的話，
     她那台已經有存檔了，newGame() 根本不會再跑，一毛都拿不到。
     補過一次就記在存檔裡，之後不管她花到剩多少都不再補。 */
  if (!out.topup100k) {
    out.topup100k = true;
    if (out.bells < START_BELLS) out.bells = START_BELLS;
  }
  // 寵物：舊存檔只有一隻 g.pet（當作「小朋友」階段的粉紅糰子），新存檔用 g.pets
  const src = Array.isArray(g.pets) && g.pets.length ? g.pets : [Object.assign({ name: DEFAULT_PET_NAME }, g.pet || {})];
  out.pets = src.map(p => {
    const q = Object.assign(newPet(), p);
    if (!PET_SPECIES_BY_ID[q.species]) q.species = 'mochi';
    if (!PET_STAGE_BY_ID[q.stage]) q.stage = 'kid';
    return q;
  });
  out.activePet = Math.max(0, Math.min(out.pets.length - 1, g.activePet || 0));
  out.pet = out.pets[out.activePet]; // 同一個物件，改 G.pet 就是改 pets 裡那隻
  fixCompanions(out);
  out.kid = Object.assign(newKid(), g.kid || {});
  out.away = null; // 重新打開遊戲一律在自己家
  if (out.cur >= out.rooms.length) out.cur = 0;
  // 衣服：補上預設款，穿著中的衣服若資料裡已不存在就換回預設
  out.wardrobe = Array.from(new Set((g.wardrobe || []).concat(newGame().wardrobe))).filter(id => CLOTHES_BY_ID[id]);
  out.outfit = Object.assign({}, DEFAULT_OUTFIT, g.outfit || {});
  /* 舊存檔沒有髮型欄位，補上預設。髮型或髮色被刪掉（改版）就換回預設，
     不然會畫出一顆沒有顏色的頭。 */
  out.hair = Object.assign({}, DEFAULT_HAIR, g.hair || {});
  if (!HAIR_BY_ID[out.hair.style]) out.hair.style = DEFAULT_HAIR.style;
  if (!HAIR_COLOR_BY_ID[out.hair.color]) out.hair.color = DEFAULT_HAIR.color;
  out.hairOwned = Array.from(new Set((g.hairOwned || [])
    .concat(HAIR_STYLES.filter(h => !h.price).map(h => h.id))
    .concat([out.hair.style]))).filter(id => HAIR_BY_ID[id]);
  OUTFIT_SLOTS.forEach(({ key }) => {
    const c = CLOTHES_BY_ID[out.outfit[key]];
    if (!c || c.slot !== key || !out.wardrobe.includes(c.id)) out.outfit[key] = DEFAULT_OUTFIT[key];
  });
  return out;
}

// ── 換裝 ──
function currentOutfit() {
  const o = {};
  OUTFIT_SLOTS.forEach(({ key }) => { o[key] = CLOTHES_BY_ID[G.outfit[key]] || CLOTHES_BY_ID[DEFAULT_OUTFIT[key]]; });
  return o;
}
function ownsClothes(id) { return G.wardrobe.includes(id); }
// 買（沒有的話）並穿上；錢不夠回傳 false
function buyAndWear(id) {
  const c = CLOTHES_BY_ID[id];
  if (!ownsClothes(id)) {
    if (!spend(c.price)) return false;
    G.wardrobe.push(id);
  }
  G.outfit[c.slot] = id;
  return true;
}

/* 註冊離線快取。用 try 包起來是因為 file:// 開的時候（走查、本機測試）
   根本沒有 serviceWorker，直接呼叫會丟錯把整支程式打斷。 */
(function registerSW() {
  try {
    if (location.protocol.indexOf('http') !== 0) return;   // file:// 不支援
    if (!('serviceWorker' in navigator)) return;
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  } catch (e) {}
})();

let G = loadGame();
if (SAVE_LOCKED != null) setTimeout(openRescue, 300);
// 上次玩到現在隔了幾小時（在第一次結算之前記下來，給「好久不見」用）
const hoursAway = (Date.now() - Math.max(G.pet.lastTick || 0, G.kid.lastTick || 0)) / 3600000;
/* 讀完立刻存一次。normalizeSave 裡的補欄位與補償如果沒有馬上落地，
   她開了又關、什麼都沒做的話那些調整就白做了——
   補償那一筆更糟：旗標沒存下來，下次開又補一次。 */
saveGame();

// 回傳有沒有存成功。存不了的時候畫面上會一直掛著提醒，不能讓她玩完才發現沒存到
function saveGame() {
  if (SAVE_LOCKED != null) { showSaveWarn('locked'); return false; }
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); }
  catch (e) { showSaveWarn('fail'); return false; } // 私密視窗、空間滿了等等
  showSaveWarn(null);
  return true;
}
function showSaveWarn(kind) {
  let b = document.getElementById('saveWarn');
  if (!kind) { if (b) b.hidden = true; return; }
  if (!b) {
    b = document.createElement('button'); b.id = 'saveWarn'; b.className = 'save-warn';
    b.onclick = () => (SAVE_LOCKED != null ? openRescue() : openTab('save'));
    document.body.appendChild(b);
  }
  b.textContent = kind === 'locked'
    ? '⚠️ 這份紀錄讀不出來，現在玩的不會存檔。請家長點這裡處理'
    : '⚠️ 進度沒有存好！請家長到「⚙️ 設定」先備份';
  b.hidden = false;
}
function downloadText(text, name) {
  const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function openRescue() {
  if (SAVE_LOCKED == null) return;
  const card = $('#modalCard');
  card.innerHTML = '';
  card.appendChild(el('h2', '', '⚠️ 這份紀錄暫時讀不出來'));
  card.appendChild(note('紀錄沒有被刪掉，也另外留了一份。現在玩的不會存檔，免得把它蓋掉。請家長選一個：'));
  const b1 = el('button', 'big', '⬇️ 下載原始資料（給大人保存）');
  b1.onclick = () => { try { downloadText(SAVE_LOCKED, '我的小屋-讀不出來的紀錄-' + today() + '.json'); toast('下載好了'); } catch (e) { toast('這台機器存不了檔案'); } };
  const b2 = el('button', 'big alt', '↩️ 用備份還原／換別的存檔格');
  b2.onclick = () => { $('#modal').hidden = true; openTab('save'); };
  const b3 = el('button', 'big alt', '🆕 這一格重新開始');
  b3.onclick = () => askPin('這一格重新開始', () => {
    if (!confirm('確定要讓這一格重新開始嗎？\n讀不出來的那份已經另外留著，之後還可以下載。')) return;
    SAVE_LOCKED = null; saveGame(); $('#modal').hidden = true; toast('重新開始了！');
  });
  card.append(b1, b2, b3);
  $('#modal').hidden = false;
}

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}

function curRoom() { return G.away ? PLACES[G.away.place].rooms[G.away.idx] : G.rooms[G.cur]; }
// 目前所在房間的代號（角色、寵物用來判斷有沒有換房間）
function roomKey() { return G.away ? `${G.away.place}:${G.away.idx}` : G.cur; }

// ── 會慢慢長回來的次數（搖樹、果園）──
function regen(o, max, ms) {
  const now = Date.now();
  if (o.n >= max) { o.t = now; return; }
  const k = Math.floor((now - o.t) / ms);
  if (k > 0) { o.n = Math.min(max, o.n + k); o.t = o.n >= max ? now : o.t + k * ms; }
}
// 小可愛做了一件事（陪寵物、餵食、做家事、玩小遊戲、聊天…）：樹長回一顆果子
function didSomething() {
  regen(G.tree, TREE_MAX, TREE_REGEN_MS);
  if (G.tree.n < TREE_MAX) G.tree.n++;
}
// 親戚送禮物：1 小時內送過就回傳 null；否則放進收納／食物，回傳送了哪些 [{emoji, name}]
function relativeGift(place) {
  if (place !== 'uncle' && place !== 'grandma') return null; // 學校不送禮物（老師的獎勵在交作業、小考）
  const now = Date.now();
  if (now - (G.giftAt[place] || 0) < GIFT_COOLDOWN_MS) return null;
  G.giftAt[place] = now;
  const pick = (list, w) => { let r = Math.random() * list.reduce((a, x) => a + w(x), 0); return list.find(x => (r -= w(x)) < 0) || list[0]; };
  if (place === 'uncle') {
    const def = pick(GIFT_FURNITURE, d => d.weight);
    addItem(def.id);
    return [{ emoji: '🎁', name: def.name }];
  }
  return [0, 1].map(() => {
    const [src, id] = pick(GRANDMA_GIFTS, g => g[2]);
    const stock = src === 'pet' ? G.food : G.kidFood, f = (src === 'pet' ? FOOD_BY_ID : KID_FOOD_BY_ID)[id];
    stock[id] = (stock[id] || 0) + 1;

}
// 摘果園的水果；摘完了回傳 null
function orchardPick(treeId) {
  regen(G.orchard, ORCHARD_MAX, ORCHARD_REGEN_MS);
  if (G.orchard.n <= 0 || !TREE_FRUIT[treeId]) return null;
  G.orchard.n--;
  const [src, id] = TREE_FRUIT[treeId], stock = src === 'pet' ? G.food : G.kidFood;
  stock[id] = (stock[id] || 0) + 1;
  return (src === 'pet' ? FOOD_BY_ID : KID_FOOD_BY_ID)[id];
}

// ── 錢 ──
function addBells(n) { G.bells += n; if (n > 0) G.earned += n; }
function spend(n) {
  if (G.bells < n) return false;
  G.bells -= n;
  return true;
}
function addItem(id, n) {
  G.inv[id] = (G.inv[id] || 0) + (n || 1);
  G.seen[id] = true;
}
// 從收納拿走一件；沒有就回傳 false（放桌上、放地上都走這裡）
function takeItem(id) {
  if (!G.inv[id]) return false;
  G.inv[id]--;
  if (!G.inv[id]) delete G.inv[id];
  return true;
}

// ── 擺放判定 ──
function canPlace(room, def, x, y, rot, ignoreUid) {
  const fp = footprint(def, rot);
  if (x < 0 || y < 0 || x + fp.w > room.w || y + fp.d > room.d) return false;
  const flat = def.layer === 'floor';
  return !room.items.some(it => {
    if (it.uid === ignoreUid) return false;
    const od = FURN_BY_ID[it.id];
    if ((od.layer === 'floor') !== flat) return false;
    const of = footprint(od, it.rot);
    return x < it.x + of.w && it.x < x + fp.w && y < it.y + of.d && it.y < y + fp.d;
  });
}

// 掛飾：同一面牆上不能重疊
function wallLength(room, side) { return side === 'R' ? room.w : room.d; }
function canPlaceWall(room, def, side, pos, ignoreUid) {
  if (pos < 0 || pos + def.w > wallLength(room, side)) return false;
  return !room.wallItems.some(w => {
    if (w.uid === ignoreUid || w.side !== side) return false;
    const od = FURN_BY_ID[w.id];
    return pos < w.pos + od.w && w.pos < pos + def.w;
  });
}

// ── 台詞 ──
function lineList(key) {
  const own = G.lines && G.lines[key];
  if (own && own.length) return own;
  return (LINE_TYPES.find(t => t.key === key) || { lines: [''] }).lines;
}
function pickLine(key, vars) {
  const list = lineList(key);
  let text = list[Math.floor(Math.random() * list.length)] || '';
  Object.entries(vars || {}).forEach(([k, v]) => { text = text.split(`{${k}}`).join(v); });
  return text;
}
function charName() { return (G.charName || '').trim() || DEFAULT_CHAR_NAME; }
// 沒取名時：蛋叫「神秘的蛋」，孵出來後用種類名稱
function petNameOf(p) {
  return (p.name || '').trim() || (p.stage === 'egg' ? '神秘的蛋' : PET_SPECIES_BY_ID[p.species].name);
}
function petName() { return petNameOf(G.pet); }

// ── 寵物收集與長大 ──
function stageOf(p) { return PET_STAGE_BY_ID[p.stage]; }
function nextStageId(stageId) {
  const i = PET_STAGES.findIndex(s => s.id === stageId);
  return i >= 0 && i < PET_STAGES.length - 1 ? PET_STAGES[i + 1].id : null;
}
// 加成長；進入下一階段時回傳 {from, to, firstOfSpecies}，否則回傳 null；p 省略時是主要那隻
function addPetGrowth(amount, p) {
  p = p || G.pet;
  const st = stageOf(p);
  if (!st.next) return null; // 已經是大朋友
  p.growth += amount;
  if (p.growth < st.next) return null;
  const from = p.stage, to = nextStageId(p.stage);
  const firstOfSpecies = from === 'egg' && !G.pets.some(o => o !== p && o.stage !== 'egg' && o.species === p.species);
  p.stage = to;
  p.growth = 0;
  if (from === 'egg') { // 剛孵出來：狀態不錯、開始跟著時間變化
    Object.assign(p, { hunger: 80, clean: 90, mood: 90, lastTick: Date.now() });
  }
  return { from, to, firstOfSpecies };
}
function collectedSpecies() {
  return new Set(G.pets.filter(p => p.stage !== 'egg').map(p => p.species));
}
// 買蛋：孵出來的種類先決定好（優先還沒收集到的），蛋上的斑點顏色會透露一點線索
function buyEgg() {
  const have = new Set(G.pets.map(p => p.species));
  const fresh = PET_SPECIES.filter(s => !have.has(s.id));
  const pool = fresh.length ? fresh : PET_SPECIES;
  if (!spend(EGG_PRICE)) return null;
  let r = Math.random() * pool.reduce((a, s) => a + s.weight, 0), pick = pool[0];
  for (const s of pool) { if ((r -= s.weight) < 0) { pick = s; break; } }
  G.pets.push(newPet(pick.id, 'egg', ''));
  return G.pets.length - 1;
}
/* 送回寵物店，拿回一半的蛋錢。
   收齊之後再買只會孵出重複的，重複的在這個遊戲裡沒有用途——
   與其擋住不給買（那她就不能養兩隻一樣的了），不如留一條後路。

   G.pets 是用「索引」被 activePet 與 companions 指著的，
   抽掉一隻之後後面全部往前移一格。這幾行沒處理好的話，

function releasePet(i) {
  if (!G.pets[i] || G.pets.length <= 1) return false;   // 最後一隻不能送走
  G.pets.splice(i, 1);
  const shift = x => (x > i ? x - 1 : x);
  G.companions = (Array.isArray(G.companions) ? G.companions : [])
    .filter(x => x !== i).map(shift);
  G.activePet = G.activePet === i ? 0 : shift(G.activePet);
  G.activePet = Math.max(0, Math.min(G.pets.length - 1, G.activePet));
  G.pet = G.pets[G.activePet];
  fixCompanions(G);
  addBells(sellValue(EGG_PRICE));
  return true;
}

// 換一隻帶出來玩；在寵物屋休息的不會餓
// 原本一起逛的那隻變成主要時，舊的主要那隻換去一起逛（蛋不會走路，就回寵物屋）
function setActivePet(i) {
  if (!G.pets[i] || i === G.activePet) return false;
  const old = G.activePet, slot = G.companions.indexOf(i);
  if (slot >= 0) {
    if (G.pets[old].stage === 'egg') G.companions.splice(slot, 1);
    else G.companions[slot] = old;
  } else if (G.pets[old].stage !== 'egg') G.companions.push(old); // 還有位置就留下來一起逛，沒位置 fixCompanions 會送回寵物屋
  G.activePet = i;
  G.pet = G.pets[i];
  G.pet.lastTick = Date.now();
  fixCompanions(G);
  return true;
}

// ── 一起逛的寵物：有幾間房間就能帶幾隻出來（含主要那隻），最多 MAX_PETS_OUT ──
function petsOutLimit(g) { g = g || G; return Math.min(MAX_PETS_OUT, 1 + g.rooms.length); }
function fixCompanions(g) {
  const seen = new Set([g.activePet]);
  g.companions = (Array.isArray(g.companions) ? g.companions : []).filter(i => {
    const ok = Number.isInteger(i) && g.pets[i] && g.pets[i].stage !== 'egg' && !seen.has(i);
    seen.add(i);
    return ok;
  }).slice(0, petsOutLimit(g) - 1);
}
function isCompanion(i) { return G.companions.includes(i); }
function canAddCompanion() { return G.companions.length < petsOutLimit() - 1; }
// 帶出來一起逛 / 回寵物屋；成功回傳 true
function toggleCompanion(i) {
  if (isCompanion(i)) { G.companions = G.companions.filter(x => x !== i); return true; }
  if (!G.pets[i] || i === G.activePet || G.pets[i].stage === 'egg' || !canAddCompanion()) return false;
  G.companions.push(i);
  return true;
}

// ── 寵物照顧 ──
const clampStat = v => Math.max(PET_MIN, Math.min(100, v));

// 依真實經過時間慢慢降低數值（關掉遊戲期間也算），最低停在 PET_MIN
// 一次結算：遊戲開著時最低到 PET_MIN；隔很久才結算（遊戲關著）時最低只到 AWAY_FLOOR，
// 而且原本就比 AWAY_FLOOR 低的不會被拉高
function decayStat(value, mins, perMin) {
  const floor = mins > AWAY_GAP_MIN ? Math.min(value, AWAY_FLOOR) : PET_MIN;
  return Math.max(floor, clampStat(value - mins / perMin));
}
function petTick() {
  const pet = G.pet, kid = G.kid, now = Date.now();
  let changed = false;
  const mins = (now - (pet.lastTick || now)) / 60000;
  if (pet.stage === 'egg') { pet.lastTick = now; } // 蛋不會餓、不會髒
  else if (mins >= .05) { // 大約每 3 秒結算一次
    Object.entries(PET_DECAY_MIN).forEach(([k, per]) => {
      pet[k] = decayStat(pet[k], mins, per);
    });
    pet.lastTick = now;
    changed = true;
  }
  const kidMins = (now - (kid.lastTick || now)) / 60000;
  if (kidMins >= .05) {
    kid.hunger = decayStat(kid.hunger, kidMins, KID_DECAY_MIN);
    kid.lastTick = now;
    changed = true;
  }
  return changed;
}

// ── 小可愛吃東西、慢慢長大（成長值不顯示在畫面上）──
function kidHeightScale() { // 畫面上的大小：成長值越高畫得大一點點，最多大 17%
  return 1 + Math.min(KID_MAX_HEIGHT - KID_START_HEIGHT, Math.max(0, G.kid.height - KID_START_HEIGHT)) / 175;
}
// src 為 'pet' 時吃的是寵物食物（蘋果、牛奶、布丁這些小可愛也能吃）
function feedKid(foodId, src) {
  const stock = src === 'pet' ? G.food : G.kidFood;
  const f = (src === 'pet' ? FOOD_BY_ID : KID_FOOD_BY_ID)[foodId];
  if (!f || !stock[foodId]) return null;
  stock[foodId]--;
  if (!stock[foodId]) delete stock[foodId];
  G.kid.hunger = clampStat(G.kid.hunger + f.hunger);
  const before = G.kid.height;
  G.kid.height = Math.min(KID_MAX_HEIGHT, Math.round((G.kid.height + (f.grow || 0)) * 10) / 10);
  return { grew: Math.round((G.kid.height - before) * 10) / 10 };
}
function buyKidFood(id) {
  const f = KID_FOOD_BY_ID[id];
  if (!spend(f.price)) return false;
  G.kidFood[id] = (G.kidFood[id] || 0) + 1;
  return true;
}
function kidFoodSellBlock(id) { return G.kidFood[id] ? null : '沒有了'; }
function sellKidFood(id) {
  if (kidFoodSellBlock(id)) return 0;
  G.kidFood[id]--;
  if (!G.kidFood[id]) delete G.kidFood[id];
  const v = sellValue(KID_FOOD_BY_ID[id].price);
  G.bells += v;
  return v;
}
function feedPet(foodId) {
  const f = FOOD_BY_ID[foodId];
  if (!G.food[foodId] || G.pet.stage === 'egg') return false;
  G.food[foodId]--;
  if (!G.food[foodId]) delete G.food[foodId];
  G.pet.hunger = clampStat(G.pet.hunger + f.hunger);
  G.pet.mood = clampStat(G.pet.mood + f.mood + 6); // 照顧就會開心，不要讓小孩覺得怎麼照顧都沒用
  return true;
}
function bathPet() {
  if (G.pet.stage === 'egg') return false;
  G.pet.clean = 100;
  G.pet.mood = clampStat(G.pet.mood + 8);
  return true;
}
function patPet(amount) { G.pet.mood = clampStat(G.pet.mood + amount); }
function buyFood(id) {
  const f = FOOD_BY_ID[id];
  if (!spend(f.price)) return false;
  G.food[id] = (G.food[id] || 0) + 1;
  return true;
}

// ── 購買 ──
function buyFurniture(id) {
  const def = FURN_BY_ID[id];
  if (!spend(def.price)) return false;
  addItem(id);
  return true;
}
function buyDeco(kind, id) {
  if (G.away) return false; // 親戚家不能改
  const list = kind === 'wall' ? WALLPAPERS : FLOORS;
  const owned = kind === 'wall' ? G.walls : G.floors;
  const item = list.find(x => x.id === id);
  if (!owned.includes(id)) {
    if (!spend(item.price)) return false;
    owned.push(id);
  }
  curRoom()[kind] = id;
  return true;
}

// ── 賣回商店：一律原價一半（無條件捨去），要再買回就付原價 ──
function sellValue(price) { return Math.floor(price / 2); }

// 回傳不能賣的原因；可以賣回傳 null
function furnSellBlock(id) {
  if (!G.inv[id]) return '沒有了';
  return FURN_BY_ID[id].price ? null : '不能賣';
}
function foodSellBlock(id) { return G.food[id] ? null : '沒有了'; }
function clothesSellBlock(id) {
  const c = CLOTHES_BY_ID[id];
  if (!c.price) return '一開始就有的';
  if (!ownsClothes(id)) return '還沒買';
  if (G.outfit[c.slot] === id) return '正在穿';
  return null;
}
function decoSellBlock(kind, id) {
  const item = (kind === 'wall' ? WALLPAPERS : FLOORS).find(x => x.id === id);
  const owned = kind === 'wall' ? G.walls : G.floors;
  if (!item.price) return '一開始就有的';
  if (!owned.includes(id)) return '還沒買';
  const room = G.rooms.find(r => r[kind] === id);
  if (room) return `${room.name}正在用`;
  return null;
}

// 賣掉一件；成功回傳拿到的鈴錢，不能賣回傳 0（賣東西不算「賺到」，不計入累計賺到）
function sellFurniture(id) {
  if (furnSellBlock(id)) return 0;
  G.inv[id]--;
  if (!G.inv[id]) delete G.inv[id];
  const v = sellValue(FURN_BY_ID[id].price);
  G.bells += v;
  return v;
}
function sellFood(id) {
  if (foodSellBlock(id)) return 0;
  G.food[id]--;
  if (!G.food[id]) delete G.food[id];
  const v = sellValue(FOOD_BY_ID[id].price);
  G.bells += v;
  return v;
}
function sellClothes(id) {
  if (clothesSellBlock(id)) return 0;
  G.wardrobe = G.wardrobe.filter(x => x !== id);
  const v = sellValue(CLOTHES_BY_ID[id].price);
  G.bells += v;
  return v;
}
function sellDeco(kind, id) {
  if (decoSellBlock(kind, id)) return 0;
  const item = (kind === 'wall' ? WALLPAPERS : FLOORS).find(x => x.id === id);
  if (kind === 'wall') G.walls = G.walls.filter(x => x !== id);
  else G.floors = G.floors.filter(x => x !== id);
  const v = sellValue(item.price);
  G.bells += v;
  return v;
}

// ── 擴建 ──
function nextSize(room) {
  const i = ROOM_SIZES.indexOf(room.w);
  return i >= 0 && i < ROOM_SIZES.length - 1 ? ROOM_SIZES[i + 1] : null;
}
function expandRoom() {
  const room = curRoom(), n = nextSize(room);
  if (G.away || !n || !spend(EXPAND_COST[n])) return false;
  room.w = room.d = n; // 往前方擴，原本擺好的家具位置不變
  return true;
}
function newRoomCost() { return NEW_ROOM_COST[G.rooms.length - 1]; }
function canAddRoom() { return G.rooms.length < ROOM_NAMES.length && G.rooms[0].w >= 6; }
// 房間名字清空時用回預設名稱
function renameRoom(i, name) { G.rooms[i].name = (name || '').trim() || ROOM_NAMES[i] || '房間'; }
function addRoom() {
  if (G.away) return false;
  if (!canAddRoom() || !spend(newRoomCost())) return false;
  G.rooms.push({ name: ROOM_NAMES[G.rooms.length], w: 6, d: 6, wall: 'wp_cream', floor: 'fl_wood', items: [], wallItems: [] });
  G.cur = G.rooms.length - 1;
  return true;
}

// ── 居家評分 ──
function roomScore(room) {
  let s = 0;
  const themes = {}, kinds = new Set();
  room.items.concat(room.wallItems || []).forEach(it => {
    const def = FURN_BY_ID[it.id];
    s += Math.round(def.price / 100);
    kinds.add(it.id);
    themes[def.theme] = (themes[def.theme] || 0) + 1;
    // 桌上擺了東西：那樣東西照算，再加一點「有在布置細節」的分
    const td = it.top ? FURN_BY_ID[it.top] : null;
    if (td) {
      s += Math.round(td.price / 100) + 20;
      kinds.add(td.id);
      themes[td.theme] = (themes[td.theme] || 0) + 1;
    }
  });
  s += kinds.size * 30;
  let main = null;
  Object.entries(themes).forEach(([t, n]) => {
    if (n >= 3) s += 300;
    if (n >= 6) s += 500;
    if (!main || n > themes[main]) main = t;
  });
  const wp = WALLPAPERS.find(x => x.id === room.wall), fl = FLOORS.find(x => x.id === room.floor);
  if (main && themes[main] >= 3) {
    if (wp && wp.theme === main) s += 200;
    if (fl && fl.theme === main) s += 200;
  }
  return { score: s, main };
}
function totalScore() { return G.rooms.reduce((a, r) => a + roomScore(r).score, 0); }

// ── 賺錢 ──
function claimGift() {
  if (G.lastGift === today()) return 0;
  G.lastGift = today();
  addBells(1000);
  return 1000;
}
function claimScore() {
  if (G.lastClaim === today()) return 0;
  const s = totalScore();
  if (s <= 0) return 0;
  G.lastClaim = today();
  addBells(s);
  return s;
}

let treeReadyAt = 0;
function shakeTree() {
  const now = Date.now();
  if (now < treeReadyAt) return { wait: Math.ceil((treeReadyAt - now) / 1000) };
  regen(G.tree, TREE_MAX, TREE_REGEN_MS);
  if (G.tree.n <= 0) return { tired: true };
  G.tree.n--;
  treeReadyAt = now + 1500; // 只是讓樹晃完，次數限制靠 G.tree
  const r = Math.random();
  if (r < .68) {
    const n = 50 + Math.floor(Math.random() * 25) * 10;
    addBells(n);
    return { bells: n };
  }
  if (r < .76) {
    G.food.apple = (G.food.apple || 0) + 1;
    return { food: FOOD_BY_ID.apple };
  }
  if (r < .9) {
    const pool = FURNITURE.filter(f => f.price <= 3000 && !f.gift);
    const def = pool[Math.floor(Math.random() * pool.length)];
    addItem(def.id);
    return { item: def };
  }
  return { bees: true };
}

function rollFish() {
  const total = FISH.reduce((a, f) => a + f.weight, 0);
  let r = Math.random() * total;
  for (const f of FISH) { if ((r -= f.weight) < 0) return f; }
  return FISH[0];
}
function catchFish(f) {
  G.fish[f.name] = (G.fish[f.name] || 0) + 1;
  addBells(f.price);
}

<script>
// Q 版小女孩：妹妹頭（程式繪製，不含照片）。衣服依 o.outfit 換裝，預設是白色制服、紅短褲、黑皮鞋
'use strict';

const GIRL = {
  skin: '#f6cfb0', skinShade: '#e8b394', hair: '#211a1a', hairHi: '#3a2f2e',
  sock: '#ffffff', line: 'rgba(50,35,30,.55)', blush: 'rgba(255,120,120,.45)',
  // 制服專用
  uniformShade: '#e3e1d8', uniformCollar: '#2c6a50', uniformStripe: '#e98a3c', lanyard: '#3452a8'

function rr(ctx, x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.fillStyle = fill;
  ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}
function star(ctx, cx, cy, r, color) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * .45 : r;
    ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
