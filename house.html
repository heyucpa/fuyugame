/* ── 🔎 找書：把書放回對的書架 ──
   簡單看顏色、普通看數字（1~40 分四格）、挑戰看三位數的書號（像真的圖書館）。畫面上不寫年級。 */
const SHELF_LEVELS = [
  { name: '簡單', sub: '看顏色', mul: 1, shelves: [['紅', '#e8505b'], ['藍', '#3f8ee0'], ['綠', '#5fae6f'], ['黃', '#ffcf3a']] },
  { name: '普通', sub: '看數字', mul: 2, shelves: [[1, 10], [11, 20], [21, 30], [31, 40]] },
  { name: '挑戰！', sub: '看書號', mul: 3, shelves: [[100, 299], [300, 499], [500, 699], [700, 999]] }
];
const SHELF_N = 10;
// 出一本書：{ label, color, ans }（ans＝第幾個書架）
function shelfBook(L) {
  const ans = Math.floor(Math.random() * 4);
  if (L === SHELF_LEVELS[0]) return { label: '', color: L.shelves[ans][1], ans };
  const [lo, hi] = L.shelves[ans];
  const n = lo + Math.floor(Math.random() * (hi - lo + 1));
  return { label: String(n), color: ['#e8c99a', '#cfe6ff', '#d9f3df', '#ffe3ec'][Math.floor(Math.random() * 4)], ans };
}
function openShelfGame() {
  const w = openGameWindow('🔎 找書', '把書放回對的書架！看書上的顏色或號碼，點對的那一格。一共 10 本。');
  pickLevelRow(w, SHELF_LEVELS, L => `${L.sub}・一本 💰 ${15 * L.mul}`, L => playShelf(w, L));
}
function playShelf(w, L) {
  w.stage.innerHTML = '';
  let n = 0, right = 0, book = null, locked = false, ended = false, timer = 0;
  gameCleanup = () => clearTimeout(timer);
  const box = el('div', 'shelf-game');
  const bookEl = el('div', 'shelf-book'), row = el('div', 'shelf-row');
  box.append(bookEl, row);
  w.stage.appendChild(box);
  const btns = L.shelves.map((s, i) => {
    const b = el('button', 'shelf-slot');
    if (L === SHELF_LEVELS[0]) { b.style.background = s[1]; b.textContent = '📚'; }
    else b.textContent = `${s[0]}～${s[1]}`;
    b.onclick = () => choose(i);
    row.appendChild(b);
    return b;
  });
  function show() {
    book = shelfBook(L); locked = false;
    bookEl.style.background = book.color;
    bookEl.textContent = book.label || '📕';
    btns.forEach(b => b.classList.remove('right', 'wrong'));
    w.status.textContent = `${L.name}　第 ${n + 1} / ${SHELF_N} 本　放對 ${right} 本`;
  }
  function choose(i) {
    if (locked || ended) return;
    locked = true;
    const ok = i === book.ans;
    if (ok) { right++; Sound.play('coin'); } else Sound.play('bad');
    btns[book.ans].classList.add('right');
    if (!ok) btns[i].classList.add('wrong');
    n++;
    timer = setTimeout(() => (n >= SHELF_N ? finish() : show()), ok ? 600 : 1300);
  }
  function finish() {
    if (ended) return;
    ended = true; clearTimeout(timer);
    const all = right === SHELF_N;
    const bells = payReward(w, right * 15 * L.mul + (all ? 100 * L.mul : 0));
    w.stage.innerHTML = '';
    w.stage.appendChild(el('div', 'quiz-end', all ? '💯' : '📚'));
    w.status.textContent = `放對 ${right} / ${SHELF_N} 本${all ? '，全對！' : ''}　💰 +${fmt(bells)}`;
    toast(`🔎 找書放對 ${right} 本，拿到 💰 ${fmt(bells)}`);
    gameButtons(w, openShelfGame);
  }
  openShelfGame.test = { book: () => book, choose, right: () => right, level: L,
                         next: () => { clearTimeout(timer); if (!ended) (n >= SHELF_N ? finish() : show()); } };
  show();
}

// ── 叔叔的打磚塊：左右移動板子接球，把磚塊全部打掉 ──
function openBrickGame() {
  const w = openGameWindow('🕹️ 叔叔的打磚塊', '左右移動板子接住球，把磚塊全部打掉！有 3 條命。點一下（或按空白鍵）發球，電腦可以用方向鍵。');
  const W = 360, H = 420, { c, g, pos } = gameCanvas(w.stage, W, H);
  const COLS = 7, ROWS = 5, BW = (W - 24) / COLS, BH = 16, TOP = 50;
  const COLORS = ['#ff6b6b', '#ffb84d', '#ffe066', '#7bd389', '#6bb6ff'];
  let bricks = [], paddle = { x: W / 2, w: 74 }, target = W / 2, ball, lives = 3, score = 0, keys = {}, raf = 0, ended = false, last = performance.now();
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) bricks.push({ x: 12 + i * BW, y: TOP + j * (BH + 4), c: COLORS[j] });
  const resetBall = () => { ball = { x: paddle.x, y: H - 44, vx: 0, vy: 0, r: 6, stuck: true, speed: 230 }; };
  resetBall();

  const launch = () => {
    if (ended || !ball.stuck) return;
    ball.stuck = false;
    const ang = -Math.PI / 2 + (Math.random() - .5) * .8;
    ball.vx = Math.cos(ang) * ball.speed; ball.vy = Math.sin(ang) * ball.speed;
    Sound.play('jump');
  };
  const onMove = e => { target = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, pos(e).x)); };
  const onKey = e => {
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') { keys[e.code] = e.type === 'keydown'; e.preventDefault(); }
    if (e.code === 'Space' && e.type === 'keydown') { e.preventDefault(); launch(); }
  };
  c.addEventListener('pointermove', onMove);
  c.addEventListener('pointerdown', e => { onMove(e); launch(); });
  document.addEventListener('keydown', onKey);
  document.addEventListener('keyup', onKey);
  gameCleanup = () => { cancelAnimationFrame(raf); document.removeEventListener('keydown', onKey); document.removeEventListener('keyup', onKey); };

  function finish(cleared) {
    ended = true;
    const bells = payReward(w, score + (cleared ? 200 : 0));
    w.status.textContent = cleared ? `🎉 全部打掉了！拿到 ${fmt(bells)} 鈴錢（全破加獎 200）` : `遊戲結束！打掉 ${score / 10} 塊，拿到 ${fmt(bells)} 鈴錢`;
    gameButtons(w, openBrickGame);
  }

  function frame(now) {
    const dt = Math.max(0, Math.min(.03, (now - last) / 1000)); last = now;
    if (keys.ArrowLeft) target = Math.max(paddle.w / 2, target - 360 * dt);
    if (keys.ArrowRight) target = Math.min(W - paddle.w / 2, target + 360 * dt);
    paddle.x += (target - paddle.x) * Math.min(1, dt * 16);
    const py = H - 30;
    if (!ended) {
      if (ball.stuck) { ball.x = paddle.x; ball.y = py - 12; }
      else {
        ball.x += ball.vx * dt; ball.y += ball.vy * dt;
        if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
        if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
        if (ball.y < ball.r + 30) { ball.y = ball.r + 30; ball.vy = Math.abs(ball.vy); }
        // 板子：打在越邊邊，球彈得越斜
        if (ball.vy > 0 && ball.y + ball.r > py && ball.y < py + 10 && Math.abs(ball.x - paddle.x) < paddle.w / 2 + ball.r) {
          const off = (ball.x - paddle.x) / (paddle.w / 2), ang = -Math.PI / 2 + off * 1.05;
          ball.vx = Math.cos(ang) * ball.speed; ball.vy = Math.sin(ang) * ball.speed;
          ball.y = py - ball.r;
          Sound.play('click');
        }
        // 磚塊
        for (let i = 0; i < bricks.length; i++) {
          const b = bricks[i];
          if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + BW - 4 && ball.y + ball.r > b.y && ball.y - ball.r < b.y + BH) {
            bricks.splice(i, 1);
            const fromSide = ball.x < b.x || ball.x > b.x + BW - 4;
            if (fromSide) ball.vx = -ball.vx; else ball.vy = -ball.vy;
            score += 10;
            ball.speed = Math.min(380, ball.speed + 4);
            const sp = Math.hypot(ball.vx, ball.vy); ball.vx *= ball.speed / sp; ball.vy *= ball.speed / sp;
            Sound.play('stack');
            break;
          }
        }
        if (!bricks.length) finish(true);
        else if (ball.y > H + 10) { // 漏接
          lives--;
          Sound.play('miss');
          if (lives <= 0) finish(false); else resetBall();
        }
      }
    }

    g.clearRect(0, 0, W, H);
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#1f2a4a'); bg.addColorStop(1, '#3d2a78');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    bricks.forEach(b => {
      g.fillStyle = b.c; g.beginPath(); g.roundRect(b.x, b.y, BW - 4, BH, 4); g.fill();
      g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(b.x + 3, b.y + 3, BW - 10, 3);
    });
    g.fillStyle = '#ffffff'; g.beginPath(); g.roundRect(paddle.x - paddle.w / 2, py, paddle.w, 10, 5); g.fill();
    g.fillStyle = '#b18cff'; g.fillRect(paddle.x - paddle.w / 2 + 6, py + 3, paddle.w - 12, 3);
    if (!ended) { g.fillStyle = '#ffd35c'; g.beginPath(); g.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = '#ffffff'; g.font = 'bold 17px "Noto Sans TC", "Microsoft JhengHei", sans-serif'; g.textBaseline = 'middle';
    g.textAlign = 'left'; g.fillText(`分數 ${score}`, 12, 16);
    g.textAlign = 'right'; g.fillText('❤️'.repeat(Math.max(0, lives)), W - 12, 16);
    if (ball.stuck && !ended) { g.textAlign = 'center'; g.fillStyle = '#ffe066'; g.fillText('點一下發球！', W / 2, H / 2 + 40); }
    g.textAlign = 'start';
    if (!ended) raf = requestAnimationFrame(frame);
  }
  w.status.textContent = '叔叔：「來，讓我看看你的厲害！」';
  gameButtons(w, openBrickGame);
  raf = requestAnimationFrame(frame);
}

// ── 阿婆的照顧小牛小羊：頭上冒出想要的東西，選對工具再點牠 ──
function openFarmGame() {
  const w = openGameWindow('🐮 照顧小牛小羊', '小牛、小羊頭上會冒出想要的東西。先點下面的工具，再點那隻動物！45 秒內照顧越多次越好。');
  const W = 360, H = 280, { c, g, pos } = gameCanvas(w.stage, W, H);
  const TOOLS = [['feed', '🌾', '飼料'], ['water', '💧', '喝水'], ['brush', '🪥', '梳毛']];
  const animals = FARM_ANIMALS.map((sp, i) => ({ sp, x: 95 + i * 170, need: null, needUntil: 0, nextNeedAt: performance.now() + 800 + i * 900,
    happyUntil: 0, sadUntil: 0, hop: 0, hearts: [] }));
  let tool = null, score = 0, raf = 0, ended = false, timers = [];
  const start = performance.now(), DURATION = 45000;
  let last = start;

  // 工具按鈕
  const bar = el('div', 'farm-tools');
  const btns = TOOLS.map(([id, emoji, name]) => {
    const b = el('button', 'farm-tool', `${emoji} ${name}`);
    b.onclick = () => { tool = id; btns.forEach(x => x.classList.toggle('on', x === b)); Sound.play('click'); };
    bar.appendChild(b);
    return b;
  });
  w.stage.appendChild(bar);
  gameCleanup = () => { cancelAnimationFrame(raf); timers.forEach(clearTimeout); };

  c.addEventListener('pointerdown', e => {
    if (ended) return;
    const p = pos(e), now = performance.now();
    const an = animals.find(a => Math.abs(p.x - a.x) < 70 && p.y > 90 && p.y < 260);
    if (!an) return;
    if (!an.need) { // 沒有要東西：摸摸
      an.hop = 1; an.happyUntil = now + 600;
      an.hearts.push({ x: an.x, y: 150, age: 0 });
      Sound.play('pickUp');
      return;
    }
    if (!tool) { w.status.textContent = '先點下面的工具喔！'; Sound.play('miss'); return; }
    if (tool === an.need) {
      score++;
      an.need = null; an.happyUntil = now + 1200; an.hop = 1;
      an.nextNeedAt = now + 900 + Math.random() * 1600;
      for (let k = 0; k < 3; k++) an.hearts.push({ x: an.x + (k - 1) * 14, y: 150, age: -k * .1 });
      Sound.play('petHappy');
      w.status.textContent = `照顧了 ${score} 次！`;
    } else {
      Sound.play('miss');
      w.status.textContent = `${an.sp.short}想要的不是這個喔～`;
    }
  });

  function finish() {
    ended = true;
    const bonus = score >= 14 ? 150 : 0;
    const bells = payReward(w, score * 25 + bonus, () => { if (score >= 8) G.food.milk = (G.food.milk || 0) + 1; });
    w.status.textContent = `🎉 時間到！照顧了 ${score} 次，拿到 ${fmt(bells)} 鈴錢${bonus ? '（加獎 150）' : ''}${score >= 8 ? '，阿婆還送你一瓶🥛牛奶！' : ''}`;
    gameButtons(w, openFarmGame);
  }

  function frame(now) {
    const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now;
    const left = Math.max(0, DURATION - (now - start));
    animals.forEach(a => {
      if (!ended && !a.need && now > a.nextNeedAt && left > 1500) {
        a.need = TOOLS[Math.floor(Math.random() * TOOLS.length)][0];
        a.needUntil = now + 6000;
      }
      if (a.need && now > a.needUntil) { a.need = null; a.sadUntil = now + 1200; a.nextNeedAt = now + 1200; } // 太久沒照顧：難過一下
      a.hop = Math.max(0, a.hop - dt * 3);
      a.hearts.forEach(h => { h.age += dt; h.y -= 40 * dt; });
      a.hearts = a.hearts.filter(h => h.age < 1);
    });

    g.clearRect(0, 0, W, H);
    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#bfe6f2'); sky.addColorStop(1, '#e8f5e4');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    g.fillStyle = '#8fc27a'; g.fillRect(0, 200, W, H - 200);
    g.fillStyle = '#c9925a'; // 圍籬
    for (let x = 10; x < W; x += 40) g.fillRect(x, 170, 6, 36);
    g.fillRect(0, 178, W, 5); g.fillRect(0, 192, W, 5);
    animals.forEach(a => {
      const y = 240 - Math.sin(a.hop * Math.PI) * 14;
      g.save(); g.translate(a.x, y); g.scale(2.6, 2.6);
      drawCreature(g, a.sp, { happy: now < a.happyUntil, sad: now < a.sadUntil, clean: 100 });
      g.restore();
      g.fillStyle = '#4a3b2a'; g.font = 'bold 14px "Noto Sans TC", "Microsoft JhengHei", sans-serif'; g.textAlign = 'center';
      g.fillText(a.sp.short, a.x, 268);
      if (a.need) { // 想要的東西
        const t = TOOLS.find(x => x[0] === a.need), frac = Math.max(0, (a.needUntil - now) / 6000);
        g.fillStyle = 'rgba(255,255,255,.96)'; g.strokeStyle = frac < .35 ? '#e8505b' : 'rgba(74,59,42,.35)'; g.lineWidth = 2;
        g.beginPath(); g.arc(a.x + 30, 100, 22, 0, Math.PI * 2); g.fill(); g.stroke();
        g.font = '24px "Segoe UI Emoji", sans-serif'; g.textBaseline = 'middle';
        g.fillText(t[1], a.x + 30, 101);
      }
      g.font = '14px "Segoe UI Emoji", sans-serif';
      a.hearts.forEach(h => { if (h.age >= 0) { g.globalAlpha = 1 - h.age; g.fillText('💗', h.x, h.y); g.globalAlpha = 1; } });
    });
    g.fillStyle = '#4a3b2a'; g.font = 'bold 17px "Noto Sans TC", "Microsoft JhengHei", sans-serif'; g.textBaseline = 'middle';
    g.textAlign = 'left'; g.fillText(`照顧 ${score} 次`, 12, 20);
    g.textAlign = 'right'; g.fillText(`⏱ ${Math.ceil(left / 1000)}`, W - 12, 20);
    g.textAlign = 'start';
    if (left <= 0 && !ended) { finish(); return; }
    if (!ended) raf = requestAnimationFrame(frame);
  }
  w.status.textContent = '阿婆：「牠們肚子餓了，幫阿婆照顧一下好不好？」';
  gameButtons(w, openFarmGame);
  raf = requestAnimationFrame(frame);
}
</script>
<script>
/* ===== 小遊戲：接金幣 =====
   手指按著籃子左右移動就好，不用準度、不用連打。
   難度只改「掉得多快、掉多久」，不改操作方式——
   小一的妹妹玩簡單的，姊姊想拚就玩快的。

   掉下來的有金幣也有炸彈：全部都是金幣的話，閉著眼睛左右掃就滿分了。 */
const COIN_LEVELS = [
  { name: '慢慢來', sec: 30, fall: 90,  gap: 900, bomb: .12, mul: 1 },
  { name: '普通',   sec: 30, fall: 140, gap: 700, bomb: .18, mul: 2 },
  { name: '好快！', sec: 30, fall: 200, gap: 520, bomb: .24, mul: 3 }
];

function openCoinGame() {
  const w = openGameWindow('🪙 接金幣', '手指按著籃子左右移動，接住掉下來的金幣。碰到炸彈會掉一顆喔！');
  pickLevel();

  function pickLevel() {
    w.stage.innerHTML = ''; w.btns.innerHTML = '';
    w.status.textContent = '選一個難度';
    leaveButton(w);
    const row = el('div', 'lv-row');
    COIN_LEVELS.forEach((L, i) => {
      const b = levelButton(i);
      b.append(el('span', 'lv-n', L.name), el('span', 'lv-p', `一顆 💰 ${L.mul * 20}`));
      b.onclick = () => { Sound.play('click'); play(L); };
      row.appendChild(b);
    });
    w.stage.appendChild(row);
  }

  function play(L) {
    w.stage.innerHTML = '';
    const W = 320, H = 400, { c, g, pos } = gameCanvas(w.stage, W, H);
    const GY = H - 26, BW = 54;
    let bx = W / 2, items = [], got = 0, left = L.sec, raf = 0, ended = false;
    let last = performance.now(), nextDrop = 0, timers = [];
    gameCleanup = () => { cancelAnimationFrame(raf); timers.forEach(clearTimeout); };

    const move = e => { if (!ended) bx = Math.max(BW / 2, Math.min(W - BW / 2, pos(e).x)); };
    c.addEventListener('pointerdown', e => { move(e); try { c.setPointerCapture(e.pointerId); } catch (err) {} });
    c.addEventListener('pointermove', move);

    const tick = setInterval(() => {
      if (ended) return;
      left--;
      w.status.textContent = `${L.name}　還有 ${left} 秒　接到 ${got} 個`;
      if (left <= 0) finish();
    }, 1000);
    timers.push(tick);
    w.status.textContent = `${L.name}　還有 ${left} 秒　接到 0 個`;

    function finish() {
      if (ended) return;
      ended = true;
      clearInterval(tick);
      const bells = payReward(w, Math.max(0, got) * 20 * L.mul);
      w.status.textContent = `接到 ${got} 個！💰 +${fmt(bells)}`;
      toast(`🪙 接到 ${got} 個，拿到 💰 ${fmt(bells)}`);
      gameButtons(w, () => pickLevel());
    }
    openCoinGame.test = { finish: finish, hit: n => { got += n; }, level: L };

    (function frame(now) {
      now = now || performance.now();
      const dt = Math.max(0, Math.min(.05, (now - last) / 1000));
      last = now;
      if (!ended) {
        if (now > nextDrop) {
          nextDrop = now + L.gap * (.7 + Math.random() * .6);
          items.push({ x: 20 + Math.random() * (W - 40), y: -14,
                       bomb: Math.random() < L.bomb });
        }
        items.forEach(it => { it.y += L.fall * dt; });
        items = items.filter(it => {
          if (it.y > GY - 16 && it.y < GY + 6 && Math.abs(it.x - bx) < BW / 2 + 8) {
            if (it.bomb) { got = Math.max(0, got - 1); Sound.play('bad'); }
            else { got++; Sound.play('coin'); }
            w.status.textContent = `${L.name}　還有 ${left} 秒　接到 ${got} 個`;
            return false;
          }
          return it.y < H + 20;
        });
      }
      g.clearRect(0, 0, W, H);
      const sky = g.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#dff1fb'); sky.addColorStop(1, '#f6f2e6');
      g.fillStyle = sky; g.fillRect(0, 0, W, H);
      g.fillStyle = '#e4d8c3'; g.fillRect(0, GY + 10, W, H - GY - 10);
      items.forEach(it => {
        if (it.bomb) {
          g.fillStyle = '#3b3340';
          g.beginPath(); g.arc(it.x, it.y, 11, 0, Math.PI * 2); g.fill();
          g.strokeStyle = '#c9772e'; g.lineWidth = 2.4;
          g.beginPath(); g.moveTo(it.x + 6, it.y - 9); g.quadraticCurveTo(it.x + 13, it.y - 17, it.x + 8, it.y - 22); g.stroke();
        } else {
          g.fillStyle = '#f2c230';
          g.beginPath(); g.arc(it.x, it.y, 11, 0, Math.PI * 2); g.fill();
          g.strokeStyle = '#c99a20'; g.lineWidth = 2; g.stroke();
          g.fillStyle = '#fff3c4'; g.font = 'bold 13px sans-serif';
          g.textAlign = 'center'; g.textBaseline = 'middle';
          g.fillText('$', it.x, it.y + 1); g.textAlign = 'start';
        }
      });
      // 籃子
      g.fillStyle = '#c98f52';
      g.beginPath();
      g.moveTo(bx - BW / 2, GY - 14); g.lineTo(bx + BW / 2, GY - 14);
      g.lineTo(bx + BW / 2 - 7, GY + 10); g.lineTo(bx - BW / 2 + 7, GY + 10);
      g.closePath(); g.fill();
      g.strokeStyle = '#8a5a33'; g.lineWidth = 2.4; g.stroke();
      g.strokeStyle = '#e0b07a'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(bx - BW / 2 + 3, GY - 8); g.lineTo(bx + BW / 2 - 3, GY - 8); g.stroke();
      if (!ended) raf = requestAnimationFrame(frame);
    })();
  }
}

/* ===== 小遊戲：彈珠台 =====
   刻意不是「瞄準用力丟」——那個彈弓已經做過了，而且小一的妹妹瞄不準。
   這裡是放下去讓它自己彈：撞釘子、掉進下面的格子，純看運氣，
   每一顆都有驚喜，完全沒有技巧門檻。
   她能決定的只有「從哪裡放」，那一點點控制感剛剛好。 */
const MARBLE_N = 5;                     // 一局五顆
const MARBLE_SLOTS = [10, 50, 10, 100, 10, 50, 10];   // 下面七格，中間那格最高

function openMarbleGame() {
  const w = openGameWindow('⚪ 彈珠台', `點畫面上方放下彈珠，它會撞來撞去掉進下面的格子。一局 ${MARBLE_N} 顆，中間那格分數最高！`);
  const W = 320, H = 420, { c, g, pos } = gameCanvas(w.stage, W, H);
  const R = 8, GRAV = 560, TOP = 54, SLOT_Y = H - 56;
  // 釘子：交錯排列
  const pegs = [];
  for (let row = 0; row < 6; row++) {
    const n = row % 2 ? 6 : 7, dx = W / (n + 1);
    for (let i = 1; i <= n; i++) pegs.push({ x: dx * i, y: TOP + 42 + row * 44 });
  }
  const slotW = W / MARBLE_SLOTS.length;
  let ball = null, score = 0, shots = MARBLE_N, raf = 0, ended = false;
  let last = performance.now(), msg = '', msgUntil = 0;
  gameCleanup = () => cancelAnimationFrame(raf);
  w.status.textContent = `還有 ${shots} 顆　分數 0`;
  leaveButton(w);

  function drop(x) {
    if (ended || ball || shots <= 0) return;
    ball = { x: Math.max(R + 2, Math.min(W - R - 2, x)), y: TOP - 10, vx: (Math.random() - .5) * 30, vy: 0 };
    shots--;
    w.status.textContent = `還有 ${shots} 顆　分數 ${score}`;
    Sound.play('pickUp');
  }
  c.addEventListener('pointerdown', e => drop(pos(e).x));
  openMarbleGame.test = { drop: drop, state: () => ({ shots, score, ended, ball: !!ball }),
                          slots: MARBLE_SLOTS };

  function land() {
    const i = Math.max(0, Math.min(MARBLE_SLOTS.length - 1, Math.floor(ball.x / slotW)));
    const pts = MARBLE_SLOTS[i];
    score += pts;
    msg = `+${pts}`; msgUntil = performance.now() + 900;
    Sound.play(pts >= 100 ? 'petHappy' : 'coin');
    ball = null;
    w.status.textContent = `還有 ${shots} 顆　分數 ${score}`;
    if (shots <= 0) finish();
  }
  function finish() {
    ended = true;
    const bells = payReward(w, score * 3);
    w.status.textContent = `總分 ${score}！💰 +${fmt(bells)}`;
    toast(`⚪ 總分 ${score}，拿到 💰 ${fmt(bells)}`);
    gameButtons(w, () => { closeGameWindow(); openMarbleGame(); });
  }

  (function frame(now) {
    now = now || performance.now();
    const dt = Math.max(0, Math.min(.03, (now - last) / 1000));
    last = now;
    if (ball) {
      ball.vy += GRAV * dt;
      ball.x += ball.vx * dt; ball.y += ball.vy * dt;
      if (ball.x < R) { ball.x = R; ball.vx = Math.abs(ball.vx) * .7; }
      if (ball.x > W - R) { ball.x = W - R; ball.vx = -Math.abs(ball.vx) * .7; }
      pegs.forEach(p => {
        const dx = ball.x - p.x, dy = ball.y - p.y, d = Math.hypot(dx, dy);
        if (d < R + 5 && d > 0) {
          const nx = dx / d, ny = dy / d;
          ball.x = p.x + nx * (R + 5.5); ball.y = p.y + ny * (R + 5.5);
          const dot = ball.vx * nx + ball.vy * ny;
          ball.vx = (ball.vx - 2 * dot * nx) * .62 + (Math.random() - .5) * 24;
          ball.vy = (ball.vy - 2 * dot * ny) * .62;
        }
      });
      if (ball.y > SLOT_Y) land();
    }
    g.clearRect(0, 0, W, H);
    g.fillStyle = '#f6f1e4'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#efe6d2'; g.fillRect(0, 0, W, TOP);
    g.fillStyle = '#8a7a60'; g.font = '600 13px "Noto Sans TC", sans-serif';
    g.textAlign = 'center'; g.fillText('點這裡放下彈珠', W / 2, TOP - 18); g.textAlign = 'start';
    pegs.forEach(p => {
      g.fillStyle = '#c7b89a';
      g.beginPath(); g.arc(p.x, p.y, 5, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#a2906e'; g.lineWidth = 1.4; g.stroke();
    });
    MARBLE_SLOTS.forEach((pts, i) => {
      const x = i * slotW;
      g.fillStyle = pts >= 100 ? '#ffe3a8' : pts >= 50 ? '#e2f0d8' : '#eee8dc';
      g.fillRect(x + 1, SLOT_Y, slotW - 2, H - SLOT_Y);
      g.strokeStyle = '#c7b89a'; g.lineWidth = 1.5;
      g.strokeRect(x + 1, SLOT_Y, slotW - 2, H - SLOT_Y);
      g.fillStyle = '#6b5a3e'; g.font = 'bold 14px sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(String(pts), x + slotW / 2, SLOT_Y + 22); g.textAlign = 'start';
    });
    if (ball) {
      g.fillStyle = '#7fc0e8';
      g.beginPath(); g.arc(ball.x, ball.y, R, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#4d93bd'; g.lineWidth = 2; g.stroke();
      g.fillStyle = 'rgba(255,255,255,.75)';
      g.beginPath(); g.arc(ball.x - 2.5, ball.y - 3, 2.6, 0, Math.PI * 2); g.fill();
    }
    if (now < msgUntil) {
      g.fillStyle = '#c9772e'; g.font = 'bold 22px sans-serif';
      g.textAlign = 'center'; g.fillText(msg, W / 2, SLOT_Y - 24); g.textAlign = 'start';
    }
    if (!ended) raf = requestAnimationFrame(frame);
  })();
}

/* ===== 小遊戲：拼圖 =====
   給小一的妹妹做的：不用反應速度、不用拖曳，點兩下交換就好。
   圖案用她自己的寵物畫出來——不用準備任何圖檔，而且每個人的不一樣。

   難度 = 片數，越難獎金越高。打亂之後一定會檢查「不是已經完成的」，
   不然她偶爾會拿到一張已經拼好的圖，莫名其妙就過關了。 */
const PUZZLE_LEVELS = [
  { n: 2, name: '4 片',  pay: 150 },
  { n: 3, name: '9 片',  pay: 400 },
  { n: 4, name: '16 片', pay: 900 }
];

function openPuzzleGame() {
  const w = openGameWindow('🧩 拼圖', '點一片、再點另一片，就會交換位置。全部排回原樣就過關！');
  pickLevel();

  function pickLevel() {
    w.stage.innerHTML = ''; w.btns.innerHTML = '';
    w.status.textContent = '選一個難度';
    leaveButton(w);
    const row = el('div', 'lv-row');
    PUZZLE_LEVELS.forEach((L, i) => {
      const b = levelButton(i);
      b.append(el('span', 'lv-n', L.name), el('span', 'lv-p', `💰 ${fmt(L.pay)}`));
      b.onclick = () => { Sound.play('click'); play(L); };
      row.appendChild(b);
    });
    w.stage.appendChild(row);
  }

  function play(L) {
    w.stage.innerHTML = '';
    const SZ = 264, n = L.n, cell = SZ / n;
    // 原圖：她現在照顧的那隻寵物，放大畫一次
    const src = document.createElement('canvas');
    const dpr = window.devicePixelRatio || 1;
    src.width = src.height = SZ * dpr;
    const sg = src.getContext('2d');
    sg.setTransform(dpr, 0, 0, dpr, 0, 0);
    sg.fillStyle = '#fdf6e8'; sg.fillRect(0, 0, SZ, SZ);
    const pic = renderPetPortrait(G.pet, SZ, SZ);
    sg.drawImage(pic, 0, 0, SZ, SZ);

    // 打亂；排到不是已經完成的為止
    let order = [];
    for (let i = 0; i < n * n; i++) order.push(i);
    const solved = () => order.every((v, i) => v === i);
    let guard = 0;
    do {
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
    } while (solved() && guard++ < 20);

    let picked = -1, moves = 0, done = false;
    const board = el('div', 'puz-board');
    board.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
    board.style.width = board.style.height = SZ + 'px';
    const tiles = [];
    for (let i = 0; i < n * n; i++) {
      const t = el('div', 'puz-tile');
      t.onclick = () => tap(i);
      board.appendChild(t);
      tiles.push(t);
    }
    w.stage.appendChild(board);
    openPuzzleGame.test = { n: n, order: () => order.slice(), tap: tap,
                            solved: () => solved() };
    paint();
    w.status.textContent = `${L.name}　移動 0 次`;
    gameButtons(w, () => pickLevel());

    function paint() {
      tiles.forEach((t, pos) => {
        const piece = order[pos];
        const px = (piece % n) * cell, py = Math.floor(piece / n) * cell;
        t.style.backgroundImage = `url(${src.toDataURL()})`;
        t.style.backgroundSize = `${SZ}px ${SZ}px`;
        t.style.backgroundPosition = `-${px}px -${py}px`;
        t.classList.toggle('on', pos === picked);
        t.classList.toggle('ok', done);
      });
    }
    function tap(pos) {
      if (done) return;
      if (picked < 0) { picked = pos; Sound.play('pickUp'); paint(); return; }
      if (picked === pos) { picked = -1; paint(); return; }
      [order[picked], order[pos]] = [order[pos], order[picked]];
      picked = -1; moves++;
      Sound.play('click');
      paint();
      w.status.textContent = `${L.name}　移動 ${moves} 次`;
      if (solved()) win();
    }
    function win() {
      done = true; paint();
      // 步數少有額外獎金：剛好是「想一下再動」會拿到的那種
      const quick = moves <= n * n * 1.5;
      const bells = payReward(w, L.pay + (quick ? Math.round(L.pay / 2) : 0));
      w.status.textContent = `拼好了！移動 ${moves} 次${quick ? '（很有效率！）' : ''}　💰 +${fmt(bells)}`;
      toast(`🧩 拼好了！拿到 💰 ${fmt(bells)}`);
    }
  }
}

// 小遊戲：彈弓丟蘋果（往後拉再放開，打倒木箱、打破氣球）
'use strict';

function openSlingGame() {
  const w = openGameWindow('🎯 彈弓丟蘋果', '往後拉彈弓再放開，蘋果會飛出去！打破所有氣球就過關，一關有 3 顆蘋果，共 3 關。');
  const W = 360, H = 420, { c, g, pos } = gameCanvas(w.stage, W, H);
  /* 彈弓本來在 x=62，最大拉距 72——要拉滿得拉到 x=-10，在畫面外，
     根本拉不到。結果是「水平方向永遠拉不滿」：想拉滿只能往正下方拉，
     但那樣蘋果是往上飛的。往右挪到 96 之後，拉滿落在 x=24，
     離左邊還有 24 的餘裕，手指不會被畫面邊緣卡住。
     距離變近 34，但滿拉的射程有 466，打最遠的箱子（x≈314）綽綽有餘。 */
  const GY = 382, ANCHOR = { x: 96, y: 312 }, R = 9, GRAV = 900, MAXPULL = 72;
  const EDGE = 4;   // 瞄準點夾在畫布裡面留的邊
  /* 給走查看的。要擋的是「拉滿的位置落在畫面外」——
     那是一個幾何條件，不是畫面上看得出來的東西，
     只靠模擬手指去點是驗不到的（拉不滿一樣射得出去，只是軟綿綿的）。 */
  openSlingGame.geom = { W: W, H: H, anchor: ANCHOR, maxPull: MAXPULL, edge: EDGE };
  // 每一關：木箱 [x, y, 寬, 高]，氣球 [x, y]
  const LEVELS = [
    { boxes: [[240, 360, 22, 22], [240, 338, 22, 22], [300, 360, 22, 22], [300, 338, 22, 22], [236, 326, 90, 12]],
      balloons: [[271, 306], [271, 352]] },
    { boxes: [[225, 360, 22, 22], [225, 338, 22, 22], [225, 316, 22, 22], [305, 360, 22, 22], [305, 338, 22, 22], [305, 316, 22, 22],
      [221, 304, 110, 12], [255, 292, 22, 22], [283, 292, 22, 22], [251, 280, 58, 12]],
      balloons: [[276, 262], [265, 350], [205, 352]] },
    { boxes: [[210, 360, 22, 22], [210, 338, 22, 22], [262, 360, 22, 22], [262, 338, 22, 22], [314, 360, 22, 22], [314, 338, 22, 22],
      [206, 326, 78, 12], [258, 326, 78, 12], [230, 314, 22, 22], [292, 314, 22, 22], [226, 302, 100, 12]],
      balloons: [[276, 284], [236, 352], [288, 352], [320, 306]] }
  ];
  let level = 0, shots = 3, score = 0, boxes = [], balloons = [], apple = null, aim = null, raf = 0, ended = false, timers = [];
  let last = performance.now(), msg = '', msgUntil = 0;
  gameCleanup = () => { cancelAnimationFrame(raf); timers.forEach(clearTimeout); };

  function loadLevel() {
    const L = LEVELS[level];
    boxes = L.boxes.map(([x, y, bw, bh]) => ({ x, y, w: bw, h: bh, vy: 0, dead: false }));
    balloons = L.balloons.map(([x, y]) => ({ x, y, r: 11, popped: false, t: Math.random() * 6 }));
    shots = 3; apple = null; aim = null;
    w.status.textContent = `第 ${level + 1} 關：還有 ${shots} 顆蘋果`;
  }
  loadLevel();

  const pull = () => (aim ? Math.min(MAXPULL, Math.hypot(ANCHOR.x - aim.x, ANCHOR.y - aim.y)) : 0);
  const aimVel = () => {
    const dx = ANCHOR.x - aim.x, dy = ANCHOR.y - aim.y, len = Math.hypot(dx, dy) || 1, p = pull();
    return { vx: dx / len * p * 9, vy: dy / len * p * 9 };
  };

  /* 手指拉出畫布也要算數。本來 pointerleave 一觸發就把 aim 清掉，
     小孩拉過頭一點整發就沒了，而且完全沒有回饋，只覺得「怎麼沒反應」。
     改成：按下去就 setPointerCapture（出了畫布一樣收得到事件），
     瞄準點夾在畫布裡面。拉到邊緣就是拉到底，不會消失。 */
  const clampAim = p => ({ x: Math.max(EDGE, Math.min(W - EDGE, p.x)),
                           y: Math.max(EDGE, Math.min(H - EDGE, p.y)) });
  c.addEventListener('pointerdown', e => {
    if (ended || apple) return;
    aim = clampAim(pos(e));
    try { c.setPointerCapture(e.pointerId); } catch (err) {}
    Sound.play('pickUp');
  });
  c.addEventListener('pointermove', e => { if (aim) aim = clampAim(pos(e)); });
  function release(e) {
    if (e) { try { c.releasePointerCapture(e.pointerId); } catch (err) {} }
    if (!aim) return;
    if (pull() < 10) { aim = null; return; } // 拉太短不算
    const v = aimVel();
    apple = { x: ANCHOR.x, y: ANCHOR.y, vx: v.vx, vy: v.vy, rest: 0 };
    aim = null; shots--;
    Sound.play('jump');
    w.status.textContent = `第 ${level + 1} 關：還有 ${shots} 顆蘋果`;
  }
  c.addEventListener('pointerup', release);
  // 手指被系統收走（來電、切 App）才取消，不是拉出畫布就取消
  c.addEventListener('pointercancel', () => { aim = null; });

  function pop(b) {
    b.popped = true;
    score += 100;
    Sound.play('petHappy');
    msg = '氣球破了！'; msgUntil = performance.now() + 1100;
  }
  function breakBox(b) {
    b.dead = true;
    score += 10;
    Sound.play('stack');
  }
  // 圓形（蘋果）撞方塊
  function hitBox(a, b) {
    const cx = Math.max(b.x, Math.min(a.x, b.x + b.w)), cy = Math.max(b.y, Math.min(a.y, b.y + b.h));
    const dx = a.x - cx, dy = a.y - cy, d = Math.hypot(dx, dy);
    if (d > R) return false;
    const speed = Math.hypot(a.vx, a.vy);
    if (speed > 180) breakBox(b); // 打得夠快就打破
    const nx = d ? dx / d : 0, ny = d ? dy / d : -1;
    a.x = cx + nx * (R + .5); a.y = cy + ny * (R + .5);
    const dot = a.vx * nx + a.vy * ny;
    a.vx = (a.vx - 2 * dot * nx) * .45; a.vy = (a.vy - 2 * dot * ny) * .45;
    return true;
  }
  // 木箱沒有東西撐著就往下掉
  function dropBoxes(dt) {
    boxes.filter(b => !b.dead).forEach(b => {
      const bottom = b.y + b.h;
      const onGround = bottom >= GY - .5;
      const onBox = boxes.some(o => o !== b && !o.dead && o.y <= bottom + 1.5 && o.y >= bottom - 4 &&
        b.x < o.x + o.w - 1 && o.x < b.x + b.w - 1);
      if (onGround || onBox) { b.vy = 0; if (onGround) b.y = GY - b.h; return; }
      b.vy += GRAV * dt;
      b.y += b.vy * dt;
      if (b.y + b.h > GY) { b.y = GY - b.h; b.vy = 0; Sound.play('click'); }
    });
  }
  function nextShot() {
    apple = null;
    if (balloons.every(b => b.popped)) { // 過關
      score += shots * 50;
      if (level >= LEVELS.length - 1) return finish(true);
      level++;
      msg = '過關！'; msgUntil = performance.now() + 1100;
      timers.push(setTimeout(() => { loadLevel(); msg = ''; }, 900));
      return;
    }
    if (shots <= 0) { // 沒蘋果了
      if (level >= LEVELS.length - 1) return finish(false);
      msg = '蘋果用完了，換下一關！'; msgUntil = performance.now() + 1400;
      level++;
      timers.push(setTimeout(() => { loadLevel(); msg = ''; }, 1200));
    }
  }
  function finish(cleared) {
    ended = true; apple = null;
    const bells = payReward(w, score + (cleared ? 200 : 0));
    w.status.textContent = `🎉 ${cleared ? '全部過關！' : '結束！'}拿到 ${fmt(bells)} 鈴錢${cleared ? '（全過關加獎 200）' : ''}`;
    gameButtons(w, openSlingGame);
  }

  function frame(now) {
    const dt = Math.max(0, Math.min(.03, (now - last) / 1000)); last = now;
    balloons.forEach(b => { b.t += dt; });
    if (msg && now > msgUntil) msg = ''; // 字樣顯示一下就消失
    if (!ended) {
      dropBoxes(dt);
      if (apple) {
        apple.vy += GRAV * dt;
        apple.x += apple.vx * dt; apple.y += apple.vy * dt;
        boxes.filter(b => !b.dead).forEach(b => hitBox(apple, b));
        balloons.filter(b => !b.popped).forEach(b => { if (Math.hypot(apple.x - b.x, apple.y - b.y) < R + b.r) pop(b); });
        if (apple.y + R > GY) { apple.y = GY - R; apple.vy *= -.35; apple.vx *= .7; } // 地上彈一下
        const slow = Math.hypot(apple.vx, apple.vy) < 30 && apple.y + R >= GY - 1;
        apple.rest = slow ? apple.rest + dt : 0;
        if (apple.rest > .5 || apple.x > W + 40 || apple.x < -40) nextShot();
        else if (balloons.every(b => b.popped)) nextShot();
      }
    }

    // ── 畫面 ──
    g.clearRect(0, 0, W, H);
    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#bfe6f2'); sky.addColorStop(1, '#e8f5e4');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    g.fillStyle = '#ffffff'; // 雲
    [[60, 60, 16], [90, 52, 12], [280, 80, 14], [305, 74, 10]].forEach(([x, y, r]) => { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); });
    g.fillStyle = '#8cc47a'; g.fillRect(0, GY, W, H - GY);
    g.fillStyle = '#7ab567'; g.fillRect(0, GY, W, 5);
    // 彈弓
    g.strokeStyle = '#8a5a33'; g.lineWidth = 7; g.lineCap = 'round';
    g.beginPath(); g.moveTo(ANCHOR.x, GY); g.lineTo(ANCHOR.x, ANCHOR.y + 6); g.stroke();
    g.lineWidth = 5;
    g.beginPath(); g.moveTo(ANCHOR.x, ANCHOR.y + 8); g.lineTo(ANCHOR.x - 11, ANCHOR.y - 8); g.stroke();
    g.beginPath(); g.moveTo(ANCHOR.x, ANCHOR.y + 8); g.lineTo(ANCHOR.x + 11, ANCHOR.y - 8); g.stroke();
    // 木箱
    boxes.filter(b => !b.dead).forEach(b => {
      g.fillStyle = '#c9925a'; g.fillRect(b.x, b.y, b.w, b.h);
      g.strokeStyle = '#8a5a33'; g.lineWidth = 2; g.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
      g.beginPath(); g.moveTo(b.x + 2, b.y + 2); g.lineTo(b.x + b.w - 2, b.y + b.h - 2); g.stroke();
    });
    // 氣球
    balloons.filter(b => !b.popped).forEach(b => {
      const bx = b.x + Math.sin(b.t * 1.5) * 2;
      g.strokeStyle = 'rgba(80,60,40,.5)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(bx, b.y + b.r); g.lineTo(bx, b.y + b.r + 10); g.stroke();
      g.fillStyle = ['#ff6b6b', '#6bb6ff', '#ffd35c', '#b18cff'][(b.x | 0) % 4];
      g.beginPath(); g.ellipse(bx, b.y, b.r, b.r * 1.2, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.ellipse(bx - 3.5, b.y - 4, 2.6, 3.4, -.4, 0, Math.PI * 2); g.fill();
    });
    // 瞄準：橡皮筋和預測路線
    if (aim) {
      const p = pull(), dx = ANCHOR.x - aim.x, dy = ANCHOR.y - aim.y, len = Math.hypot(dx, dy) || 1;
      const bx = ANCHOR.x - dx / len * p, by = ANCHOR.y - dy / len * p;
      g.strokeStyle = '#8a5a33'; g.lineWidth = 3;
      g.beginPath(); g.moveTo(ANCHOR.x - 11, ANCHOR.y - 8); g.lineTo(bx, by); g.lineTo(ANCHOR.x + 11, ANCHOR.y - 8); g.stroke();
      const v = aimVel();
      let px = ANCHOR.x, py = ANCHOR.y, vx = v.vx, vy = v.vy;
      g.fillStyle = 'rgba(255,255,255,.85)';
      for (let i = 0; i < 26; i++) {
        vy += GRAV * .035; px += vx * .035; py += vy * .035;
        if (i % 2 === 0) { g.beginPath(); g.arc(px, py, 2.2, 0, Math.PI * 2); g.fill(); }
      }
      drawApple(bx, by);
    } else if (!apple && !ended) drawApple(ANCHOR.x, ANCHOR.y - 2);
    if (apple) drawApple(apple.x, apple.y);

    g.fillStyle = '#4a3b2a'; g.font = 'bold 17px "Noto Sans TC", "Microsoft JhengHei", sans-serif'; g.textBaseline = 'middle';
    g.textAlign = 'left'; g.fillText(`分數 ${score}`, 12, 18);
    g.textAlign = 'right'; g.fillText(`🍎 ${'●'.repeat(Math.max(0, shots))}`, W - 12, 18);
    g.textAlign = 'center';
    g.fillText(`第 ${level + 1} / ${LEVELS.length} 關`, W / 2, 18);
    if (msg) { g.fillStyle = '#e8505b'; g.font = 'bold 22px "Noto Sans TC", "Microsoft JhengHei", sans-serif'; g.fillText(msg, W / 2, 120); }
    g.textAlign = 'start';
    raf = requestAnimationFrame(frame);
  }
  function drawApple(x, y) {
    g.fillStyle = '#e8505b'; g.beginPath(); g.arc(x, y, R, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,255,255,.45)'; g.beginPath(); g.arc(x - 3, y - 3.5, 2.6, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#5fa15a'; g.beginPath(); g.ellipse(x + 4, y - 8, 3.5, 1.8, -.5, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#7a5a3a'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(x, y - 8); g.lineTo(x + .5, y - 11); g.stroke();
  }
  gameButtons(w, openSlingGame);
  raf = requestAnimationFrame(frame);
}
</script>
