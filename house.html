  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}
function heart(ctx, cx, cy, s, color) {
  ctx.beginPath();
  ctx.moveTo(cx, cy + s * .9);
  ctx.bezierCurveTo(cx - s * 1.4, cy - s * .2, cx - s * .6, cy - s * 1.2, cx, cy - s * .35);
  ctx.bezierCurveTo(cx + s * .6, cy - s * 1.2, cx + s * 1.4, cy - s * .2, cx, cy + s * .9);
  ctx.fillStyle = color;
  ctx.fill();
}

// 沒傳衣服時用預設款（商店縮圖、舊程式呼叫都安全）
function outfitOf(o) {
  const out = {};
  OUTFIT_SLOTS.forEach(({ key }) => { out[key] = (o.outfit && o.outfit[key]) || CLOTHES_BY_ID[DEFAULT_OUTFIT[key]]; });
  return out;
}

// 以腳底中心為原點，往上是負值；身高約 64
/* 現在該露出什麼表情。只有「房間裡那個真的小可愛」會用到——
   預覽縮圖不傳 face，所以商店、換裝裡永遠是笑的。 */
function kidFace() {
  try { if (G.kid && G.kid.hunger < 30) return 'hungry'; } catch (e) {}
  return 'happy';
}
function drawGirl(ctx, o) {
  const swing = o.walking ? Math.sin(o.t * 11) : 0;
  const fit = outfitOf(o);
  if (!o.headOnly) drawGirlBody(ctx, o, swing, fit);
  if (o.prop && !o.back && !o.headOnly) drawProp(ctx, o.prop, o.t || 0); // 做事時手上拿的東西
  drawGirlHead(ctx, o);
  drawHeadwear(ctx, o, fit.head);
}

// ── 手上拿的東西（胸前、右手邊）──
function drawProp(ctx, prop, t) {
  const L = 'rgba(50,35,30,.45)';
  const wob = Math.sin(t * 7) * .08; // 跟著動作輕輕晃
  ctx.save();
  ctx.lineWidth = .9;
  if (prop === 'book' || prop === 'comic') { // 打開的書
    ctx.translate(0, -23); ctx.rotate(wob * .5);
    rr(ctx, -9.5, -6, 19, 11, 1.5, prop === 'comic' ? '#6bb6ff' : '#e8505b', L);
    rr(ctx, -8.5, -5.2, 8, 9.4, 1, '#fffaf0'); rr(ctx, .5, -5.2, 8, 9.4, 1, '#fffaf0');
    if (prop === 'comic') { // 漫畫格子
      ['#ffd35c', '#ff9ec4', '#7bd389', '#b18cff'].forEach((c, i) => rr(ctx, (i % 2 ? 1.5 : -7.5), (i < 2 ? -4.3 : -.2), 6, 3.3, .5, c));
    } else {
      ctx.fillStyle = '#c9bfae'; [-3, -1, 1].forEach(y => { ctx.fillRect(-7.5, y, 6, .7); ctx.fillRect(1.5, y, 6, .7); });
    }
  } else if (prop === 'pencil' || prop === 'brush') { // 鉛筆、畫筆（右手）
    ctx.translate(9, -18); ctx.rotate(-.7 + wob * 3);
    rr(ctx, -1, -12, 2.2, 12, .8, prop === 'pencil' ? '#ffd35c' : '#b07843', L);
    ctx.fillStyle = prop === 'pencil' ? '#3a3240' : ['#e8505b', '#6bb6ff', '#7bd389', '#ffd35c'][Math.floor(t * 2) % 4];
    ctx.beginPath(); ctx.moveTo(-1.2, -12); ctx.lineTo(1.4, -12); ctx.lineTo(.1, -15.5); ctx.closePath(); ctx.fill();
  } else if (prop === 'spatula') { // 鍋鏟
    ctx.translate(9, -18); ctx.rotate(-.5 + wob * 4);
    rr(ctx, -.8, -9, 1.6, 10, .6, '#8a5a33');
    rr(ctx, -3, -14, 6, 5.5, 1, '#c0c7ce', L);
  } else if (prop === 'can') { // 澆水壺
    ctx.translate(10, -20); ctx.rotate(-.25 + wob);
    rr(ctx, -4, -3, 8, 7, 1.5, '#7bd389', L);
    ctx.strokeStyle = '#5fa15a'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(8, -4); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -3, 3, Math.PI, 0); ctx.stroke();
  } else if (prop === 'plate') { // 盤子
    ctx.translate(0, -22);
    ctx.beginPath(); ctx.ellipse(0, 0, 9, 3.2, 0, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.strokeStyle = L; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, -.3, 5.5, 1.8, 0, 0, Math.PI * 2); ctx.strokeStyle = '#9ec9ff'; ctx.stroke();
  } else if (prop === 'pad') { // 遊戲手把（兩手拿）
    ctx.translate(0, -21); ctx.rotate(wob);
    rr(ctx, -8, -3, 16, 6.5, 3, '#3a3240');
    ctx.fillStyle = '#e8505b'; ctx.beginPath(); ctx.arc(4.5, -.5, 1.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6bb6ff'; ctx.beginPath(); ctx.arc(6.3, 1.2, 1.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c0c7ce'; ctx.fillRect(-6, -.3, 4, 1.2); ctx.fillRect(-4.6, -1.7, 1.2, 4);
  } else if (prop === 'teddy') { // 抱著熊熊
    ctx.translate(0, -22);
    ctx.fillStyle = '#c98d5a';
    ctx.beginPath(); ctx.arc(0, 1, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -6, 4.5, 0, Math.PI * 2); ctx.fill();
    [-3.5, 3.5].forEach(x => { ctx.beginPath(); ctx.arc(x, -9.5, 1.8, 0, Math.PI * 2); ctx.fill(); });
    ctx.fillStyle = '#3a3240'; [-1.5, 1.5].forEach(x => { ctx.beginPath(); ctx.arc(x, -6.5, .7, 0, Math.PI * 2); ctx.fill(); });
  } else if (prop === 'juice' || prop === 'cup' || prop === 'apple' || prop === 'ball') { // 右手拿的小東西
    ctx.translate(7.5, -21 + Math.sin(t * 5) * .8);
    if (prop === 'juice') { rr(ctx, -2.5, -3.5, 5, 7, .8, '#ffb84d', L); ctx.fillStyle = '#ffffff'; ctx.fillRect(.5, -6.5, .9, 3.5); }
    else if (prop === 'cup') {
      rr(ctx, -3, -2.5, 6, 5, 1.2, '#ffffff', L);
      ctx.strokeStyle = 'rgba(200,200,200,.8)'; ctx.beginPath(); ctx.moveTo(-1, -4); ctx.quadraticCurveTo(1, -6, -1, -8); ctx.stroke(); // 熱氣
    } else if (prop === 'apple') {
      ctx.fillStyle = '#e8505b'; ctx.beginPath(); ctx.arc(0, 0, 3.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5fa15a'; ctx.beginPath(); ctx.ellipse(1.5, -4, 1.5, .8, -.5, 0, Math.PI * 2); ctx.fill();
    } else { ctx.fillStyle = ['#ff6b6b', '#ffd35c', '#6bb6ff'][Math.floor(t * 3) % 3]; ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill(); }
  } else if (prop === 'hay' || prop === 'shirt') { // 抱在胸前
    ctx.translate(0, -22);
    if (prop === 'hay') { rr(ctx, -7, -3.5, 14, 7, 2, '#e8c35a', L); ctx.fillStyle = '#c9a23a'; ctx.fillRect(-2.5, -3.5, 1, 7); ctx.fillRect(2, -3.5, 1, 7); }
    else { ctx.fillStyle = '#9ec9ff'; ctx.beginPath(); ctx.moveTo(-6, -3); ctx.lineTo(-2.5, -4.5); ctx.lineTo(2.5, -4.5); ctx.lineTo(6, -3); ctx.lineTo(4.5, 0); ctx.lineTo(3, -.5); ctx.lineTo(3, 4); ctx.lineTo(-3, 4); ctx.lineTo(-3, -.5); ctx.lineTo(-4.5, 0); ctx.closePath(); ctx.fill(); }
  } else if (prop === 'basket' || prop === 'bucket') { // 提著（右手）
    ctx.translate(9, -14);
    rr(ctx, -4, -2, 8, 6, 1.5, prop === 'basket' ? '#c9925a' : '#c0c7ce', L);
    ctx.strokeStyle = prop === 'basket' ? '#8a5a33' : '#8e98a3'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, -2, 3.5, Math.PI, 0); ctx.stroke();
    if (prop === 'basket') { ctx.fillStyle = '#e8505b'; ctx.beginPath(); ctx.arc(-1.5, -2.5, 1.8, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#ffa53a'; ctx.beginPath(); ctx.arc(1.8, -2.3, 1.8, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.fillStyle = '#6bb6ff'; ctx.fillRect(-3.2, -1.5, 6.4, 1.5); }
  }
  ctx.restore();
}

// ── 身體 ──
function drawGirlBody(ctx, o, swing, fit) {
  const L = GIRL.line, top = fit.top, dress = !!top.dress;

  // 腳與鞋子（穿長褲時腿是褲子的顏色、不露襪子）
  const pants = !dress && fit.bottom.style === 'pants';
  const legColor = pants ? fit.bottom.color : GIRL.skin;
  const shoe = (x, y) => drawShoe(ctx, fit.shoes, x, y, o.back);
  if (o.sit) { // 坐著：腿短短地垂在椅子前緣，偶爾晃一下
    [-4, 4].forEach((x, i) => {
      const kick = Math.max(0, Math.sin(o.t * 3 + i * Math.PI)) * 1.5;
      rr(ctx, x - 2.5, -12, 5, 7 - kick, 2, legColor, L);
      shoe(x, -5 - kick);
    });
  } else [[-1, -4], [1, 4]].forEach(([side, x]) => {
    const lift = o.walking ? Math.max(0, swing * side) * 2.5 : 0;
    const dx = swing * side * 1.5;
    rr(ctx, x - 2.5 + dx, -12 - lift, 5, 9, 2, legColor, L);
    if (!pants && fit.shoes.style !== 'boots') rr(ctx, x - 2.5 + dx, -5 - lift, 5, 3.5, 1, GIRL.sock);
    shoe(x + dx, -1.5 - lift);
  });

  // 下身（穿洋裝時由洋裝的裙子取代）
  if (dress) drawDressSkirt(ctx, top);
  else drawBottom(ctx, fit.bottom);

  // 上衣
  drawTop(ctx, top, o.back);

  // 手：從袖口垂下，走路時前後擺
  const sleeve = top.color;
  const longSleeve = top.style === 'hoodie' || top.style === 'sweater' || top.style === 'jacket';
  [-1, 1].forEach(side => {
    ctx.save();
    ctx.translate(side * 10.5, -31);
    ctx.rotate(-side * .22 + (o.walking ? swing * side * .3 : 0));
    if (longSleeve) {
      rr(ctx, -2.2, -.5, 4.4, 12, 2, sleeve, L);                 // 長袖
      rr(ctx, -1.9, 11, 3.8, 3, 1.5, GIRL.skin, L);             // 手掌
    } else {
      rr(ctx, -1.9, 4, 3.8, 10, 1.9, GIRL.skin, L);
      if (top.style === 'dress') { // 泡泡袖
        ctx.beginPath(); ctx.ellipse(0, 2.2, 3.6, 3.2, 0, 0, Math.PI * 2);
        ctx.fillStyle = sleeve; ctx.fill(); ctx.strokeStyle = L; ctx.lineWidth = 1; ctx.stroke();
      } else rr(ctx, -2.8, -.5, 5.6, 5.5, 2, sleeve, L);        // 短袖
    }
    ctx.restore();
  });

  // 脖子
  rr(ctx, -2.5, -35, 5, 4, 1, GIRL.skinShade);

  // 領口細節（上衣各款）
  drawTopCollar(ctx, top, o.back);
}

function drawShoe(ctx, s, x, y, back) {
  const c = s.color;
  if (s.style === 'boots') { // 雨鞋：高筒
    rr(ctx, x - 3, y - 5.5, 6, 6, 1.5, c);
    ctx.beginPath(); ctx.ellipse(x + (back ? 0 : .6), y + .2, 3.8, 2.2, 0, 0, Math.PI * 2);
    ctx.fillStyle = c; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = .8; ctx.stroke();
    return;
  }
  ctx.beginPath();
  ctx.ellipse(x + (back ? 0 : .5), y, 3.6, 2.2, 0, 0, Math.PI * 2);
  ctx.fillStyle = c; ctx.fill();
  if (s.style === 'princess' && !back) { // 公主鞋：鞋面小蝴蝶結
    heart(ctx, x + .5, y - 1.2, 1.3, '#ffffff');
    return;
  }
  if (s.style === 'sneakers') { // 球鞋：白色鞋底線
    ctx.strokeStyle = s.id === 'white_sneakers' ? '#c9c9c2' : '#ffffff'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x - 3.2, y + 1.2); ctx.lineTo(x + 3.8, y + 1.2); ctx.stroke();
  }
}

function drawBottom(ctx, b) {
  const L = GIRL.line;
  if (b.style === 'skirt') { // 百褶裙
    ctx.beginPath();
    ctx.moveTo(-9, -19); ctx.lineTo(9, -19); ctx.lineTo(12, -8); ctx.lineTo(-12, -8); ctx.closePath();
    ctx.fillStyle = b.color; ctx.fill(); ctx.strokeStyle = L; ctx.lineWidth = 1; ctx.stroke();
    if (b.plaid) { // 格子裙：交錯的淺色線
      ctx.save(); ctx.clip();
      ctx.strokeStyle = b.plaid; ctx.lineWidth = 1; ctx.globalAlpha = .7;
      [-7, -2, 3, 8].forEach(x => { ctx.beginPath(); ctx.moveTo(x, -19); ctx.lineTo(x * 1.3, -8); ctx.stroke(); });
      [-15, -11.5].forEach(y => { ctx.beginPath(); ctx.moveTo(-13, y); ctx.lineTo(13, y); ctx.stroke(); });
      ctx.restore();
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,.25)';
      [-6, -2, 2, 6].forEach(x => { ctx.beginPath(); ctx.moveTo(x, -18); ctx.lineTo(x * 1.3, -8.5); ctx.stroke(); });
    }
  } else if (b.style === 'tutu') { // 蓬蓬裙：兩層圓弧
    ctx.fillStyle = b.color;
    [[0, -11, 13, 4.5], [0, -14, 11, 4]].forEach(([x, y, rx, ry]) => {
      ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1; ctx.stroke();
    });
    rr(ctx, -9, -19, 18, 4, 2, b.color);
  } else if (b.style === 'pants') { // 長褲的上半截（腿的部分在畫腳時已是褲子顏色）
    rr(ctx, -9, -18, 18, 7, 3, b.color, L);
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(-9, -17.5, 18, 1); // 腰帶線
  } else { // 短褲
    rr(ctx, -9, -18, 18, 8, 3, b.color, L);
    ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(-.5, -14, 1, 4); // 兩褲管中間
    // 運動褲的褲管滾邊（照片裡橘色那件是深綠色的邊）
    if (b.hem) { ctx.fillStyle = b.hem; ctx.fillRect(-9, -11.6, 7.8, 1.6); ctx.fillRect(1.2, -11.6, 7.8, 1.6); }
    // 腰帶：黑色帶子＋中間一個銀色扣環
    if (b.belt) {
      ctx.fillStyle = b.belt; ctx.fillRect(-9, -18, 18, 2.2);
      ctx.fillStyle = '#d6d9de'; ctx.fillRect(-2.2, -18.3, 4.4, 2.8);
      ctx.strokeStyle = 'rgba(40,40,50,.5)'; ctx.lineWidth = .5; ctx.strokeRect(-2.2, -18.3, 4.4, 2.8);
    }
    if (b.stitch) {
      ctx.strokeStyle = b.stitch; ctx.lineWidth = .8; ctx.setLineDash([1.5, 1.2]);
      ctx.beginPath(); ctx.moveTo(-8, -12); ctx.lineTo(-1.5, -12); ctx.moveTo(1.5, -12); ctx.lineTo(8, -12); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

function drawDressSkirt(ctx, t) {
  ctx.beginPath();
  ctx.moveTo(-9, -20); ctx.lineTo(9, -20);
  ctx.quadraticCurveTo(15, -12, 14, -7);
  ctx.quadraticCurveTo(0, -4.5, -14, -7);
  ctx.quadraticCurveTo(-15, -12, -9, -20);
  ctx.fillStyle = t.color; ctx.fill();
  ctx.strokeStyle = GIRL.line; ctx.lineWidth = 1; ctx.stroke();
  // 裙襬蕾絲
  ctx.strokeStyle = t.trim; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-13.5, -7.3); ctx.quadraticCurveTo(0, -4.8, 13.5, -7.3); ctx.stroke();
}

function drawTop(ctx, t, back) {
  const L = GIRL.line;
  if (t.style === 'dress') {
    rr(ctx, -9, -32, 18, 13, 4, t.color, L);
    if (t.dots) { // 點點（草莓洋裝）
      ctx.fillStyle = t.dots;
      [[-5, -28], [4, -29], [-1, -24.5], [6, -23.5], [-6, -22.5]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, .9, 0, Math.PI * 2); ctx.fill(); });
    }
    ctx.fillStyle = t.trim; ctx.fillRect(-9, -21, 18, 2); // 腰帶
    if (!back) heart(ctx, 0, -20, 1.6, '#e8505b');        // 腰間小蝴蝶結
    return;
  }
  rr(ctx, -10, -32, 20, 16, 4, t.color, L);
  if (t.style === 'uniform') {
    ctx.fillStyle = GIRL.uniformShade; ctx.fillRect(-9.5, -18.5, 19, 2);
    ctx.fillStyle = GIRL.uniformCollar; ctx.fillRect(-10, -25, 20, 2);
    ctx.fillStyle = GIRL.uniformStripe; ctx.fillRect(-10, -23, 20, 1.3);
    ctx.fillStyle = GIRL.uniformCollar; ctx.fillRect(-10, -21.7, 20, 1.6);
  } else if (t.style === 'tee') {
    if (!back && t.print) heart(ctx, 0, -24, 3, t.print); // 爸爸的素色 T 恤沒有圖案
  } else if (t.style === 'hoodie') {
    ctx.fillStyle = t.trim; ctx.fillRect(-9.5, -18.5, 19, 2.5);         // 下擺羅紋
    if (!back) rr(ctx, -6, -24, 12, 5, 2, t.trim);                       // 口袋
  } else if (t.style === 'sailor') {
    ctx.fillStyle = t.collar; ctx.fillRect(-9.5, -18.5, 19, 1.8);
  } else if (t.style === 'sweater') {
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(-9.5, -19, 19, 2.5);
    if (!back) star(ctx, 0, -24.5, 4, t.print);
  } else if (t.style === 'rainbow') { // 彩虹橫條
    ['#ff6b6b', '#ffb84d', '#ffe066', '#7bd389', '#6bb6ff', '#b18cff'].forEach((c, i) => {
      ctx.fillStyle = c; ctx.fillRect(-9.5, -29 + i * 1.9, 19, 1.9);
    });
  } else if (t.style === 'stripe') { // 水手條紋
    ctx.fillStyle = t.print;
    for (let y = -30; y < -17; y += 3) ctx.fillRect(-9.5, y, 19, 1.4);
  } else if (t.style === 'jacket') { // 運動外套：中間拉鍊、袖側白線
    ctx.fillStyle = t.trim;
    ctx.fillRect(-.6, -32, 1.2, 15);
    ctx.fillRect(-9.5, -18.5, 19, 1.5);
    if (!back) { ctx.fillRect(-7.5, -27, 4, 1.2); } // 胸前小標誌
  }
}

function drawTopCollar(ctx, t, back) {
  if (t.style === 'uniform') {
    if (!back) {
      ctx.fillStyle = GIRL.uniformCollar;
      ctx.beginPath(); ctx.moveTo(-7, -33); ctx.lineTo(0, -31); ctx.lineTo(-4, -27); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(7, -33); ctx.lineTo(0, -31); ctx.lineTo(4, -27); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = GIRL.lanyard; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-3.5, -31); ctx.lineTo(-.5, -20); ctx.moveTo(3.5, -31); ctx.lineTo(.5, -20); ctx.stroke();
    } else {
      ctx.fillStyle = GIRL.uniformCollar; ctx.fillRect(-7, -33, 14, 3);
    }
  } else if (t.style === 'sailor') {
    ctx.fillStyle = t.collar;
    if (!back) {
      ctx.beginPath(); ctx.moveTo(-9, -33); ctx.lineTo(0, -24); ctx.lineTo(9, -33); ctx.lineTo(5, -33); ctx.lineTo(0, -28); ctx.lineTo(-5, -33); ctx.closePath(); ctx.fill();
      heart(ctx, 0, -24.5, 2.4, t.bow); // 紅色領結
    } else {
      rr(ctx, -9, -33, 18, 8, 1, t.collar);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = .8; ctx.strokeRect(-7.5, -32, 15, 5.5);
    }
  } else if (t.style === 'hoodie') {
    ctx.fillStyle = t.trim; // 帽子摺在脖子後面
    rr(ctx, -7, -35, 14, 4, 2, t.trim);
    if (!back) {
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-2, -31); ctx.lineTo(-2.5, -26); ctx.moveTo(2, -31); ctx.lineTo(2.5, -26); ctx.stroke();
    }
  } else if (t.style === 'dress') {
    ctx.fillStyle = t.trim; rr(ctx, -6, -33, 12, 2.5, 1.2, t.trim); // 白色小圓領
  } else if (t.style === 'jacket') {
    rr(ctx, -6, -34, 12, 3.5, 1.5, t.trim); // 立領
  } else {
    ctx.fillStyle = 'rgba(0,0,0,.1)'; rr(ctx, -4.5, -33, 9, 2, 1, 'rgba(0,0,0,.1)'); // 一般圓領
  }
}

// ── 頭 ──
/* 現在用的髮型與髮色。預覽縮圖會自己傳 o.hair 進來蓋掉存檔裡的那組。 */
function hairOf(o) {
  /* 不能用 typeof G：G 是 let，在它被指派之前讀到的是暫時死區，
     typeof 一樣會丟 ReferenceError（只有「完全沒宣告」的變數才安全）。
     所以用 try 包起來。 */
  let cur = null;
  try { cur = G && G.hair; } catch (e) { cur = null; }
  const h = (o && o.hair) || cur || DEFAULT_HAIR;
  const col = HAIR_COLOR_BY_ID[h.color] || HAIR_COLOR_BY_ID.black;
  // short＝爸爸的短髮，只給爸媽用，商店買不到
  return { style: HAIR_BY_ID[h.style] || h.style === 'short' ? h.style : 'bob', c: col.c, hi: col.hi };
}

/* 髮型多出來的那一塊，畫在頭之前（會被頭蓋住一部分，看起來才像長在後面）。
   五款共用同一顆頭，差別只在這裡。 */
function drawHairBack(ctx, hair, hy) {
  ctx.fillStyle = hair.c;
  if (hair.style === 'long') {
    /* 長髮本來是一片直直垂到底、下緣切平的布，看起來像女鬼。
       改成：到肩膀下面一點就收、下緣畫成兩個圓弧（像髮尾分兩束），
       中間稍微內縮，兩側帶一點外翻的弧度。有形狀才像頭髮。 */
    ctx.beginPath();
    ctx.moveTo(-15.5, hy - 4);
    ctx.quadraticCurveTo(-21, hy + 8, -17.5, hy + 22);   // 左側外翻
    ctx.quadraticCurveTo(-14, hy + 30, -9, hy + 24);     // 左邊髮尾圓弧
    ctx.quadraticCurveTo(-6, hy + 14, 0, hy + 8);        // 中間挖深，露出衣服
    ctx.quadraticCurveTo(6, hy + 14, 9, hy + 24);
    ctx.quadraticCurveTo(14, hy + 30, 17.5, hy + 22);    // 右邊髮尾圓弧
    ctx.quadraticCurveTo(21, hy + 8, 15.5, hy - 4);      // 右側外翻
    ctx.closePath(); ctx.fill();
    // 一道髮光，不然大面積的單色看起來很平
    ctx.strokeStyle = hair.hi; ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-11, hy + 4); ctx.quadraticCurveTo(-13, hy + 13, -11, hy + 20);
    ctx.stroke();
  } else if (hair.style === 'twin') {
    // 雙馬尾：兩邊各一束，往外下方甩
    [-1, 1].forEach(s => {
      ctx.beginPath();
      ctx.moveTo(s * 13, hy - 6);
      ctx.quadraticCurveTo(s * 27, hy + 2, s * 24, hy + 26);
      ctx.quadraticCurveTo(s * 20, hy + 16, s * 12, hy + 4);
      ctx.closePath(); ctx.fill();
    });
  } else if (hair.style === 'pony') {
    // 馬尾：綁在右後方，一束往下
    ctx.beginPath();
    ctx.moveTo(13, hy - 8);
    ctx.quadraticCurveTo(28, hy - 2, 25, hy + 28);
    ctx.quadraticCurveTo(19, hy + 14, 11, hy + 2);
    ctx.closePath(); ctx.fill();
  } else if (hair.style === 'bun') {
    // 丸子頭：頭頂兩顆小丸子
    [-1, 1].forEach(s => {
      ctx.beginPath(); ctx.arc(s * 11, hy - 17, 6.2, 0, Math.PI * 2); ctx.fill();
    });
  }
}

function drawGirlHead(ctx, o) {
  const hy = -46;
  const hair = hairOf(o);
  drawHairBack(ctx, hair, hy);
  /* 短髮（爸爸）：後髮只到耳朵上面，不蓋住臉頰。
     背影的時候下半顆頭沒有頭髮蓋著，要先把頭畫出來。 */
  const short = hair.style === 'short', hb = short ? (o.back ? hy + 10 : hy + 3) : hy + 14; // 背影的短髮要蓋到後頸
  if (short && o.back) {
    ctx.beginPath(); ctx.ellipse(0, hy + 1, 12.5, 13, 0, 0, Math.PI * 2);
    ctx.fillStyle = GIRL.skin; ctx.fill();
  }
  // 後髮（妹妹頭輪廓）
  ctx.beginPath();
  ctx.moveTo(-16, hb - 2);
  ctx.lineTo(-16, hy - 2);
  ctx.arc(0, hy - 2, 16, Math.PI, 0);
  ctx.lineTo(16, hb - 2);
  ctx.quadraticCurveTo(16, hb, 13, hb);
  ctx.lineTo(-13, hb);
  ctx.quadraticCurveTo(-16, hb, -16, hb - 2);
  ctx.fillStyle = hair.c;
  ctx.fill();

  if (o.back) {
    // 背影：只看到頭髮
    ctx.strokeStyle = hair.hi; ctx.lineWidth = 1;
    for (let x = -10; x <= 10; x += 5) {
      ctx.beginPath(); ctx.moveTo(x * .4, hy - 16); ctx.quadraticCurveTo(x, hy - (short ? 6 : 0), x * 1.1, hb - 2); ctx.stroke();
    }
    return;
  }

  // 臉
  ctx.beginPath();
  ctx.ellipse(0, hy + 1, 12.5, 13, 0, 0, Math.PI * 2);
  ctx.fillStyle = GIRL.skin;
  ctx.fill();

  const fx = 1.2; // 臉稍微朝行進方向
  const blink = o.blink;
  ctx.fillStyle = '#231c1c';
  [-5, 5].forEach(ex => {
    if (blink) {
      ctx.fillRect(ex + fx - 2, hy + 1, 4, 1);
    } else {
      ctx.beginPath(); ctx.ellipse(ex + fx, hy + 1, 1.9, 2.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex + fx + .6, hy, .7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#231c1c';
    }
  });
  ctx.fillStyle = GIRL.blush;
  [-8.5, 8.5].forEach(bx => { ctx.beginPath(); ctx.arc(bx + fx, hy + 5.5, 2.6, 0, Math.PI * 2); ctx.fill(); });
  /* 表情。她肚子餓的時候會說「肚子好餓喔…」，可是臉還在笑——
     講一套、臉一套，小孩會覺得怪。
     預覽縮圖（商店、換裝）一律用笑臉：那些是在看衣服，不是在看心情。 */
  ctx.strokeStyle = '#8a3b36'; ctx.lineWidth = 1.2;
  if (o.face === 'hungry') {
    // 嘴角往下，再加一道口水／汗滴
    ctx.beginPath(); ctx.arc(fx, hy + 9.5, 3.2, 1.18 * Math.PI, 1.82 * Math.PI); ctx.stroke();
    ctx.fillStyle = 'rgba(120,190,230,.85)';
    ctx.beginPath(); ctx.ellipse(fx + 10, hy + 2, 1.5, 2.4, 0, 0, Math.PI * 2); ctx.fill();
  } else if (o.face === 'sleepy') {
    // 睏：嘴巴一條線
    ctx.beginPath(); ctx.moveTo(fx - 2.6, hy + 6.4); ctx.lineTo(fx + 2.6, hy + 6.4); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(fx, hy + 5.5, 3.2, .2 * Math.PI, .8 * Math.PI); ctx.stroke();
  }

  // 瀏海
  ctx.beginPath();
  ctx.moveTo(-14.5, hy + 2);
  ctx.arc(0, hy - 2, 14.8, Math.PI * 1.05, Math.PI * 1.95);
  ctx.lineTo(14.5, hy + 2);
  ctx.lineTo(12, hy - 4);
  // 參差的瀏海下緣
  for (let x = 10; x >= -10; x -= 4) ctx.lineTo(x, hy - 5 + (x / 4 % 2 ? 1.5 : 0));
  ctx.lineTo(-12, hy - 4);
  ctx.closePath();
  ctx.fillStyle = hair.c;
  ctx.fill();
  // 兩側髮絲蓋住臉頰（短髮沒有）
  if (!short) {
    ctx.beginPath(); ctx.moveTo(-15.5, hy - 3); ctx.quadraticCurveTo(-12, hy + 6, -12.5, hy + 13); ctx.lineTo(-16, hy + 13); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(15.5, hy - 3); ctx.quadraticCurveTo(12, hy + 6, 12.5, hy + 13); ctx.lineTo(16, hy + 13); ctx.closePath(); ctx.fill();
  }
  // 髮光
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, hy - 2, 11, Math.PI * 1.2, Math.PI * 1.45); ctx.stroke();
  // 眼鏡（爸爸）：細細的方框，框在眼睛外面，再加鏡腳到耳朵
  if (o.glasses) {
    ctx.strokeStyle = o.glasses; ctx.lineWidth = 1;
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    [-5, 5].forEach(ex => {
      ctx.beginPath(); ctx.roundRect(ex + fx - 3.6, hy - 2, 7.2, 5.6, 1.2); ctx.fill(); ctx.stroke();
    });
    ctx.beginPath(); ctx.moveTo(fx - 1.4, hy - .2); ctx.lineTo(fx + 1.4, hy - .2); ctx.stroke(); // 鼻樑
    ctx.beginPath(); ctx.moveTo(fx - 8.6, hy - .6); ctx.lineTo(-12.5, hy - 1.4);
    ctx.moveTo(fx + 8.6, hy - .6); ctx.lineTo(12.5, hy - 1.4); ctx.stroke();               // 鏡腳
  }
}

// ── 頭飾（正面、背面都看得到）──
function drawHeadwear(ctx, o, h) {
  if (!h || h.style === 'none') return;
  if (o.headOnly && (h.style === 'hat' || h.style === 'beanie' || h.style === 'glasses')) return; // 睡覺、泡澡時脫帽子、拿下墨鏡
  const hy = -46, top = hy - 18; // 頭頂大約在 y = -64
  const line = 'rgba(50,35,30,.35)';
  if (h.style === 'ribbon') {
    const cx = 9, cy = top + 5;
    ctx.fillStyle = h.color;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx - 7, cy - 4.5); ctx.lineTo(cx - 7, cy + 4.5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + 7, cy - 4.5); ctx.lineTo(cx + 7, cy + 4.5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, 2, 0, Math.PI * 2); ctx.fillStyle = '#b8323c'; ctx.fill();
  } else if (h.style === 'flower') {
    const cx = -10, cy = top + 8;
    ctx.fillStyle = h.color;
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * Math.PI * 2;
      ctx.beginPath(); ctx.arc(cx + Math.cos(a) * 2.8, cy + Math.sin(a) * 2.8, 2.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(cx, cy, 1.6, 0, Math.PI * 2); ctx.fillStyle = '#ffd35c'; ctx.fill();
  } else if (h.style === 'catEars') {
    ctx.strokeStyle = h.color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 2, 15.5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); // 髮箍
    [-1, 1].forEach(s => {
      ctx.beginPath(); ctx.moveTo(s * 5, top + 3); ctx.lineTo(s * 11, top - 7); ctx.lineTo(s * 14, top + 5); ctx.closePath();
      ctx.fillStyle = h.color; ctx.fill();
      ctx.beginPath(); ctx.moveTo(s * 7.5, top + 3); ctx.lineTo(s * 11, top - 3); ctx.lineTo(s * 12.5, top + 4); ctx.closePath();
      ctx.fillStyle = h.inner; ctx.fill();
    });
  } else if (h.style === 'crown') {
    ctx.beginPath();
    ctx.moveTo(-8, top + 3); ctx.lineTo(-8, top - 5); ctx.lineTo(-4, top - 1); ctx.lineTo(0, top - 7);
    ctx.lineTo(4, top - 1); ctx.lineTo(8, top - 5); ctx.lineTo(8, top + 3); ctx.closePath();
    ctx.fillStyle = h.color; ctx.fill(); ctx.strokeStyle = line; ctx.lineWidth = .8; ctx.stroke();
    [[-8, top - 5], [0, top - 7], [8, top - 5]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 1.4, 0, Math.PI * 2); ctx.fillStyle = '#e8505b'; ctx.fill(); });
  } else if (h.style === 'hat') { // 草帽
    ctx.beginPath(); ctx.ellipse(0, top + 8, 22, 5, 0, 0, Math.PI * 2);
    ctx.fillStyle = h.color; ctx.fill(); ctx.strokeStyle = line; ctx.lineWidth = .8; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-11, top + 7); ctx.quadraticCurveTo(-11, top - 8, 0, top - 8); ctx.quadraticCurveTo(11, top - 8, 11, top + 7); ctx.closePath();
    ctx.fillStyle = h.color; ctx.fill(); ctx.stroke();
    ctx.fillStyle = h.band; ctx.fillRect(-11, top + 2, 22, 3.5);
  } else if (h.style === 'beanie') { // 毛帽
    ctx.beginPath(); ctx.moveTo(-15.5, top + 12); ctx.quadraticCurveTo(-16, top - 6, 0, top - 6); ctx.quadraticCurveTo(16, top - 6, 15.5, top + 12); ctx.closePath();
    ctx.fillStyle = h.color; ctx.fill();
    rr(ctx, -16, top + 8, 32, 5, 2.5, 'rgba(0,0,0,.12)');
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1;
    [-8, -3, 3, 8].forEach(x => { ctx.beginPath(); ctx.moveTo(x, top - 3); ctx.lineTo(x * 1.2, top + 8); ctx.stroke(); });
    ctx.beginPath(); ctx.arc(0, top - 7, 4, 0, Math.PI * 2); ctx.fillStyle = h.pom; ctx.fill();
  } else if (h.style === 'bunnyEars') { // 兔耳髮箍：長長的耳朵
    ctx.strokeStyle = '#ffb3c7'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 2, 15.5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    [-1, 1].forEach(s => {
      ctx.save(); ctx.translate(s * 6, top + 2); ctx.rotate(s * .22);
      ctx.beginPath(); ctx.ellipse(0, -8, 3.4, 9, 0, 0, Math.PI * 2);
      ctx.fillStyle = h.color; ctx.fill(); ctx.strokeStyle = line; ctx.lineWidth = .8; ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, -7.5, 1.6, 6.5, 0, 0, Math.PI * 2); ctx.fillStyle = h.inner; ctx.fill();
      ctx.restore();
    });
  } else if (h.style === 'starClip') { // 星星髮夾
    star(ctx, 10, top + 8, 4, h.color);
    star(ctx, 5, top + 5, 2.4, '#ffe89a');
  } else if (h.style === 'flowerCrown') { // 花冠：一圈葉子加小花
    ctx.strokeStyle = h.color; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.ellipse(0, top + 4, 15, 4, 0, Math.PI, 0); ctx.stroke();
    [['#ff9ec4', -12], ['#ffd35c', -6], ['#ffffff', 0], ['#b18cff', 6], ['#ff9ec4', 12]].forEach(([c, x]) => {
      const y = top + 4 - Math.sqrt(Math.max(0, 1 - (x / 15) ** 2)) * 4;
      ctx.fillStyle = c;
      for (let i = 0; i < 5; i++) {
        const a = i / 5 * Math.PI * 2;
        ctx.beginPath(); ctx.arc(x + Math.cos(a) * 1.8, y + Math.sin(a) * 1.8, 1.5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.beginPath(); ctx.arc(x, y, 1, 0, Math.PI * 2); ctx.fillStyle = '#e8b43a'; ctx.fill();
    });
  } else if (h.style === 'pumpkin') {      // 🎃 南瓜髮夾
    const cx = -10, cy = top + 7;
    ctx.fillStyle = h.color;
    ctx.beginPath(); ctx.ellipse(cx, cy, 4.6, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(120,60,10,.5)'; ctx.lineWidth = .8;
    ctx.beginPath(); ctx.moveTo(cx - 1.6, cy - 3.4); ctx.lineTo(cx - 1.6, cy + 3.4);
    ctx.moveTo(cx + 1.6, cy - 3.4); ctx.lineTo(cx + 1.6, cy + 3.4); ctx.stroke();
    ctx.fillStyle = '#4a7a3a';
    ctx.fillRect(cx - .7, cy - 6.2, 1.4, 2.6);
  } else if (h.style === 'devilHorns') {    // 😈 小惡魔角
    ctx.fillStyle = h.color; ctx.strokeStyle = line; ctx.lineWidth = .8;
    [-1, 1].forEach(s => {
      ctx.beginPath();
      ctx.moveTo(s * 7, top + 2);
      ctx.quadraticCurveTo(s * 12, top - 4, s * 9.5, top - 9);
      ctx.quadraticCurveTo(s * 9, top - 3, s * 4.5, top + 2);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    });
  } else if (h.style === 'witchHat') {      // 🧙 巫師帽
    ctx.fillStyle = h.color; ctx.strokeStyle = line; ctx.lineWidth = .8;
    ctx.beginPath(); ctx.ellipse(0, top + 7, 19, 4.4, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-10, top + 6);
    ctx.quadraticCurveTo(-5, top - 12, 4, top - 20);
    ctx.quadraticCurveTo(6, top - 6, 10, top + 6);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = h.band || '#f2c75c';
    ctx.beginPath(); ctx.ellipse(-.5, top + 3, 10.5, 3, 0, 0, Math.PI * 2); ctx.fill();
  } else if (h.style === 'santaHat') {      // 🎄 聖誕帽
    ctx.fillStyle = h.color; ctx.strokeStyle = line; ctx.lineWidth = .8;
    ctx.beginPath();
    ctx.moveTo(-12, top + 5);
    ctx.quadraticCurveTo(-6, top - 13, 9, top - 14);
    ctx.quadraticCurveTo(8, top - 2, 12, top + 5);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(0, top + 5.5, 13, 3.6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(10.5, top - 14, 3.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  } else if (h.style === 'antlers') {       // 🦌 麋鹿角
    ctx.strokeStyle = h.color; ctx.lineWidth = 2; ctx.lineCap = 'round';
    [-1, 1].forEach(s => {
      ctx.beginPath();
      ctx.moveTo(s * 6, top + 2); ctx.quadraticCurveTo(s * 11, top - 5, s * 10, top - 12);
      ctx.moveTo(s * 9.4, top - 6); ctx.lineTo(s * 14, top - 9);
      ctx.moveTo(s * 10.2, top - 10); ctx.lineTo(s * 6, top - 13);
      ctx.stroke();
    });
    ctx.lineCap = 'butt';
  } else if (h.style === 'osmanthus') {     // 🥮 桂花髮夾（中秋）
    const cx = -10, cy = top + 7;
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * Math.PI * 2, r = 3.2;
      ctx.fillStyle = h.color;
      ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 1.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#fff6d8';
    ctx.beginPath(); ctx.arc(cx, cy, 1.8, 0, Math.PI * 2); ctx.fill();
    // 旁邊一彎小月亮
    ctx.fillStyle = '#fff3c4';
    ctx.beginPath(); ctx.arc(cx - 7, cy - 4, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = h.band || '#f4ead2';
    ctx.beginPath(); ctx.arc(cx - 8.6, cy - 5.2, 3, 0, Math.PI * 2); ctx.fill();
  } else if (h.style === 'fuClip') {        // 🧧 福字髮飾（新年）
    const cx = -10, cy = top + 7;
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(Math.PI / 4);
    ctx.fillStyle = h.color; ctx.strokeStyle = 'rgba(120,20,20,.5)'; ctx.lineWidth = .8;
    ctx.fillRect(-4, -4, 8, 8); ctx.strokeRect(-4, -4, 8, 8);
    ctx.restore();
    ctx.fillStyle = h.band || '#f2d06a';
    ctx.font = 'bold 6px "Noto Sans TC", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('福', cx, cy + .5);
    ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
  } else if (h.style === 'sakura') {        // 🌸 櫻花髮圈
    ctx.strokeStyle = h.band || '#f7c5d8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, hy - 2, 15.5, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
    [[-11, top + 4], [0, top - 1], [11, top + 4]].forEach(([fx2, fy], i) => {
      const r = i === 1 ? 3.4 : 2.6;
      ctx.fillStyle = h.color;
      for (let k = 0; k < 5; k++) {
        const a = k / 5 * Math.PI * 2;
        ctx.beginPath(); ctx.arc(fx2 + Math.cos(a) * r, fy + Math.sin(a) * r, r * .72, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = '#fff6d8';
      ctx.beginPath(); ctx.arc(fx2, fy, r * .5, 0, Math.PI * 2); ctx.fill();
    });
  } else if (h.style === 'schoolCap') {   // 🧢 小學帽（照片裡那頂：白色、橘色前片與帽沿）
    ctx.strokeStyle = line; ctx.lineWidth = .8;
    // 帽身
    ctx.fillStyle = h.color;
    ctx.beginPath(); ctx.moveTo(-13, top + 7); ctx.quadraticCurveTo(-13, top - 9, 0, top - 9);
    ctx.quadraticCurveTo(13, top - 9, 13, top + 7); ctx.closePath(); ctx.fill(); ctx.stroke();
    // 正面的橘色片，夾在帽身中間
    ctx.save(); ctx.clip();
    ctx.fillStyle = h.band; ctx.fillRect(-5, top - 10, 10, 18);
    ctx.restore();
    // 帽沿：往前伸出去一片，畫在最下面一圈
    ctx.fillStyle = h.band;
    ctx.beginPath(); ctx.ellipse(0, top + 7.5, 15, 3.4, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // 頂上的小鈕
    ctx.fillStyle = h.band; ctx.beginPath(); ctx.arc(0, top - 9, 1.6, 0, Math.PI * 2); ctx.fill();
  } else if (h.style === 'glasses') { // 愛心墨鏡（只有正面看得到）
    if (o.back) return;
    const fx = 1.2, ey = hy + 1;
    [-5, 5].forEach(ex => heart(ctx, ex + fx, ey + .3, 3.4, h.color));
    ctx.strokeStyle = h.color; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-1.5 + fx, ey - 1); ctx.lineTo(1.5 + fx, ey - 1); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    [-6, 4].forEach(ex => { ctx.beginPath(); ctx.arc(ex + fx, ey - 1, .8, 0, Math.PI * 2); ctx.fill(); });
  }
}

<script>
// 會走動的角色「小可愛」（程式內變數沿用 fufu 命名）
'use strict';

const FUFU_H = 64;          // 畫面上的身高（世界座標像素）
const FUFU_SPEED = 2.2;     // 每秒走幾格

// 台詞一律用 pickLine(類別)，內容在 data.js 的 LINE_TYPES，玩家可在「台詞」分頁修改

const fufu = {
  room: -1, x: .5, y: .5, path: [], facing: 1,
  t: 0, jumpT: 0, idleUntil: 0, say: null, sayUntil: 0, back: false, blinkAt: 0,
  task: null,   // 正在走過去要做的事 {uid, act} 或 {pet: true}
  pose: null,   // 坐著或躺著 {type, uid, snap, until, lx, ly, z, ...}
  act: null,    // 正在做的事（彈琴、跳舞、陪寵物玩…）{key, uid, until, nextFx, fxEvery, n}
  fx: []        // 頭上冒出的小圖（音符、愛心…）
};

function fufuSay(text, ms) {
  if (text && text !== fufu.say) Sound.play('talk', text);
  fufu.say = text;
  fufu.sayUntil = performance.now() + (ms || 2600);
}

// ── 可走的格子 ──
function blockedGrid(room) {
  const g = Array.from({ length: room.w }, () => new Array(room.d).fill(false));
  room.items.forEach(it => {
    const def = FURN_BY_ID[it.id];
    if (def.layer === 'floor') return; // 地毯可以踩
    const fp = footprint(def, it.rot);
    for (let i = it.x; i < it.x + fp.w; i++)
      for (let j = it.y; j < it.y + fp.d; j++)
        if (g[i] && j < room.d) g[i][j] = true;
  });
  return g;
}

// 從 (sx,sy) 走到 (tx,ty) 的最短路徑；到不了就走到最近的可達格
function findPath(room, sx, sy, tx, ty) {
  const blk = blockedGrid(room), key = (i, j) => i * 100 + j;
  const prev = new Map([[key(sx, sy), null]]);
  const queue = [[sx, sy]];
  let best = [sx, sy], bestD = Math.abs(sx - tx) + Math.abs(sy - ty);
  while (queue.length) {
    const [i, j] = queue.shift();
    const dist = Math.abs(i - tx) + Math.abs(j - ty);
    if (dist < bestD) { best = [i, j]; bestD = dist; }
    if (dist === 0) break;
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([di, dj]) => {
      const ni = i + di, nj = j + dj;
      if (ni < 0 || nj < 0 || ni >= room.w || nj >= room.d || blk[ni][nj] || prev.has(key(ni, nj))) return;
      prev.set(key(ni, nj), [i, j]);
      queue.push([ni, nj]);
    });
  }
  return tracePath(prev, key, best, sx, sy);
}

function tracePath(prev, key, end, sx, sy) {
  const path = [];
  for (let c = end; c && !(c[0] === sx && c[1] === sy); c = prev.get(key(c[0], c[1]))) path.unshift(c);
  return path;
}

// 走到家具旁邊任一空格；到不了回傳 null
function findPathToItem(room, sx, sy, it) {
  const def = FURN_BY_ID[it.id], fp = footprint(def, it.rot);
  const near = (i, j) => (i >= it.x - 1 && i <= it.x + fp.w && j >= it.y && j < it.y + fp.d) ||
                         (j >= it.y - 1 && j <= it.y + fp.d && i >= it.x && i < it.x + fp.w);
  const blk = blockedGrid(room), key = (i, j) => i * 100 + j;
  const prev = new Map([[key(sx, sy), null]]);
  const queue = [[sx, sy]];
  while (queue.length) {
    const [i, j] = queue.shift();
    if (near(i, j)) return tracePath(prev, key, [i, j], sx, sy);
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([di, dj]) => {
      const ni = i + di, nj = j + dj;
      if (ni < 0 || nj < 0 || ni >= room.w || nj >= room.d || blk[ni][nj] || prev.has(key(ni, nj))) return;
      prev.set(key(ni, nj), [i, j]);
      queue.push([ni, nj]);
    });
  }
  return null;
}

function nearestFree(room, ci, cj) {
  const blk = blockedGrid(room);
  let best = null, bestD = Infinity;
  for (let i = 0; i < room.w; i++)
    for (let j = 0; j < room.d; j++) {
      const d = Math.abs(i + .5 - ci) + Math.abs(j + .5 - cj);
      if (!blk[i][j] && d < bestD) { best = [i, j]; bestD = d; }
    }
  return best;
}

function fufuTile() { return [Math.floor(fufu.x), Math.floor(fufu.y)]; }

function fufuWalkTo(ti, tj) {
  if (fufu.pose) fufuStandUp(false);
  fufu.task = null;
  fufu.act = null;
  const [si, sj] = fufuTile();
  fufu.path = findPath(curRoom(), si, sj, ti, tj);
}

// ── 使用家具：坐、躺（FURNITURE_USE）、在旁邊做事（FURNITURE_ACT）、寵物床（PET_BEDS）──
function canUse(it) { return !!(FURNITURE_USE[it.id] || FURNITURE_ACT[it.id] || PET_BEDS[it.id]); }

// act 省略時是坐、躺；有 act 時走到旁邊做那件事
function fufuGoUse(it, quiet, act) {
  if (fufu.pose) fufuStandUp(false);
  fufu.act = null;
  const room = curRoom();
  const [si, sj] = fufuTile();
  const path = findPathToItem(room, si, sj, it);
  if (!path) { if (!quiet) fufuSay(pickLine('blocked')); return false; }
  fufu.path = path;
  fufu.task = { uid: it.uid, act };
  fufu.pendingSay = null;
  return true;
}

// 走到了：看要做什麼
function fufuArrive(now) {
  const task = fufu.task;
  if (task.pet) { fufu.task = null; fufuStartPlayPet(now); return; }
  if (task.act) {
    fufu.task = null;
    const it = curRoom().items.find(x => x.uid === task.uid);
    if (it) fufuStartAct(task.act, now, it, task.auto);
    return;
  }
  fufuStartPose(now);
}

// 「看時間」用的真實時間
function timeText() {
  const d = new Date(), h = d.getHours(), m = d.getMinutes();
  const part = h < 5 ? '半夜' : h < 11 ? '早上' : h < 13 ? '中午' : h < 18 ? '下午' : '晚上';
  return `${part} ${h % 12 || 12} 點${m ? ` ${m} 分` : '整'}`;
}

// ── 做事時看得到的畫面（115.9.19 謝會：擺碗盤、生火、看電視要有動作）──
// 手上拿的東西（girl.js 的 drawProp）；有拿東西時臉朝前，才看得到
const ACT_PROPS = {
  read: 'book', comic: 'comic', study: 'pencil', paint: 'brush', cook: 'spatula', snack: 'juice', dishes: 'plate',
  water: 'can', hug: 'teddy', videogame: 'pad', fruit: 'apple', tea: 'cup', hay: 'hay', pick: 'basket',
  trough: 'bucket', laundry: 'shirt', toys: 'ball', lesson: 'pencil', homework: 'book'
};
// 家具留下來的狀態（只在這次遊戲中記得）：{fireUntil, dishesUntil, lit, paint}
const itemState = {};
const stateOf = uid => (itemState[uid] = itemState[uid] || {});
const SCREEN_COLORS = ['#6bb6ff', '#7bd389', '#ffd35c', '#ff9ec4', '#b18cff', '#ffb84d'];
// 冒煙、水滴、泡泡：i 顆，每顆在 0～1 之間循環
const puffs = (n, t, speed, f) => Array.from({ length: n }, (_, i) => f((t * speed + i / n) % 1, i));
// 使用中、或留下狀態的家具，換掉部分零件、加上額外零件（render.js 的 drawItem 會呼叫）
function itemLook(def, rot, it, parts) {
  const now = performance.now(), t = now / 1000;
  const active = fufu.act && fufu.act.uid === it.uid ? fufu.act.key : null;
  const st = itemState[it.uid];
  const alwaysMoving = def.id === 'fishtank';
  if (!active && !st && !alwaysMoving) return parts;
  const fire = st && st.fireUntil > now;
  let out = parts.map((p, i) => {
    if (p.screen && active) return Object.assign({}, p, { c: SCREEN_COLORS[(Math.floor(t * 4) + i) % SCREEN_COLORS.length] });
    if (p.spin && active) return Object.assign({}, p, { c: Math.floor(t * 6) % 2 ? '#8fd3f4' : '#ffffff' });
    if (p.fire && fire) return Object.assign({}, p, { r: p.r + 3 + Math.sin(t * 12) * 1.5, c: Math.sin(t * 9) > 0 ? '#ffb347' : '#ff7a3c' });
    if (p.shade && st && st.lit) return Object.assign({}, p, { c: '#fff6a0' });
    if (p.fish) return Object.assign({}, p, { x: p.x + Math.sin(t * 1.6) * .16 });
    if (p.globe && active) return Object.assign({}, p, { c: Math.floor(t * 3) % 2 ? '#6bb6ff' : '#7bd389' });
    if (p.toy && active) return Object.assign({}, p, { z: p.z + Math.abs(Math.sin(t * 6 + p.x * 5)) * 8 });
    return p;
  });
  const extra = [];
  const steam = (x, y, z0) => puffs(3, t, .7, (ph, i) => ({ k: 'ball', x: x + Math.sin(ph * 6 + i) * .05, y, z: z0 + ph * 30, r: 3 + ph * 4, c: '#ffffff', a: .7 * (1 - ph) }));
  if (active === 'cook' && def.id === 'stove') extra.push(...steam(.5, .5, 60));
  if (active === 'cook' && def.id === 'kitchen') extra.push(...steam(.65, .5, 46));
  if (active === 'tea') extra.push(...steam(.45, .45, 42));
  if (active === 'water') { // 澆花：水滴從上面落下
    const top = itemHeight(def) + 6;
    extra.push(...puffs(4, t, 1.4, (ph, i) => ({ k: 'ball', x: .35 + i * .1, y: .5, z: top - ph * 26, r: 2, c: '#6bb6ff', a: 1 - ph * .5 })));
  }
  if (active === 'wash') extra.push(...puffs(4, t, .9, (ph, i) => ({ k: 'ball', x: .38 + i * .08, y: .45, z: 40 + ph * 16, r: 2 + ph * 2, c: '#ffffff', a: .85 * (1 - ph) })));
  if (fire && def.id === 'fireplace') extra.push( // 火變大、多兩團火焰
    { k: 'ball', x: .86, y: .76, z: 18 + Math.sin(t * 11) * 2, r: 5, c: '#ffe066' },
    { k: 'ball', x: 1.14, y: .76, z: 18 + Math.cos(t * 10) * 2, r: 5, c: '#ffe066' });
  if (st && st.lit && (def.id === 'lamp' || def.id === 'nightstand')) // 開燈：燈罩外一圈光
    extra.push({ k: 'ball', x: .5, y: .5, z: def.id === 'lamp' ? 75 : 51, r: 24, c: '#fff6b0', a: .28 });
  if (st && st.dishesUntil > now && def.id === 'dining_table') extra.push( // 擺好的碗盤、筷子
    { x: .22, y: .22, w: .5, d: .5, z: 36, h: 1, c: '#ffffff' }, { k: 'ball', x: .47, y: .47, z: 41, r: 5, c: '#fff4d6' },
    { x: .76, y: .25, w: .04, d: .42, z: 36, h: 1.5, c: '#8a5a33' },
    { x: 1.28, y: 1.28, w: .5, d: .5, z: 36, h: 1, c: '#ffffff' }, { k: 'ball', x: 1.53, y: 1.53, z: 41, r: 5, c: '#fff4d6' },
    { x: 1.2, y: 1.3, w: .04, d: .42, z: 36, h: 1.5, c: '#8a5a33' });
  if (st && st.paint && def.id === 'easel') // 畫布上一筆一筆多出顏色
    for (let i = 0; i < st.paint; i++) extra.push({ x: .2 + (i * .37) % .5, y: .52, w: .14, d: .01, z: 28 + (i * 11) % 28, h: 6, c: SCREEN_COLORS[i % SCREEN_COLORS.length] });
  if (extra.length) out = sortBoxes(out.concat(rotateParts(extra, def, rot)).map(toBounds)).map(b => b.src);
  return out;
}

// 在家具旁邊做事，大約 5 秒；auto＝她自己閒逛時做的（不算「做了一件事」）
function fufuStartAct(key, now, it, auto) {
  const a = ACTIVITIES[key], def = FURN_BY_ID[it.id], fp = footprint(def, it.rot);
  const dx = it.x + fp.w / 2 - fufu.x, dy = it.y + fp.d / 2 - fufu.y;
  fufu.facing = dx - dy >= 0 ? 1 : -1;
  fufu.back = !ACT_PROPS[key] && dx + dy < 0; // 家具在後面（靠牆）就看到背影；手上有拿東西時臉朝前
  // 家具留下來的樣子
  const st = stateOf(it.uid);
  if (key === 'warm') st.fireUntil = now + 120000;
  if (key === 'dishes' && it.id === 'dining_table') st.dishesUntil = now + 120000;
  if (key === 'paint') st.paint = Math.min(12, (st.paint || 0) + 1);
  if (key === 'light') { st.lit = !st.lit; if (!st.lit) { fufu.path = []; fufu.act = { key, uid: it.uid, until: now + 2000, nextFx: now + 9e9, fxEvery: 9e9, n: 0 }; fufuSay('關燈囉～', 2200); Sound.play('click'); return; } }
  fufu.path = [];
  fufu.act = { key, uid: it.uid, until: now + 5500, nextFx: now + 300, fxEvery: a.sound === 'note' ? 380 : 1000, n: 0 };
  if (key === 'pick') { // 阿婆的果園：摘水果（有次數限制，摘完要等水果長出來）
    const f = orchardPick(it.id);
    if (!f) { fufu.act = null; fufuSay(pickLine('orchardEmpty'), 3000); return; }
    fufuSay(pickLine('act_pick', { 水果: f.name }), 3000);
    toast(`🧺 摘到${f.emoji}${f.name}！（果園還有 ${G.orchard.n} 顆）`);
    Sound.play('coin');
  } else fufuSay(pickLine('act_' + key, { 時間: timeText() }), 3000);
  if (key === 'fruit') G.kid.hunger = clampStat(G.kid.hunger + 15); // 阿婆的水果免費吃
  if (!auto) relativePerk(key); // 親戚家的事情：吃點心、喝茶、幫忙做事…（她自己點的才算）
  if (a.sound === 'bath') Sound.play('bath');
  else if (a.sound !== 'note') Sound.play('pickUp');
  if (a.tab) openTab(a.tab);
  if (a.open) setTimeout(() => { // 叔叔的電腦、阿婆的穀倉：打開那裡專屬的小遊戲
    const fn = { brick: openBrickGame, mole: openMoleGame, race: openRaceGame, farm: openFarmGame, hay: () => openStackGame('hay'), quiz: openQuizGame, run: openRunGame, fish: openFishing, bfly: openButterflyGame, shelf: openShelfGame, story: openNextStorybook, passport: openPassport }[a.open] || openFarmGame;
    if ($('#modal').hidden) fn();
  }, 1300);
  if (a.game) setTimeout(() => { // 大型電玩：隨機開一個小遊戲
    const games = [openMemoryGame, openCatchGame, openBubbleGame, openCupGame, openStackGame, openSimonGame];
    if ($('#modal').hidden) games[Math.floor(Math.random() * games.length)]();
  }, 1500);
  if (!auto) didSomething();
  saveGame();
}

// 跳舞：原地轉圈、跳一跳，寵物們也跟著跳
function fufuDance() {
  if (fufu.pose) fufuStandUp(false);
  const now = performance.now();
  fufu.path = []; fufu.task = null; fufu.back = false;
  fufu.act = { key: 'dance', until: now + 6000, nextFx: now, fxEvery: 420, n: 0 };
  fufuSay(pickLine('dance'), 3000);
}

// 陪寵物玩：走到寵物旁邊，一起跳、冒愛心，寵物心情變好也會長大一點
function fufuPlayPet() {
  if (fufu.pose) fufuStandUp(false);
  petWake(false);
  pet.task = null;
  pet.path = [];
  pet.idleUntil = performance.now() + 9000; // 寵物先停下來等她
  fufu.act = null;
  const [si, sj] = fufuTile();
  const path = findPath(curRoom(), si, sj, Math.floor(pet.x), Math.floor(pet.y));
  path.pop(); // 停在寵物旁邊那一格
  fufu.path = path;
  fufu.task = { pet: true };
  fufu.pendingSay = null;
  if (!path.length) fufuArrive(performance.now());
}
function fufuStartPlayPet(now) {
  const dx = pet.x - fufu.x, dy = pet.y - fufu.y;
  fufu.facing = dx - dy >= 0 ? 1 : -1;
  fufu.back = false;
  fufu.act = { key: 'playPet', until: now + 5000, nextFx: now, fxEvery: 700, n: 0 };
  pet.idleUntil = now + 5500;
  if (isEgg()) {
    fufuSay(pickLine('playEgg'), 3000);
    petGainGrowth(GROWTH.eggPat, GROWTH.eggCooldownMs);
  } else {
    fufuSay(pickLine('playPet', { 寵物: petName() }), 3000);
    patPet(12);
    pet.happyUntil = now + 5000;
    petGainGrowth(GROWTH.play, GROWTH.playCooldownMs);
  }
  Sound.play('petHappy');
  didSomething();
  saveGame();
}

// 叫她去洗澡、睡覺、念書：在這個房間找對應的家具
function fufuGoFind(kind) {
  const room = curRoom();
  const find = {
    bath: [it => FURNITURE_USE[it.id] && FURNITURE_USE[it.id].bath, '浴缸'],
    sleep: [it => FURNITURE_USE[it.id] && FURNITURE_USE[it.id].use === 'lie' && !FURNITURE_USE[it.id].bath, '床'],
    study: [it => ['study', 'read'].includes(FURNITURE_ACT[it.id]), '書桌或書櫃']
  }[kind];
  const it = room.items.find(find[0]);
  if (!it) { fufuSay(pickLine('noFurniture', { 家具: find[1] }), 3200); return; }
  fufuGoUse(it, false, kind === 'study' ? FURNITURE_ACT[it.id] : undefined);
}

function fufuBurst(emoji) {
  const { p, h } = fufuAnchor();
  fufu.fx.push({ emoji, x: p.x + (Math.random() - .5) * 24, y: p.y - h * .8, vy: -22 - Math.random() * 10, age: 0, life: 1.4 });
}

function fufuUpdateAct(now) {
  const a = fufu.act;
  if (a.uid && !curRoom().items.some(x => x.uid === a.uid)) { fufu.act = null; return; } // 家具被收走了
  if (now > a.until) { fufu.act = null; fufu.back = false; fufu.idleUntil = now + 2500; return; }
  if (now < a.nextFx) return;
  a.nextFx = now + a.fxEvery;
  a.n++;
  if (a.key === 'dance') {
    fufu.facing = -fufu.facing;
    fufu.jumpT = .35;
    Sound.play('note', [0, 1, 2, 3, 2, 1][a.n % 6]);
    fufuBurst(a.n % 2 ? '🎵' : '✨');
    if (!isEgg() && !pet.sleep) { pet.squishV = -6; pet.happyUntil = now + 800; }
    compList().forEach(c => { c.squishV = -6; c.happyUntil = now + 800; });
  } else if (a.key === 'playPet') {
    fufu.jumpT = .35;
    if (isEgg()) pet.leanV = (a.n % 2 ? -1 : 1) * 60;
    else { pet.squishV = -8; pet.happyUntil = now + 900; }
    petBurst({ kind: 'heart' }, 1);
    if (a.n % 2) Sound.play('petHappy');
  } else {
    const act = ACTIVITIES[a.key];
    fufuBurst(act.fx);
    if (act.sound === 'note') Sound.play('note', Math.floor(Math.random() * 4));
    if (a.key === 'paint' && a.uid) { const st = stateOf(a.uid); st.paint = Math.min(12, (st.paint || 0) + 1); } // 邊畫邊多一筆
  }
}

function fufuStartPose(now) {
  const room = curRoom(), task = fufu.task;
  fufu.task = null;
  const it = room.items.find(x => x.uid === task.uid);
  if (!it) return;
  const def = FURN_BY_ID[it.id], use = FURNITURE_USE[it.id];
  const pose = { type: use.use, uid: it.uid, snap: `${it.x},${it.y},${it.rot}` };
  if (use.use === 'sit') {
    const seat = use.seats[task.seat != null ? task.seat : Math.floor(Math.random() * use.seats.length)]; // 跟鄰居聊天時會指定座位
    const p = rotatePoint(def, it.rot, seat.x, seat.y), f = rotateDir(it.rot, use.front[0], use.front[1]);
    Object.assign(pose, { lx: p.x, ly: p.y, z: seat.z, facing: f.dx - f.dy >= 0 ? 1 : -1, back: f.dx + f.dy < 0 });
    pose.until = now + 6000 + Math.random() * 6000;
    fufuSay(pickLine('sit'));
  } else {
    const p = rotatePoint(def, it.rot, use.pillow.x, use.pillow.y);
    Object.assign(pose, { lx: p.x, ly: p.y, z: use.pillow.z, bath: !!use.bath });
    pose.until = now + 10000 + Math.random() * 8000;
    pose.snoreAt = now + 1200;
    if (use.bath) fufuSay(pickLine('bath'));
  }
  fufu.pose = pose;
  fufu.x = it.x + pose.lx;
  fufu.y = it.y + pose.ly;
  fufu.path = [];
  fufu.jumpT = .35;
  if (pose.type === 'lie' && !pose.bath) petMaybeJoinBed(it); // 寵物偶爾跳上床一起睡
}

function fufuStandUp(talk) {
  const room = curRoom(), pose = fufu.pose;
  fufu.pose = null;
  const it = room.items.find(x => x.uid === pose.uid);
  const c = nearestFree(room, fufu.x, fufu.y);
  if (c) { fufu.x = c[0] + .5; fufu.y = c[1] + .5; }
  fufu.jumpT = .35;
  fufu.back = false;
  fufu.idleUntil = performance.now() + 2500;
  if (talk && pose.type === 'lie') fufuSay(pickLine(pose.bath ? 'bathDone' : 'wake'));
  if (!it && talk) fufuSay(pickLine('moveAway'));
}

function fufuUpdatePose(now) {
  const room = curRoom(), pose = fufu.pose;
  const it = room.items.find(x => x.uid === pose.uid);
  // 家具被搬走或收起來：站起來
  if (!it || `${it.x},${it.y},${it.rot}` !== pose.snap) { fufuStandUp(!it); return; }
  if (now > pose.until) { fufuStandUp(true); return; }
  if (pose.type === 'lie' && now > pose.snoreAt) {
    fufuSay(pickLine(pose.bath ? 'bath' : 'sleep'), 1800);
    pose.snoreAt = now + 4000;
  }
}

// ── 每一幀更新 ──
function fufuUpdate(dt, now) {
  const room = curRoom();
  fufu.t += dt;
  if (fufu.jumpT > 0) fufu.jumpT = Math.max(0, fufu.jumpT - dt);
  fufu.fx.forEach(q => { q.age += dt; q.y += q.vy * dt; });
  fufu.fx = fufu.fx.filter(q => q.age < q.life);

  // 換房間：出現在房間中央附近
  if (fufu.room !== roomKey()) {
    fufu.room = roomKey();
    fufu.pose = null;
    fufu.task = null;
    fufu.act = null;
    fufu.pendingSay = null; // 上一個房間還沒說出口的話就不說了
    const c = nearestFree(room, room.w / 2, room.d / 2);
    if (c) { fufu.x = c[0] + .5; fufu.y = c[1] + .5; }
    fufu.path = [];
    fufu.idleUntil = now + 1500;
  }

  if (fufu.pose) { fufuUpdatePose(now); return; }
  if (fufu.act) { fufuUpdateAct(now); if (fufu.act) return; }

  // 腳下被家具蓋住：跳到旁邊的空格
  const blk = blockedGrid(room);
  const [ci, cj] = fufuTile();
  if (ci >= room.w || cj >= room.d || blk[ci] === undefined || blk[ci][cj]) {
    const c = nearestFree(room, fufu.x, fufu.y);
    if (c) {
      fufu.x = c[0] + .5; fufu.y = c[1] + .5; fufu.path = []; fufu.task = null;
      fufu.jumpT = .35;
      fufuSay(pickLine('squash'));
    }
  }

  if (fufu.path.length) {
    const [ni, nj] = fufu.path[0];
    if (blk[ni] && blk[ni][nj]) { // 路被擋住就重新找
      const task = fufu.task, last = fufu.path[fufu.path.length - 1];
      const it = task && room.items.find(x => x.uid === task.uid);
      if (it) { if (fufuGoUse(it, true, task.act)) Object.assign(fufu.task, { auto: task.auto, seat: task.seat }); }
      else if (task && task.pet) fufuPlayPet();
      else fufuWalkTo(last[0], last[1]);
      return;
    }
    const tx = ni + .5, ty = nj + .5, dx = tx - fufu.x, dy = ty - fufu.y;
    const hungrySlow = G.kid.hunger < 35 ? .7 : 1; // 肚子餓走得慢一點
    const dist = Math.hypot(dx, dy), step = FUFU_SPEED * hungrySlow * dt;
    const sx = dx - dy; // 螢幕上的左右方向
    if (Math.abs(sx) > .01) fufu.facing = sx > 0 ? 1 : -1;
    if (Math.abs(dx + dy) > .01) fufu.back = dx + dy < 0; // 往房間深處走就看到背影
    if (dist <= step) {
      fufu.x = tx; fufu.y = ty;
      fufu.path.shift();
      if (!fufu.path.length) {
        fufu.back = false;
        if (fufu.task) fufuArrive(now);
        else fufu.idleUntil = now + 2500 + Math.random() * 4000;
      }
    } else {
      fufu.x += dx / dist * step;
      fufu.y += dy / dist * step;
    }
  } else if (fufu.task) {
    fufuArrive(now); // 本來就站在家具旁邊
  } else if (now > fufu.idleUntil && !hold) {
    fufuWander(room);
  }
}

function fufuWander(room) {
  fufu.idleUntil = performance.now() + 3000;
  // 自己肚子餓、寵物需要照顧時，偶爾說一下（不會一直唸）
  if (G.kid.hunger < 35 && Math.random() < .3) { fufuSay(pickLine('kidHungry'), 3000); Sound.play('petSad'); return; }
  if (Math.random() < .25) {
    if (G.pet.hunger < 35) { fufuSay(pickLine('petHungry', { 寵物: petName() }), 3200); return; }
    if (G.pet.clean < 35) { fufuSay(pickLine('petDirty', { 寵物: petName() }), 3200); return; }
  }
  // 偶爾自言自語（邊說邊繼續逛）
  if (Math.random() < .15) fufuSay(pickLine('chat'), 2800);
  // 有時候自己去坐椅子、睡午覺，或在家具旁邊做事（會打開分頁的「換衣服」不自己做）
  // 自己閒逛時不做：會打開分頁的、會開小遊戲的、會用掉果園次數的
  const autoAct = it => { const k = FURNITURE_ACT[it.id], a = k && ACTIVITIES[k]; return a && !a.tab && !a.game && !a.open && k !== 'pick'; };
  const usable = room.items.filter(it => FURNITURE_USE[it.id] || autoAct(it));
  if (usable.length && Math.random() < .35) {
    const it = usable[Math.floor(Math.random() * usable.length)];
    const act = autoAct(it) && (!FURNITURE_USE[it.id] || Math.random() < .5) ? FURNITURE_ACT[it.id] : undefined;
    if (fufuGoUse(it, true, act)) { fufu.task.auto = true; return; }
  }
  // 有時候走到家具旁邊說說話
  if (room.items.length && Math.random() < .35) {
    const it = room.items[Math.floor(Math.random() * room.items.length)];
    const def = FURN_BY_ID[it.id], fp = footprint(def, it.rot);
    fufuWalkTo(Math.min(room.w - 1, it.x + fp.w), Math.min(room.d - 1, it.y + Math.floor(fp.d / 2)));
    fufu.pendingSay = pickLine('like', { 家具: def.name });
    return;
  }
  const [si, sj] = fufuTile();
  const ti = Math.max(0, Math.min(room.w - 1, si + Math.floor(Math.random() * 7) - 3));
  const tj = Math.max(0, Math.min(room.d - 1, sj + Math.floor(Math.random() * 7) - 3));
  fufuWalkTo(ti, tj);
}

// ── 繪圖 ──
function fufuDrawEntry() {
  if (fufu.pose) return null; // 坐著躺著時跟家具一起畫
  return { x: fufu.x - .2, y: fufu.y - .2, w: .4, d: .4, z: 0, h: FUFU_H, drawFn: fufuDraw };
}

function fufuOccupant() {
  const pose = fufu.pose;
  if (!pose) return null;
  return { uid: pose.uid, pose: pose.type, lx: pose.lx, ly: pose.ly, z: pose.z, draw: fufuDrawPosed };
}

function fufuBlink() {
  if (fufu.t > fufu.blinkAt + .13) fufu.blinkAt = fufu.t + 2 + Math.random() * 3; // 偶爾眨眼
  return fufu.t > fufu.blinkAt;
}

function fufuDraw(ctx) {
  const p = iso(fufu.x, fufu.y);
  const walking = fufu.path.length > 0;
  const busy = fufu.act && ACTIVITIES[fufu.act.key]; // 做事中：身體跟著動作輕輕上下
  const hop = walking ? Math.abs(Math.sin(fufu.t * 11)) * 2 : busy ? Math.abs(Math.sin(fufu.t * 7)) * 1.5 : 0;
  const prop = fufu.act && ACT_PROPS[fufu.act.key];
  const jump = fufu.jumpT > 0 ? Math.sin((1 - fufu.jumpT / .35) * Math.PI) * 18 : 0;
  const breathe = walking ? 1 : 1 + Math.sin(fufu.t * 2.4) * .015;

  ctx.fillStyle = 'rgba(40,30,20,.22)';
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, 16 - hop, 7 - hop / 3, 0, 0, Math.PI * 2);
  ctx.fill();

  const k = kidHeightScale(); // 長大後畫大一點
  ctx.save();
  ctx.translate(p.x, p.y - hop - jump + 1);
  ctx.scale(fufu.facing * k, breathe * k);
  drawGirl(ctx, { t: fufu.t, walking, back: fufu.back && (walking || !!fufu.act), blink: fufuBlink(), outfit: currentOutfit(), prop, face: kidFace() });
  ctx.restore();
}

function fufuDrawPosed(ctx) {
  const pose = fufu.pose, p = iso(fufu.x, fufu.y, pose.z);
  const jump = fufu.jumpT > 0 ? Math.sin((1 - fufu.jumpT / .35) * Math.PI) * 10 : 0;
  const k = kidHeightScale();
  ctx.save();
  if (pose.type === 'sit') {
    ctx.translate(p.x, p.y + 12 * k - jump); // 讓褲子底部剛好在座面上
    ctx.scale(pose.facing * k, (1 + Math.sin(fufu.t * 2.4) * .012) * k);
    drawGirl(ctx, { t: fufu.t, sit: true, back: pose.back, blink: fufuBlink(), outfit: currentOutfit(), face: kidFace() });
  } else {
    // 頭靠在枕頭上、身體在棉被下，只畫頭，微微歪一邊
    ctx.translate(p.x, p.y - 6 - jump);
    ctx.rotate(-.3 + Math.sin(fufu.t * 1.2) * .03);
    ctx.translate(0, 46);
    drawGirl(ctx, { t: 0, blink: true, headOnly: true, outfit: currentOutfit(), face: kidFace() });
  }
  ctx.restore();
}

// 對話框與點選用的定位點：頭頂位置
function fufuAnchor() {
  const pose = fufu.pose;
  const k = kidHeightScale();
  if (!pose) return { p: iso(fufu.x, fufu.y), h: FUFU_H * k };
  if (pose.type === 'sit') { const p = iso(fufu.x, fufu.y, pose.z); return { p: { x: p.x, y: p.y + 12 * k }, h: FUFU_H * k }; }
  const p = iso(fufu.x, fufu.y, pose.z); return { p: { x: p.x, y: p.y + 4 }, h: 26 };
}

// 小可愛吃東西；小安素、鮮奶、青花菜是營養的食物，會慢慢長大（不顯示數字，也不說長高）
// src 為 'pet' 時吃的是寵物食物
function kidEat(foodId, src) {
  const r = feedKid(foodId, src);
  if (!r) return false;
  const f = (src === 'pet' ? FOOD_BY_ID : KID_FOOD_BY_ID)[foodId];
  didSomething();
  Sound.play('eat');
  if (!fufu.pose) { fufu.jumpT = .35; fufu.back = false; }
  fufu.thinkUntil = 0;
  fufu.thinkAt = performance.now() + 20000;
  if (r.grew) {
    fufuSay(pickLine('kidGrow'), 3000);
    toast(`${f.emoji} 好營養！${charName()}會健康、快快長大、壯壯的！💪`);
  } else {
    fufuSay(pickLine('kidEat'));
  }
  saveGame();
  return true;
}

// 肚子餓時，頭上偶爾冒出想吃東西的泡泡（沒在說話時才出現）
function fufuDrawThink(ctx, now) {
  if (G.kid.hunger >= 35 || fufu.say) return;
  if (!fufu.thinkAt || now > fufu.thinkAt) { fufu.thinkUntil = now + 2200; fufu.thinkAt = now + 9000; }
  if (now > fufu.thinkUntil) return;
  const { p, h } = fufuAnchor(), bx = p.x + 18, by = p.y - h - 8;
  ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.strokeStyle = 'rgba(74,59,42,.3)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(p.x + 9, p.y - h + 4, 2.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(bx, by, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.font = '13px "Segoe UI Emoji", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🍙', bx, by + 1);
  ctx.textAlign = 'start';
}

function fufuDrawBubble(ctx, now) {
  // 頭上冒出的音符、愛心…
  ctx.font = '14px "Segoe UI Emoji", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  fufu.fx.forEach(q => { ctx.globalAlpha = Math.max(0, 1 - q.age / q.life); ctx.fillText(q.emoji, q.x, q.y); });
  ctx.globalAlpha = 1; ctx.textAlign = 'start';
  fufuDrawThink(ctx, now);
  if (!fufu.say || now > fufu.sayUntil) { fufu.say = null; return; }
  const { p, h } = fufuAnchor(), top = p.y - h - 14;
  ctx.font = '600 13px "Noto Sans TC", "Microsoft JhengHei", sans-serif';
  const tw = ctx.measureText(fufu.say).width, bw = tw + 22, bh = 28;
  const bx = p.x - bw / 2, by = top - bh;
  ctx.fillStyle = 'rgba(255,255,255,.96)';
  ctx.strokeStyle = 'rgba(74,59,42,.35)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.roundRect(bx, by, bw, bh, 12);
  ctx.moveTo(p.x - 6, by + bh);
  ctx.lineTo(p.x, by + bh + 8);
  ctx.lineTo(p.x + 6, by + bh);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#4a3b2a';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(fufu.say, p.x, by + bh / 2 + 1);
  ctx.textAlign = 'start';
}

function fufuHit(w) {
  const { p, h } = fufuAnchor();
  const lie = fufu.pose && fufu.pose.type === 'lie';
  return w.x > p.x - 17 && w.x < p.x + 17 && w.y > p.y - h && w.y < p.y + (lie ? 16 : 4);
}

function fufuPoke() {
  Sound.play('jump');
  if (fufu.pose) {
    if (fufu.pose.type === 'lie') { const bath = fufu.pose.bath; fufuStandUp(false); fufuSay(pickLine(bath ? 'bathDone' : 'wakePoke')); }
    else fufuSay(pickLine('poke'));
    return;
  }
  fufu.jumpT = .35;
  fufu.back = false;
  fufu.path = [];
  fufu.task = null;
  fufu.act = null;
  fufu.idleUntil = performance.now() + 3000;
  fufuSay(pickLine('poke'));
}

// 走到定點後說出準備好的話
function fufuArrivalCheck() {
  if (fufu.pendingSay && !fufu.path.length) {
    fufuSay(fufu.pendingSay);
    fufu.pendingSay = null;
  }
}
