<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffe9f1">
<title>圓圓跑酷答題</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 30% 0%,#fff7e8 0,#ffe9f1 45%,#e6f0ff 100%) fixed;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;color:#6b4423}
body{display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:520px;height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;border:none}
.scr{position:absolute;inset:0;background:rgba(255,240,246,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;z-index:20;overflow-y:auto}
.scr.on{display:flex}
.panel{width:100%;max-width:420px;border-radius:28px;background:linear-gradient(160deg,#fffdf7,#fff3e2);box-shadow:0 14px 30px rgba(140,90,50,.22),0 6px 0 #f0dcc0,inset 0 2px 0 #fff;padding:20px 16px}
h1{margin:4px 0 2px;font-size:30px;color:#e8505b;text-shadow:0 3px 0 #fff,0 5px 6px rgba(200,80,90,.25);letter-spacing:2px}
.subt{font-size:15px;font-weight:700;color:#a07048;margin:0 0 12px;line-height:1.6}
.big{display:block;width:100%;font-size:22px;font-weight:900;color:#fff;padding:14px 8px 16px;margin-top:12px;border-radius:20px;background:linear-gradient(#86d8a0,#5fae7c 60%,#4f9a69);box-shadow:0 6px 0 #3f7d55,0 10px 14px rgba(40,90,60,.3),inset 0 3px 0 rgba(255,255,255,.45);text-shadow:0 2px 0 rgba(0,60,30,.3)}
.big:active{transform:translateY(5px);box-shadow:0 1px 0 #3f7d55}
.big.pink{background:linear-gradient(#ff9fb8,#f0708f 60%,#dc5b7b);box-shadow:0 6px 0 #b3405e,0 10px 14px rgba(180,60,90,.3),inset 0 3px 0 rgba(255,255,255,.45)}
.big.blue{background:linear-gradient(#8cc8ff,#4f9cf0 60%,#3f88dc);box-shadow:0 6px 0 #3577c4,0 10px 14px rgba(50,100,180,.3),inset 0 3px 0 rgba(255,255,255,.45)}
.big.alt{background:linear-gradient(#ffcf80,#e7a94a 60%,#d49638);box-shadow:0 6px 0 #a8752a,0 10px 14px rgba(160,110,40,.3),inset 0 3px 0 rgba(255,255,255,.45)}
.big small{display:block;font-size:13px;font-weight:700;opacity:.92}
.how{font-size:14px;line-height:1.7;color:#8a5a33;background:#fff;border-radius:16px;padding:8px 10px;margin-top:14px;box-shadow:inset 0 2px 5px rgba(120,80,40,.12)}
.bests{font-size:14px;font-weight:700;color:#a07048;margin-top:8px}
/* 開始畫面的圓圓 */
.hero{width:96px;height:96px;margin:0 auto 6px;position:relative;animation:hop 1s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-10px)}}
/* HUD */
#hud{display:flex;align-items:center;gap:6px;padding:8px 10px 4px;flex-shrink:0}
.chip{display:flex;align-items:center;gap:3px;background:#fff;border-radius:999px;padding:4px 10px;font-weight:900;font-size:15px;box-shadow:0 3px 0 #e6d6b8,inset 0 2px 0 #fff;white-space:nowrap}
#hearts{letter-spacing:-1px}
#prog{flex:1;height:14px;border-radius:999px;background:#fff;box-shadow:inset 0 3px 5px rgba(120,80,40,.25),0 2px 0 #fff;overflow:hidden;min-width:30px}
#prog i{display:block;height:100%;width:0;background:linear-gradient(#ffe68a,#ffc23a 55%,#f2a52a);border-radius:999px;transition:width .4s}
#mute{width:36px;height:34px;border-radius:12px;background:#fff;font-size:18px;box-shadow:0 3px 0 #e0cfb0,inset 0 2px 0 #fff;flex-shrink:0}
/* 題目卡 */
#q{margin:4px 10px 6px;border-radius:22px;background:linear-gradient(#fff,#fff7ea);box-shadow:0 6px 0 #efdcc0,0 10px 18px rgba(140,90,50,.18),inset 0 2px 0 #fff;padding:8px 10px 10px;text-align:center;flex-shrink:0;position:relative;z-index:5;min-height:64px}
#q .tag{display:inline-block;font-size:12px;font-weight:900;color:#fff;border-radius:999px;padding:2px 10px;background:linear-gradient(#8cc8ff,#4f9cf0);box-shadow:0 2px 0 #3577c4}
#qn{font-size:12px;font-weight:900;color:#c49a70;margin-left:6px}
#qt{font-size:20px;font-weight:900;line-height:1.7;margin-top:8px;word-break:break-word;text-shadow:0 2px 0 rgba(255,255,255,.9)}
#qt b{color:#e8505b}
#qt .em{font-size:44px;line-height:1.15;margin:0}
#qt .em.en{font-size:30px;font-weight:800;color:#d0664f}
#qt .em.cpb,#qt .em.num{font-size:50px;font-weight:900;color:#d0664f}
#qt .em.zyseq,#qt .em.ord{font-size:30px;font-weight:900;letter-spacing:1px}
#qt .sub{font-size:17px;color:#8a5a33;font-weight:700;line-height:1.5}
ruby{ruby-align:center;ruby-position:over}
rt{font-size:.46em;font-weight:700;line-height:1.1;color:#8a5a33}
.gate rt{color:#fff}
#sp{position:absolute;right:8px;top:6px;width:34px;height:30px;border-radius:10px;background:#fff3c4;font-size:16px;display:none;box-shadow:0 2px 0 #e6c870}
/* 跑道 */
#stage{position:relative;flex:1;min-height:200px;overflow:hidden;touch-action:none;border-radius:22px 22px 0 0;margin:0 6px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#layer{position:absolute;inset:0;pointer-events:none}
.gate{position:absolute;left:0;top:0;transform-origin:50% 100%;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-weight:900;border-radius:22px 22px 10px 10px;padding:8px 4px 12px;text-shadow:0 2px 0 rgba(0,0,0,.25);line-height:1.25;word-break:break-word;will-change:transform}
.gate::before{content:"";position:absolute;left:8%;right:8%;top:5px;height:30%;border-radius:16px 16px 40% 40%;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.gate::after{content:"";position:absolute;left:10%;right:10%;bottom:-10px;height:12px;border-radius:50%;background:rgba(60,30,10,.22);filter:blur(2px);z-index:-1}
.g0{background:linear-gradient(#ff9fb8,#f0708f 60%,#dc5b7b);box-shadow:0 7px 0 #b3405e,inset 0 -5px 8px rgba(0,0,0,.08)}
.g1{background:linear-gradient(#8cc8ff,#4f9cf0 60%,#3f88dc);box-shadow:0 7px 0 #3577c4,inset 0 -5px 8px rgba(0,0,0,.08)}
.g2{background:linear-gradient(#ffd98a,#f2b33f 60%,#e09d2a);box-shadow:0 7px 0 #b07a1f,inset 0 -5px 8px rgba(0,0,0,.08)}
.gate.ok{background:linear-gradient(#a6f0b8,#5fc77e 60%,#4caf69);box-shadow:0 7px 0 #3f7d55,0 0 0 4px #fff,0 0 20px #fff7a0}
.gate.soft{background:linear-gradient(#fff,#f3e6ff 60%,#e3d0f7);color:#9a6bc4;text-shadow:none;box-shadow:0 7px 0 #c9b0e6}
.gate.hl{outline:4px solid rgba(255,255,255,.9);outline-offset:2px}
.cd{display:inline-block;width:40px;height:40px;border-radius:50%;border:3px solid rgba(0,0,0,.22);vertical-align:middle;box-shadow:0 3px 0 rgba(0,0,0,.12)}
/* 圓圓（黏土風） */
#runner{position:absolute;left:0;top:0;width:70px;height:78px;margin-left:-35px;margin-top:-78px;transition:left .16s ease-out;z-index:3}
.blob{position:absolute;left:5px;right:5px;top:6px;bottom:12px;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 35% 28%,#fff8e2 0,#ffe3a8 45%,#f4c06e 100%);box-shadow:inset -4px -6px 8px rgba(180,110,40,.35),inset 3px 4px 6px rgba(255,255,255,.8),0 6px 6px rgba(80,40,10,.3)}
.blob .ey{position:absolute;top:36%;width:8px;height:10px;border-radius:50%;background:#4a2e1a}
.blob .ey::after{content:"";position:absolute;left:1px;top:1px;width:3px;height:3px;border-radius:50%;background:#fff}
.blob .ey.l{left:30%}.blob .ey.r{right:30%}
.blob .ck{position:absolute;top:52%;width:11px;height:6px;border-radius:50%;background:#ff9fb0;opacity:.8}
.blob .ck.l{left:14%}.blob .ck.r{right:14%}
.blob .mo{position:absolute;left:50%;top:56%;width:10px;height:6px;margin-left:-5px;border-radius:0 0 10px 10px;background:#c0504d}
.ear{position:absolute;top:0;width:18px;height:20px;border-radius:50% 50% 30% 30%;background:radial-gradient(circle at 40% 35%,#fff3d2,#f4c06e);box-shadow:inset -2px -3px 4px rgba(180,110,40,.3)}
.ear.l{left:8px;transform:rotate(-18deg)}.ear.r{right:8px;transform:rotate(18deg)}
.leg{position:absolute;bottom:2px;width:16px;height:14px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffb3c4,#ee7c97);box-shadow:0 3px 3px rgba(80,40,10,.25)}
.leg.l{left:16px}.leg.r{right:16px}
.run .leg.l{animation:legA .32s linear infinite}.run .leg.r{animation:legB .32s linear infinite}
.run .bod{animation:bob .32s ease-in-out infinite}
@keyframes legA{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes legB{0%,100%{transform:translateY(-8px)}50%{transform:translateY(0)}}
@keyframes bob{50%{transform:translateY(-4px)}}
.bod{position:absolute;inset:0}
.shadow{position:absolute;left:12px;right:12px;bottom:-5px;height:10px;border-radius:50%;background:rgba(60,30,10,.25);filter:blur(2px)}
#runner.yay .bod{animation:jelly .55s ease}
#runner.oops .bod{animation:squish .7s ease}
@keyframes jelly{30%{transform:scale(1.18,.84)}55%{transform:scale(.92,1.1) translateY(-10px)}80%{transform:scale(1.04,.97)}}
@keyframes squish{20%{transform:scale(1.25,.7)}45%{transform:scale(.9,1.08)}70%{transform:scale(1.05,.95)}}
/* 跳出的文字 */
.pop{position:absolute;font-weight:900;font-size:24px;color:#ffb300;text-shadow:0 3px 0 #fff,0 0 8px #fff;pointer-events:none;animation:up 1s ease-out forwards;z-index:6;white-space:nowrap;transform:translateX(-50%)}
.pop.soft{color:#9a6bc4;font-size:18px}
@keyframes up{to{margin-top:-60px;opacity:0}}
#msg{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);background:#fff;border-radius:18px;padding:8px 14px;font-weight:900;font-size:17px;box-shadow:0 5px 0 #efdcc0,0 8px 14px rgba(140,90,50,.2);display:none;z-index:7;max-width:92%;text-align:center;line-height:1.5}
#msg.on{display:block;animation:jelly .45s ease}
#combo{position:absolute;right:10px;top:8px;z-index:6;color:#fff;font-weight:900;font-size:15px;padding:4px 10px;border-radius:999px;background:linear-gradient(#ff8ab8,#e95f97);box-shadow:0 4px 0 #d94f87;display:none}
#hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:12px;font-weight:700;color:rgba(255,255,255,.95);text-shadow:0 1px 2px rgba(0,0,0,.35);pointer-events:none;z-index:4}
/* 結算 */
#score{font-size:54px;font-weight:900;color:#ffb300;text-shadow:0 4px 0 #c98a1c,0 8px 10px rgba(150,100,20,.3);margin:4px 0}
#stars{font-size:38px;letter-spacing:4px;margin:2px 0}
#estat{font-size:15px;font-weight:700;line-height:1.8;color:#8a5a33}
#newbest{display:none;font-weight:900;color:#e8505b;font-size:18px;animation:jelly .6s ease}
@media (max-width:350px){h1{font-size:26px}#qt{font-size:18px}#qt .em{font-size:38px}.chip{font-size:13px;padding:3px 7px}}
@media (prefers-reduced-motion:reduce){.hero,.run .leg.l,.run .leg.r,.run .bod{animation:none}}

/* 外觀：小貓、小兔、帽子 */
.hat{position:absolute;left:50%;top:-16px;transform:translateX(-50%);font-size:24px;z-index:2;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25));pointer-events:none}
[data-skin=cat] .blob{background:radial-gradient(circle at 35% 28%,#fff 0,#e8e8ee 45%,#b9bccb 100%);box-shadow:inset -4px -6px 8px rgba(90,90,120,.35),inset 3px 4px 6px #fff,0 6px 6px rgba(40,40,60,.3)}
[data-skin=cat] .ear{width:20px;height:22px;border-radius:15% 85% 10% 50%;background:linear-gradient(135deg,#ffc6d6 30%,#c9ccd8 31%)}
[data-skin=cat] .ear.l{transform:rotate(-8deg) scaleX(-1)}[data-skin=cat] .ear.r{transform:rotate(8deg)}
[data-skin=cat] .blob .mo{width:12px;height:5px;border-radius:0 0 50% 50%;background:none;border:2px solid #6b4a5a;border-top:0}
[data-skin=bunny] .blob{background:radial-gradient(circle at 35% 28%,#fff 0,#fff1f6 50%,#f5cbd9 100%);box-shadow:inset -4px -6px 8px rgba(200,120,150,.3),inset 3px 4px 6px #fff,0 6px 6px rgba(80,40,60,.25)}
[data-skin=bunny] .ear{top:-22px;width:14px;height:36px;border-radius:50%;background:linear-gradient(90deg,#fff 25%,#ffc0d3 26%,#ffc0d3 74%,#fff 75%)}
[data-skin=bunny] .ear.l{left:14px}[data-skin=bunny] .ear.r{right:14px}
[data-skin=bunny] .hat{top:-30px}
#shopbtn{font-size:17px;padding:10px 8px 12px}
.shopgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.item{border-radius:16px;background:#fff;padding:8px 4px;font-size:13px;font-weight:900;color:#8a5a33;box-shadow:0 4px 0 #ecd8b8,inset 0 2px 0 #fff;line-height:1.4}
.item b{display:block;font-size:30px;line-height:1.2}
.item.own{background:#f0fff3}.item.on{outline:3px solid #5fc77e}
.item i{font-style:normal;font-size:12px;color:#c98a1c}
.sh{font-weight:900;margin-top:10px;text-align:left;font-size:15px}
#wallet{font-size:20px;font-weight:900;color:#ffb300;text-shadow:0 2px 0 #c98a1c}
/* 道具 */
.pu{position:absolute;left:0;top:0;width:52px;height:52px;margin:-52px 0 0 -26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;
 background:radial-gradient(circle at 35% 30%,#fff 0,#e6f6ff 45%,#9fd8ff 100%);box-shadow:0 5px 0 #6fb6e6,0 0 14px #fff;animation:pfl .8s ease-in-out infinite;z-index:2}
@keyframes pfl{50%{margin-top:-60px}}
#pus{display:flex;gap:2px}
#pus span{font-size:16px}
#runner.shield::before{content:"";position:absolute;left:-10px;right:-10px;top:-14px;bottom:-6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7),rgba(170,220,255,.25) 60%,rgba(140,200,255,.5));box-shadow:0 0 10px #bfe6ff;z-index:3}
/* 寶箱 */
#chest{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:9;display:none;text-align:center;background:#fffaf0;border-radius:24px;padding:12px 18px;box-shadow:0 6px 0 #efd6a8,0 10px 20px rgba(140,90,50,.3);font-weight:900;color:#8a5a33;min-width:180px}
#chest.on{display:block;animation:jelly .5s ease}
#chest .box{font-size:58px;animation:shake .5s ease 2}
#chest.open .box{animation:pop2 .5s ease forwards}
@keyframes shake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes pop2{50%{transform:scale(1.4)}100%{transform:scale(1.1)}}
#chest .gift{font-size:18px;margin-top:4px}
/* 魔王題 */
#q.boss{background:linear-gradient(#fff0f7,#ffe1ef);box-shadow:0 6px 0 #f3b7d0,0 0 0 3px #ffb3d0,0 10px 18px rgba(200,80,130,.25)}
#q.boss .tag{background:linear-gradient(#ff9fc8,#e95f97);box-shadow:0 2px 0 #c04878}
#boss{position:absolute;left:50%;top:2%;width:120px;height:110px;margin-left:-60px;z-index:1;display:none;pointer-events:none}
#boss.on{display:block;animation:bin .9s cubic-bezier(.3,1.6,.5,1) both}
#boss.on .bb{animation:bwob 1.2s ease-in-out .9s infinite}
#boss.giggle .bb{animation:jelly .5s ease}
#boss.flee{animation:bflee 1.4s ease-in forwards}
@keyframes bin{0%{transform:translateY(-140px) scale(.4)}60%{transform:translateY(8px) scale(1.08,.92)}100%{transform:none}}
@keyframes bwob{50%{transform:scale(1.05,.95) translateY(2px)}}
@keyframes bflee{0%{transform:none}15%{transform:translateY(-20px) rotate(-8deg)}30%{transform:translate(20px,0) rotate(8deg)}50%{transform:translate(60px,-18px) rotate(-10deg)}70%{transform:translate(120px,0) rotate(10deg)}100%{transform:translate(260px,-30px) rotate(25deg);opacity:0}}
.bb{position:absolute;inset:0}
.bb div{position:absolute}
.bf{left:50%;top:44%;width:56px;margin-left:-28px;height:30px}
.bf::before,.bf::after{content:"";position:absolute;top:0;width:12px;height:14px;border-radius:50%;background:#3d2a1e;box-shadow:inset 3px 3px 0 -1px #fff}
.bf::before{left:6px}.bf::after{right:6px}
.bf i{position:absolute;left:50%;top:14px;width:14px;height:8px;margin-left:-7px;border-radius:0 0 10px 10px;background:#c0504d}
.bf b{position:absolute;top:12px;width:12px;height:7px;border-radius:50%;background:#ff9fb0;opacity:.85}.bf b.l{left:-4px}.bf b.r{right:-4px}
.clay{box-shadow:inset -6px -8px 12px rgba(0,0,0,.14),inset 5px 6px 8px rgba(255,255,255,.7),0 6px 8px rgba(60,30,10,.25)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:8;width:100%;height:100%}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span class="chip" id="hearts" aria-label="愛心">❤️❤️❤️❤️❤️</span>
    <span class="chip">🪙<span id="coins">0</span></span><span id="pus"></span>
    <div id="prog" aria-hidden="true"><i id="pbar"></i></div>
    <button id="mute" type="button" aria-label="音效開關">🔊</button>
  </div>
  <div id="q"><span class="tag" id="qtag">準備</span><span id="qn"></span><button id="sp" type="button" aria-label="唸給我聽">🔈</button><div id="qt">跑起來囉！</div></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="boss"></div><div id="layer"><div id="runner" class="run"><div class="shadow"></div><div class="bod"><div class="ear l"></div><div class="ear r"></div><div class="blob"><i class="ey l"></i><i class="ey r"></i><i class="ck l"></i><i class="ck r"></i><i class="mo"></i></div><span class="hat" id="hat"></span><div class="leg l"></div><div class="leg r"></div></div></div></div>
    <div id="combo"></div><canvas id="fx"></canvas><div id="chest"><div class="box">🎁</div><div class="gift" id="gift">連續答對 5 題！</div></div>
    <div id="msg"></div>
    <div id="hint">左右滑動或點跑道換路 · 往上滑衝刺</div>
  </div>

  <div class="scr on" id="start">
    <div class="panel">
      <div class="hero"><div style="position:absolute;inset:0" class="run" id="hero"></div></div>
      <h1>圓圓跑酷答題</h1>
      <p class="subt">圓圓往前跑，跑進正確答案的門<br>就能吃到金幣喔！</p>
      <button class="big pink" id="g1" type="button">🐣 小一版<small>國語・英文</small></button>
      <button class="big blue" id="g4" type="button">🚀 小四版<small>數學・國語</small></button>
      <button class="big alt" id="shopbtn" type="button">🛍️ 換裝商店　🪙<span id="walletS">0</span></button><div class="bests" id="bests"></div>
      <div class="how">⬅️➡️ 左右滑動、點跑道，或按鍵盤方向鍵換路<br>⬆️ 往上滑或按空白鍵：衝刺<br>跑錯門會撞到軟軟的棉花糖，扣一顆愛心</div>
    </div>
  </div>

  <div class="scr" id="shop">
    <div class="panel">
      <div style="font-size:22px;font-weight:900">🛍️ 換裝商店</div>
      <div>我的金幣 <span id="wallet">0</span></div>
      <div class="sh">🐾 角色</div><div class="shopgrid" id="skins"></div>
      <div class="sh">🎀 帽子・裝飾</div><div class="shopgrid" id="hats"></div>
      <button class="big" id="shopback" type="button">⬅️ 回去</button>
    </div>
  </div>
  <div class="scr" id="end">
    <div class="panel">
      <div style="font-size:22px;font-weight:900" id="etitle">跑完囉！</div>
      <div id="stars">⭐⭐⭐</div>
      <div id="score">0</div>
      <div id="newbest">🎉 新紀錄！</div>
      <div id="estat"></div>
      <button class="big" id="again" type="button">🔁 再跑一次</button>
      <button class="big alt" id="home" type="button">🏠 換年級</button>
    </div>
  </div>
</div>
<script>
'use strict';

var QG4=(function(){

  var fx=$('fx'),fc=fx.getContext('2d'),parts=[],fxOn=0;
  function fireworks(){var r=stage.getBoundingClientRect();fx.width=r.width;fx.height=r.height;var cols=['#ff8fb1','#ffd36b','#8fd3ff','#a6f0b8','#c9a6ff','#fff'];
    for(var k=0;k<5;k++){var cx0=r.width*(.15+.7*rnd(100)/100),cy0=r.height*(.12+.3*rnd(100)/100),col=cols[rnd(cols.length)];
      for(var i=0;i<26;i++){var a=i/26*6.283,v=1.5+rnd(30)/10;parts.push({x:cx0,y:cy0,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:60+rnd(30)+k*8,d:k*8,c:col})}}

    if(!fxOn){fxOn=1;requestAnimationFrame(fxLoop)}}
  function fxLoop(){fc.clearRect(0,0,fx.width,fx.height);parts=parts.filter(function(p){if(p.d>0){p.d--;return true}p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.vx*=.985;p.l--;
      fc.globalAlpha=Math.max(0,Math.min(1,p.l/30));fc.fillStyle=p.c;fc.beginPath();fc.arc(p.x,p.y,2.6,0,7);fc.fill();return p.l>0});fc.globalAlpha=1;
    if(parts.length)requestAnimationFrame(fxLoop);else{fxOn=0;fc.clearRect(0,0,fx.width,fx.height)}}

  // ---- 操作：鍵盤、滑動、點跑道 ----
  function doDash(){if(st.on&&phase==='run'&&!dash){dash=true;SFX.dash()}}
  document.addEventListener('keydown',function(e){if(!st.on)return;var k=e.key;
    if(k==='ArrowLeft'||k==='a'||k==='A'){setLane(lane-1);e.preventDefault()}
    else if(k==='ArrowRight'||k==='d'||k==='D'){setLane(lane+1);e.preventDefault()}
    else if(k==='1'||k==='2'||k==='3'){setLane(+k-1)}
    else if(k==='ArrowUp'||k===' '||k==='w'||k==='W'){doDash();e.preventDefault()}});
  var sx=0,sy=0,tracking=false;
  stage.addEventListener('pointerdown',function(e){tracking=true;sx=e.clientX;sy=e.clientY});
  stage.addEventListener('pointerup',function(e){if(!tracking)return;tracking=false;var dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy))setLane(lane+(dx>0?1:-1));
    else if(dy<-40&&Math.abs(dy)>Math.abs(dx))doDash();
    else if(Math.abs(dx)<12&&Math.abs(dy)<12){var r=stage.getBoundingClientRect(),x=e.clientX-r.left,lw=laneW();
      setLane(x<W/2-lw*.5?0:x>W/2+lw*.5?2:1)}});
