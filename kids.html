<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>小小冒險 🌈</title>
<meta name="theme-color" content="#ff8fb8" />
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
<meta name="build" content="2026.08.18-693917" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgcng9IjIyIiBmaWxsPSIjZmY4ZmI4Ii8+PHRleHQgeD0iNTAiIHk9IjcyIiBmb250LXNpemU9IjU2IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj7wn4yIPC90ZXh0Pjwvc3ZnPg==" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 14px calc(14px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    background: linear-gradient(180deg, #fff0f6 0%, #eaf6ff 100%);
    color: #33224a; min-height: 100vh; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  button { font-family: inherit; cursor: pointer; border: 4px solid #33224a; border-radius: 20px;
           background: #fff; color: #33224a; box-shadow: 0 5px 0 rgba(51,34,74,.22); }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(51,34,74,.22); }

  /* ── 首頁 ── */
  h1 { font-size: 30px; text-align: center; margin: 6px 0 2px; color: #d1477f; }
  .sub { text-align: center; font-size: 15px; color: #6b5a7e; margin-bottom: 16px; }
  .pickbtn {
    width: 100%; display: flex; align-items: center; gap: 14px;
    padding: 18px 16px; margin-bottom: 12px; font-size: 22px; font-weight: 900;
  }
  .pickbtn .ico { font-size: 40px; line-height: 1; }

  /* ── 遊戲畫面 ── */
  .card { background: #fff; border: 5px solid #33224a; border-radius: 26px; padding: 14px; }
  .art { width: 100%; border-radius: 18px; overflow: hidden; display: block; background: #f7f4ff; }
  .art svg { width: 100%; display: block; }

  .sayrow { display: flex; align-items: center; gap: 10px; margin: 14px 2px 4px; }
  .say { flex: 1; font-size: 22px; font-weight: 800; line-height: 1.6; }
  .spk { flex: 0 0 auto; font-size: 26px; padding: 8px 12px; border-radius: 16px; background: #ffe9a8; }

  .picks { display: grid; gap: 12px; margin-top: 12px; }
  .pick2 {
    width: 100%; display: flex; align-items: center; gap: 14px;
    padding: 16px; font-size: 21px; font-weight: 900; text-align: left; line-height: 1.4;
  }
  .pick2 .big { font-size: 46px; line-height: 1; flex: 0 0 auto; }
  .pick2.good:active { background: #d8f7e0; }

  /* ── 選錯了：不是失敗，是看一下會怎樣 ── */
  .oops .art { background: #fff4f4; }
  .again {
    width: 100%; margin-top: 14px; padding: 18px; font-size: 24px; font-weight: 900;
    background: #ffd23f;
  }
  /* ── 完成 ── */
  .win .art { background: #eafaf1; }
  .stars { text-align: center; font-size: 44px; letter-spacing: 8px; margin: 10px 0 0; }
  .row { display: flex; gap: 10px; margin-top: 14px; }
  .row button { flex: 1; padding: 15px; font-size: 19px; font-weight: 900; }

  .steps { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; background: #e2dcee; border: 3px solid #cbbce0; }
  .dot.on { background: #ff8fb8; border-color: #d1477f; }
  .dot.done { background: #7cc9a0; border-color: #1e7d46; }

  .foot { text-align: center; font-size: 12px; color: #a99ac9; margin-top: 16px; }
  .foot button { background: none; border: 0; box-shadow: none; color: #a99ac9;
                 font-size: 12px; text-decoration: underline; padding: 4px; }

  @media (min-width: 700px) {
    .say { font-size: 25px; }
    .pick2 { font-size: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
  .anim { animation: pop .24s ease-out; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>

/* ===== 妹妹版：每篇 3 步，每步 2 個選項，不看字也能玩 =====
   say    = 這一格的旁白（會唸出來，也給大人照著念）
   choices= 兩個選項；big 是大圖示，label 是字（不認得字也沒關係）
   ok:true  → 走到下一步
   ok:false → 看一下會發生什麼，然後回到同一題再選一次（不會卡住、不會失敗）
*/
const KIDS = [
  {
    id: 'room', emoji: '🏫', title: '找不到教室',
    forParent: '練習：在學校迷路時，去找穿制服的大人，並且說得出自己是哪一班。',
    steps: [
      {
        say: '下課回來，走廊看起來都一樣。你找不到自己的教室了。',
        art: 'room1',
        choices: [
          { big: '😢', label: '站在原地哭', ok: false, art: 'room1x',
            oops: '大家都走光了，你還是不知道教室在哪裡。' },
          { big: '🙋', label: '去找大人幫忙', ok: true },
        ],
      },
      {
        say: '走廊上有一位老師。',
        art: 'room2',
        choices: [
          { big: '🙊', label: '不敢說話，低頭走開', ok: false, art: 'room2x',
            oops: '老師走掉了。你又是一個人了。' },
          { big: '🗣️', label: '跟老師說「我找不到教室」', ok: true },
        ],
      },
      {
        say: '老師問你：「你是幾年幾班呀？」',
        art: 'room3',
        choices: [
          { big: '🤷', label: '搖搖頭，我不知道', ok: false, art: 'room3x',
            oops: '老師要一間一間找，花了好久好久。' },
          { big: '🪪', label: '給老師看名牌', ok: true },
        ],
      },
    ],
    win: { art: 'roomwin', say: '老師牽著你回到教室，同學都在裡面。你做得很好！' },
  },

  {
    id: 'candy', emoji: '🍬', title: '有人給你糖果',
    forParent: '練習：不拿不認識的人給的東西、不跟他走、事後要告訴大人。',
    steps: [
      {
        say: '放學了。一個不認識的叔叔拿糖果給你。',
        art: 'candy1',
        choices: [
          { big: '😋', label: '接過來吃', ok: false, art: 'candy1x',
            oops: '吃了不知道是什麼的東西，肚子好不舒服。' },
          { big: '🙅', label: '搖頭，快步走開', ok: true },
        ],
      },
      {
        say: '他跟過來說：「我車上還有很多，跟我來拿。」',
        art: 'candy2',
        choices: [
          { big: '🚗', label: '跟他去車子那裡', ok: false, art: 'candy2x',
            oops: '車子開走了，就沒有人知道你在哪裡了。' },
          { big: '🏃', label: '跑回學校找老師', ok: true },
        ],
      },
      {
        say: '老師問你：「怎麼跑得這麼喘呀？」',
        art: 'candy3',
        choices: [
          { big: '🤐', label: '說「沒事」', ok: false, art: 'candy3x',
            oops: '沒有人知道那個叔叔的事，他明天可能還會來。' },
          { big: '🗣️', label: '告訴老師剛剛的事', ok: true },
        ],
      },
    ],
    win: { art: 'candywin', say: '老師陪你一起等媽媽來。你做得很好！' },
  },
];

/* ===== 結局插圖（inline SVG，動畫在 CSS） ===== */

// 共用零件
const GIRL_FACE = (cx, cy, r, mood) => {
  const eyes = mood === 'happy'
    ? '<path d="M' + (cx - r * .42) + ' ' + (cy - r * .1) + ' q ' + (r * .18) + ' ' + (-r * .28) + ' ' + (r * .36) + ' 0" stroke="#33224a" stroke-width="1.6" fill="none" stroke-linecap="round"/>' +
      '<path d="M' + (cx + r * .06) + ' ' + (cy - r * .1) + ' q ' + (r * .18) + ' ' + (-r * .28) + ' ' + (r * .36) + ' 0" stroke="#33224a" stroke-width="1.6" fill="none" stroke-linecap="round"/>'
    : '<circle cx="' + (cx - r * .34) + '" cy="' + (cy - r * .12) + '" r="' + (r * .13) + '" fill="#33224a"/>' +
      '<circle cx="' + (cx + r * .34) + '" cy="' + (cy - r * .12) + '" r="' + (r * .13) + '" fill="#33224a"/>';
  const mouth = mood === 'flat'
    ? '<path d="M' + (cx - r * .22) + ' ' + (cy + r * .42) + ' h ' + (r * .44) + '" stroke="#33224a" stroke-width="1.6" fill="none" stroke-linecap="round"/>'
    : mood === 'sad'   // 妹妹版要看得出難過，嘴角往下
    ? '<path d="M' + (cx - r * .26) + ' ' + (cy + r * .52) + ' q ' + (r * .26) + ' ' + (-r * .34) + ' ' + (r * .52) + ' 0" stroke="#33224a" stroke-width="1.8" fill="none" stroke-linecap="round"/>'
    : '<path d="M' + (cx - r * .26) + ' ' + (cy + r * .3) + ' q ' + (r * .26) + ' ' + (r * .34) + ' ' + (r * .52) + ' 0" stroke="#33224a" stroke-width="1.8" fill="none" stroke-linecap="round"/>';
  return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#fde2c5" stroke="#33224a" stroke-width="1.6"/>' +
    '<path d="M' + (cx - r) + ' ' + (cy - r * .25) + ' q 0 ' + (-r * 1.2) + ' ' + r + ' ' + (-r * 1.2) + ' q ' + r + ' 0 ' + r + ' ' + (r * 1.2) + ' q ' + (-r * .3) + ' ' + (-r * .55) + ' ' + (-r) + ' ' + (-r * .55) + ' q ' + (-r * .7) + ' 0 ' + (-r) + ' ' + (r * .55) + ' Z" fill="#5d3a1f"/>' +
    eyes +
    '<circle cx="' + (cx - r * .62) + '" cy="' + (cy + r * .2) + '" r="' + (r * .16) + '" fill="#ff8fb8" opacity=".7"/>' +
    '<circle cx="' + (cx + r * .62) + '" cy="' + (cy + r * .2) + '" r="' + (r * .16) + '" fill="#ff8fb8" opacity=".7"/>' +
    mouth;
};

const CROWN = (cx, y, w) =>
  '<path d="M' + (cx - w) + ' ' + y + ' L' + (cx - w * .55) + ' ' + (y - w * .9) + ' L' + cx + ' ' + (y - w * .3) +
  ' L' + (cx + w * .55) + ' ' + (y - w * .9) + ' L' + (cx + w) + ' ' + y + ' Z" fill="#ffd23f" stroke="#33224a" stroke-width="1.4" stroke-linejoin="round"/>' +
  '<circle cx="' + cx + '" cy="' + (y - w * .42) + '" r="' + (w * .17) + '" fill="#ff5a8a"/>';

const CASTLE = (x, y, s, fill) =>
  '<g fill="' + fill + '">' +
  '<rect x="' + x + '" y="' + (y - 26 * s) + '" width="' + (12 * s) + '" height="' + (26 * s) + '"/>' +
  '<rect x="' + (x + 16 * s) + '" y="' + (y - 34 * s) + '" width="' + (14 * s) + '" height="' + (34 * s) + '"/>' +
  '<rect x="' + (x + 34 * s) + '" y="' + (y - 24 * s) + '" width="' + (12 * s) + '" height="' + (24 * s) + '"/>' +
  '<path d="M' + x + ' ' + (y - 26 * s) + ' l' + (6 * s) + ' ' + (-8 * s) + ' l' + (6 * s) + ' ' + (8 * s) + ' Z"/>' +
  '<path d="M' + (x + 16 * s) + ' ' + (y - 34 * s) + ' l' + (7 * s) + ' ' + (-10 * s) + ' l' + (7 * s) + ' ' + (10 * s) + ' Z"/>' +
  '<path d="M' + (x + 34 * s) + ' ' + (y - 24 * s) + ' l' + (6 * s) + ' ' + (-8 * s) + ' l' + (6 * s) + ' ' + (8 * s) + ' Z"/>' +
  '</g>';

// 惡龍（卡通、不恐怖）：dir = 1 朝右, -1 朝左
const DRAGON = (x, y, s, dir) => {
  const f = 'transform="translate(' + x + ',' + y + ') scale(' + (s * dir) + ',' + s + ')"';
  return '<g ' + f + '>' +
    // 尾巴
    '<path d="M-2 6 q-22 4 -30 -8 q10 8 26 0 Z" fill="#4caf7d" stroke="#2a6b4f" stroke-width="1.4" stroke-linejoin="round"/>' +
    // 尾鰭
    '<path d="M-31 -2 l-9 -7 l3 8 l-8 4 l10 2 Z" fill="#ffd23f" stroke="#2a6b4f" stroke-width="1.3" stroke-linejoin="round"/>' +
    // 背刺
    '<path d="M-14 -10 l3 -7 l4 6 l4 -8 l4 7 l4 -6 l3 6 Z" fill="#ffd23f" stroke="#2a6b4f" stroke-width="1.3" stroke-linejoin="round"/>' +
    // 翅膀（會拍動）
    '<g class="wing"><path d="M-4 -8 q-16 -26 -34 -20 q10 6 12 16 q-8 -2 -12 2 q14 10 34 8 Z" fill="#7ed6a5" stroke="#2a6b4f" stroke-width="1.4" stroke-linejoin="round"/></g>' +
    // 身體
    '<ellipse cx="0" cy="4" rx="20" ry="15" fill="#4caf7d" stroke="#2a6b4f" stroke-width="1.6"/>' +
    '<ellipse cx="2" cy="8" rx="12" ry="9" fill="#bff0d4"/>' +
    // 頭
    '<circle cx="17" cy="-9" r="12" fill="#4caf7d" stroke="#2a6b4f" stroke-width="1.6"/>' +
    '<path d="M26 -5 q10 1 11 5 q-9 3 -13 -1 Z" fill="#4caf7d" stroke="#2a6b4f" stroke-width="1.4" stroke-linejoin="round"/>' +
    // 角
    '<path d="M13 -19 l-3 -8 l7 5 Z" fill="#ffd23f" stroke="#2a6b4f" stroke-width="1.2" stroke-linejoin="round"/>' +
    '<path d="M21 -20 l2 -8 l4 7 Z" fill="#ffd23f" stroke="#2a6b4f" stroke-width="1.2" stroke-linejoin="round"/>' +
    // 眼睛（斜斜的，有點壞但不兇）
    '<ellipse cx="19" cy="-11" rx="3.4" ry="3.8" fill="#fff"/>' +
    '<circle cx="20" cy="-10.5" r="1.9" fill="#33224a"/>' +
    '<path d="M15 -16 l8 3" stroke="#2a6b4f" stroke-width="1.6" stroke-linecap="round"/>' +
    // 牙齒
    '<path d="M24 -3 l2 3 l2 -3 Z" fill="#fff"/>' +
    // 腳
    '<path d="M-8 17 l0 5 l7 0" stroke="#2a6b4f" stroke-width="2.4" fill="none" stroke-linecap="round"/>' +
    '<path d="M6 18 l0 4 l7 0" stroke="#2a6b4f" stroke-width="2.4" fill="none" stroke-linecap="round"/>' +
    '</g>';
};

// 膚色的手腳畫在淺色背景上會看不見，先描一層深色外框
const LIMB = (x1, y1, x2, y2, w) =>
  '<path d="M' + x1 + ' ' + y1 + ' L' + x2 + ' ' + y2 + '" stroke="#33224a" stroke-width="' + (w + 2.6) + '" stroke-linecap="round"/>' +
  '<path d="M' + x1 + ' ' + y1 + ' L' + x2 + ' ' + y2 + '" stroke="#fde2c5" stroke-width="' + w + '" stroke-linecap="round"/>';

const SCENE = {
  /* 🌟 完美：加冕，站在陽光裡 */
  best:
    '<svg viewBox="0 0 200 130" role="img" aria-label="小女生戴著皇冠，在陽光下舉起雙手歡呼">' +
    '<g class="rays" style="transform-origin:100px 62px">' +
    Array.from({ length: 12 }, (_, i) =>
      '<path d="M100 62 L94 -40 L106 -40 Z" fill="#ffe9a8" opacity=".8" transform="rotate(' + (i * 30) + ' 100 62)"/>').join('') +
    '</g>' +
    '<circle cx="100" cy="62" r="46" fill="#fff8dc" opacity=".75"/>' +
    CASTLE(58, 118, 1, '#d9c8f0') +
    '<rect x="0" y="118" width="200" height="12" fill="#a8e6c0"/>' +
    '<g class="bob">' +
    // 手臂舉高
    LIMB(92, 86, 74, 56, 7) + LIMB(108, 86, 126, 56, 7) +
    // 裙子
    '<path d="M86 118 L92 82 L108 82 L114 118 Z" fill="#ff8fb8" stroke="#33224a" stroke-width="1.6" stroke-linejoin="round"/>' +
    '<path d="M100 92 q-4 5 0 9 q4 -4 0 -9" fill="#fff"/>' +
    GIRL_FACE(100, 66, 15, 'happy') +
    CROWN(100, 52, 11) +
    '</g>' +
    '<g class="twinkle">' +
    '<text x="36" y="34" font-size="16">✨</text><text x="152" y="46" font-size="14">⭐</text>' +
    '<text x="30" y="88" font-size="13">💛</text><text x="160" y="96" font-size="15">✨</text>' +
    '</g></svg>',

  /* 👍 不錯：爸爸媽媽來接（爸爸帥氣登場） */
  good:
    '<svg viewBox="0 0 200 130" role="img" aria-label="小女生牽著帥氣的爸爸和媽媽的手">' +
    '<circle cx="100" cy="58" r="52" fill="#e8f6ff"/>' +
    '<rect x="0" y="118" width="200" height="12" fill="#a8e6c0"/>' +
    // 爸爸（左）：飄動的紅披風 + 佩劍
    '<g class="sway">' +
    '<g class="cape" style="transform-origin:52px 62px">' +
    '<path d="M40 60 q-22 22 -14 52 q16 -12 30 -8 Z" fill="#e74c3c" stroke="#33224a" stroke-width="1.5" stroke-linejoin="round"/>' +
    '</g>' +
    '<path d="M60 92 L74 100" stroke="#fde2c5" stroke-width="6" stroke-linecap="round"/>' +
    '<path d="M42 118 L46 76 L62 76 L66 118 Z" fill="#9aa4ad" stroke="#33224a" stroke-width="1.6" stroke-linejoin="round"/>' +
    '<path d="M46 82 h16" stroke="#33224a" stroke-width="1.4"/>' +
    // 佩劍
    '<path d="M64 92 L74 116" stroke="#cfd6dc" stroke-width="3.4" stroke-linecap="round"/>' +
    '<path d="M61 90 l8 4" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/>' +
    '<circle cx="54" cy="62" r="12" fill="#fde2c5" stroke="#33224a" stroke-width="1.6"/>' +
    '<path d="M42 60 q0 -14 12 -14 q12 0 12 14 q-4 -6 -12 -6 q-8 0 -12 6 Z" fill="#3a2510"/>' +
    '<circle cx="50" cy="61" r="1.5" fill="#33224a"/><circle cx="58" cy="61" r="1.5" fill="#33224a"/>' +
    '<path d="M49 68 q5 4 10 0" stroke="#33224a" stroke-width="1.6" fill="none" stroke-linecap="round"/>' +
    '<text x="30" y="46" font-size="13" class="sparkle">✨</text>' +
    '</g>' +
    // 媽媽（右）
    '<g class="sway2">' +
    '<path d="M140 92 L126 100" stroke="#fde2c5" stroke-width="6" stroke-linecap="round"/>' +
    '<path d="M134 118 L138 78 L154 78 L158 118 Z" fill="#9b59b6" stroke="#33224a" stroke-width="1.6" stroke-linejoin="round"/>' +
    '<circle cx="146" cy="64" r="12" fill="#fde2c5" stroke="#33224a" stroke-width="1.6"/>' +
    '<path d="M133 66 q-1 -18 13 -18 q14 0 13 18 q-3 -8 -13 -8 q-10 0 -13 8 Z" fill="#3a2510"/>' +
    '<circle cx="142" cy="63" r="1.5" fill="#33224a"/><circle cx="150" cy="63" r="1.5" fill="#33224a"/>' +
    '<path d="M141 70 q5 4 10 0" stroke="#33224a" stroke-width="1.6" fill="none" stroke-linecap="round"/>' +
    '</g>' +
    // 女孩（中，被牽著）
    '<g class="bob">' +
    '<path d="M88 100 L76 100" stroke="#fde2c5" stroke-width="5" stroke-linecap="round"/>' +
    '<path d="M112 100 L124 100" stroke="#fde2c5" stroke-width="5" stroke-linecap="round"/>' +
    '<path d="M88 118 L92 94 L108 94 L112 118 Z" fill="#ff8fb8" stroke="#33224a" stroke-width="1.6" stroke-linejoin="round"/>' +
    GIRL_FACE(100, 84, 11, 'happy') +
    '</g>' +
    '<g class="hearts"><text x="86" y="40" font-size="14">💖</text><text x="112" y="30" font-size="12">💕</text><text x="70" y="26" font-size="11">💗</text></g>' +
    '</svg>',

  /* 😮‍💨 驚險：從惡龍手中跑掉 */
  escape:
    '<svg viewBox="0 0 200 130" role="img" aria-label="小女生成功從惡龍旁邊跑走">' +
    '<circle cx="100" cy="58" r="54" fill="#fff2e0"/>' +
    '<rect x="0" y="118" width="200" height="12" fill="#a8e6c0"/>' +
    // 惡龍在左後方（撲空）

// 女孩：pose = stand / cheer / run / reachR / reachL / hang / shout / sit
const GIRL = (x, y, s, o) => {
  o = o || {};
  const mood = o.mood || 'happy', dress = o.dress || '#ff8fb8', pose = o.pose || 'stand';
  let arms = '', legs = '', bottom = 0;
  if (pose === 'cheer')       arms = LIMB(-8, -26, -21, -47, 6) + LIMB(8, -26, 21, -47, 6);
  else if (pose === 'run')  { arms = LIMB(-8, -26, -19, -14, 6) + LIMB(8, -26, 21, -38, 6);
                              legs = LIMB(-3, -6, -15, -10, 6) + LIMB(4, -6, 9, 2, 6); bottom = -6; }
  else if (pose === 'reachR') arms = LIMB(-9, -26, -14, -12, 6) + LIMB(8, -26, 27, -31, 6);
  else if (pose === 'reachL') arms = LIMB(9, -26, 14, -12, 6) + LIMB(-8, -26, -27, -31, 6);
  else if (pose === 'hang')  { arms = LIMB(-8, -30, -17, -19, 5) + LIMB(8, -30, 17, -19, 5);
                              legs = LIMB(-5, -2, -8, 10, 5) + LIMB(5, -2, 8, 10, 5); bottom = -2; }
  else if (pose === 'sit')   { arms = LIMB(-9, -26, -18, -18, 6) + LIMB(9, -26, 18, -18, 6);
                              legs = LIMB(-5, -4, -16, 0, 6) + LIMB(5, -4, 16, 0, 6); bottom = -4; }
  else                        arms = LIMB(-9, -26, -14, -12, 6) + LIMB(9, -26, 14, -12, 6);
  const head = pose === 'shout'
    ? '<circle cx="0" cy="-46" r="13" fill="#fde2c5" stroke="#33224a" stroke-width="1.6"/>' +
      '<path d="M-13 -50 q0 -16 13 -16 q13 0 13 16 q-4 -7 -13 -7 q-9 0 -13 7 Z" fill="#5d3a1f"/>' +
      '<circle cx="-5" cy="-48" r="1.7" fill="#33224a"/><circle cx="5" cy="-48" r="1.7" fill="#33224a"/>' +
      '<ellipse cx="0" cy="-38" rx="5" ry="6" fill="#33224a"/>'
    : GIRL_FACE(0, -46, 13, mood);
  return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')">' + arms +
    '<path d="M-13 ' + bottom + ' L-8 -34 L8 -34 L13 ' + bottom + ' Z" fill="' + dress +
    '" stroke="#33224a" stroke-width="1.6" stroke-linejoin="round"/>' + legs + head +
    (o.crown ? CROWN(0, -58, 11) : '') + '</g>';
};

    '<rect x="0" y="18" width="46" height="12" rx="3" fill="#c98f52" stroke="#33224a" stroke-width="2"/>' +
    '<g class="fadeDanger">' + ADULT(150, 106, 1.15, { color: '#8a8f96' }) +
    EMO(120, 46, '🍬', 22) + '</g>' +
    GIRL(66, 106, 0.9, { dress: '#a8e6c0', mood: 'flat' }) +
    GIRL(96, 106, 0.9, { dress: '#7fc1ed', mood: 'flat' })),

  candywin: SVG('老師陪小女生等媽媽，媽媽來了',
    '<rect width="200" height="130" fill="#eafaf1"/>' +
    '<rect x="0" y="106" width="200" height="24" fill="#bfe6cf"/>' + SUNBURST(100, 56) +
    TEACHER(38, 106, 1.05, 'reachR') +
    GIRL(90, 106, 1.15, { pose: 'cheer' }) +
    MOM(152, 106, 1.15, 'reachL') +
    '<g class="hearts">' + EMO(112, 42, '💖', 22) + EMO(70, 34, '✨', 18) + '</g>'),
});

/* ===== 妹妹版：3 步、每步 2 個選項、選錯不會失敗 ===== */
const app = document.getElementById('app');
const BUILD = (document.querySelector('meta[name="build"]') || {}).content || '?';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const art = k => ART_SCENES[k] || SCENE.escape;

let view = 'menu';   // menu / play / oops / win
let cur = null;      // 目前劇本
let step = 0;        // 第幾步
let oops = null;     // 選錯時要看的那一格

function render() {
  if (view === 'menu') renderMenu();
  else if (view === 'oops') renderOops();
  else if (view === 'win') renderWin();
  else renderStep();
  window.scrollTo(0, 0);
}

function dots(n, total) {
  return '<div class="steps">' + Array.from({ length: total }, (_, i) =>
    `<div class="dot ${i < n ? 'done' : i === n ? 'on' : ''}"></div>`).join('') + '</div>';
}

function renderMenu() {
  app.innerHTML = `
    <div class="anim">
      <h1>🌈 小小冒險</h1>
      <div class="sub">選一個故事，看看你會怎麼做</div>
      ${KIDS.map(s => `
        <button class="pickbtn" data-id="${esc(s.id)}">
          <span class="ico">${s.emoji}</span><span>${esc(s.title)}</span>
        </button>`).join('')}
      <p class="foot">
        給大人看的：每篇 3 步，選錯不會失敗，會看到發生什麼事再選一次。<br>
        ${KIDS.map(s => s.emoji + ' ' + esc(s.forParent)).join('<br>')}
        <br><button id="ver">版本 ${esc(BUILD)}　·　點一下檢查更新</button>
      </p>
    </div>`;
  document.querySelectorAll('.pickbtn').forEach(b => {
    b.onclick = () => { cur = KIDS.find(s => s.id === b.dataset.id); step = 0; view = 'play'; render(); };
  });
  document.getElementById('ver').onclick = () => {
    location.href = location.pathname + '?v=' + Math.floor(Date.now() / 1000);
  };
}

function renderStep() {
  const st = cur.steps[step];
  app.innerHTML = `
    <div class="anim">
      ${dots(step, cur.steps.length)}
      <div class="card">
        <div class="art">${art(st.art)}</div>
        <div class="sayrow"><div class="say">${esc(st.say)}</div></div>
        <div class="picks">
          ${st.choices.map((c, i) => `
            <button class="pick2${c.ok ? ' good' : ''}" data-i="${i}">
              <span class="big">${c.big}</span><span>${esc(c.label)}</span>
            </button>`).join('')}
        </div>
      </div>
      <div class="row">
        <button id="back">← 回去選故事</button>
      </div>
    </div>`;
  document.querySelectorAll('.pick2').forEach(b => {
    b.onclick = () => pick(parseInt(b.dataset.i, 10));
  });
  document.getElementById('back').onclick = () => { view = 'menu'; render(); };
}

function pick(i) {
  const c = cur.steps[step].choices[i];
  if (c.ok) {
    step++;
    view = step >= cur.steps.length ? 'win' : 'play';
  } else {
    oops = c;            // 先看一下會發生什麼，再回到同一題
    view = 'oops';
  }
  render();
}

/* 選錯了：不說「你錯了」，只給她看接下來會怎樣，然後再選一次 */
function renderOops() {
  app.innerHTML = `
    <div class="anim oops">
      ${dots(step, cur.steps.length)}
      <div class="card">
        <div class="art">${art(oops.art)}</div>
        <div class="sayrow"><div class="say">${esc(oops.oops)}</div></div>
        <button class="again" id="retry">🔄 再選一次</button>
      </div>
    </div>`;
  document.getElementById('retry').onclick = () => { view = 'play'; render(); };
}

function renderWin() {
  app.innerHTML = `
    <div class="anim win">
      ${dots(cur.steps.length, cur.steps.length)}
      <div class="card">
        <div class="art">${art(cur.win.art)}</div>
        <div class="stars">⭐⭐⭐</div>
        <div class="sayrow"><div class="say">${esc(cur.win.say)}</div></div>
      </div>
      <div class="row">
        <button id="again2">🔁 再玩一次</button>
        <button id="menu">🌈 別的故事</button>
      </div>
    </div>`;
  document.getElementById('again2').onclick = () => { step = 0; view = 'play'; render(); };
  document.getElementById('menu').onclick = () => { view = 'menu'; render(); };
}

render();
</script>
</body>
</html>
