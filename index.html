<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font-family: "Comic Sans MS", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    background: linear-gradient(180deg, #ffd6e8 0%, #ffe8c8 60%, #c8f1ff 100%);
    min-height: 100vh;
    color: #4a2a52;
  }
  .app { max-width: 760px; margin: 0 auto; }
  .card {
    background: white;
    border: 4px solid #4a2a52;
    border-radius: 24px;
    padding: 18px;
    box-shadow: 0 6px 0 rgba(0,0,0,.15), 0 10px 24px rgba(0,0,0,.18);
    position: relative;
    z-index: 2;
  }
  .app { position: relative; z-index: 2; }
  h1 {
    margin: 0 0 6px;
    text-align: center;
    color: #e85a92;
    font-size: 30px;
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 #4a2a52;
  }
  .sub { text-align: center; color: #6b4a72; margin-bottom: 14px; }
  button {
    font-family: inherit;
    cursor: pointer;
    border: 3px solid #4a2a52;
    border-radius: 14px;
    padding: 10px 22px;
    font-size: 18px;
    font-weight: 800;
    background: #ffd23f;
    color: #4a2a52;
    box-shadow: 0 4px 0 rgba(0,0,0,.15);
  }
  button:hover:not(:disabled) { transform: translateY(-2px); }
  button:active:not(:disabled) { transform: translateY(2px); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  /* 開始畫面 */
  .pick-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 16px 0;
  }
  @media (min-width: 600px) {
    .pick-row { grid-template-columns: repeat(4, 1fr); }
  }
  .pick-card {
    border: 3px solid #4a2a52;
    border-radius: 16px;
    padding: 12px 8px;
    background: #fff5e6;
    text-align: center;
    cursor: pointer;
  }
  .pick-card:hover { background: #ffd23f; }
  .pick-card .emoji { font-size: 56px; }
  .pick-card .name { font-size: 16px; font-weight: 800; margin-top: 4px; }
  .start-btn {
    background: #e85a92;
    color: white;
    font-size: 20px;
    padding: 14px 30px;
    width: 100%;
  }

  /* 玩家面板 */
  .players {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .player {
    border: 3px solid #4a2a52;
    border-radius: 16px;
    padding: 10px;
    background: #fff5e6;
    text-align: center;
    transition: transform .15s;
  }
  .player.active {
    background: #ff8fb8;
    color: white;
    transform: scale(1.04);
  }
  .player .emoji { font-size: 36px; line-height: 1; }
  .player .name { font-weight: 800; margin-top: 4px; font-size: 15px; }
  .player .stat { font-size: 13px; margin-top: 2px; }
  .player .coins { font-weight: 800; color: #b8860b; }
  .player.active .coins { color: #fff8a8; }

  /* 棋盤 */
  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
    margin-bottom: 14px;
  }
  @media (max-width: 600px) {
    .board { grid-template-columns: repeat(5, 1fr); }
  }
  .cell {
    position: relative;
    aspect-ratio: 1;
    background: #fff5e6;
    border: 2px solid #4a2a52;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    overflow: hidden;
  }
  .cell.has-token .cell-icon {
    position: absolute;
    top: 1px; right: 2px;
    font-size: 14px;
    opacity: 0.65;
  }
  .tokens {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 75%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 1px;
    pointer-events: none;
  }
  .token {
    height: 100%;
    display: block;
  }
  .token svg {
    height: 100%;
    width: auto;
    display: block;
  }
  .pet {
    height: 65%;
    display: block;
    align-self: flex-end;
    margin-left: -2px;
  }
  .pet svg {
    height: 100%;
    width: auto;
    display: block;
  }
  @media (max-width: 600px) {
    .cell { font-size: 24px; }
  }
  .cell.start { background: #b3f0a5; }
  .cell.coin { background: #fff2a8; }
  .cell.mushroom { background: #ffd0d0; }
  .cell.star { background: #ffe07a; }
  .cell.koopa { background: #b9e7c2; }
  .cell.boss { background: #ffb0a8; }
  .cell.q { background: #d8c5ff; }
  .cell.zhuyin { background: #c5e0ff; }
  .cell.reward { background: #ffd1f5; }
  .cell.castle { background: #ffd6f0; }
  .cell .num {
    position: absolute;
    top: 1px; left: 3px;
    font-size: 10px;
    font-weight: 800;
    opacity: .55;
  }

  /* 控制區 */
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .dice-box {
    width: 64px; height: 64px;
    background: white;
    border: 4px solid #4a2a52;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 900;
  }
  .turn-info { font-size: 16px; font-weight: 700; }
  .roll-btn { background: #e85a92; color: white; font-size: 20px; }

  /* 圖例 */
  .legend {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px 8px;
    font-size: 12px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 2px dashed #b48bbf;
  }

  /* Log */
  .log {
    margin-top: 10px;
    height: 70px;
    overflow-y: auto;
    background: #fff8f0;
    border: 2px dashed #b48bbf;
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 13px;
    line-height: 1.5;
  }
  .log p { margin: 1px 0; }

  /* Modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(74,42,82,.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .modal {
    background: white;
    border: 4px solid #4a2a52;
    border-radius: 22px;
    padding: 22px;
    max-width: 380px;
    width: 100%;
    text-align: center;
  }
  .modal h2 { color: #e85a92; margin: 0 0 10px; }
  .question {
    font-size: 38px;
    font-weight: 900;
    margin: 16px 0;
  }
  .answers {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .answers.vertical {
    grid-template-columns: 1fr;
  }
  .ans {
    background: #fff5e6;
    border: 3px solid #4a2a52;
    border-radius: 12px;
    padding: 14px 6px;
    font-size: 24px;
    font-weight: 800;
    cursor: pointer;
  }
  .ans.long {
    font-size: 16px;
    text-align: left;
    padding: 12px 14px;
    line-height: 1.5;
  }
  .ans:hover { background: #ffd23f; }

  /* 難度按鈕 */
  .diff-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 12px 0;
  }
  .diff-card {
    border: 3px solid #4a2a52;
    border-radius: 14px;
    padding: 12px;
    background: #fff5e6;
    text-align: center;
    cursor: pointer;
    font-weight: 800;
  }
  .diff-card .d-emoji { font-size: 36px; line-height: 1; }
  .diff-card .d-title { margin-top: 4px; font-size: 16px; }
  .diff-card .d-sub { font-size: 12px; color: #6b4a72; font-weight: 600; margin-top: 2px; }
  .diff-card.active {
    background: #e85a92;
    color: white;
    border-color: #4a2a52;
  }
  .diff-card.active .d-sub { color: #fff8a8; }

  .victory { text-align: center; padding: 20px; }
  .victory .trophy { font-size: 80px; }

  /* 動畫 */
  @keyframes wiggle {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  @keyframes pop {
    0% { transform: scale(0.6); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-5px) rotate(-2deg); }
    40% { transform: translateX(5px) rotate(2deg); }
    60% { transform: translateX(-3px) rotate(-1deg); }
    80% { transform: translateX(3px) rotate(1deg); }
  }
  @keyframes coin-storm-fall {
    0% { transform: translate(-50%, -10px) rotate(0); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translate(-50%, 90px) rotate(720deg); opacity: 0; }
  }
  @keyframes arrow-back-pulse {
    0%, 100% { transform: translate(-50%, 0); opacity: 0.7; }
    50% { transform: translate(-65%, 0) scale(1.2); opacity: 1; }
  }
  .coin-storm-fall { animation: coin-storm-fall 1.6s ease-in 2 forwards; }
  .arrow-back-pulse { animation: arrow-back-pulse 0.6s ease-in-out infinite; }

  /* 煙火動畫 */
  @keyframes firework {
    0% {
      transform: translate(-50%, -50%);
      opacity: 1;
    }
    100% {
      transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)));
      opacity: 0;
    }
  }
  @keyframes firework-trail {
    0% {
      transform: translate(-50%, 80vh) scale(0.3);
      opacity: 0;
    }
    50% { opacity: 1; }
    100% {
      transform: translate(-50%, var(--launch-y)) scale(0.5);
      opacity: 0;
    }
  }
  .firework-trail { animation: firework-trail 0.6s ease-out forwards; }
  .firework-particle { animation: firework 1.4s ease-out forwards; }

  /* 傳送動畫 */
  @keyframes teleport-out {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
    30% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.3); opacity: 0; }
  }
  @keyframes teleport-in {
    0% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.3); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0; }
  }
  @keyframes tp-ring-out {
    0% { width: 10px; height: 10px; opacity: 1; }
    100% { width: 90px; height: 90px; opacity: 0; }
  }
  @keyframes tp-ring-in {
    0% { width: 90px; height: 90px; opacity: 0; }
    50% { opacity: 1; }
    100% { width: 10px; height: 10px; opacity: 0; }
  }
  .tp-ring-out, .tp-ring-in {
    position: absolute;
    left: 0; top: 0;
    transform: translate(-50%, -50%);
    border: 4px solid #9b59b6;
    border-radius: 50%;
    box-shadow: 0 0 20px #9b59b6, 0 0 40px #ff8fb8;
    pointer-events: none;
  }
  .tp-ring-out { animation: tp-ring-out 0.85s ease-out forwards; }
  .tp-ring-in { animation: tp-ring-in 0.85s ease-out forwards; }

  /* 安安公主能力 */
  @keyframes princess-burst {
    0% { transform: translate(-50%, -50%) scale(0.4) rotate(0); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) + 50px)) scale(1.3) rotate(540deg); opacity: 0; }
  }
  @keyframes princess-ring {
    0% { width: 8px; height: 8px; border-width: 6px; opacity: 1; }
    100% { width: 140px; height: 140px; border-width: 1px; opacity: 0; }
  }
  .princess-ring {
    position: absolute;
    left: 0; top: 0;
    transform: translate(-50%, -50%);
    border: 6px solid #ff5a8a;
    border-radius: 50%;
    box-shadow: 0 0 16px #ff8fb8, 0 0 30px #ffd23f;
    animation: princess-ring 0.9s ease-out forwards;
    pointer-events: none;
  }

  /* 帆帆公主能力（雷電） */
  @keyframes storm-flash {
    0% { background: rgba(120,40,180,0); }
    8% { background: rgba(255,255,255,0.65); }
    18% { background: rgba(120,40,180,0.5); }
    50% { background: rgba(50,80,180,0.4); }
    100% { background: rgba(120,40,180,0); }
  }
  @keyframes lightning-flash {
    0% { opacity: 0; transform: scaleY(0); }
    20% { opacity: 1; transform: scaleY(1); }
    50% { opacity: 1; }
    100% { opacity: 0; transform: scaleY(0.8); }
  }

  /* 爸比戰士能力 */
  @keyframes charge-burst {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
    25% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.6); opacity: 0; }
  }
  @keyframes charge-ring {
    0% { width: 8px; height: 8px; border-width: 6px; opacity: 1; }
    100% { width: 160px; height: 160px; border-width: 1px; opacity: 0; }
  }
  .charge-ring {
    position: absolute;
    left: 0; top: 0;
    transform: translate(-50%, -50%);
    border: 6px solid #e74c3c;
    border-radius: 50%;
    box-shadow: 0 0 16px #ffd23f, 0 0 30px #e74c3c;
    animation: charge-ring 0.85s ease-out forwards;
    pointer-events: none;
  }
  @keyframes sword-slash {
    0% { opacity: 0; transform: translate(-50%, -50%) rotate(-15deg) scaleX(0.3); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -50%) rotate(15deg) scaleX(1.4); }
  }
  @keyframes treasure-burst {
    0% { transform: translate(-50%, -50%) scale(0.3) rotate(0); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) + 30px)) scale(1.1) rotate(360deg); opacity: 0; }
  }
  @keyframes freeze-burst {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.4); opacity: 0; }
  }
  @keyframes charm-fly {
    0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3) rotate(360deg); opacity: 0; }
  }
  @keyframes shield-burst {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.4); opacity: 0; }
  }
  @keyframes shield-ring {
    0% { width: 8px; height: 8px; opacity: 1; }
    100% { width: 130px; height: 130px; opacity: 0; }
  }
  .shield-ring {
    position: absolute;
    left: 0; top: 0;
    transform: translate(-50%, -50%);
    border: 5px solid #ff8fb8;
    border-radius: 50%;
    box-shadow: 0 0 18px #ff8fb8, 0 0 36px #ffb7d8;
    animation: shield-ring 0.95s ease-out forwards;
    pointer-events: none;
  }
  @keyframes command-fly {
    0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3); opacity: 0; }
  }
  @keyframes command-impact {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
    30% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
  }
  @keyframes rampage-burst {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.5) rotate(540deg); opacity: 0; }
  }
  @keyframes rampage-ring {
    0% { width: 8px; height: 8px; opacity: 1; border-width: 6px; }
    100% { width: 220px; height: 220px; opacity: 0; border-width: 1px; }
  }
  .rampage-ring {
    position: absolute; left: 0; top: 0;
    transform: translate(-50%, -50%);
    border: 6px solid #e85a92;
    border-radius: 50%;
    box-shadow: 0 0 22px #ff5a8a, 0 0 44px #e85a92;
    animation: rampage-ring 1s ease-out forwards;
    pointer-events: none;
  }

  /* 勝利畫面飄浮 emoji */
  @keyframes winFloat {
    0% { transform: translateY(0) rotate(0); opacity: 0; }
    10% { opacity: 0.85; }
    90% { opacity: 0.85; }
    100% { transform: translateY(-110vh) rotate(540deg); opacity: 0; }
  }

  /* 季節背景動畫 */
  @keyframes season-fall {
    0% { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(var(--drift), 110vh) rotate(540deg); }
  }
  .anim-wiggle { animation: wiggle 0.5s ease-in-out infinite; transform-origin: center; }
  .anim-float { animation: float 1.4s ease-in-out infinite; }

function pIcon(p, size) {
  const main = `<span style="display:inline-block;width:${size};height:${size};vertical-align:middle;line-height:0;">${p.svg}</span>`;
  if (!p.pet) return main;
  const petSize = typeof size === 'string' && size.endsWith('px')
    ? `${Math.round(parseInt(size, 10) * 0.6)}px`
    : `calc(${size} * 0.6)`;
  const pet = `<span style="display:inline-block;width:${petSize};height:${petSize};vertical-align:middle;line-height:0;margin-left:-2px;">${p.pet}</span>`;
  return `<span style="display:inline-flex;align-items:flex-end;line-height:0;">${main}${pet}</span>`;
}

  const board = [...BASE_BOARD];
  for (let i = 0; i < 6; i++) {

function makeZhuyinQuestion() {
  const w = ZHUYIN_WORDS[rand(0, ZHUYIN_WORDS.length - 1)];
  const opts = new Set([w.initial]);
  while (opts.size < 3) {
    const v = ALL_ZHUYIN[rand(0, ALL_ZHUYIN.length - 1)];
    if (v !== w.initial) opts.add(v);
  }
  return { emoji: w.emoji, word: w.word, ans: w.initial, options: shuffle([...opts]) };
}

/* ===== 幼稚園程度題目：10 以內加減 ===== */
function rand(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function shuffle(arr) {
  arr = [...arr];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function makeQuestion() {
  const isAdd = Math.random() < 0.5;
  let a, b, ans, text;
  if (isAdd) {
    a = rand(1, 5); b = rand(1, 10 - a);
    ans = a + b; text = `${a} + ${b} = ?`;
  } else {
    a = rand(2, 10); b = rand(1, a - 1);
    ans = a - b; text = `${a} − ${b} = ?`;
  }
  const opts = new Set([ans]);
  let tries = 0;
  while (opts.size < 3 && tries < 30) {
    tries++;
    const v = ans + rand(-3, 3);
    if (v >= 0 && v !== ans) opts.add(v);
  }
  while (opts.size < 3) opts.add(opts.size + ans + 1);
  return { text, ans, options: shuffle([...opts]) };
}

      ],
    },
  };
  function getBgmNotes() { return (BGM_TRACKS[state.bgmTrack] || BGM_TRACKS.mario).notes; }
  function playBgmLoop() {
    if (!bgmActive || state.muted || !state.bgmOn) { bgmActive = false; return; }
    const c = getCtx(); if (!c) { bgmActive = false; return; }
    if (!bgmGain) {
      bgmGain = c.createGain();
      bgmGain.gain.value = 0.07;
      bgmGain.connect(c.destination);
    }
    const notes = getBgmNotes();
    let t = c.currentTime + 0.05;
    notes.forEach(([f, d]) => {
      if (f > 0) {
        const osc = c.createOscillator();
        const g = c.createGain();
        osc.connect(g); g.connect(bgmGain);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.7, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.001, t + d * 0.85);
        osc.start(t);
        osc.stop(t + d + 0.02);
      }
      t += d;
    });
    const total = notes.reduce((s, [_, d]) => s + d, 0);
    bgmTimer = setTimeout(playBgmLoop, (total - 0.05) * 1000);
  }
  function startBgm() {
    if (state.muted || !state.bgmOn) return;
    if (bgmActive) return;
    bgmActive = true;
    playBgmLoop();
  }
  function stopBgm() {
    bgmActive = false;
    if (bgmTimer) { clearTimeout(bgmTimer); bgmTimer = null; }
  }
  return {

/* ===== 學習紀錄 ===== */
const Stats = (() => {
  const KEY = 'mb-stats';
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
  }
  function save(data) { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
  function defaults() {
    return {
      plays: 0,
      wins: [0, 0, 0, 0],
      winsById: {},
      qAnswered: 0,
      qCorrect: 0,
      maxStreak: 0,
      coinsLifetime: 0,
    };
  }
  return {
    get() {
      const s = Object.assign(defaults(), load());
      if (!s.winsById || typeof s.winsById !== 'object') s.winsById = {};
      // 舊存檔遷移：以前用座位 index 記勝場，改成用角色 id
      if (Object.keys(s.winsById).length === 0 && Array.isArray(s.wins)) {
        DEFAULT_PLAYERS.forEach((c, i) => {
          if (s.wins[i] > 0) s.winsById[c.id] = s.wins[i];
        });
      }
      return s;
    },
    bumpPlay() { const s = this.get(); s.plays += 1; save(s); },
    bumpWin(charId) {
      const s = this.get();
      s.winsById[charId] = (s.winsById[charId] || 0) + 1;
      save(s);
    },
    bumpAnswered(correct) {
      const s = this.get();
      s.qAnswered += 1;
      if (correct) s.qCorrect += 1;
      save(s);
    },
    bumpStreak(n) {
      const s = this.get();
      if (n > (s.maxStreak || 0)) s.maxStreak = n;
      save(s);
    },
    bumpCoins(n) {
      const s = this.get();
      s.coinsLifetime = (s.coinsLifetime || 0) + n;
      save(s);
    },
    reset() { save(defaults()); },
  };
})();

function totalWins(s) {
  return Object.values(s.winsById || {}).reduce((a, b) => a + b, 0);
}

/* ===== 存檔（暫停/繼續） ===== */
const SAVE_KEY = 'mb-savegame';
function saveGame() {
  if (state.screen !== 'playing' || state.winner != null) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      board: state.board, positions: state.positions, coins: state.coins,
      skipTurn: state.skipTurn, skipReason: state.skipReason,
      shielded: state.shielded, fanfanArmed: state.fanfanArmed, streak: state.streak,
      lineup: state.lineup, current: state.current, extraTurn: state.extraTurn,
      difficulty: state.difficulty, log: state.log.slice(-20), ts: Date.now(),
    }));
  } catch (e) {}
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    const n = (d.positions || []).length;
    if (!n) return false;
    if (Array.isArray(d.lineup) && d.lineup.length === n) state.lineup = d.lineup;
    rebuildPlayers();
    if (PLAYERS.length !== n) return false;
    Object.assign(state, {
      board: d.board, positions: d.positions, coins: d.coins,
      skipTurn: d.skipTurn || makeArr(false, n),
      skipReason: d.skipReason || makeArr(null, n),
      shielded: d.shielded || makeArr(false, n),
      fanfanArmed: d.fanfanArmed || makeArr(false, n),
      streak: d.streak || makeArr(0, n),
      current: d.current, extraTurn: d.extraTurn, difficulty: d.difficulty,
      log: d.log || [],
    });
    state.screen = 'playing';
    state.busy = false; state.modal = null; state.dice = null; state.winner = null;
    if (state.bgmOn && !state.muted) Sound.startBgm();
    render();
    return true;
  } catch (e) { return false; }
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
function hasSave() { return !!localStorage.getItem(SAVE_KEY); }

/* ===== 狀態 ===== */
function nPlayers() { return PLAYERS.length; }
function makeArr(v, n) { return Array(n != null ? n : nPlayers()).fill(v); }

const state = {
  screen: 'start',
  difficulty: 'easy',
  muted: localStorage.getItem('mb-muted') === '1',
  bgmOn: localStorage.getItem('mb-bgm') !== '0',
  bgmTrack: localStorage.getItem('mb-bgm-track') || 'mario',
  speed: parseFloat(localStorage.getItem('mb-speed') || '1'),
  theme: localStorage.getItem('mb-theme') || 'spring',
  lineup: (() => {
    try {
      const saved = JSON.parse(localStorage.getItem('mb-lineup') || 'null');
      if (Array.isArray(saved) && saved.length >= 2 && saved.length <= 4) return saved;
    } catch (e) {}
    return ['anan', 'fanfan', 'mama', 'papa'];
  })(),
  abilityChoice: (() => {
    try { return JSON.parse(localStorage.getItem('mb-ability-choice') || '{}'); } catch (e) { return {}; }
  })(),
  shielded: makeArr(false, 4),
  board: [],
  positions: makeArr(0, 4),
  coins: makeArr(0, 4),
  skipTurn: makeArr(false, 4),
  skipReason: makeArr(null, 4),
  fanfanArmed: makeArr(false, 4),
  streak: makeArr(0, 4),
  current: 0,
  dice: null,
  busy: false,
  modal: null,
  winner: null,
  extraTurn: false,
  log: [],
};
/* ===== 流程 ===== */
function getActiveAbility(c) {
  const list = c.abilities || [c.ability];
  const id = state.abilityChoice[c.id];
  return list.find(a => a.id === id) || list[0];
}

function rebuildPlayers() {
  PLAYERS.length = 0;
  const all = [...DEFAULT_PLAYERS, ...getUnlocked()];
  state.lineup.forEach(id => {
    const c = all.find(c => c.id === id);
    if (c) PLAYERS.push({ ...c, ability: getActiveAbility(c) });
  });
  if (PLAYERS.length === 0) {
    DEFAULT_PLAYERS.forEach(c => PLAYERS.push({ ...c, ability: getActiveAbility(c) }));
  }
}

function startGame(firstPlayer) {
  Sound.unlock();
  rebuildPlayers();
  state.screen = 'playing';
  state.board = buildBoard();
  state.current = Math.min(firstPlayer, PLAYERS.length - 1);
  state.positions = makeArr(0);
  state.coins = makeArr(0);
  state.skipTurn = makeArr(false);
  state.fanfanArmed = makeArr(false);
  state.streak = makeArr(0);
  state.shielded = makeArr(false);
  state.skipReason = makeArr(null);
  state.dice = null;
  state.busy = false;
  state.modal = null;
  state.winner = null;
  state.extraTurn = false;
  state.log = [`🎉 遊戲開始！${PLAYERS[state.current].name} 先走！`];
  if (state.bgmOn && !state.muted) Sound.startBgm();
  Stats.bumpPlay();
  render();
}

async function rollDice() {
  if (state.busy) return;
  state.busy = true;
  Sound.diceRoll();
  state.dice = rand(1, 6);
  addLog(`🎲 ${PLAYERS[state.current].name} 擲出 ${state.dice} 點`);
  render();
  await wait(450);
  await movePlayer(state.current, state.dice);
  if (state.positions[state.current] >= state.board.length - 1) { win(); return; }
  await landOn(state.current);
  if (state.positions[state.current] >= state.board.length - 1) { win(); return; }
  await advanceTurn();
}

async function advanceTurn() {
  if (!state.extraTurn) {
    let next = (state.current + 1) % nPlayers();
    let safety = 0;
    while (state.skipTurn[next] && safety < nPlayers()) {
      const reason = state.skipReason[next] || 'boss';
      state.skipTurn[next] = false;
      state.skipReason[next] = null;
      await showSkip(next, false, reason);
      next = (next + 1) % nPlayers();
      safety++;
    }
    state.current = next;
  }
  state.extraTurn = false;
  state.busy = false;
  saveGame();
  render();
}

function movePlayer(idx, steps) {
  return new Promise(resolve => {
    let i = 0;
    const step = () => {
      if (i >= steps) { resolve(); return; }
      state.positions[idx] = Math.min(state.positions[idx] + 1, state.board.length - 1);
      i++;
      Sound.move();
      render();
      if (state.positions[idx] >= state.board.length - 1) { resolve(); return; }
      setTimeout(step, 180 * state.speed);
    };
    step();
  });
}

function moveBack(idx, steps) {
  state.positions[idx] = Math.max(0, state.positions[idx] - steps);
  render();
}

async function landOn(idx) {
  const p = PLAYERS[idx];
  const sq = state.board[state.positions[idx]];
  if (sq.type === 'coin') {
    state.coins[idx] += 1;
    Stats.bumpCoins(1);
    Sound.coin();
    treasureEffect(state.positions[idx]);
    addLog(`${COIN_ICON} ${p.name} 撿到 1 個金幣！`);
    await showEffect(COIN_ICON, `${p.name} 撿到金幣！`, '+1 金幣');
  } else if (sq.type === 'mushroom') {
    state.extraTurn = true;
    Sound.mushroom();
    addLog(`🍄 ${p.name} 吃到蘑菇，可以再擲一次！`);
    await showEffect('🍄', `${p.name} 吃到蘑菇！`, '可以再擲一次！');
  } else if (sq.type === 'star') {
    Sound.star();
    addLog(`⭐ ${p.name} 拿到星星，前進 3 格！`);
    await showEffect('⭐', `${p.name} 拿到星星！`, '前進 3 格');
    await movePlayer(idx, 3);
    if (state.positions[idx] < state.board.length - 1) await landOn(idx);
  } else if (sq.type === 'koopa') {
    if (state.shielded[idx]) {
      state.shielded[idx] = false;
      shieldEffect(state.positions[idx]);
      addLog(`🛡️ ${p.name} 的公主任性擋住了烏龜！`);
      await wait(800);
    } else {
      Sound.koopa();
      addLog(`🐢 ${p.name} 被烏龜擋住，後退 2 格。`);
      await showEffect('🐢', `${p.name} 被烏龜擋住！`, '後退 2 格');
      moveBack(idx, 2);
      if (state.positions[idx] > 0) await landOn(idx);
    }
  } else if (sq.type === 'boss') {
    if (state.shielded[idx]) {
      state.shielded[idx] = false;
      shieldEffect(state.positions[idx]);
      addLog(`🛡️ ${p.name} 的公主任性擋住了叔叔庫巴！`);
      await wait(800);
    } else {
      Sound.boss();
      state.skipTurn[idx] = true;
      state.skipReason[idx] = 'boss';
      addLog(`👹 叔叔庫巴出現！${p.name} 被關起來，下回合暫停！`);
      await showSkip(idx, true);
    }
  } else if (sq.type === 'q') {
    if (state.difficulty === 'grade4') await askSafety(idx);
    else await askQuestion(idx);
  } else if (sq.type === 'zhuyin') {
    if (state.difficulty === 'grade4') await askSafety(idx);
    else await askZhuyin(idx);
  } else if (sq.type === 'reward') {
    Sound.reward();
    const r = REWARDS[rand(0, REWARDS.length - 1)];
    addLog(`🎁 ${p.name} 抽到獎勵：${r}`);
    await showReward(idx, r);
  }
}

function showReward(idx, text) {
  return new Promise(resolve => {
    state.modal = {
      type: 'reward',
      playerIdx: idx,
      text,
      onClose: () => {
        state.modal = null;
        render();
        setTimeout(resolve, 200);
      },
    };
    render();
  });
}

async function useAbility() {
  const idx = state.current;
  const p = PLAYERS[idx];
  if (state.busy) return;
  if (state.coins[idx] < p.ability.cost) return;
  state.busy = true;
  state.coins[idx] -= p.ability.cost;
  const aId = p.ability.id;
  // Open sound
  if (aId === 'anan_command' || aId === 'anan_rampage' || aId === 'anan_shield') Sound.abilityAnan();
  else if (aId === 'fanfan_pull' || aId === 'fanfan_storm' || aId === 'fanfan_wisdom') Sound.abilityFanfan();
  else if (aId === 'mama_teleport') Sound.star();
  else if (aId === 'papa_charge') Sound.abilityPapa();
  else if (aId === 'dog_dash') Sound.diceRoll();
  else if (aId === 'cat_freeze') Sound.koopa();
  else if (aId === 'panda_swap') Sound.mushroom();
  addLog(`${p.ability.emoji} ${p.name} 使用「${p.ability.name}」！`);
  await showAbility(idx);

  if (aId === 'anan_command') {
    // 安安：公主指令 → 強制一名玩家後退 4 格
    Sound.abilityAnan();
    const targetIdx = await pickPlayer(idx, '👑 命令誰後退 4 格？');
    if (targetIdx == null) {
      state.coins[idx] += p.ability.cost;
      state.busy = false;
      render();
      return;
    }
    Sound.koopa();
    const before = state.positions[targetIdx];
    state.positions[targetIdx] = Math.max(0, state.positions[targetIdx] - 4);
    const back = before - state.positions[targetIdx];
    commandEffect(state.positions[idx], state.positions[targetIdx]);
    if (back > 0) {
      addLog(`👑 ${PLAYERS[idx].name} 命令 ${PLAYERS[targetIdx].name} 後退 ${back} 格！`);
    } else {
      addLog(`👑 ${PLAYERS[targetIdx].name} 已在起點，沒法再退！`);
    }
    render();
    await wait(1000);
  } else if (aId === 'anan_rampage') {
    // 安安：公主大鬧 → 所有其他玩家後退 2 格
    Sound.abilityAnan();
    rampageEffect(state.positions[idx]);
    await wait(700);
    Sound.koopa();
    for (let i = 0; i < nPlayers(); i++) {
      if (i === idx) continue;
      const before = state.positions[i];
      state.positions[i] = Math.max(0, state.positions[i] - 2);
      const back = before - state.positions[i];
      if (back > 0) {
        addLog(`💢 ${PLAYERS[i].name} 被推退 ${back} 格！`);
      } else {
        addLog(`💢 ${PLAYERS[i].name} 已在起點，沒退！`);
      }
    }
    render();
    await wait(900);
  } else if (aId === 'anan_shield') {
    // 安安：公主任性 → 擋下一次傷害
    state.shielded[idx] = true;
    shieldEffect(state.positions[idx]);
    addLog(`🛡️ ${PLAYERS[idx].name} 開啟公主任性護盾！下一次傷害會被擋掉`);
    render();
    await wait(1000);
  } else if (aId === 'fanfan_storm') {
    Sound.abilityFanfan();
    stormFlash();
    await wait(900);
    const results = [];
    for (let i = 0; i < nPlayers(); i++) {
      if (i === idx) continue;
      if (state.coins[i] > 0) {
        const lost = Math.min(2, state.coins[i]);
        state.coins[i] -= lost;
        results.push({ pidx: i, type: 'coin', lost });
        addLog(`💸 ${PLAYERS[i].name} 掉了 ${lost} 個金幣！`);
      } else {
        const before = state.positions[i];
        state.positions[i] = Math.max(0, state.positions[i] - 2);
        const back = before - state.positions[i];
        results.push({ pidx: i, type: 'move', back });
        addLog(`💸 ${PLAYERS[i].name} 沒金幣，後退 ${back} 格！`);
      }
    }
    await showFanfanStorm(results);
  } else if (aId === 'fanfan_pull') {
    // 帆帆：魅力呼喚 → 拉一名玩家到自己後面 1 格（在起點時拉到同一格）
    const targetIdx = await pickPlayer(idx, '💫 把誰拉到妳後面？');
    if (targetIdx == null) {
      state.coins[idx] += p.ability.cost;
      state.busy = false;
      render();
      return;
    }
    Sound.abilityFanfan();
    const myPos = state.positions[idx];
    const newPos = Math.max(myPos - 1, 0);
    charmEffect(state.positions[targetIdx], myPos);
    await wait(800);
    state.positions[targetIdx] = newPos;
    addLog(`💫 ${PLAYERS[idx].name} 把 ${PLAYERS[targetIdx].name} 拉到第 ${newPos + 1} 格！`);
    render();
    await wait(500);
  } else if (aId === 'fanfan_wisdom') {
    // 帆帆：智慧祝福 → 下一題自動答對
    state.fanfanArmed[idx] = true;
    princessSparkles(state.positions[idx]);
    addLog(`🧠 ${PLAYERS[idx].name} 啟動智慧祝福！下一題自動答對`);
    render();
    await wait(1000);
  } else if (aId === 'mama_teleport') {
    const fromIdx = state.positions[idx];
    const target = rand(1, state.board.length - 2);
    Sound.star();
    teleportEffect(fromIdx, 'out');
    await wait(700);
    state.positions[idx] = target;
    addLog(`✨ 魔法傳送！${PLAYERS[idx].name} 傳送到第 ${target + 1} 格`);
    render();
    Sound.coin();
    teleportEffect(target, 'in');
    await wait(700);
    await landOn(idx);
    if (state.positions[idx] >= state.board.length - 1) { win(); return; }
  } else if (aId === 'papa_charge') {
    Sound.abilityPapa();
    chargeEffect(state.positions[idx]);
    await wait(500);
    await movePlayer(idx, 6);
    if (state.positions[idx] >= state.board.length - 1) { win(); return; }
    await landOn(idx);
    if (state.positions[idx] >= state.board.length - 1) { win(); return; }
  } else if (aId === 'dog_dash') {
    // 狗狗：忠犬狂奔 → 連擲兩次骰子前進總和
    const d1 = rand(1, 6);
    const d2 = rand(1, 6);
    const total = d1 + d2;
    Sound.diceRoll();
    addLog(`🐶 ${PLAYERS[idx].name} 第一次擲出 ${d1} 點`);
    state.dice = d1;
    render();
    await wait(400);
    Sound.diceRoll();
    addLog(`🐶 第二次擲出 ${d2} 點，合計 ${total} 點！`);
    state.dice = total;
    render();
    await wait(500);
    await movePlayer(idx, total);
    if (state.positions[idx] >= state.board.length - 1) { win(); return; }
    await landOn(idx);
    if (state.positions[idx] >= state.board.length - 1) { win(); return; }
  } else if (aId === 'cat_freeze') {
    // 貓咪：冰凍時間 → 選玩家凍結
    const targetIdx = await pickPlayer(idx, '🧊 選一個要凍結的玩家');
    if (targetIdx == null) {
      state.coins[idx] += p.ability.cost; // 取消退費
      state.busy = false;
      render();
      return;
    }
    state.skipTurn[targetIdx] = true;
    state.skipReason[targetIdx] = 'freeze';
    freezeEffect(state.positions[targetIdx]);
    addLog(`🧊 ${PLAYERS[idx].name} 凍結了 ${PLAYERS[targetIdx].name}！下回合跳過`);
    await wait(900);
  } else if (aId === 'panda_swap') {
    // 貓熊：換位術 → 選玩家換位置
    const targetIdx = await pickPlayer(idx, '🔄 選一個要換位的玩家');
    if (targetIdx == null) {
      state.coins[idx] += p.ability.cost;
      state.busy = false;
      render();
      return;
    }
    const myPos = state.positions[idx];
    const tgtPos = state.positions[targetIdx];
    swapEffect(myPos, tgtPos);
    await wait(400);
    state.positions[idx] = tgtPos;
    state.positions[targetIdx] = myPos;
    addLog(`🐼 ${PLAYERS[idx].name} 跟 ${PLAYERS[targetIdx].name} 換位！第 ${tgtPos + 1} 格 ↔ 第 ${myPos + 1} 格`);
    render();
    await wait(600);
    if (state.positions[idx] >= state.board.length - 1) { win(); return; }
    await landOn(idx);
    if (state.positions[idx] >= state.board.length - 1) { win(); return; }
  }
  await advanceTurn();
}

async function handleCorrect(idx, mode) {
  Stats.bumpAnswered(true);
  state.streak[idx]++;
  Stats.bumpStreak(state.streak[idx]);
  const base = 2;
  state.coins[idx] += base;
  Stats.bumpCoins(base);
  let bonus = 0;
  if (state.streak[idx] >= 3) {
    bonus = Math.min(state.streak[idx] - 1, 5);
    state.coins[idx] += bonus;
    Stats.bumpCoins(bonus);
  }
  Sound.correct();
  const label = mode === 'zhuyin' ? '注音答對' : '答對';
  addLog(`✅ ${PLAYERS[idx].name} ${label}！+${base}${bonus ? `+${bonus} 連擊` : ''} 金幣`);
  await showCorrect(base + bonus, mode);
  if (state.streak[idx] >= 3) {
    Sound.streak(state.streak[idx]);
    await showStreak(state.streak[idx], bonus);
  }
}

async function handleWrong(idx, q, mode) {
  state.streak[idx] = 0;
  Stats.bumpAnswered(false);
  const ansText = mode === 'safety' ? q.options[q.ansIdx] : q.ans;
  if (state.shielded[idx]) {
    state.shielded[idx] = false;
    shieldEffect(state.positions[idx]);
    addLog(`🛡️ ${PLAYERS[idx].name} 的公主任性擋住了答錯處罰！正確答案是 ${ansText}`);
    await wait(900);
    return;
  }
  Sound.wrong();
  const label = mode === 'zhuyin' ? '注音答錯了' : '答錯了';
  addLog(`❌ ${PLAYERS[idx].name} ${label}，正確答案是 ${ansText}`);
  setTimeout(() => Sound.punishment(), 350);
  return new Promise(res => {
    state.modal = {
      type: 'punishment',
      playerIdx: idx,
      ans: ansText,
      mode,
      why: q.why || null,
      text: PUNISHMENTS[rand(0, PUNISHMENTS.length - 1)],
      onClose: () => { state.modal = null; render(); setTimeout(res, 200); },
    };
    render();
  });
}

  if (state.fanfanArmed[idx]) {
    state.fanfanArmed[idx] = false;

  return new Promise(resolve => {

function commandEffect(fromCellIdx, toCellIdx) {
  const from = getCellPos(fromCellIdx);
  const to = getCellPos(toCellIdx);
  if (!from || !to) return;
  const c = document.createElement('div');
  c.style.cssText = `position:fixed;inset:0;pointer-events:none;z-index:200;`;
  document.body.appendChild(c);
  // 命令光束從安安飛向目標
  for (let i = 0; i < 10; i++) {
    setTimeout(() => {
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      const sp = document.createElement('div');
      sp.textContent = ['👉', '💢', '⚡', '👑'][i % 4];
      sp.style.cssText = `position:absolute;left:${from.x}px;top:${from.y}px;font-size:${22 + Math.random() * 12}px;transform:translate(-50%,-50%);--dx:${dx}px;--dy:${dy}px;animation:command-fly 0.7s ease-out forwards;`;
      c.appendChild(sp);
    }, i * 60);

  setTimeout(() => {
    const ring = document.createElement('div');
    ring.style.cssText = `position:absolute;left:${to.x}px;top:${to.y}px;width:80px;height:80px;border:5px solid #e85a92;border-radius:50%;box-shadow:0 0 16px #e85a92,0 0 32px #ff8fb8;transform:translate(-50%,-50%);animation:command-impact 0.7s ease-out forwards;`;
    c.appendChild(ring);
  }, 500);
  setTimeout(() => c.remove(), 1500);

function getWinTheme() {
  const winner = PLAYERS[state.winner];
  if (winner && WIN_THEMES[winner.id]) return WIN_THEMES[winner.id];
  return WIN_THEMES.anan;
}

function getCellPos(cellIdx) {
  const cells = document.querySelectorAll('.board .cell');
  const cell = cells[cellIdx];
  if (!cell) return null;
  const rect = cell.getBoundingClientRect();
  return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
}

function spawnAt(x, y, html) {
  const c = document.createElement('div');
  c.style.cssText = `position:fixed;left:${x}px;top:${y}px;pointer-events:none;z-index:200;`;
  c.innerHTML = html;
  document.body.appendChild(c);
  return c;
}

function princessSparkles(cellIdx) {
  const pos = getCellPos(cellIdx);
  if (!pos) return;
  const c = spawnAt(pos.x, pos.y, '');
  // Pink crown ring
  const ring = document.createElement('div');
  ring.className = 'princess-ring';
  c.appendChild(ring);
  const emojis = ['💕', '💗', '🌸', '🌺', '✨', '💖', '🎀'];
  const colors = ['#ff5a8a', '#ff8fb8', '#ffd23f', '#e85a92'];
  for (let i = 0; i < 26; i++) {
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.4;
    const distance = 60 + Math.random() * 60;
    const dx = Math.cos(angle) * distance;
    const dy = Math.sin(angle) * distance;
    const sp = document.createElement('div');
    sp.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    sp.style.cssText = `position:absolute;left:0;top:0;font-size:${22 + Math.floor(Math.random() * 10)}px;color:${colors[i % colors.length]};text-shadow:0 0 6px ${colors[i % colors.length]};transform:translate(-50%,-50%);--dx:${dx}px;--dy:${dy}px;animation:princess-burst 1.3s ease-out forwards;animation-delay:${Math.random() * 0.25}s;`;
    c.appendChild(sp);
  }
  setTimeout(() => c.remove(), 1700);
}

function stormFlash() {

function teleportEffect(cellIdx, type) {
  const cells = document.querySelectorAll('.board .cell');
  const cell = cells[cellIdx];
  if (!cell) return;
  const rect = cell.getBoundingClientRect();
  const x = rect.left + rect.width / 2;
  const y = rect.top + rect.height / 2;
  const container = document.createElement('div');
  container.style.cssText = `position:fixed;left:${x}px;top:${y}px;pointer-events:none;z-index:200;`;
  document.body.appendChild(container);
  // Magic ring: bright glow that pulses
  const ring = document.createElement('div');
  const ringClass = type === 'out' ? 'tp-ring-out' : 'tp-ring-in';
  ring.className = ringClass;
  container.appendChild(ring);
  // Sparkles
  const emojis = ['✨', '⭐', '💫', '🌟'];
  const colors = ['#ffd23f', '#ff8fb8', '#9b59b6', '#3498db', '#fff350'];
  for (let i = 0; i < 18; i++) {
    const angle = (Math.PI * 2 * i) / 18 + Math.random() * 0.2;
    const distance = 35 + Math.random() * 30;
    const dx = Math.cos(angle) * distance;
    const dy = Math.sin(angle) * distance;
    const sp = document.createElement('div');
    sp.textContent = emojis[i % emojis.length];
    sp.style.cssText = `position:absolute;left:0;top:0;font-size:${16 + Math.floor(Math.random()*8)}px;transform:translate(-50%,-50%);--dx:${dx}px;--dy:${dy}px;color:${colors[i % colors.length]};text-shadow:0 0 8px ${colors[i % colors.length]};animation:teleport-${type} 0.9s ease-out forwards;`;
    container.appendChild(sp);
  }
  setTimeout(() => container.remove(), 1100);
}

function fireworks() {
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden;';
  document.body.appendChild(container);
  const colors = ['#ff5a8a', '#ffd23f', '#27ae60', '#3498db', '#9b59b6', '#e85a92', '#fff350', '#ff6347', '#00d4ff'];
  for (let i = 0; i < 12; i++) {
    setTimeout(() => {
      const x = 8 + Math.random() * 84;
      const y = 12 + Math.random() * 50;
      const color = colors[Math.floor(Math.random() * colors.length)];
      const numParticles = 22 + Math.floor(Math.random() * 8);
      Sound.firework();
      for (let p = 0; p < numParticles; p++) {
        const angle = (Math.PI * 2 * p) / numParticles + Math.random() * 0.15;
        const distance = 70 + Math.random() * 60;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance;
        const particle = document.createElement('div');
        particle.className = 'firework-particle';
        particle.style.cssText = `position:absolute;left:${x}%;top:${y}%;width:9px;height:9px;background:${color};border-radius:50%;box-shadow:0 0 10px ${color},0 0 18px ${color};transform:translate(-50%,-50%);--dx:${dx}px;--dy:${dy}px;`;
        container.appendChild(particle);
      }
    }, i * 380);
  }
  setTimeout(() => container.remove(), 6000);
}

const app = document.getElementById('app');

function render() {
  applyTheme();
  if (state.screen === 'start') renderStart();
  else if (state.screen === 'win') renderWin();
  else renderGame();
}

function applyTheme() {
  const t = BOARD_THEMES[state.theme] || BOARD_THEMES.spring;
  document.body.style.background = t.bg;
  document.body.style.backgroundAttachment = 'fixed';
  startSeasonAnimation();
}

const SEASON_CONFIG = {
  spring: { emojis: ['🌸','🌸','🌸','🌺','🌷','💮'], spawnMs: 700, dur: [7, 11], rotate: true },
  summer: { emojis: ['☀️','🌞','🌻','✨','☀️'],     spawnMs: 1200, dur: [9, 14], rotate: true },
  autumn: { emojis: ['🍁','🍂','🍁','🌰'],         spawnMs: 600, dur: [6, 10], rotate: true },
  winter: { emojis: ['❄️','❄️','❄️','⛄','✦'],     spawnMs: 500, dur: [8, 13], rotate: false },
};
let seasonInterval = null;
let seasonContainer = null;
let seasonTheme = null;
function startSeasonAnimation() {
  // 只有在主題真的改變時才重建，否則每次 render 都會把飄落的花瓣清掉重來
  if (seasonInterval && seasonTheme === state.theme) return;
  if (seasonInterval) { clearInterval(seasonInterval); seasonInterval = null; }
  if (!seasonContainer) {
    seasonContainer = document.createElement('div');
    seasonContainer.id = 'season-bg';
    seasonContainer.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;';
    document.body.appendChild(seasonContainer);
  }
  seasonContainer.innerHTML = '';
  seasonTheme = state.theme;
  const cfg = SEASON_CONFIG[state.theme] || SEASON_CONFIG.spring;
  function spawn() {
    const el = document.createElement('div');
    el.textContent = cfg.emojis[Math.floor(Math.random() * cfg.emojis.length)];
    const left = Math.random() * 100;
    const size = 20 + Math.random() * 22;
    const dur = cfg.dur[0] + Math.random() * (cfg.dur[1] - cfg.dur[0]);
    const drift = (Math.random() - 0.5) * 120;
    el.style.cssText = `position:absolute;left:${left}vw;top:-40px;font-size:${size}px;opacity:${0.6 + Math.random() * 0.35};animation:season-fall ${dur}s linear forwards;--drift:${drift}px;`;
    seasonContainer.appendChild(el);
    setTimeout(() => el.remove(), dur * 1000 + 200);
  }
  for (let i = 0; i < 6; i++) setTimeout(spawn, i * 400);
  seasonInterval = setInterval(spawn, cfg.spawnMs);
}

function toggleMute() {
  state.muted = !state.muted;
  localStorage.setItem('mb-muted', state.muted ? '1' : '0');
  if (state.muted) Sound.stopBgm();
  else if (state.bgmOn) Sound.startBgm();
  render();
}

function toggleBgm() {
  state.bgmOn = !state.bgmOn;
  localStorage.setItem('mb-bgm', state.bgmOn ? '1' : '0');
  if (state.bgmOn && !state.muted) Sound.startBgm();
  else Sound.stopBgm();
  render();
}

      Sound.stopBgm();
      if (state.bgmOn && !state.muted) { Sound.unlock(); Sound.startBgm(); }
      render();
    };
  });
  document.getElementById('stats-start')?.addEventListener('click', () => {
    state.modal = { type: 'stats', onClose: () => { state.modal = null; render(); } };
    render();
  });
  document.querySelectorAll('.pick-card').forEach(c => {
    c.onclick = () => startGame(parseInt(c.dataset.i, 10));
  });
  document.getElementById('random').onclick = () => startGame(rand(0, nPlayers() - 1));
  bindModal();
}

function confirmRestart() {

          </div>
          <h3 style="margin: 12px 0 6px; color:#9b59b6;">🎨 隱藏角色（${unlocked.length}/${UNLOCKABLES.length}）</h3>
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; text-align:center;">
            ${UNLOCKABLES.map(u => {
              const ok = s.plays >= u.unlockAt;
              const ab = u.abilities[0];
              return `<div style="padding:6px; border:2px solid ${ok ? '#9b59b6' : '#bbb'}; border-radius:10px; background:${ok ? '#f0e0ff' : '#f0f0f0'}; opacity:${ok ? '1' : '0.6'};">
                <div style="width:48px; height:60px; margin:0 auto;">${ok ? u.svg : '<div style="font-size:42px;line-height:60px;">🔒</div>'}</div>
                <div style="font-size:12px; font-weight:800;">${ok ? u.name : `玩 ${u.unlockAt} 場`}</div>
                <div style="font-size:10px; color:#6b4a72;">${ok ? `${ab.emoji} ${ab.name}` : '解鎖'}</div>
              </div>`;
            }).join('')}
          </div>
          <button id="stats-ok" style="background:#3498db; color:white; margin-top:10px;">關閉</button>
        </div>
      </div>
    `;
  }
  if (state.modal.type === 'reward') {
    const m = state.modal;
    return `
      <div class="overlay">
        <div class="modal">
          <div style="font-size: 80px; line-height: 1;" class="anim-float">🎁</div>
          <h2 style="color:#27ae60;">獎勵時間！</h2>
          <p style="font-size:16px; color:#6b4a72; margin: 4px 0 12px;">${PLAYERS[m.playerIdx].name} 抽到：</p>
          <div style="font-size:24px; font-weight:900; color:#27ae60; margin: 14px 0; padding: 14px; background: #e8f8e6; border: 3px dashed #27ae60; border-radius: 16px;">
            ${m.text}
          </div>
          <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
            <button id="reward-ok" style="background:#27ae60; color:white;">做完了 💖</button>
            <button id="reward-coin" style="background:#ffd23f; color:#4a2a52; font-size:14px;">改拿 1 金幣</button>
          </div>
        </div>
      </div>
    `;
  }
  return '';
}

function bindModal() {
  if (!state.modal) return;
  if (state.modal.type === 'question') {
    document.querySelectorAll('.ans').forEach(b => {
      b.onclick = () => state.modal.onAnswer(parseInt(b.dataset.v, 10));
    });
  } else if (state.modal.type === 'zhuyin') {
    document.querySelectorAll('.ans').forEach(b => {
      b.onclick = () => state.modal.onAnswer(b.dataset.v);
    });
  } else if (state.modal.type === 'safety') {
    document.querySelectorAll('.ans').forEach(b => {
      b.onclick = () => state.modal.onAnswer(parseInt(b.dataset.i, 10));
    });
  } else if (state.modal.type === 'punishment') {
    document.getElementById('punish-ok')?.addEventListener('click', () => state.modal.onClose());
    document.getElementById('punish-skip')?.addEventListener('click', () => {
      const idx = state.modal.playerIdx;
      state.skipTurn[idx] = true;
      state.skipReason[idx] = 'refuse';
      addLog(`⏸ ${PLAYERS[idx].name} 不做處罰，下回合停留一回合`);
      state.modal.onClose();
    });
  } else if (state.modal.type === 'reward') {
    document.getElementById('reward-ok')?.addEventListener('click', () => state.modal.onClose());
    document.getElementById('reward-coin')?.addEventListener('click', () => {
      const idx = state.modal.playerIdx;
      state.coins[idx] += 1;
      Stats.bumpCoins(1);
      Sound.coin();
      addLog(`${COIN_ICON} ${PLAYERS[idx].name} 不做動作，改拿 1 金幣`);
      state.modal.onClose();
    });
  } else if (state.modal.type === 'effect') {
    document.getElementById('effect-overlay')?.addEventListener('click', () => state.modal?.onClose());
  } else if (state.modal.type === 'correct') {
    document.getElementById('correct-overlay')?.addEventListener('click', () => state.modal?.onClose());
  } else if (state.modal.type === 'skip') {
    document.getElementById('skip-ok')?.addEventListener('click', () => state.modal.onClose());
  } else if (state.modal.type === 'ability') {
    document.getElementById('ability-ok')?.addEventListener('click', () => state.modal.onClose());
  } else if (state.modal.type === 'pick-player') {
    document.querySelectorAll('.pick-target').forEach(b => {
      b.onclick = () => state.modal.onPick(parseInt(b.dataset.i, 10));
    });
    document.getElementById('pick-cancel')?.addEventListener('click', () => state.modal.onCancel());
  } else if (state.modal.type === 'streak') {
    document.getElementById('streak-overlay')?.addEventListener('click', () => state.modal?.onClose());
  } else if (state.modal.type === 'fanfan-storm') {
    document.getElementById('storm-ok')?.addEventListener('click', () => state.modal.onClose());
  } else if (state.modal.type === 'achievement') {
    document.getElementById('achv-ok')?.addEventListener('click', () => state.modal.onClose());
  } else if (state.modal.type === 'stats') {
    document.getElementById('stats-ok')?.addEventListener('click', () => state.modal.onClose());
  } else if (state.modal.type === 'confirm-restart') {
    document.getElementById('confirm-yes')?.addEventListener('click', () => state.modal.onConfirm());
    document.getElementById('confirm-no')?.addEventListener('click', () => state.modal.onCancel());
  }
}

render();
</script>
</body>
</html>
