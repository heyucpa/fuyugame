<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>圓圓的新家大採購 🛋️</title>
<style>
:root{--bg:#f4efe3;--panel:#fffaf0;--ink:#4a3b2a;--line:#e4d8c3;--accent:#5fae7c;--warn:#d0664f;--gold:#ffd35c;--pink:#ff9ec4;--blue:#6bb6ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
body{display:flex;justify-content:center;align-items:flex-start;padding:10px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#app{width:min(520px,100%);background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px 14px 16px;text-align:center;position:relative;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px;margin-bottom:6px}
.dots{display:flex;gap:6px}.dot{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.dot.on{background:var(--gold);border-color:#e0a82e}
/* 小房間 */
#room{position:relative;height:190px;border-radius:14px;border:2px solid var(--line);overflow:hidden;background:linear-gradient(#ffe6ef 0 62%,#d9b27c 62% 100%)}
#room::before{content:"";position:absolute;left:0;right:0;top:62%;height:4px;background:#8a5a33;opacity:.35}
.win{position:absolute;left:50%;top:14px;width:58px;height:50px;margin-left:-29px;border:4px solid #fff;border-radius:8px;background:linear-gradient(#bfe3ff,#e9f6ff);box-shadow:0 0 0 2px #e4d8c3}
.slot{position:absolute;font-size:38px;line-height:1;transform:scale(0);filter:drop-shadow(0 3px 2px rgba(0,0,0,.18))}
.slot.in{animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{0%{transform:translateY(-70px) scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
#pet{position:absolute;left:44%;bottom:12px;width:50px;height:46px;transition:left .8s ease-in-out;z-index:3}
.blob{position:absolute;inset:0;background:#ffe3a8;border:3px solid #8a5a33;border-radius:50% 50% 46% 46%}
.blob::before,.blob::after{content:"";position:absolute;top:16px;width:6px;height:8px;border-radius:50%;background:#3a3240}
.blob::before{left:11px}.blob::after{right:11px}
.cheek{position:absolute;top:24px;width:8px;height:5px;border-radius:50%;background:#ff9ec4;opacity:.8}
.cheek.l{left:4px}.cheek.r{right:4px}
.mouth{position:absolute;left:21px;top:27px;width:8px;height:5px;border-bottom:2px solid #3a3240;border-radius:0 0 8px 8px}
.ear{position:absolute;top:-8px;width:14px;height:14px;background:#ffe3a8;border:3px solid #8a5a33;border-radius:50%;z-index:-1}
.ear.l{left:3px}.ear.r{right:3px}
#pet.hop{animation:hop .5s ease 2}
@keyframes hop{50%{transform:translateY(-22px)}}
#say{min-height:40px;margin:8px 0 2px;font-weight:700;font-size:15px;color:#8a5a33}
#q{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 8px;margin:4px 0 8px}
#q .tag{display:inline-block;background:var(--blue);color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;margin-bottom:4px}
#q .t{font-size:24px;font-weight:800;line-height:1.4}
#q .t b{color:var(--warn);border-bottom:3px dashed var(--warn);padding:0 6px}
#opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:none;border-radius:12px;padding:14px 4px;background:var(--accent);color:#fff;font-weight:800;font-size:24px;box-shadow:0 3px 0 #488a60}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 #488a60}
.opt.no{background:#e7a94a;box-shadow:0 3px 0 #bb8330;animation:shake .35s}
.opt.ok{background:#e8505b;box-shadow:0 3px 0 #b83a45}
.opt:disabled{opacity:.55}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.big{display:block;width:100%;border:none;border-radius:12px;padding:12px;background:var(--accent);color:#fff;font-weight:800;font-size:18px;margin:8px 0 0;box-shadow:0 3px 0 #488a60}
.big.alt{background:#e7a94a;box-shadow:0 3px 0 #bb8330}
#end{display:none}
.sticker{display:inline-block;margin:6px auto;padding:8px 18px;border-radius:999px;background:linear-gradient(#ffe066,#ffd23f);border:3px solid #e0a82e;font-weight:800;font-size:18px;transform:rotate(-4deg);animation:pop2 .6s ease}
@keyframes pop2{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(-4deg)}}
.conf{position:absolute;top:-20px;font-size:24px;pointer-events:none;animation:fall 1.8s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(520px) rotate(360deg);opacity:.2}}
</style></head>
<body>
<div id="app">
  <div class="top"><span>🏡 圓圓的新家</span><span class="dots" id="dots"></span></div>
  <div id="room"><div class="win"></div>
    <div id="pet"><div class="ear l"></div><div class="ear r"></div><div class="blob"></div><div class="cheek l"></div><div class="cheek r"></div><div class="mouth"></div></div>
  </div>
  <div id="say"></div>
  <div id="play">
    <div id="q"><div class="tag" id="tag"></div><div class="t" id="qt"></div></div>
    <div id="opts"></div>
  </div>
  <div id="end">
    <div class="sticker">🌟 小小設計師 🌟</div>
    <div id="endsay" style="font-weight:800;font-size:17px;margin:6px 0"></div>
    <button class="big" id="again">🔁 再玩一次</button>
  </div>
</div>
<script>
'use strict';
(function(){
  var $=function(id){return document.getElementById(id)};
  var rnd=function(n){return Math.floor(Math.random()*n)};
  var pick=function(a){return a[rnd(a.length)]};
  var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a};

  // 小音效（沒有也沒關係；需點一下才會出聲）
  var ac=null;
  function beep(f,d,t){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
  function good(){beep(660,.12);setTimeout(function(){beep(880,.18)},110)}
  function soft(){beep(300,.15,'triangle')}
  function fan(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){beep(f,.2)},i*120)})}

  // 家具（避開太新的表情符號，Windows 10 看不到）
  var FURN=[['🛋️','沙發'],['🛏️','小床'],['🖼️','圖畫','wall'],['📺','電視'],['🧸','娃娃'],['🌷','花'],['📚','書櫃'],['🧺','籃子']];
  var SLOTS=[{l:'1%',b:'14px'},{l:'20%',b:'14px'},{l:'64%',b:'14px'},{l:'81%',b:'14px'}];var WSLOTS=[{l:'12%',b:'100px'},{l:'74%',b:'100px'}];

  // ---- 題庫（都偏簡單；答錯只鼓勵） ----
  function mulQ(){
    var a=2+rnd(5),b=2+rnd(5),ans=a*b; // 2~6 的乘法
    var ws=shuffle([ans+a,ans-b,ans+b+1,ans-a,ans+2].filter(function(x){return x>0&&x!==ans}));
    return {tag:'乘法小任務',text:a+' × '+b+' = <b>？</b>',ans:String(ans),opts:[String(ans),String(ws[0]),String(ws[1])]};
  }
  var IDIOM=[['一<b>？</b>兩得','舉','拳','學'],['三心<b>？</b>意','二','三','四'],['七上八<b>？</b>','下','上','左'],['一<b>？</b>二鳥','石','右','日'],['半途而<b>？</b>','廢','費','肺'],['畫蛇添<b>？</b>','足','手','走'],['守株待<b>？</b>','兔','免','冤'],['四面八<b>？</b>','方','万','放'],['五光十<b>？</b>','色','包','邑'],['井底之<b>？</b>','蛙','娃','挂']];
  function idiomQ(){var x=pick(IDIOM);return {tag:'成語小任務',text:x[0],ans:x[1],opts:[x[1],x[2],x[3]]}}
  function wordQ(){
    var P=[['媽媽買了 3 盒餅乾，每盒 4 片，一共有幾片？','12','7','10'],['圓圓每天吃 2 顆莓果，5 天吃幾顆？','10','7','25'],['一束花 6 朵，買 2 束，一共幾朵？','12','8','62'],['每張桌子 4 隻腳，3 張桌子有幾隻腳？','12','7','16'],['一包貼紙 5 張，買 4 包，有幾張貼紙？','20','9','54']];
    var x=pick(P);return {tag:'應用小任務',text:x[0],ans:x[1],opts:[x[1],x[2],x[3]]};
  }
  var ZAI=[['我們明天<b>？</b>見！','再','在','才'],['小花貓<b>？</b>沙發上睡覺。','在','再','才'],['這首歌好好聽，我想<b>？</b>聽一次。','再','在','載']];
  function zaiQ(){var x=pick(ZAI);return {tag:'國字小任務',text:x[0],ans:x[1],opts:[x[1],x[2],x[3]]}}
  var ROUNDS=[mulQ,idiomQ,function(){return Math.random()<.5?wordQ():zaiQ()}];

  var round=0,furn=[],slots=[],locked=false;
  function dots(){var h='';for(var i=0;i<3;i++)h+='<span class="dot'+(i<round?' on':'')+'"></span>';$('dots').innerHTML=h}
  function say(t){$('say').textContent=t}
  function reset(){
    round=0;locked=false;
    furn=shuffle(FURN).slice(0,3);var fs=shuffle(SLOTS),ws=shuffle(WSLOTS);slots=furn.map(function(f){return f[2]==='wall'?ws.shift():fs.shift()});
    var r=$('room');Array.prototype.slice.call(r.querySelectorAll('.slot')).forEach(function(n){n.remove()});
    $('end').style.display='none';$('play').style.display='block';
    $('pet').style.left='42%';
    say('圓圓要布置新家！答對就能搬家具進去 🏠');
    next();
  }
  function next(){
    dots();locked=false;
    var q=ROUNDS[round]();
    $('tag').textContent='第 '+(round+1)+' / 3 關　'+q.tag;
    $('qt').innerHTML=q.text;
    var o=$('opts');o.innerHTML='';
    shuffle(q.opts).forEach(function(v){
      var b=document.createElement('button');b.className='opt';b.textContent=v;
      b.onclick=function(){answer(b,v===q.ans,q)};
      o.appendChild(b);
    });
  }
  function answer(b,right,q){
    if(locked||b.disabled)return;
    if(!right){b.className='opt no';b.disabled=true;soft();say(pick(['差一點點，再想想看～','沒關係，再試一次！','圓圓相信你！換一個答案看看']));return}
    locked=true;b.className='opt ok';good();
    var f=furn[round],s=slots[round];
    var n=document.createElement('div');n.className='slot';n.textContent=f[0];n.style.left=s.l;n.style.bottom=s.b;
    $('room').appendChild(n);void n.offsetWidth;n.className='slot in';
    var pet=$('pet');pet.style.left='42%';pet.className='hop';setTimeout(function(){pet.className=''},1100);
    say('答對了！'+f[1]+'搬進新家 '+f[0]);
    round++;dots();
    setTimeout(function(){if(round>=3)finish();else next()},1100);
  }
  function finish(){
    $('play').style.display='none';$('end').style.display='block';
    $('endsay').textContent='圓圓的新家完成了，好開心！';say('🎉 謝謝你幫圓圓布置新家 🎉');
    fan();
    for(var i=0;i<14;i++){(function(i){setTimeout(function(){var c=document.createElement('div');c.className='conf';c.textContent=pick(['⭐','🎉','💖','✨','🌸']);c.style.left=rnd(92)+'%';$('app').appendChild(c);setTimeout(function(){c.remove()},1900)},i*70)})(i)}
  }
  $('again').onclick=reset;
  reset();
})();
</script>
</body></html>
