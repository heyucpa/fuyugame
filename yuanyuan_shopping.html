<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>圓圓的新家大採購 🛋️</title>
<style>
:root{--bg:#f4efe3;--panel:#fffaf0;--ink:#4a3b2a;--line:#e4d8c3;--accent:#5fae7c;--warn:#d0664f;--gold:#ffd35c;--pink:#ff9ec4;--blue:#6bb6ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
body{display:flex;justify-content:center;align-items:flex-start;padding:10px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#app{width:min(520px,100%);background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px 14px 16px;text-align:center;position:relative;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px;margin-bottom:6px}
.top>span:first-child{flex:1;text-align:left;white-space:nowrap}
@media(max-width:380px){.dots{gap:3px!important}.dot{width:11px!important;height:11px!important}}
.dots{display:flex;gap:4px;flex:none}.dot{width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.dot.on{background:var(--gold);border-color:#e0a82e}
/* 小房間 */
:root{--wall:#ffe6ef;--wp:none;--wsz:auto;--floorc:#d9b27c;--fp:none;--fsz:auto;--cc:#d9531e;--wf:#fff}
#room{position:relative;height:210px;border-radius:14px;border:2px solid var(--line);overflow:hidden;background-color:var(--wall);background-image:var(--wp);background-size:var(--wsz)}
#fl{position:absolute;left:0;right:0;top:62%;bottom:0;background-color:var(--floorc);background-image:var(--fp);background-size:var(--fsz);border-top:4px solid rgba(80,50,30,.28)}
.win{position:absolute;left:50%;top:14px;width:58px;height:50px;margin-left:-29px;border:4px solid var(--wf);border-radius:8px;background:linear-gradient(#bfe3ff,#e9f6ff);box-shadow:0 0 0 2px rgba(80,60,40,.25);overflow:hidden}
.win svg{display:block;width:100%;height:100%}
.slot{position:absolute;font-size:40px;line-height:1;transform:scale(0);cursor:pointer;transition:filter .3s}
.slot.show{transform:none}
.slot.in{animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{0%{transform:translateY(-70px) scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
#pet{position:absolute;left:44%;bottom:12px;width:50px;height:46px;transition:left .8s ease-in-out;z-index:3}
.blob{position:absolute;inset:0;background:#ffe3a8;border:3px solid #8a5a33;border-radius:50% 50% 46% 46%}
.blob::before,.blob::after{content:"";position:absolute;top:16px;width:6px;height:8px;border-radius:50%;background:#3a3240}
.blob::before{left:11px}.blob::after{right:11px}
.cheek{position:absolute;top:24px;width:8px;height:5px;border-radius:50%;background:#ff9ec4;opacity:.8}
.cheek.l{left:4px}.cheek.r{right:4px}
.mouth{position:absolute;left:21px;top:27px;width:8px;height:5px;border-bottom:2px solid #3a3240;border-radius:0 0 8px 8px}
.ear{position:absolute;top:-8px;width:14px;height:14px;background:#ffe3a8;border:3px solid #8a5a33;border-radius:50%;z-index:-1}
.ear.l{left:3px}.ear.r{right:3px}
#pet.hop{animation:hop .5s ease 2}
@keyframes hop{50%{transform:translateY(-22px)}}
#pet.dance{animation:dance .45s ease 3}
@keyframes dance{25%{transform:translateY(-16px) rotate(-14deg)}75%{transform:translateY(-16px) rotate(14deg)}}
#pet.tilt{animation:tilt .7s ease}
@keyframes tilt{30%{transform:rotate(-16deg)}70%{transform:rotate(10deg)}}
#pet.happy .blob::before,#pet.happy .blob::after{height:4px;top:19px;border-radius:4px}
#pet.happy .mouth{left:18px;width:14px;height:9px;background:#ff8a8a;border:2px solid #3a3240;border-radius:0 0 14px 14px}
#pet.sad .mouth{top:30px;border-bottom:none;border-top:2px solid #3a3240;border-radius:8px 8px 0 0}
#pet.glow .blob{background:#fff2b8;box-shadow:0 0 14px 7px #ffe066}
#combo{position:absolute;top:6px;right:6px;z-index:5;display:none;background:linear-gradient(#ff9ec4,#ff6fa8);color:#fff;font-weight:800;font-size:15px;border-radius:999px;padding:3px 12px;border:2px solid #fff;box-shadow:0 2px 0 #d04d86}
#combo.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.35) rotate(-6deg)}}
.spk{position:absolute;font-size:18px;pointer-events:none;z-index:6;animation:spk .9s ease-out forwards}
@keyframes spk{to{transform:translate(var(--dx),-46px) scale(1.4);opacity:0}}
#stars{font-size:38px;letter-spacing:4px;margin:6px 0 0;color:#e0a82e}
#stars span{display:inline-block;animation:pop2 .6s ease backwards}
#endinfo{font-size:14px;color:#8a5a33;margin:2px 0 6px}
#say{min-height:44px;margin:8px 0 2px;font-weight:700;font-size:15px;color:#8a5a33}
#q{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 8px;margin:4px 0 8px}
#story{font-size:14px;color:#8a5a33;font-weight:700;margin-bottom:6px;line-height:1.4}
#q .tag{display:inline-block;background:var(--blue);color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;margin-bottom:4px}
#q .t{font-size:24px;font-weight:800;line-height:1.4}
#q .t b{color:var(--warn);border-bottom:3px dashed var(--warn);padding:0 6px}
#opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:none;border-radius:12px;padding:14px 4px;background:var(--accent);color:#fff;font-weight:800;font-size:24px;box-shadow:0 3px 0 #488a60}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 #488a60}
.opt.no{background:#e7a94a;box-shadow:0 3px 0 #bb8330;animation:shake .35s}
.opt.ok{background:#e8505b;box-shadow:0 3px 0 #b83a45}
.opt:disabled{opacity:.55}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.big{display:block;width:100%;border:none;border-radius:12px;padding:12px;background:var(--accent);color:#fff;font-weight:800;font-size:18px;margin:8px 0 0;box-shadow:0 3px 0 #488a60}
.big.alt{background:#e7a94a;box-shadow:0 3px 0 #bb8330}
#end{display:none}
.sticker{display:inline-block;margin:6px auto;padding:8px 18px;border-radius:999px;background:linear-gradient(#ffe066,#ffd23f);border:3px solid #e0a82e;font-weight:800;font-size:18px;transform:rotate(-4deg);animation:pop2 .6s ease}
@keyframes pop2{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(-4deg)}}
.conf{position:absolute;top:-20px;font-size:24px;pointer-events:none;animation:fall 1.8s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(520px) rotate(360deg);opacity:.2}}

#bar{display:flex;justify-content:space-between;align-items:center;min-height:30px;margin:0 0 6px;font-size:13px;font-weight:700;color:#8a5a33;gap:6px}
#hist{text-align:left}
#clear{border:2px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px;color:#8a5a33;white-space:nowrap;flex:none}
#clear.sure{background:var(--warn);border-color:#b34f3b;color:#fff}
.crown{display:none;position:absolute;left:50%;top:-16px;margin-left:-10px;font-size:18px;line-height:1;z-index:4}
#pet[data-king="1"] .crown{display:block;animation:crown .6s ease-in-out infinite alternate}
@keyframes crown{to{transform:translateY(-3px) rotate(6deg)}}
.cpop{position:absolute;left:50%;top:34%;z-index:8;display:flex;align-items:center;gap:4px;white-space:nowrap;pointer-events:none;animation:cpop .8s ease-out forwards}
.cpop .tx{font-weight:900;color:#fff;text-shadow:0 2px 0 var(--cc),2px 0 0 var(--cc),-2px 0 0 var(--cc),0 -2px 0 var(--cc),0 0 10px #fff}
.cpop.l3 .tx{color:#fff3a0}.cpop.l4 .tx{color:#ffd0e6;text-shadow:0 2px 0 var(--cc),2px 0 0 var(--cc),-2px 0 0 var(--cc),0 -2px 0 var(--cc),0 0 12px #fff}
.cpop .sd{font-size:20px;animation:flick .25s ease-in-out 3 alternate}
@keyframes flick{to{transform:scale(1.3) rotate(10deg)}}
@keyframes cpop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}25%{transform:translate(-50%,-50%) scale(1.2);opacity:1}45%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.15);opacity:0}}
.fw{position:absolute;left:50%;top:40%;font-size:20px;pointer-events:none;z-index:7;animation:fw .9s ease-out forwards}
@keyframes fw{0%{transform:translate(-50%,-50%) scale(.4)}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3);opacity:0}}
#room.rb::after{content:"";position:absolute;inset:0;border-radius:12px;pointer-events:none;z-index:7;box-shadow:inset 0 0 0 3px #ff5d5d,inset 0 0 0 6px #ffb347,inset 0 0 0 9px #ffe066,inset 0 0 0 12px #6fdc8c,inset 0 0 0 15px #6bb6ff;animation:rb 1.4s ease-out forwards}
#mute{flex:none;width:42px;height:42px;margin-left:8px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:22px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 var(--line)}
#mute:active{transform:translateY(1px);box-shadow:none}
#mute.off{background:#eee;border-color:#cfc6b4;filter:grayscale(.6)}
#prog{margin:0 0 8px;font-size:13px;font-weight:800;color:#8a5a33}
.pbar{height:12px;border-radius:999px;background:#fff;border:2px solid var(--line);overflow:hidden;margin:3px 0 4px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd35c,#ffb347);border-radius:999px;transition:width 1s ease}
#chips{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.chip{font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px;background:#fff;border:1px solid var(--line);color:#a8977c;white-space:nowrap}
.chip.on{background:#fff2b8;border-color:#e0a82e;color:#8a5a33}
#unl{display:none;margin:8px 0;padding:10px 8px;border-radius:14px;border:3px solid #e0a82e;background:linear-gradient(#fff6c9,#ffe27a);font-weight:800;color:#8a5a33;font-size:15px;line-height:1.5;animation:unlpop .8s cubic-bezier(.3,1.6,.5,1)}
#unl .ut{font-size:17px;margin-bottom:2px}
#unl .ue{font-size:30px;letter-spacing:4px;line-height:1.3}
#unl .ue span{display:inline-block;animation:ubob .7s ease-in-out infinite alternate}
#unl .ue span:nth-child(2n){animation-delay:.2s}#unl .ue span:nth-child(3n){animation-delay:.4s}
@keyframes unlpop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes ubob{to{transform:translateY(-7px) rotate(8deg)}}
@keyframes rb{0%{opacity:0}15%{opacity:1}100%{opacity:0}}

/* ---- v8：8 個房間主題（純 CSS + 內嵌 SVG + emoji，沒有外部圖檔） ---- */
[data-t="0"]{--wall:#ffe6d0;--wp:repeating-linear-gradient(90deg,rgba(176,112,64,.12) 0 2px,transparent 2px 22px);--floorc:#d9a066;--fp:repeating-linear-gradient(90deg,rgba(110,60,20,.22) 0 2px,transparent 2px 38px);--cc:#d9531e;--wf:#fff}
[data-t="1"]{--wall:#ffc88f;--wp:radial-gradient(circle,rgba(255,255,255,.4) 3px,transparent 4px);--wsz:26px 26px;--floorc:#9b72c6;--fp:repeating-linear-gradient(90deg,rgba(60,20,90,.2) 0 3px,transparent 3px 40px);--cc:#c2410c;--wf:#ff9a3c}
[data-t="2"]{--wall:#d3c6f0;--wp:repeating-linear-gradient(90deg,rgba(90,60,150,.16) 0 10px,transparent 10px 30px);--floorc:#5d4a82;--fp:conic-gradient(#7a65a3 25%,#5d4a82 0 50%,#7a65a3 0 75%,#5d4a82 0);--fsz:36px 36px;--cc:#6a3fb0;--wf:#8d79b8}
[data-t="3"]{--wall:#aee4f7;--wp:radial-gradient(circle at 25% 30%,rgba(255,255,255,.55) 0 4px,transparent 5px),radial-gradient(circle at 72% 70%,rgba(255,255,255,.5) 0 6px,transparent 7px);--wsz:80px 64px;--floorc:#f2d99a;--fp:radial-gradient(circle at 50% 100%,transparent 8px,rgba(200,150,60,.3) 9px 11px,transparent 12px);--fsz:28px 14px;--cc:#0e7fb8;--wf:#ffe08a}
[data-t="4"]{--wall:#ffd3ea;--wp:repeating-linear-gradient(45deg,rgba(255,255,255,.6) 0 8px,transparent 8px 20px);--floorc:#fff0c8;--fp:conic-gradient(#ffc2de 25%,#fff0c8 0 50%,#ffc2de 0 75%,#fff0c8 0);--fsz:32px 32px;--cc:#d6247f;--wf:#ff8fc2}
[data-t="5"]{--wall:#dff1ff;--wp:radial-gradient(circle,#fff 2px,transparent 3px);--wsz:24px 24px;--floorc:#b9d9ef;--fp:repeating-linear-gradient(90deg,rgba(255,255,255,.6) 0 2px,transparent 2px 34px);--cc:#1f78c1;--wf:#fff}
[data-t="6"]{--wall:#d2efc6;--wp:repeating-linear-gradient(60deg,rgba(80,150,70,.14) 0 6px,transparent 6px 22px);--floorc:#7fc069;--fp:repeating-linear-gradient(90deg,rgba(40,110,40,.24) 0 2px,transparent 2px 9px);--cc:#2e8b3a;--wf:#b78a5a}
[data-t="7"]{--wall:#8d92dd;--wp:radial-gradient(circle,rgba(255,255,255,.85) 1px,transparent 2px);--wsz:31px 27px;--floorc:#4a4f93;--fp:linear-gradient(rgba(255,255,255,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px);--fsz:24px 24px;--cc:#4b3fd0;--wf:#c9ccf2}
[data-t="8"]{--wall:#ffe6ef;--floorc:#d9b27c;--cc:#d9531e;--wf:#fff}
#room[data-t="8"] .slot{font-size:34px}
#room[data-t="2"] .win{border-radius:26px 26px 6px 6px}
#room[data-t="3"] .win{border-radius:50%}
#decor{position:absolute;inset:0;pointer-events:none}
.dc{position:absolute;line-height:1;font-size:22px}
.dc.a{left:5%;top:24px}.dc.b{right:5%;top:30px;font-size:20px}.dc.c{left:3%;bottom:8px;font-size:26px}.dc.d{right:3%;bottom:8px;font-size:26px}
.gar{position:absolute;left:2%;right:2%;top:1px;display:flex;justify-content:space-between;font-size:12px;line-height:1}
.hat{position:absolute;left:50%;top:-16px;margin-left:-9px;font-size:16px;line-height:1;z-index:4}
#pet[data-king="1"] .hat{display:none}
#banner{position:absolute;left:50%;top:46%;z-index:10;max-width:94%;text-align:center;pointer-events:none;display:none;background:rgba(255,255,255,.92);border:3px solid var(--cc);border-radius:14px;padding:5px 12px;color:var(--cc);font-weight:900;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.18)}
#banner small{display:block;font-size:12px;line-height:1.2;opacity:.85}
#banner b{display:block;font-size:17px;line-height:1.3}
#banner.go{display:block;animation:bn 1.6s ease forwards}
@keyframes bn{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}14%{transform:translate(-50%,-50%) scale(1.08);opacity:1}24%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
#room.rin{animation:rin .6s ease}
@keyframes rin{0%{opacity:.15;filter:brightness(1.7)}100%{opacity:1;filter:none}}
#rtitle{font-size:13px;font-weight:800;color:#8a5a33;margin:6px 0 2px}
#rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 8px}
.rc{border:2px solid var(--line);border-radius:10px;padding:0;overflow:hidden;background:#fff;min-width:0}
.rc.on{border-color:var(--accent);box-shadow:0 0 0 2px #bfe6cc}
.rc .rm{position:relative;display:flex;align-items:flex-end;justify-content:center;height:44px;padding-bottom:2px;background:linear-gradient(var(--wall) 0 58%,var(--floorc) 58%);overflow:hidden}
.rc .rm i{position:absolute;left:3px;top:2px;font-style:normal;font-size:13px;line-height:1}
.rc .rm b{font-size:22px;line-height:1;font-weight:400;white-space:nowrap}
.rc .rn{display:block;font-size:11px;font-weight:800;padding:2px 0;color:#8a5a33;white-space:nowrap}
</style></head>
<body>
<div id="app">
  <div class="top"><span>🏡 圓圓的新家</span><span class="dots" id="dots"></span><button id="mute" type="button" aria-label="音效開關" aria-pressed="false">🔊</button></div>
  <div id="bar"><span id="hist"></span><button id="clear" style="display:none">🧹 清掉舊家</button></div>
  <div id="prog"><div id="progtx"></div><div class="pbar"><i id="pfill"></i></div><div id="chips"></div></div>
  <div id="room" data-t="0"><div id="fl"></div><div id="decor"></div><div class="win" id="win"></div><div id="combo"></div><div id="banner"></div>
    <div id="pet"><div class="hat" id="hat"></div><div class="crown">👑</div><div class="ear l"></div><div class="ear r"></div><div class="blob"></div><div class="cheek l"></div><div class="cheek r"></div><div class="mouth"></div></div>
  </div>
  <div id="say"></div>
  <div id="play">
    <div id="q"><div id="story"></div><div class="tag" id="tag"></div><div class="t" id="qt"></div></div>
    <div id="opts"></div>
  </div>
  <div id="end">
    <div class="sticker" id="sticker">🌟 小小設計師 🌟</div>
    <div id="stars"></div>
    <div id="endsay" style="font-weight:800;font-size:17px;margin:6px 0"></div>
    <div id="endstory" style="font-size:14px;color:#8a5a33;margin:4px 0"></div>
    <div id="endinfo"></div>
    <div id="endgain" style="font-size:14px;font-weight:800;color:#8a5a33;margin:2px 0 4px"></div>
    <div id="unl"></div>
    <div id="rtitle">🏠 8 間房間回顧（點一下可以再看那一間）</div><div id="rooms"></div>
    <div id="endhist" style="font-size:14px;font-weight:800;color:#8a5a33;margin:0 0 6px"></div>
    <button class="big" id="again">🔁 再玩一次</button>
  </div>
</div>
<script>
'use strict';
(function(){
  var $=function(id){return document.getElementById(id)};
  var rnd=function(n){return Math.floor(Math.random()*n)};
  var pick=function(a){return a[rnd(a.length)]};
  var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a};

  // ---- 音效：只用 Web Audio 現場合成（沒有任何音檔）；要等第一次點擊/觸控後才建立；失敗就安靜略過 ----
  var ac=null,master=null,muted=false,acDead=false;
  function unlock(){
    if(acDead)return;
    try{
      if(!ac){var AC=window.AudioContext||window.webkitAudioContext;if(!AC){acDead=true;return}
        ac=new AC();
        try{master=ac.createGain();master.gain.value=.5;master.connect(ac.destination)}catch(e){master=null}
        try{var bf=ac.createBuffer(1,1,22050),sr=ac.createBufferSource();sr.buffer=bf;sr.connect(ac.destination);sr.start(0)}catch(e){} // iOS 解鎖
      }
      if(ac.state==='suspended'||ac.state==='interrupted'){var pr=ac.resume();if(pr&&pr.catch)pr.catch(function(){})}
    }catch(e){ac=null;master=null;acDead=true}
  }
  ['pointerdown','touchstart','touchend','mousedown','click','keydown'].forEach(function(ev){document.addEventListener(ev,unlock,true)});
  // 單音：f 頻率、at 延遲秒數、d 長度、type 波形、v 音量、f2 滑到的頻率
  function tone(f,at,d,type,v,f2){
    if(muted||!ac||ac.state==='closed')return;
    try{var t=ac.currentTime+(at||0)+.01,o=ac.createOscillator(),g=ac.createGain();
      o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
      g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v||.16,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(master||ac.destination);o.start(t);o.stop(t+d+.03)}catch(e){}
  }
  var LAD=[523,587,659,784,880,1047,1175,1319,1568,1760,2093]; // 五聲音階，不會刺耳
  var SFX={
    ok:function(){tone(784,0,.12,'sine',.17);tone(1175,.09,.2,'sine',.17)},                       // 答對：短清脆上行
    combo:function(n){ // 連擊：越高連擊音越多、音越高
      var cnt=n<=2?3:(n===3?5:Math.min(6+(n-4),8)),st=n<=2?1:(n===3?2:3),i;
      for(i=0;i<cnt;i++)tone(LAD[st+i],.16+i*.07,.16,'triangle',.15);
      if(n>=3){tone(2093,.16+cnt*.07,.3,'sine',.1);tone(2637,.2+cnt*.07,.3,'sine',.08)}

  var RHET=[['「月亮像一個大銀盤。」是哪一種句子？','譬喻','擬人','設問'],['「小花對我點點頭。」是哪一種句子？','擬人','譬喻','設問'],['「白雲像棉花糖。」是哪一種句子？','譬喻','擬人','設問'],['「風兒在樹林裡唱歌。」是哪一種句子？','擬人','譬喻','設問'],['「弟弟的臉紅得像蘋果。」是哪一種句子？','譬喻','擬人','設問'],['「太陽公公笑瞇瞇。」是哪一種句子？','擬人','譬喻','設問'],['「窗口邊的台灣欒樹像一幅風景畫。」是哪一種句子？','譬喻','擬人','設問'],['「彎彎的月亮像一艘小船。」是哪一種句子？','譬喻','擬人','設問'],['「笑聲像銀鈴一樣好聽。」是哪一種句子？','譬喻','擬人','設問'],['「秋天的楓葉紅得像火焰。」是哪一種句子？','譬喻','擬人','設問'],['「雨絲細得像一根根銀針。」是哪一種句子？','譬喻','擬人','設問'],['「秋天為青山穿上芒花編織的毛衣。」是哪一種句子？','擬人','譬喻','設問'],['「花兒張開笑臉歡迎小蜜蜂。」是哪一種句子？','擬人','譬喻','設問'],['「星星眨著眼睛看著我們。」是哪一種句子？','擬人','譬喻','設問'],['「小河哼著歌向前跑。」是哪一種句子？','擬人','譬喻','設問'],['「春風輕輕撫摸我的臉。」是哪一種句子？','擬人','譬喻','設問'],['「誰最愛吃魚呢？答案是小貓。」是哪一種句子？','設問','譬喻','擬人'],['「是誰把花園變得這麼美？是辛勤的園丁。」是哪一種句子？','設問','譬喻','擬人'],['「我愛讀書，我愛運動，我愛畫畫。」是哪一種句子？','排比','設問','擬人'],['「他的力氣大得可以搬動一座山。」是哪一種句子？','誇飾','擬人','設問']];
  function rhetQ(){var x=pick(RHET);return {k:'rhet',tag:'修辭小任務',text:x[0],ans:x[1],opts:[x[1],x[2],x[3]]}}
  var MATH=[mulQ,divQ,invQ,fracQ,kgQ,timeQ,circleQ,wordQ],CHI=[idiomQ,zaiQ,simQ,polyQ,rhetQ];
  var rounds=[];
  function buildRounds(){var m=shuffle(MATH),c=shuffle(CHI),i;rounds=[];for(i=0;i<NR;i++)rounds.push(i%2===startM?m[i>>1]:c[i>>1])} // 數學/國語交錯，8 關題型都不同（數學 4 種、國語 4 種）
  var startM=0;
  // 小故事、鼓勵話、必殺技、稱號：都放在各房間主題 TH 裡
  var ENDSTORY=['圓圓逛完 '+NR+' 間不同的房間，抱著 '+NR+' 件新家具開心轉圈！','老闆笑著說「謝謝光顧」，圓圓高興地搬進新家，每個房間都有你挑的家具。','圓圓把 '+NR+' 間房都布置好了，從木屋到太空基地，每一間都好有特色！',NR+' 間房都搬進新家具啦！圓圓說：這是全世界最棒的家！'];

  var round=0,furn=[],run=[],maxRoom=-1,bnT=null,locked=false,combo=0,maxCombo=0,wrong=0,qWrong=false,moodT=null,rbT=null;
  function TT(r){return TH[(r===undefined?round:r)%8]}
  function mood(cls,ms){var p=$('pet');clearTimeout(moodT);p.className='';void p.offsetWidth;p.className=cls;moodT=setTimeout(function(){p.className=''},ms)}
  function sparkle(){var r=$('room');for(var i=0;i<6;i++){var e=document.createElement('div');e.className='spk';e.textContent=pick(TT().fw);e.style.left=(40+rnd(18))+'%';e.style.bottom=(30+rnd(30))+'px';e.style.setProperty('--dx',(rnd(80)-40)+'px');r.appendChild(e);(function(e){setTimeout(function(){e.remove()},950)})(e)}}
  function showCombo(){var c=$('combo');if(combo>=2){c.textContent=TT().fx[0]+' '+TT().cb+' x'+combo;c.style.display='block';c.className='';void c.offsetWidth;c.className='bump'}else{c.style.display='none'}}
  function king(on){if(on)$('pet').setAttribute('data-king','1');else $('pet').removeAttribute('data-king')}
  function comboFx(n){ // 連擊特效：x2 大字+火焰，x3 煙火星星，x4↑ 彩虹邊框+皇冠，越高越多
    var r=$('room'),e=document.createElement('div');e.className='cpop l'+Math.min(n,4);SFX.combo(n);
    var fs=20+2*Math.min(n,5);
    var th=TT(),dec=n>=4?[th.fx[2],th.fx[3]]:[th.fx[0],th.fx[1]];
    e.innerHTML='<span class="sd">'+dec[0]+'</span><span class="tx" style="font-size:'+fs+'px">'+th.mv[n<=2?0:(n===3?1:2)]+' x'+n+'！</span><span class="sd">'+dec[1]+'</span>';
    r.appendChild(e);var tx=e.querySelector('.tx'),lim=r.clientWidth/1.25;while(e.offsetWidth>lim&&fs>14){fs-=2;tx.style.fontSize=fs+'px'}
    setTimeout(function(){e.remove()},850);
    if(n>=3){var cnt=8+3*(Math.min(n,8)-3),ic=th.fw;
      for(var i=0;i<cnt;i++){(function(i){var f=document.createElement('div');f.className='fw';f.textContent=ic[i%ic.length];var ang=i*6.2832/cnt,rad=60+rnd(45);
        f.style.setProperty('--dx',Math.round(Math.cos(ang)*rad)+'px');f.style.setProperty('--dy',Math.round(Math.sin(ang)*rad*.7)+'px');r.appendChild(f);setTimeout(function(){f.remove()},950)})(i)}}
    if(n>=4){clearTimeout(rbT);r.classList.remove('rb');void r.offsetWidth;r.classList.add('rb');rbT=setTimeout(function(){r.classList.remove('rb')},1450);king(true)}
  }
  function mkSlotsClear(){var l=$('room').querySelectorAll('.slot');for(var i=0;i<l.length;i++)l[i].remove()}
  function showRoom(t,items){ // 換成第 t 間房：背景、窗景、裝飾、圓圓的小帽子，再放這一間的家具
    var r=$('room'),th=TH[t]||TH[0],h='',i;mkSlotsClear();r.setAttribute('data-t',String(TH[t]?t:0));
    $('win').innerHTML=th.win;
    if(th.gar.length){h+='<div class="gar">';for(i=0;i<th.gar.length;i++)h+='<span>'+th.gar[i]+'</span>';h+='</div>'}
    for(i=0;i<th.dec.length;i++)h+='<span class="dc '+'abcd'.charAt(i)+'">'+th.dec[i]+'</span>';
    $('decor').innerHTML=h;$('hat').textContent=th.hat;
    (items||[]).forEach(function(it){if(it)mkNode(it,false)})}
  function enterRoom(t){
    var th=TH[t%8];showRoom(t%8,[]);var r=$('room');r.classList.remove('rin');void r.offsetWidth;r.classList.add('rin');
    var b=$('banner');b.innerHTML='<small>第 '+(t+1)+' 間房　'+th.ic+'</small><b>'+th.ent+'</b>';b.classList.remove('go');void b.offsetWidth;b.classList.add('go');
    clearTimeout(bnT);bnT=setTimeout(function(){b.classList.remove('go')},1650);if(t>0)SFX.room()}
  function dots(){var h='';for(var i=0;i<NR;i++)h+='<span class="dot'+(i<round?' on':'')+'"></span>';$('dots').innerHTML=h}
  function say(t){$('say').textContent=t}
  function reset(){
    round=0;locked=false;combo=0;maxCombo=0;wrong=0;qWrong=false;showCombo();king(false);clearTimeout(moodT);$('pet').className='';
    startM=rnd(2);buildRounds();furn=chooseFurn();run=[];maxRoom=-1;
    $('end').style.display='none';$('unl').style.display='none';$('play').style.display='block';
    $('pet').style.left='42%';
    refreshBar();
    next();
    say(plays>0?'歡迎回來！這次要布置 '+NR+' 間不同風格的房間 🏠':'圓圓要布置 '+NR+' 間不同的房間！答對就能搬家具進去 🏠');
  }
  function next(){
    dots();locked=false;qWrong=false;enterRoom(round);if(round>0)say(TT().hi);
    var q=rounds[round]();
    $('story').textContent=pick(TT().st).replace('{f}',furn[round][1]);
    $('tag').textContent='第 '+(round+1)+' / '+NR+' 關　'+q.tag;
    $('qt').innerHTML=q.text;
    var o=$('opts');o.innerHTML='';
    shuffle(q.opts).forEach(function(v){
      var b=document.createElement('button');b.className='opt';b.textContent=v;
      var w=0;for(var i=0;i<v.length;i++)w+=/[0-9\/]/.test(v[i])?.58:(/[ˊˇˋ˙]/.test(v[i])?.1:1);
      b.style.fontSize=w<=2.7?'':(w<=3.7?'20px':(w<=4.7?'17px':'14px'));
      b.onclick=function(){answer(b,v===q.ans,q)};
      o.appendChild(b);
    });
  }
  function answer(b,right,q){
    if(locked||b.disabled)return;
    $('banner').classList.remove('go');
    if(!right){b.className='opt no';b.disabled=true;SFX.no();wrong++;qWrong=true;combo=0;king(false);showCombo();mood('tilt sad',900);say(pick(TT().op));return}
    locked=true;b.className='opt ok';SFX.ok();
    var f=furn[round];
    if(!qWrong){combo++;if(combo>maxCombo){maxCombo=combo;maxRoom=round}}
    place(f);
    showCombo();
    var th=TT(),line=f[1]+'搬進'+th.sn+'！'+(round===0?'　👆點一下家具可以換顏色！':'');
    if(combo>=2){mood('dance glow',1500);sparkle();comboFx(combo);say(th.ic+'【'+th.ttl[combo<=2?0:(combo===3?1:2)]+'】'+pick(th.cs)+' '+f[1]+'搬進'+th.sn)}
    else{mood('happy hop',1100);say(pick(th.ch)+line)}
    round++;dots();
    setTimeout(function(){if(round>=NR)finish();else next()},1100);
  }
  function finish(){
    $('play').style.display='none';$('end').style.display='block';
    var st=wrong===0?3:(wrong<=4?2:1); // 0 錯＝3 星、1–4 錯＝2 星、5 以上＝1 星
    var msgs={3:['太完美了！'+NR+' 關一次就全對，你是設計大師！',NR+' 關全部一次答對，圓圓的新家超漂亮！'],2:['很棒喔！只錯一點點，新家很好看！','好厲害，圓圓好喜歡你布置的家！'],1:['完成了！多練習幾次會更厲害～','圓圓的新家完成了，謝謝你不放棄！']};
    var sh='';for(var i=0;i<3;i++)sh+='<span style="animation-delay:'+(i*.25)+'s">'+(i<st?'⭐':'☆')+'</span>';
    $('stars').innerHTML=sh;$('stars').setAttribute('data-stars',st);
    $('endsay').textContent=pick(msgs[st]);
    $('endstory').textContent=pick(ENDSTORY);var ft=TH[maxRoom>=0?maxRoom:rnd(8)];$('sticker').textContent='🌟 '+ft.et[st-1]+' 🌟';buildRooms();$('endinfo').textContent='答錯 '+wrong+' 次　｜　最高連擊 x'+maxCombo;
    $('combo').style.display='none';king(false);plays++;if(st>best)best=st;sset('plays',String(plays));sset('best',String(best));
    var oldT=curTier();total+=st;var newT=Math.max(oldT,tierOf(total));tierSaved=newT;sset('total',String(total));sset('unlock',String(newT));
    $('endgain').textContent='本次得到 ★'+st+'　累積 ★'+total;$('endhist').textContent=histText();refreshBar();mood('dance glow',1500);
    say('🎉 謝謝你幫圓圓布置新家 🎉');
    SFX.end(st);showUnlock(oldT,newT,st);
    for(var i=0;i<14;i++){(function(i){setTimeout(function(){var c=document.createElement('div');c.className='conf';c.textContent=pick(['⭐','🎉','💖','✨','🌸']);c.style.left=rnd(92)+'%';$('app').appendChild(c);setTimeout(function(){c.remove()},1900)},i*70)})(i)}
  }
  function buildRooms(){ // 結尾：8 間房逐間回顧；有舊家的話多一張「舊家」
    var h='',i,L=legacy();
    for(i=0;i<NR;i++){var th=TH[i%8],it=run[i];h+='<button class="rc'+(i===NR-1?' on':'')+'" type="button" data-t="'+(i%8)+'" data-i="'+i+'" aria-label="看'+th.n+'"><span class="rm"><i>'+th.ic+'</i><b>'+(it?it.e:'')+'</b></span><span class="rn">'+th.sn+'</span></button>'}
    if(L.length)h+='<button class="rc" type="button" data-t="8" data-i="L" aria-label="看舊家"><span class="rm"><i>🏠</i><b>'+L.slice(0,3).map(function(x){return x.e}).join('')+'</b></span><span class="rn">舊家</span></button>';
    $('rooms').innerHTML=h}
  $('rooms').onclick=function(ev){var n=ev.target;while(n&&n!==this&&!(n.className&&String(n.className).indexOf('rc')>=0))n=n.parentNode;if(!n||n===this)return;
    var i=n.getAttribute('data-i'),cs=this.querySelectorAll('.rc'),k;SFX.click();for(k=0;k<cs.length;k++)cs[k].className='rc'+(cs[k]===n?' on':'');
    if(i==='L'){showRoom(8,legacy());say('這是以前布置的舊家 🏠')}else{i=+i;showRoom(i%8,[run[i]]);say(TH[i%8].ic+' '+TH[i%8].n+'：圓圓最喜歡這間！')}};
  function showUnlock(a,b,st){ // 這次玩完剛好跨過門檻才慶祝；只有這一次畫面會出現
    var u=$('unl');if(b<=a){u.style.display='none';return}
    var h='',em=[],i;for(i=a;i<b;i++){h+='<div class="ut">🎉 '+TIERS[i][2]+' 🎉</div><div class="ue">'+TEMOJI[i].map(function(e){return '<span>'+e+'</span>'}).join('')+'</div><div>'+TIERS[i][3]+'</div>';em=em.concat(TEMOJI[i])}
    u.innerHTML=h;u.style.display='block';u.style.animation='none';void u.offsetWidth;u.style.animation='';
    SFX.unlock(st>=3?1.8:(st===2?1.5:.9),b);
    for(i=0;i<20;i++){(function(i){setTimeout(function(){var c=document.createElement('div');c.className='conf';c.textContent=em[i%em.length];c.style.left=rnd(92)+'%';$('app').appendChild(c);setTimeout(function(){c.remove()},1900)},300+i*80)})(i)}
  }
  $('again').onclick=function(){SFX.click();reset()};
  var clrT=null;
  $('clear').onclick=function(){var c=$('clear');SFX.click();
    if(c.className!=='sure'){c.className='sure';c.textContent='再按一次，確定清空';clearTimeout(clrT);clrT=setTimeout(function(){c.className='';c.textContent='🧹 清掉舊家'},3000);return}
    clearTimeout(clrT);c.className='';c.textContent='🧹 清掉舊家';
    house=house.filter(function(x){return x.r!==undefined});saveHouse();refreshBar();if($('end').style.display==='block'){buildRooms();showRoom(NR-1,[run[NR-1]])}say('舊家的家具都搬走了～')};
  muted=sget('mute')==='1';paintMute();
  mb.onclick=function(){muted=!muted;sset('mute',muted?'1':'0');paintMute();if(!muted)SFX.click()};
  loadAll();
  reset();
})();
</script>
